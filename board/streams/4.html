
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오름차순 빙고</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef4fb;
    font-family:Arial,"Noto Sans KR",sans-serif;
    color:#222;
    padding:18px;
}

.wrap{
    max-width:900px;
    margin:auto;
}

h1{
    margin:0;
    text-align:center;
    font-size:28px;
}

.sub{
    text-align:center;
    color:#666;
    margin:6px 0 18px;
}

.board{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 3px 14px #0001;
    margin-bottom:15pt;
}

.map{
    position:relative;
    width:840px;
    height:420px;
    background:linear-gradient(90deg,#ffe7c7,#eef5df 45%,#e4f3f3);
    overflow:hidden;
    border:2px solid #ddd;
    border-radius:14px;
    margin:auto;
}

#routes{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
}

.station{
    position:absolute;
    transform:translate(-50%,-50%);
    width:48px;
    height:48px;
    border-radius:50%;
    background:#fff;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    outline:none;
    z-index:2;
    padding:0;
}

.station.orange{
    border:3px solid #ef6c00;
}

.station.lightgreen{
    border:3px solid #72c43f;
}

.station.green{
    border:3px solid #2fa96d;
}

.station.transfer{
    border:3px solid #7350a5;
    background:#fff;
}

.station:read-only{
    background:#fafafa;
}

.dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right:5pt;
}
.dot.orange { background: #ef6c00; }
.dot.lightgreen { background: #72c43f; }
.dot.green { background: #2fa96d; }
.dot.purple { background: #7160b8; }


/* 점수 영역 */

.scores{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.score-card,
.score-total{
    padding:12px;
    border-radius:10px;
    background:#fff;
    text-align:center;
}

.score-card strong,
.score-total strong{
    display:block;
    margin-top:4px;
    font-size:26px;
}

.score-card small{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:12px;
}

.score-total{
    grid-column:1/-1;
}


/* 버튼 */

button{
    border:0;
    border-radius:9px;
    padding:10px 16px;
    background:#333;
    color:#fff;
    font-size:15px;
}

.reset{
    display:block;
    margin:18px auto 0;
}


/* 모바일 */

@media(max-width:600px){

    body{
        padding:10px;
    }

    h1{
        font-size:23px;
    }

    .scores{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="wrap">

<h1>오름차순 빙고</h1>

<div class="sub">
    <i class="dot orange"></i>주황색, <i class="dot lightgreen"></i>연두색, <i class="dot green"></i>초록색 세 노선을 원하는 순서대로 입력하세요 <br>
   <i class="dot purple"></i>환승역은 중복하여 계산합니다.
</div>


<div class="board">

    <div class="map" id="map">
        <svg
            id="routes"
            viewBox="0 0 840 420"
            aria-hidden="true">
        </svg>
    </div>

</div>


<div class="scores">

    <div class="score-card">
        <div><i class="dot orange"></i>주황색 라인</div>
        <strong id="score-0"></strong>
        <small id="detail-0">
            입력 완료 시 계산
        </small>
    </div>

    <div class="score-card">
        <div><i class="dot lightgreen"></i>연두색 라인</div>
        <strong id="score-1"></strong>
        <small id="detail-1">
            입력 완료 시 계산
        </small>
    </div>

    <div class="score-card">
        <div><i class="dot green"></i>초록색 라인</div>
        <strong id="score-2"></strong>
        <small id="detail-2">
            입력 완료 시 계산
        </small>
    </div>

    <div class="score-total">
        <div>총점</div>
        <strong id="total-score"></strong>
    </div>

</div>


<button class="reset" id="reset">
    다시 하기
</button>


</div>


<script>

const scores=[
    0,1,3,5,7,9,11,15,20,25,
    30,35,40,50,60,70,85,100,150,300
];


// 환승역은 하나의 입력칸을 여러 노선이 함께 사용한다.
// 따라서 환승역에 적은 숫자는 연결된 두 노선의 계산에 모두 들어간다.

const stations={

    // 주황색 노선

    o1:[55,65,'orange'],
    o2:[125,65,'orange'],
    o3:[195,85,'orange'],
    o4:[265,85,'orange'],
    o5:[335,115,'orange'],

    p1:[405,150,'transfer'],

    o6:[495,215,'orange'],
    o7:[595,215,'orange'],
    o8:[685,225,'orange'],
    o9:[780,225,'orange'],


    // 연두색 노선

    g1:[55,320,'lightgreen'],
    g2:[125,320,'lightgreen'],

    p2:[195,275,'transfer'],

    g3:[265,245,'lightgreen'],
    g4:[335,215,'lightgreen'],
    g5:[495,115,'lightgreen'],
    g6:[590,95,'lightgreen'],
    g7:[685,95,'lightgreen'],
    g8:[780,75,'lightgreen'],


    // 초록색 노선

    d1:[125,185,'green'],

    d2:[235,315,'green'],
    d3:[305,325,'green'],
    d4:[375,300,'green'],
    d5:[445,325,'green'],
    d6:[515,300,'green'],
    d7:[585,325,'green'],
    d8:[655,300,'green'],
    d9:[725,325,'green']

};


// 실제 노선을 따라가는 순서
//
// p1 = 주황 + 연두 환승역
// p2 = 연두 + 초록 환승역

const lines=[

    {
        name:'주황색 노선',
        color:'#ef6c00',
        route:[
            'o1',
            'o2',
            'o3',
            'o4',
            'o5',
            'p1',
            'o6',
            'o7',
            'o8',
            'o9'
        ]
    },

    {
        name:'연두색 노선',
        color:'#72c43f',
        route:[
            'g1',
            'g2',
            'p2',
            'g3',
            'g4',
            'p1',
            'g5',
            'g6',
            'g7',
            'g8'
        ]
    },

    {
        name:'초록색 노선',
        color:'#2fa96d',
        route:[
            'd1',
            'p2',
            'd2',
            'd3',
            'd4',
            'd5',
            'd6',
            'd7',
            'd8',
            'd9'
        ]
    }

];


const map=document.getElementById('map');
const svg=document.getElementById('routes');

const ns='http://www.w3.org/2000/svg';


// 노선 선을 먼저 그린다.

lines.forEach(line=>{

    const poly=
        document.createElementNS(
            ns,
            'polyline'
        );

    poly.setAttribute(
        'points',
        line.route
            .map(
                id=>
                    stations[id]
                        .slice(0,2)
                        .join(',')
            )
            .join(' ')
    );

    poly.setAttribute(
        'fill',
        'none'
    );

    poly.setAttribute(
        'stroke',
        line.color
    );

    poly.setAttribute(
        'stroke-width',
        '18'
    );

    poly.setAttribute(
        'stroke-linecap',
        'round'
    );

    poly.setAttribute(
        'stroke-linejoin',
        'round'
    );

    svg.appendChild(poly);

});


// 역 생성
// 환승역도 입력칸은 하나만 생성된다.

Object.entries(stations).forEach(
    ([id,[x,y,kind]])=>{

        const inp=
            document.createElement('input');

        inp.className=
            `station ${kind}`;

        inp.type='text';

        inp.inputMode='numeric';

        inp.maxLength=2;

        inp.dataset.station=id;

        inp.style.left=
            `${x}px`;

        inp.style.top=
            `${y}px`;


        inp.addEventListener(
            'input',
            ()=>{

                inp.value=
                    inp.value
                    .replace(/[^0-9]/g,'');


                if(inp.value!==''){

                    const n=
                        Number(inp.value);

                    if(n>30){
                        inp.value='30';
                    }

                }

                updateAll();

            }
        );


        inp.addEventListener(
            'blur',
            ()=>{

                if(inp.value!==''){
                    inp.readOnly=true;
                }

                updateAll();

            }
        );


        map.appendChild(inp);

    }
);


function getValue(id){

    const el=
        document.querySelector(
            `[data-station="${id}"]`
        );


    if(
        !el ||
        el.value===''
    ){
        return null;
    }


    const n=
        Number(el.value);


    return (
        n>=0 &&
        n<=30
    )
        ? n
        : null;

}


function calc(line){

    const vals=
        line.route.map(getValue);


    if(
        vals.some(
            v=>v===null
        )
    ){
        return null;
    }


    const streams=[];

    let len=0;

    let previousNumber=null;


    for(
        const value of vals
    ){

        if(value===0){

            len++;

            continue;

        }


        if(
            previousNumber!==null &&
            value<previousNumber
        ){

            streams.push(len);

            len=1;

        }else{

            len++;

        }


        previousNumber=value;

    }


    if(len>0){
        streams.push(len);
    }


    const total=
        streams.reduce(
            (sum,n)=>
                sum+
                (
                    scores[
                        Math.min(n,20)-1
                    ] || 0
                ),
            0
        );


    return {
        total,
        streams
    };

}


function updateAll(){

    let total=0;

    let completed=0;


    lines.forEach(
        (line,li)=>{

            const result=
                calc(line);


            const score=
                document.getElementById(
                    `score-${li}`
                );


            const detail=
                document.getElementById(
                    `detail-${li}`
                );


            if(!result){

                score.textContent='';

                detail.textContent=
                    '입력 완료 시 표시';

                return;

            }


            score.textContent=
                `${result.total}점`;


detail.textContent =
    `${result.streams.map(n => `${n}칸`).join(' + ')}`;


            total+=result.total;

            completed++;

        }
    );


    document.getElementById(
        'total-score'
    ).textContent=
        completed===0
            ? ''
            : `${total}점`;

}


// 다시 하기

document.getElementById(
    'reset'
).onclick=()=>{

    document
        .querySelectorAll('.station')
        .forEach(
            input=>{

                input.value='';

                input.readOnly=false;

            }
        );


    updateAll();

};

</script>

</body>
</html>
