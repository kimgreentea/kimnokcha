<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오름차순 빙고</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:24px 12px 50px;
    background:#f5f5f5;
    font-family:Arial,"Noto Sans KR",sans-serif;
    color:#222;
}
h1{text-align:center;margin:0 0 18px;font-size:24px}
.wrap{max-width:960px;margin:auto}
.sub { margin: 0 0 18px; text-align: center; color: #666; }
.board-wrap{
    width:100%;
    overflow-x:auto;
    padding:10px 0 20px;
}
.board{
    position:relative;
    width:900px;
    height:470px;
    margin:auto;
     background: linear-gradient(115deg, #ffe8ca 0 30%, #e9f8f7 30% 72%, #f6edcf 72%);
    border-radius:18px;
    box-shadow:0 2px 10px #0001;
}
.route{
    position:absolute;
    left:0;
    top:0;
    width:900px;
    height:470px;
    z-index:1;
    pointer-events:none;
}
.route path{
    fill:none;
    stroke:#2d9bd3;
    stroke-width:18;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.station{
    position:absolute;
    z-index:5;
    width:50px;
    height:50px;
    transform:translate(-50%,-50%);
    border:4px solid #2d9bd3;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    outline:none;
    padding:0;
}
.station:focus{
    border-color:#166b99;
    box-shadow:0 0 0 3px #2d9bd344;
}
.station.start{
    background:#ffe56b;
    border-color:#d89b00;
}
.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
}
button{
    border:0;
    border-radius:9px;
    padding:11px 18px;
    background:#333;
    color:#fff;
    font-size:15px;
    cursor:pointer;

}
button.reset{background:#333; color:white;}


.status{
    max-width:900px;
    height:40pt;
    text-align:center;
    display:none;
    align-items:center;
    justify-content:center;
    margin:0 auto; 
    background:#fff;
    border-radius:12px;
    font-weight:bold; 
}
.score{
    max-width:900px;
    margin:16px auto 0;
    background:#fff;
    border-radius:12px;
    padding:16px;
    text-align:center;
}
.score .title{font-size:18px;font-weight:bold}
.score .detail{margin-top:8px;color:#555}
.score .total{margin-top:8px;font-size:25px;font-weight:bold}

.score-table {
    margin-top: 25px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 8px 5px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #eee;
}

.tile-count-table table {
    border-collapse: collapse;
}

.tile-count-table th,
.tile-count-table td {
    padding: 4px 12px;
    border: 1px solid #ccc;
    text-align: center;
}
@media(max-width:920px){
    .board-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<div class="wrap">
<h1>오름차순 빙고</h1>
    <p class="sub">게임 시작 전 원하는 칸 2개를 골라 조커를 넣습니다. <br> 칸이 다 차면 계산을 시작할 지점을 스스로 고릅니다.<br>순서는 반시계방향입니다.</p>

<div class="board-wrap">
<div class="board" id="board">

   <svg viewBox="0 0 900 470" preserveAspectRatio="none" aria-hidden="true">
                <polyline
                    points="145,105 241,105 336,105, 432, 105, 527,105, 623, 105, 718, 105 790,125, 815,190 815,265 790,325 718,365 623,365 527,365 432,365 336, 365 241, 365 125,350 90,270 90,180 145,105"
                    fill="none"
                    stroke="#2f9fd4"
                    stroke-width="18"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                </polyline>
            </svg>
<input class="station" id="s1" style="left:145px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="1번 역">
<input class="station" id="s2" style="left:241px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="2번 역">
<input class="station" id="s3" style="left:336px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="3번 역">
<input class="station" id="s4" style="left:432px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="4번 역">
<input class="station" id="s5" style="left:527px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="5번 역">
<input class="station" id="s6" style="left:623px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="6번 역">
<input class="station" id="s7" style="left:718px;top:105px"  type="text" inputmode="numeric" maxlength="2" aria-label="7번 역">
<input class="station" id="s8" style="left:790px;top:125px"  type="text" inputmode="numeric" maxlength="2" aria-label="8번 역">
<input class="station" id="s9" style="left:815px;top:190px"  type="text" inputmode="numeric" maxlength="2" aria-label="9번 역">
<input class="station" id="s10" style="left:815px;top:265px"  type="text" inputmode="numeric" maxlength="2" aria-label="10번 역">
<input class="station" id="s11" style="left:790px;top:325px"  type="text" inputmode="numeric" maxlength="2" aria-label="11번 역">
<input class="station" id="s12" style="left:718px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="12번 역">
<input class="station" id="s13" style="left:623px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="13번 역">
<input class="station" id="s14" style="left:527px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="14번 역">
<input class="station" id="s15" style="left:432px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="15번 역">
<input class="station" id="s16" style="left:336px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="16번 역">
<input class="station" id="s17" style="left:241px;top:365px"  type="text" inputmode="numeric" maxlength="2" aria-label="17번 역">
<input class="station" id="s18" style="left:125px;top:350px"  type="text" inputmode="numeric" maxlength="2" aria-label="18번 역">
<input class="station" id="s19" style="left:90px;top:270px"  type="text" inputmode="numeric" maxlength="2" aria-label="19번 역">
<input class="station" id="s20" style="left:90px;top:180px" type="text" inputmode="numeric" maxlength="2" aria-label="20번 역">


</div>


</div>


<div class="statusmother">
<div class="status" id="status">상태창</div></div>

<div class="score" id="score">

    <div class="title">점수</div>
    <div class="detail"></div>
</div>
</div>


    <div class="score">

    <p><b>조커는 0으로 입력</b></p>

<div class="tile-count-table">
    <table>
        <thead>
            <tr>
                <th>숫자</th>
                <th>1~10</th>
                <th>11~19</th>
                <th>20~30</th>
                <th>조커</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>개수</th>
                <td>1개</td>
                <td>2개</td>
                <td>1개</td>
                <td>1개</td>
            </tr>
        </tbody>
    </table>
</div>

    <div class="score-table">
        <table>
            <thead>
                <tr>
                    <th>연속 칸</th>
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                    <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
                    <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th>
                    <th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>점수</th>
                    <td>0</td><td>1</td><td>3</td><td>5</td><td>7</td>
                    <td>9</td><td>11</td><td>15</td><td>20</td><td>25</td>
                    <td>30</td><td>35</td><td>40</td><td>50</td><td>60</td>
                    <td>70</td><td>85</td><td>100</td><td>150</td><td>300</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>

<div class="controls">

    <button class="reset" id="resetBtn">다시 하기</button>
</div>

<script>
const scores=[0,1,3,5,7,9,11,15,20,25,30,35,40,50,60,70,85,100,150,300];
 
const inputs=[...document.querySelectorAll('.station')];
const statusEl=document.getElementById('status');
const scoreEl=document.getElementById('score');

let startIndex=null;
let startLocked=false;

inputs.forEach((input,index)=>{
    input.addEventListener('blur',()=>{
        const v=input.value.trim();
        if(v!==''){
            const n=Number(v);
            if(Number.isInteger(n) && n>=0 && n<=30){
                input.value=String(n);
                input.readOnly=true;
            }else{
                input.value='';
            }
        }
        updateStatus();
    });

    input.addEventListener('input',()=>{
        input.value=input.value.replace(/[^0-9]/g,'').slice(0,2);
        updateStatus();
    }); 

    input.addEventListener('click',()=>{
        if(startLocked) return;
        if(allFilled()){
            selectStart(index);
        }else{

        statusEl.style.display = 'none';
        }
    });
});



document.getElementById('resetBtn').addEventListener('click',()=>{
    inputs.forEach(input=>{
        input.value='';
        input.readOnly=false;
        input.classList.remove('start');
    });
    startIndex=null;
    startLocked=false; 
    scoreEl.innerHTML='<div class="title">점수</div><div class="detail"></div>';
        statusEl.style.display = 'none';
});

function allFilled(){
    return inputs.every(input=>{
        const n=Number(input.value);
        return input.value.trim()!=='' && Number.isInteger(n) && n>=0 && n<=30;
    });
}

function getValue(i){
    return Number(inputs[i].value);
}

function selectStart(index){
    if(startLocked) return;
    if(!allFilled()) return;

    startIndex=index;
    startLocked=true;

    inputs.forEach(input=>input.classList.remove('start'));
    inputs[index].classList.add('start');

    inputs.forEach(input=>input.readOnly=true);

    calculate();
        statusEl.style.display = 'none';

}

function calculate(){
    const routeValues=[];

    // 시작역부터 반시계방향:
    // 1 → 20 → 19 → 18 → ... 순서
    for(let k=0;k<20;k++){
        routeValues.push(getValue((startIndex-k+20)%20));
    }

    const streams=[];
    let len=0;
    let previous=null;

    for(const value of routeValues){
        if(value===0){
            len++;
            continue;
        }

        if(previous!==null && value<previous){
            streams.push(len);
            len=1;
        }else{
            len++;
        }

        previous=value;
    }

    if(len>0) streams.push(len);

    const total=streams.reduce((sum,n)=>{
        return sum+(scores[Math.min(n,20)-1]||0);
    },0);

    scoreEl.innerHTML=`
        <div class="title">점수</div>
        <div class="detail">${streams.map(n=>`${n}칸`).join(' + ')}</div>
        <div class="total">${total}점</div>
    `;
}
 
function updateStatus(){
    if(startLocked) return;

    const count = inputs.filter(input => input.value.trim() !== '').length;
    
    if(count === 20){
        statusEl.textContent = '입력이 완료되었습니다. 시작할 역을 선택하세요.';
        statusEl.style.display = 'flex';
    }
}
</script>
</body>
</html>
