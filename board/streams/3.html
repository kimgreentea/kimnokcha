llapse}.tile-count-table td,.tile-count-table th{padding:4px 12px;border:1px solid #ccc;text-align:center}@media (max-width:920px){.board-wrap{overflow-x:auto}}</style> </head><body><div class="wrap"><h1>오름차순 빙고</h1><p class="sub">게임 시작 전 원하는 칸 2개를 골라 조커를 넣습니다. <br> 칸이 다 차면 계산을 시작할 지점을 스스로 고릅니다.<br>순서는 반시계방향입니다.</p><div class="board-wrap"><div class="board" id="board"><svg viewBox="0 0 900 470" preserveAspectRatio="none" aria-hidden="true"><polyline points="145,105 241,105 336,105, 432, 105, 527,105, 623, 105, 718, 105 790,125, 815,190 815,265 790,325 718,365 623,365 527,365 432,365 336, 365 241, 365 125,350 90,270 90,180 145,105" fill="none" stroke="#2f9fd4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></polyline></svg><input class="station" id="s1" style="left:145px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="1번 역"><input class="station" id="s2" style="left:241px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="2번 역"><input class="station" id="s3" style="left:336px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="3번 역"><input class="station" id="s4" style="left:432px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="4번 역"><input class="station" id="s5" style="left:527px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="5번 역"><input class="station" id="s6" style="left:623px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="6번 역"><input class="station" id="s7" style="left:718px;top:105px" type="text" inputmode="numeric" maxlength="2" aria-label="7번 역"><input class="station" id="s8" style="left:790px;top:125px" type="text" inputmode="numeric" maxlength="2" aria-label="8번 역"><input class="station" id="s9" style="left:815px;top:190px" type="text" inputmode="numeric" maxlength="2" aria-label="9번 역"><input class="station" id="s10" style="left:815px;top:265px" type="text" inputmode="numeric" maxlength="2" aria-label="10번 역"><input c d><td>1</td><td>3</td><td>5</td><td>7</td><td>9</td><td>11</td><td>15</td><td>20</td><td>25</td><td>30</td><td>35</td><td>40</td><td>50</td><td>60</td><td>70</td><td>85</td><td>100</td><td>150</td><td>300</td></tr></tbody></table></div></div></div><div class="controls"><button class="reset" id="resetBtn">다시 하기</button></div> <script>const scores=[0,1,3,5,7,9,11,15,20,25,30,35,40,50,60,70,85,100,150,300],inputs=[...document.querySelectorAll(".station")],statusEl=document.getElementById("status"),scoreEl=document.getElementById("score");let startIndex=null,startLocked=!1;function allFilled(){return inputs.every(t=>{const e=Number(t.value);return""!==t.value.trim()&&Number.isInteger(e)&&e>=0&&e<=30})}function getValue(t){return Number(inputs[t].value)}function selectStart(t){startLocked||allFilled()&&(startIndex=t,startLocked=!0,inputs.forEach(t=>t.classList.remove("start")),inputs[t].classList.add("start"),inputs.forEach(t=>t.readOnly=!0),calculate(),statusEl.style.display="none")}function calculate(){const t=[];for(let e=0;e<20;e++)t.push(getValue((startIndex-e+20)%20));const e=[];let s=0,l=null;for(const n of t)0!==n?(null!==l&&n<l?(e.push(s),s=1):s++,l=n):s++;s>0&&e.push(s);const n=e.reduce((t,e)=>t+(scores[Math.min(e,20)-1]||0),0);scoreEl.innerHTML=`\n        <div class="title">점수</div>\n        <div class="detail">${e.map(t=>`${t}칸`).join(" + ")}</div>\n        <div class="total">${n}점</div>\n    `}function updateStatus(){if(startLocked)return;20===inputs.filter(t=>""!==t.value.trim()).length&&(statusEl.textContent="시작할 역을 선택하세요.",statusEl.style.display="flex")}inputs.forEach((t,e)=>{t.addEventListener("blur",()=>{const e=t.value.trim();if(""!==e){const s=Number(e);Number.isInteger(s)&&s>=0&&s<=30?(t.value=String(s),t.readOnly=!0):t.value=""}updateStatus()}),t.addEventListener("input",()=>{t.value=t.value.replace(/[^0-9]/g,"").slice(0,2),updateStatus()}),t.addEventListener("click",()=>{startLocked||(allFilled()?selectStart(e):statusEl.style.display="none")})}),do
