<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트림스 메트로 A노선</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px 12px 40px;
    background: #eef5fb;
    color: #222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}
.wrap { width: min(900px, 100%); margin: auto; }
h1 { margin: 0 0 5px; text-align: center; font-size: clamp(22px, 5vw, 34px); }
.sub { margin: 0 0 18px; text-align: center; color: #666; }
.sheet {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0002;
}
.board {
    position: relative;
    width: 560px;
    height: 330px;
    margin: auto;
    background: linear-gradient(115deg, #ffe8ca 0 40%, #e9f8f7 40% 72%, #f6edcf 72%);
}
.board svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
.station {
    position: absolute;
    width: 38px;
    height: 38px;
    transform: translate(-50%, -50%);
    border: 3px solid #3aa0d4;
    border-radius: 50%;
    background: #fff;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    outline: none;
    padding: 0;
    color: #222;
}
.station:focus {
    box-shadow: 0 0 0 3px #3aa0d455;
}
.station:read-only {
    background: #f7f7f7;
}
.info {
    padding: 15px 18px;
    text-align: center;
    border-top: 1px solid #ddd;
    color: #555;
    line-height: 1.55;
}
.score-box {
    margin-top: 14px;
    padding: 18px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0002;
    text-align: center;
}
.score-title { color: #666; font-weight: bold; }
.score {
    margin-top: 4px;
    font-size: 38px;
    font-weight: 800;
}
.detail { margin-top: 7px; color: #666; min-height: 24px; }
.buttons { display: flex; gap: 8px; margin-top: 12px; }
button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#clear { background: #ddd; }
@media (max-width: 600px) {
    .board { width: 560px; }
}
</style>
</head>
<body>
<div class="wrap">
    <h1>스트림스 메트로 A노선</h1>
    <p class="sub">숫자를 왼쪽에서 오른쪽 순서로 입력하세요.</p>

    <div class="sheet">
        <div class="board">
            <svg viewBox="0 0 560 330" preserveAspectRatio="none" aria-hidden="true">
                <polyline
                    points="35,38 83,38 132,64 132,110 100,170 70,214 115,214 155,252 205,252 230,210 260,150 260,110 260,64 314,64 346,105 385,135 425,105 468,64 468,110 468,170"
                    fill="none"
                    stroke="#2f9fd4"
                    stroke-width="18"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                </polyline>
            </svg>

            <input class="station" data-id="1"  style="left:35px;top:38px;">
            <input class="station" data-id="2"  style="left:83px;top:38px;">
            <input class="station" data-id="3"  style="left:132px;top:64px;">
            <input class="station" data-id="4"  style="left:132px;top:110px;">
            <input class="station" data-id="5"  style="left:100px;top:170px;">
            <input class="station" data-id="6"  style="left:70px;top:214px;">
            <input class="station" data-id="7"  style="left:115px;top:214px;">
            <input class="station" data-id="8"  style="left:155px;top:252px;">
            <input class="station" data-id="9"  style="left:205px;top:252px;">
            <input class="station" data-id="10" style="left:230px;top:210px;">
            <input class="station" data-id="11" style="left:260px;top:150px;">
            <input class="station" data-id="12" style="left:260px;top:110px;">
            <input class="station" data-id="13" style="left:260px;top:64px;">
            <input class="station" data-id="14" style="left:314px;top:64px;">
            <input class="station" data-id="15" style="left:346px;top:105px;">
            <input class="station" data-id="16" style="left:385px;top:135px;">
            <input class="station" data-id="17" style="left:425px;top:105px;">
            <input class="station" data-id="18" style="left:468px;top:64px;">
            <input class="station" data-id="19" style="left:468px;top:110px;">
            <input class="station" data-id="20" style="left:468px;top:170px;">
        </div>
        <div class="info">
            <b>0 = 조커</b> · 숫자는 0~30까지 입력할 수 있습니다.<br>
            입력 후 다른 곳을 누르면 해당 칸이 잠깁니다. · 전체 초기화로 다시 입력할 수 있습니다.
        </div>
    </div>

    <div class="score-box">
        <div class="score-title">현재 점수</div>
        <div class="score" id="score">-</div>
        <div class="detail" id="detail">20칸을 모두 입력하면 점수가 계산됩니다.</div>
    </div>

    <div class="buttons">
        <button id="clear">전체 초기화</button>
    </div>
</div>

<script>
const scores = [
    0, 1, 3, 5, 7, 9, 11, 15, 20, 25,
    30, 35, 40, 50, 60, 70, 85, 100, 150, 300
];

const route = Array.from({length: 20}, (_, i) => String(i + 1));
const stations = [...document.querySelectorAll('.station')];

function getValue(id) {
    const input = document.querySelector(`[data-id="${id}"]`);
    if (!input || input.value === '') return null;
    return Number(input.value);
}

function streamScore(route) {
    const values = route.map(getValue);
    if (values.some(value => value === null)) return null;

    const streams = [];
    let streamLength = 0;
    let previousNumber = null;

    for (const value of values) {
        if (value === 0) {
            streamLength++;
            continue;
        }

        if (previousNumber !== null && value < previousNumber) {
            streams.push(streamLength);
            streamLength = 1;
        } else {
            streamLength++;
        }

        previousNumber = value;
    }

    if (streamLength > 0) streams.push(streamLength);

    const total = streams.reduce((sum, length) => {
        return sum + (scores[Math.min(length, 20) - 1] || 0);
    }, 0);

    return { total, streams };
}

function updateScore() {
    const result = streamScore(route);
    const scoreEl = document.getElementById('score');
    const detailEl = document.getElementById('detail');

    if (!result) {
        scoreEl.textContent = '-';
        detailEl.textContent = '20칸을 모두 입력하면 점수가 계산됩니다.';
        return;
    }

    scoreEl.textContent = result.total;
    detailEl.textContent = `스트림: ${result.streams.join(' + ')}칸`;
}

stations.forEach(input => {
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 2;
    input.autocomplete = 'off';
    input.spellcheck = false;

    input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');

        if (input.value !== '') {
            const number = Number(input.value);
            if (number > 30) input.value = '30';
        }
        updateScore();
    });

    input.addEventListener('blur', () => {
        if (input.value !== '') input.readOnly = true;
        updateScore();
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'Enter') input.blur();
    });
});

document.getElementById('clear').addEventListener('click', () => {
    stations.forEach(input => {
        input.value = '';
        input.readOnly = false;
    });
    updateScore();
});

updateScore();
</script>
</body>
</html>
