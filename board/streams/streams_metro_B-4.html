<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트림스 메트로 B노선</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px 40px;
    background: #eef5fb;
    color: #222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}

.wrap {
    width: min(900px, 100%);
    margin: auto;
}

h1 {
    margin: 0 0 5px;
    text-align: center;
    font-size: clamp(22px, 5vw, 34px);
}

.sub {
    margin: 0 0 18px;
    text-align: center;
    color: #666;
}

.controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.round-btn {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    background: #ddd;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.round-btn.active.orange {
    background: #ef8b16;
    color: white;
}

.round-btn.active.blue {
    background: #2d9bd3;
    color: white;
}

.sheet {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0002;
}

.board {
    position: relative;
    width: 720px;
    height: 360px;
    margin: auto;
    background:
        linear-gradient(125deg, #ffe8ca 0 34%, #e9f8f7 34% 67%, #f6edcf 67%);
}

/* 노선 */
.route {
    fill: none;
    stroke-width: 18;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.route.blue {
    stroke: #2d9bd3;
}

.route.orange {
    stroke: #ed8314;
}

.route.purple {
    stroke: #7160b8;
}

/* 역 */
.station {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 47px;
    height: 47px;
    border-radius: 50%;
    background: white;
    border: 3px solid;
    padding: 0;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    outline: none;
    z-index: 3;
}

.station.blue {
    border-color: #2d9bd3;
}

.station.orange {
    border-color: #ed8314;
}

.station.purple {
    border-color: #7160b8;
}

.station:focus {
    box-shadow: 0 0 0 4px #0002;
}

.station:read-only {
    cursor: default;
}

/* 비활성 노선 */
.station.disabled {
    opacity: .28;
    pointer-events: none;
}

.scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.score-card,
.score-total {
    padding: 12px;
    border-radius: 10px;
    background: white;
    text-align: center;
}

.score-card strong,
.score-total strong {
    display: block;
    margin-top: 4px;
    font-size: 26px;
}

.score-card small {
    display: block;
    margin-top: 5px;
    color: #777;
    font-size: 12px;
}

@media (max-width: 600px) {
    .scores {
        grid-template-columns: 1fr;
    }
}

.legend {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 13px;
    background: white;
    font-size: 14px;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.dot.orange { background: #ed8314; }
.dot.blue { background: #2d9bd3; }
.dot.purple { background: #7160b8; }

.info {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: white;
    text-align: center;
    color: #555;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.actions button {
    flex: 1;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

@media (max-width: 760px) {
    .sheet {
        overflow-x: auto;
    }
}
</style>
</head>

<body>
<div class="wrap">
    <h1>스트림스 메트로</h1>
    <p class="sub">B노선도 · 환승열차</p>

    <div class="controls">
        <button class="round-btn orange active" data-round="1">1라운드 · 주황 + 환승</button>
        <button class="round-btn blue" data-round="2">2라운드 · 파랑</button>
    </div>

    <div class="sheet">
        <div class="board">

            <!-- 노선 -->
            <svg viewBox="0 0 720 360"
                 style="position:absolute; inset:0; width:100%; height:100%; z-index:1;">
                <!-- 파란 노선 20칸 -->
                <polyline class="route blue"
                    points="60,45 110,45 160,45 205,90 160,140 160,185
                            105,245 160,245 215,245 275,245 320,285 380,285
                            435,285 435,230 435,185 435,130 435,80
                            490,80 535,130 560,185"/>

                <!-- 주황 노선 -->
                <polyline class="route orange"
                    points="65,130 110,185 160,185 215,185 260,130
                            320,130 375,185 435,185 490,235 545,285"/>

                <!-- 환승 구간 -->
                <line class="route purple" x1="160" y1="185" x2="160" y2="185"/>
                <line class="route purple" x1="435" y1="185" x2="435" y2="185"/>
            </svg>

            <!-- 파란 노선 20칸 -->
            <input class="station blue round2" data-id="b1"  style="left:60px;top:45px;">
            <input class="station blue round2" data-id="b2"  style="left:110px;top:45px;">
            <input class="station blue round2" data-id="b3"  style="left:160px;top:45px;">
            <input class="station blue round2" data-id="b4"  style="left:205px;top:90px;">
            <input class="station blue round2" data-id="b5"  style="left:160px;top:140px;">
            <input class="station purple round1 round2" data-id="p1" style="left:160px;top:185px;">
            <input class="station blue round2" data-id="b6"  style="left:105px;top:245px;">
            <input class="station blue round2" data-id="b7"  style="left:160px;top:245px;">
            <input class="station blue round2" data-id="b8"  style="left:215px;top:245px;">
            <input class="station blue round2" data-id="b9"  style="left:275px;top:245px;">
            <input class="station blue round2" data-id="b10" style="left:320px;top:285px;">
            <input class="station blue round2" data-id="b11" style="left:380px;top:285px;">
            <input class="station blue round2" data-id="b12" style="left:435px;top:285px;">
            <input class="station blue round2" data-id="b13" style="left:435px;top:230px;">
            <input class="station purple round1 round2" data-id="p2" style="left:435px;top:185px;">
            <input class="station blue round2" data-id="b14" style="left:435px;top:130px;">
            <input class="station blue round2" data-id="b15" style="left:435px;top:80px;">
            <input class="station blue round2" data-id="b16" style="left:490px;top:80px;">
            <input class="station blue round2" data-id="b17" style="left:535px;top:130px;">
            <input class="station blue round2" data-id="b18" style="left:560px;top:185px;">

            <!-- 주황 노선 10칸 -->
            <input class="station orange round1" data-id="o1" style="left:65px;top:130px;">
            <input class="station orange round1" data-id="o2" style="left:110px;top:185px;">
            <input class="station orange round1" data-id="o3" style="left:215px;top:185px;">
            <input class="station orange round1" data-id="o4" style="left:260px;top:130px;">
            <input class="station orange round1" data-id="o5" style="left:320px;top:130px;">
            <input class="station orange round1" data-id="o6" style="left:375px;top:185px;">
            <input class="station orange round1" data-id="o7" style="left:490px;top:235px;">
            <input class="station orange round1" data-id="o8" style="left:545px;top:285px;">
        </div>
    </div>

    <div class="scores">
        <div class="score-card">
            <div>1라운드 점수</div>
            <strong id="score1">-</strong>
            <small id="detail1">10칸 입력 완료 시 표시</small>
        </div>
        <div class="score-card">
            <div>2라운드 점수</div>
            <strong id="score2">-</strong>
            <small id="detail2">20칸 입력 완료 시 표시</small>
        </div>
        <div class="score-total">
            <div>총점</div>
            <strong id="totalScore">-</strong>
        </div>
    </div>

    <div class="legend">
        <span><i class="dot orange"></i>1라운드</span>
        <span><i class="dot blue"></i>2라운드</span>
        <span><i class="dot purple"></i>환승 구간</span>
    </div>

    <div class="info" id="info">
        1라운드: 주황색 노선과 보라색 환승 구간에 숫자를 입력하세요.
    </div>

    <div class="actions">
        <button id="clear">전체 초기화</button>
    </div>
</div>


<script>
const scores = [
    0, 1, 3, 5, 7,
    9, 11, 15, 20, 25,
    30, 35, 40, 50, 60,
    70, 85, 100, 150, 300
];

const orangeRoute = [
    "o1", "o2", "p1", "o3", "o4",
    "o5", "o6", "p2", "o7", "o8"
];

const blueRoute = [
    "b1", "b2", "b3", "b4", "b5", "p1",
    "b6", "b7", "b8", "b9", "b10", "b11",
    "b12", "b13", "p2", "b14", "b15", "b16",
    "b17", "b18"
];

const stations = [...document.querySelectorAll(".station")];
const roundButtons = [...document.querySelectorAll(".round-btn")];
const info = document.getElementById("info");

let currentRound = 1;

function getValue(id) {
    const input = document.querySelector(`[data-id="${id}"]`);
    if (!input || input.value === "") return null;
    return Number(input.value);
}

function streamScore(route) {
    const values = route.map(getValue);

    // 해당 라운드의 모든 칸이 입력되어야 점수를 확정한다.
    if (values.some(value => value === null)) {
        return null;
    }

    /*
        스트림스의 오름차순 판정

        - 작은 수로 내려가지만 않으면 같은 스트림이다.
        - 같은 숫자도 인정한다.
          예: 3 → 3 → 5 = 3칸
        - 숫자 사이의 간격은 제한이 없다.
          예: 3 → 6 = 2칸
        - 0(조커)은 어떤 숫자로도 사용할 수 있으므로 스트림을
          끊지 않는다.
          예: 3 → 0 → 6 = 3칸
        - 단, 조커 뒤의 실제 숫자가 이전 실제 숫자보다 작아지면
          그 지점에서 스트림이 끊어진다.
          예: 3 → 0 → 5 → 3 → 4 → 5
              = 3칸 + 3칸
    */

    const streams = [];
    let streamLength = 0;
    let previousNumber = null;

    for (const value of values) {
        if (value === 0) {
            // 조커는 현재 스트림에 포함되며 스트림을 끊지 않는다.
            streamLength++;
            continue;
        }

        if (previousNumber !== null && value < previousNumber) {
            // 이전 실제 숫자보다 작아졌으므로 새 스트림 시작.
            streams.push(streamLength);
            streamLength = 1;
        } else {
            streamLength++;
        }

        previousNumber = value;
    }

    if (streamLength > 0) {
        streams.push(streamLength);
    }

    let total = 0;

    for (const length of streams) {
        total += scores[Math.min(length, 20) - 1] || 0;
    }

    return {
        total,
        streams
    };
}

function isRound1Complete() {
    return orangeRoute.every(id => getValue(id) !== null);
}

function isRound2Complete() {
    return blueRoute.every(id => getValue(id) !== null);
}

function updateScores() {
    const result1 = streamScore(orangeRoute);
    const result2 = streamScore(blueRoute);

    const score1 = document.getElementById("score1");
    const score2 = document.getElementById("score2");
    const totalScore = document.getElementById("totalScore");
    const detail1 = document.getElementById("detail1");
    const detail2 = document.getElementById("detail2");

    if (result1) {
        score1.textContent = `${result1.total}점`;
        detail1.textContent = result1.streams.map(n => `${n}칸`).join(" + ");
    } else {
        score1.textContent = "-";
        detail1.textContent = "10칸 입력 완료 시 표시";
    }

    if (result2) {
        score2.textContent = `${result2.total}점`;
        detail2.textContent = result2.streams.map(n => `${n}칸`).join(" + ");
    } else {
        score2.textContent = "-";
        detail2.textContent = "20칸 입력 완료 시 표시";
    }

    totalScore.textContent = result1 && result2
        ? `${result1.total + result2.total}점`
        : "-";
}

function setRound(round) {
    currentRound = round;

    roundButtons.forEach(button => {
        button.classList.toggle(
            "active",
            Number(button.dataset.round) === round
        );
    });

    stations.forEach(input => {
        const active = round === 1
            ? input.classList.contains("round1")
            : input.classList.contains("round2");

        input.classList.toggle("disabled", !active);

        // 환승역은 2라운드에서 1라운드의 값을 그대로 사용한다.
        if (round === 2 && input.classList.contains("purple")) {
            input.readOnly = true;
        }

        // 1라운드에서 비어 있는 환승역은 다시 입력 가능.
        if (
            round === 1 &&
            input.classList.contains("purple") &&
            input.value === ""
        ) {
            input.readOnly = false;
        }
    });

    info.textContent = round === 1
        ? "1라운드: 주황색 노선과 보라색 환승역에 숫자를 입력하세요."
        : "2라운드: 파란색 노선에 숫자를 입력하세요. 환승역은 1라운드 숫자를 그대로 사용합니다.";

    updateScores();
}

roundButtons.forEach(button => {
    button.addEventListener("click", () => {
        setRound(Number(button.dataset.round));
    });
});

stations.forEach(input => {
    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 2;
    input.autocomplete = "off";

    input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");

        if (input.value !== "") {
            const number = Number(input.value);

            if (number > 30) {
                input.value = "30";
            }
        }

        updateScores();
    });

    // 포커스를 벗어나면 해당 칸을 잠근다.
    input.addEventListener("blur", () => {
        if (input.value !== "") {
            input.readOnly = true;
        }
    });

    // Enter를 눌러도 다른 칸으로 자동 이동하지 않는다.
    input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
        }
    });
});

document.getElementById("clear").addEventListener("click", () => {
    stations.forEach(input => {
        input.value = "";
        input.readOnly = false;
    });

    setRound(1);
    updateScores();
});

setRound(1);
</script>

</body>
</html>
