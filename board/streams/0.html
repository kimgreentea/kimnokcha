<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>숫자 뽑기</title> <style>body,td{text-align:center}body{margin:0;font-family:Arial,sans-serif;background:#fff}h1{margin:30px 0 20px;font-size:28px}.buttons{display:flex;justify-content:center;gap:10px;margin:30px 0}.filled,button{background-color:#222;color:#fff}button{font-size:18pt;padding:10px 20px;border:0;border-radius:15px;cursor:pointer}button:active{transform:scale(.96)}table{margin:20px auto;border-collapse:separate;border-spacing:8px}td{width:80px;height:80px;border:0;vertical-align:middle}.filled{border-radius:50%;font-size:35pt;font-weight:700}@media (max-width:700px){td{width:60px;height:60px}.filled{font-size:25pt}button{font-size:15pt}}@media (max-width:500px){td{width:18vw;height:18vw}.filled{font-size:8vw}}</style> </head><body><h1>숫자 뽑기</h1><div class="buttons"><button id="drawButton" onclick="draw()">뽑기</button><button id="resetButton" onclick="resetGame()">다시 하기</button></div><table id="board"><tbody> <script>for(let t=0;t<8;t++){document.write("<tr>");for(let t=0;t<5;t++)document.write("<td></td>");document.write("</tr>")}</script> </tbody></table> <script>let pool=[],drawCount=0;const maxDraw=40,cells=document.querySelectorAll("#board td"),drawButton=document.getElementById("drawButton");function createPool(){pool=[];for(let o=1;o<=30;o++)pool.push(o),o>=11&&o<=19&&pool.push(o);pool.push("★")}function draw(){if(drawCount>=40)return;const o=Math.floor(Math.random()*pool.length),t=pool[o],l=cells[drawCount];l.textContent=t,l.classList.add("filled"),pool.splice(o,1),drawCount++,40===drawCount&&(drawButton.style.display="none")}function resetGame(){drawCount=0,createPool(),cells.forEach(o=>{o.textContent="",o.classList.remove("filled")}),drawButton.style.display="block"}createPool();</script> </body></html>
