<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오름차순 빙고</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px 12px 40px;
    background: #eef5fb;
    color: #222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}
.wrap { width: min(900px, 100%); margin: auto; }
h1 { margin: 0 0 5px; text-align: center; font-size: clamp(22px, 5vw, 34px); }
.sub { margin: 0 0 18px; text-align: center; color: #666; }
.sheet {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0002;
}
.board {
    position: relative;
    width: 560px;
    height: 330px;
    margin: auto;
    background: linear-gradient(115deg, #ffe8ca 0 30%, #e9f8f7 30% 72%, #f6edcf 72%);
}
.board svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
.station {
    position: absolute;
    width: 38px;
    height: 38px;
    transform: translate(-50%, -50%);
    border: 3px solid #3aa0d4;
    border-radius: 50%;
    background: #fff;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    outline: none;
    padding: 0;
    color: #222;
}
.station:focus {
    box-shadow: 0 0 0 3px #3aa0d455;
}
.station:read-only {
    background: #f7f7f7;
}
.info {
    padding: 15px 18px;
    text-align: center;
    border-top: 1px solid #ddd;
    color: #555;
    line-height: 1.55;
}
.score-box {
    margin-top: 14px;
    padding: 18px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0002;
    text-align: center;
}
.score-title { color: #666; font-weight: bold; }
.score {
    margin-top: 4px;
    font-size: 38px;
    font-weight: 800;
}
.detail { margin-top: 7px; color: #666; min-height: 24px; }
.buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}
button {

    border-radius: 10px;
    padding: 12px;
    border:none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#clear {
     background: #333;
      
     color: white;}
.score-table {
    margin-top: 25px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 8px 5px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #eee;
}

.tile-count-table table {
    border-collapse: collapse;
}

.tile-count-table th,
.tile-count-table td {
    padding: 4px 12px;
    border: 1px solid #ccc;
    text-align: center;
}

@media (max-width: 600px) {
    .board { width: 560px; }

}
</style>
</head>
<body>
<div class="wrap">
    <h1>오름차순 빙고</h1>
    <p class="sub">숫자가 왼쪽에서 오른쪽으로 갈수록 커지도록 입력하세요.<br>같은 숫자도 이어져도 커지는 것으로 인정합니다.</p>

    <div class="sheet">
        <div class="board">
            <svg viewBox="0 0 560 330" preserveAspectRatio="none" aria-hidden="true">
                <polyline
                    points="35,38 83,38 132,64 132,110 100,170 70,214 115,214 155,252 205,252 230,210 260,160 260,110 260,64 314,64 346,105 385,135 425,105 468,64 488,115 468,170"
                    fill="none"
                    stroke="#2f9fd4"
                    stroke-width="18"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                </polyline>
            </svg>

            <input class="station" data-id="1"  style="left:35px;top:38px;">
            <input class="station" data-id="2"  style="left:83px;top:38px;">
            <input class="station" data-id="3"  style="left:132px;top:64px;">
            <input class="station" data-id="4"  style="left:132px;top:110px;">
            <input class="station" data-id="5"  style="left:100px;top:170px;">
            <input class="station" data-id="6"  style="left:70px;top:214px;">
            <input class="station" data-id="7"  style="left:115px;top:214px;">
            <input class="station" data-id="8"  style="left:155px;top:252px;">
            <input class="station" data-id="9"  style="left:205px;top:252px;">
            <input class="station" data-id="10" style="left:230px;top:210px;">
            <input class="station" data-id="11" style="left:260px;top:160px;">
            <input class="station" data-id="12" style="left:260px;top:110px;">
            <input class="station" data-id="13" style="left:260px;top:64px;">
            <input class="station" data-id="14" style="left:314px;top:64px;">
            <input class="station" data-id="15" style="left:346px;top:105px;">
            <input class="station" data-id="16" style="left:385px;top:135px;">
            <input class="station" data-id="17" style="left:425px;top:105px;">
            <input class="station" data-id="18" style="left:468px;top:64px;">
            <input class="station" data-id="19" style="left:488px;top:115px;">
            <input class="station" data-id="20" style="left:468px;top:170px;">
        </div>
 
        </div>


    <div class="score-box">
        <div class="score-title">점수</div>
        <div class="score" id="score">-</div>
        <div class="detail" id="detail">게임 완료 시 점수 계산</div>
    </div>

    <div class="score-box">

    <p><b>조커는 0으로 입력</b></p>

<div class="tile-count-table">
    <table>
        <thead>
            <tr>
                <th>숫자</th>
                <th>1~10</th>
                <th>11~19</th>
                <th>20~30</th>
                <th>조커</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>개수</th>
                <td>1개</td>
                <td>2개</td>
                <td>1개</td>
                <td>1개</td>
            </tr>
        </tbody>
    </table>
</div>

    <div class="score-table">
        <table>
            <thead>
                <tr>
                    <th>연속 칸</th>
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                    <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
                    <th>11</th><th>12</th><th>13</th><th>14</th><th>15</th>
                    <th>16</th><th>17</th><th>18</th><th>19</th><th>20</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>점수</th>
                    <td>0</td><td>1</td><td>3</td><td>5</td><td>7</td>
                    <td>9</td><td>11</td><td>15</td><td>20</td><td>25</td>
                    <td>30</td><td>35</td><td>40</td><td>50</td><td>60</td>
                    <td>70</td><td>85</td><td>100</td><td>150</td><td>300</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>


    <div class="buttons">
        <button id="clear">다시 하기</button>
    </div>
</div>
    </div>
<script>
const scores = [
    0, 1, 3, 5, 7, 9, 11, 15, 20, 25,
    30, 35, 40, 50, 60, 70, 85, 100, 150, 300
];

const route = Array.from({length: 20}, (_, i) => String(i + 1));
const stations = [...document.querySelectorAll('.station')];

function getValue(id) {
    const input = document.querySelector(`[data-id="${id}"]`);
    if (!input || input.value === '') return null;
    return Number(input.value);
}

function streamScore(route) {
    const values = route.map(getValue);
    if (values.some(value => value === null)) return null;

    const streams = [];
    let streamLength = 0;
    let previousNumber = null;

    for (const value of values) {
        if (value === 0) {
            streamLength++;
            continue;
        }

        if (previousNumber !== null && value < previousNumber) {
            streams.push(streamLength);
            streamLength = 1;
        } else {
            streamLength++;
        }

        previousNumber = value;
    }

    if (streamLength > 0) streams.push(streamLength);

    const total = streams.reduce((sum, length) => {
        return sum + (scores[Math.min(length, 20) - 1] || 0);
    }, 0);

    return { total, streams };
}

function updateScore() {
    const result = streamScore(route);
    const scoreEl = document.getElementById('score');
    const detailEl = document.getElementById('detail');

    if (!result) {
        scoreEl.textContent = '';
        detailEl.textContent = '게임 완료 시 점수 계산';
        return;
    }

    scoreEl.textContent = result.total;
    detailEl.textContent = `${result.streams.map(n => n + '칸').join(' + ')}`;
}

stations.forEach(input => {
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 2;
    input.autocomplete = 'off';
    input.spellcheck = false;

    input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');

        if (input.value !== '') {
            const number = Number(input.value);
            if (number > 30) input.value = '30';
        }
        updateScore();
    });

    input.addEventListener('blur', () => {
        if (input.value !== '') input.readOnly = true;
        updateScore();
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'Enter') input.blur();
    });
});

document.getElementById('clear').addEventListener('click', () => {
    stations.forEach(input => {
        input.value = '';
        input.readOnly = false;
    });
    updateScore();
});

updateScore();
</script>
</body>
</html>
