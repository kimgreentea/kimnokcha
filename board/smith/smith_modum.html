<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>잰말놀이</title> <style>*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#f3f3f3;font-family:Arial,sans-serif;color:#222}h1{text-align:center;margin:0 0 30px}.game{max-width:1300px;margin:0 auto}.board{display:flex;gap:30px;align-items:flex-start;justify-content:center}.deck-area{flex:0 0 180px}.deck{width:250px;height:200px;border:3px solid #222;border-radius:14px;background:#555;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;user-select:none;box-shadow:4px 4px 0#aaa;transition:transform .1s}.deck:hover{transform:translateY(-2px)}.deck:active{transform:translateY(2px)}.deck-title{color:#fff;font-size:22px;font-weight:700}.arrow{margin-top:20px;width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700}.deck-count{margin-top:12px;color:#fff;font-size:16px}.cards-area{flex:1}.area-title{font-size:18px;font-weight:700;margin-bottom:12px;text-align:center}.card-slots{display:flex;gap:12px;align-items:flex-start;justify-content:center;min-height:250px}.slot{flex:1 1 0;max-width:250px;min-width:0;height:200px;border:2px dashed #aaa;border-radius:12px;position:relative;cursor:pointer;background:rgba(255,255,255,.5)}.slot:hover{background:rgba(220,220,220,.7)}.card-stack{position:absolute;top:32px;left:0;width:100%;height:240px}.card,.slot-count{position:absolute;text-align:center}.slot-count{top:8px;left:0;width:100%;color:#888;font-size:16px}.card{left:5%;width:90%;min-height:170px;border:2px solid #222;border-radius:10px;background:#fff;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:25px;line-height:1.5;box-shadow:2px 2px 4px rgba(0,0,0,.2);user-select:none}.card-text-top{transform:rotate(180deg)}.card.top{z-index:100}.drawn-area{min-height:200px;display:flex;flex-direction:column;align-items:center}.drawn-title{font-weight:700;margin-bottom:12px}.drawn-card{width:250px;min-height:200px;border:3px solid #222;border-radius:12px;background:#fff;flex-direction:column;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;font-size:25px;line-height:1.5;box-shadow:4px 4px 0#bbb}small{color:#888;font-size:15px}.drawn-empty{color:#999;font-size:16px}.restart-area{text-align:center}.restart{margin:0 0 20pt;border:0;border-radius:8px;padding:12px 25px;background:#222;color:#fff;font-size:16px;cursor:pointer}@media (max-width:700px){body{padding:20px 10px}.board{flex-direction:column;align-items:center}.deck-area{flex:none}.cards-area{width:100%}.card-slots{gap:5px}.slot{height:220px}.card{min-height:190px;padding:12px 7px;font-size:14px}}</style> </head><body><div class="restart-area"><button class="restart" id="restartButton" onclick="restartGame()" > 처음으로 </button></div><div class="game"><h1></h1><div class="board"><div class="deck-area"><div class="area-title"> 카드 더미<small> 클릭하여 뽑기</small></div><div class="deck" id="deck" onclick="drawCard()" ><div class="deck-title"> 방향 </div><div class="arrow" id="arrow" > ← </div><div class="deck-count"> 남은 장수: <span id="deckCount">30</span></div></div></div><div class="drawn-area"><div class="area-title"> 뽑은 카드 </div><div class="drawn-card" id="drawnCard" ><span class="drawn-empty"> 카드를 뽑아 주세요. </span></div></div></div><p style="height:30pt;"></p><div class="cards-area"><div class="area-title"> 카드 배치 <small>각 구역 클릭하여 배치된 카드 제거</small></div><div class="card-slots"><div class="slot" onclick="clickSlot(0)" ></div><div class="slot" onclick="clickSlot(1)" ></div><div class="slot" onclick="clickSlot(2)" ></div><div class="slot" onclick="clickSlot(3)" ></div><div class="slot" onclick="clickSlot(4)" ></div></div></div></div></div> <script>let sentences=[],deck=[],drawnCard=null,slots=[[],[],[],[],[]];async function loadSentences(){try{const t=await fetch("https://kimgreentea.github.io/kimnokcha/board/smith.json");if(!t.ok)throw new Error("문장 파일을 불러오지 못했습니다.");sentences=await t.json(),initGame()}catch(t){console.error(t),alert("문장 목록을 불러오지 못했습니다.")}}function initGame(){deck=[...sentences],shuffle(deck),drawnCard=null,slots=[[],[],[],[],[]],updateDeck(),renderSlots(),renderDrawnCard(),randomArrow()}function shuffle(t){for(let e=t.length-1;e>0;e--){const n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}}function drawCard(){0!==deck.length&&null===drawnCard&&(drawnCard=deck.pop(),randomArrow(),updateDeck(),renderDrawnCard())}function randomArrow(){const t=document.getElementById("arrow");Math.random()<.5?t.textContent="←":t.textContent="→"}function updateDeck(){document.getElementById("deckCount").textContent=deck.length}function renderDrawnCard(){const t=document.getElementById("drawnCard");t.innerHTML=null!==drawnCard?`\n    <div>${drawnCard}</div>\n    <br><small>배치 구역을 클릭하여 배치</small>\n`:'\n            <span class="drawn-empty">\n                카드를 뽑아 주세요.\n            </span>\n        '}function clickSlot(t){if(drawnCard)return slots[t].push(drawnCard),drawnCard=null,renderSlots(),void renderDrawnCard();slots[t]=[];for(let e=t;e<slots.length-1;e++)slots[e]=slots[e+1];slots[slots.length-1]=[],renderSlots(),renderDrawnCard()}function renderSlots(){const t=document.querySelector(".card-slots");t.innerHTML="";let e=1;for(let t=0;t<slots.length;t++)slots[t].length>0&&(e=Math.min(t+2,slots.length));for(let n=0;n<e;n++){const e=document.createElement("div");e.className="slot",e.onclick=()=>clickSlot(n);const r=document.createElement("div");r.className="card-stack";const a=slots[n];a.forEach((t,e)=>{const n=document.createElement("div");n.className="card",n.style.top=8*e+"px",n.style.zIndex=e+1;const a=document.createElement("div");a.className="card-text-top",a.textContent=t;const o=document.createElement("div");o.className="card-text-bottom",o.textContent=t,n.appendChild(a),n.appendChild(o),r.appendChild(n)}),e.appendChild(r);const o=document.createElement("small");o.className="slot-count",o.textContent=`${a.length}장`,e.appendChild(o),t.appendChild(e)}}function restartGame(){initGame()}loadSentences();</script> </body></html>
