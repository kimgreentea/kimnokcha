<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Minifier</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0 auto;
            padding: 26px 16px 50px;
            max-width: 1100px;
            font-family: Arial, "Malgun Gothic", sans-serif;
            line-height: 1.5;
            color: #222;
            background: #f5f6f8
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 6px
        }

        .sub {
            color: #555;
            margin: 0 0 18px
        }

        .panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin: 14px 0
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px
        }

        button,
        textarea {
            border-radius: 7px
        }

        .preview-frame,
        textarea {
            display: block;
            width: 100%;
            border: 1px solid #bbb
        }

        textarea {
            padding: 12px;
            font: 13px/1.5 Consolas, monospace;
            resize: vertical;
            tab-size: 2
        }

        #output,
        textarea {
            min-height: 300px
        }

        .preview-frame {
            height: 420px;
            border-radius: 7px;
            background: #fff
        }

        .buttons,
        .preview-head {
            display: flex;
            flex-wrap: wrap
        }

        .preview-head {
            justify-content: space-between;
            align-items: center;
            gap: 12px
        }

        .preview-head label {
            margin: 0
        }

        .buttons {
            gap: 8px;
            margin-top: 10px
        }

        button {
            border: 0;
            padding: 10px 15px;
            background: #2459a9;
            color: #fff;
            font-size: 14px;
            cursor: pointer
        }

        button.secondary {
            background: #555
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .options {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: 14px
        }

        .options label {
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0
        }

        .status {
            font-weight: 700
        }

        .ok {
            color: #147a35
        }

        .err {
            color: #b42318
        }

        .hint,
        .stats {
            font-size: 13px;
            color: #666
        }

        .stats {
            color: #444;
            margin-top: 8px;
            white-space: pre-wrap
        }

        @media (max-width:600px) {
            textarea {
                min-height: 240px
            }

            .panel {
                padding: 12px
            }
        }

    </style>
</head>

<body>
    <h1>HTML Minifier</h1>


    <section class="panel">
        <label for="file">파일 불러오기 (HTML, HTM, CSS, JS, TXT)</label>
        <input id="file" type="file" accept=".html,.htm,.css,.js,.txt,text/html,text/css,application/javascript,text/plain">

    </section>

    <section class="panel">
        <label for="input">입력 코드</label>
        <textarea id="input" spellcheck="false" placeholder="코드를 붙여 넣으세요."></textarea>
        <div class="options">
            <label><input type="checkbox" id="comments" checked> 일반 주석 제거</label>
            <label><input type="checkbox" id="collapse" checked> HTML 공백 압축</label>
            <label><input type="checkbox" id="optional"> 빈 속성 등 추가 최적화</label>
        </div>
        <div class="buttons">
            <button id="minify">전체 압축</button>


        </div>
    </section>

    <section class="panel">
        <label for="output">압축 결과</label>
        <textarea id="output" spellcheck="false" placeholder="압축 결과가 여기에 표시됩니다."></textarea>
        <div id="status" class="status"></div>
        <div id="stats" class="stats"></div>
        <div class="buttons">

            <button id="copy" disabled>결과 복사</button>

        </div>
        <p class="hint">압축은 코드의 동작을 완벽히 보장하지 않습니다. </p>
    </section>

    <section class="panel">
        <div class="preview-head">
            <label for="preview">압축 결과 미리보기</label>
            <button id="refreshPreview" class="secondary" type="button">미리보기 새로고침</button>
        </div>
        <iframe id="preview" class="preview-frame" title="압축된 HTML 미리보기" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        <p class="hint">일부 브라우저 기능이나 외부 API 요청은 실제 페이지와 다르게 동작할 수 있습니다. 악성코드가 실행될 수 있으니 신뢰할 수 있는 코드만 사용하세요.</p>
    </section>

    <script>
        window.__minifierLibraryErrors = [], window.__loadMinifierScript = function(i) {
            return new Promise(async n => {
                for (const r of i) try {
                    return await new Promise((i, n) => {
                        const e = document.createElement("script");
                        e.src = r, e.onload = i, e.onerror = () => {
                            e.remove(), n(new Error("로드 실패: " + r))
                        }, document.head.appendChild(e)
                    }), void n(!0)
                } catch (i) {
                    window.__minifierLibraryErrors.push(i.message)
                }
                n(!1)
            })
        }, window.__minifierLibrariesReady = Promise.all([window.__loadMinifierScript(["https://cdn.jsdelivr.net/npm/terser@5.43.1/dist/bundle.min.js", "https://unpkg.com/terser@5.43.1/dist/bundle.min.js"]), window.__loadMinifierScript(["https://cdn.jsdelivr.net/npm/csso@5.0.5/dist/csso.min.js", "https://unpkg.com/csso@5.0.5/dist/csso.min.js"]), window.__loadMinifierScript(["https://cdnjs.cloudflare.com/ajax/libs/html-minifier/4.0.0/htmlminifier.min.js", "https://cdn.jsdelivr.net/npm/html-minifier@4.0.0/dist/htmlminifier.min.js", "https://unpkg.com/html-minifier@4.0.0/dist/htmlminifier.min.js"])]);

    </script>
    <script>
        const $ = t => document.getElementById(t),
            fileInput = $("file"),
            input = $("input"),
            output = $("output"),
            minifyBtn = $("minify"),
            copyBtn = $("copy"),
            status = $("status"),
            stats = $("stats"),
            previewFrame = $("preview"),
            refreshPreviewBtn = $("refreshPreview");
        let usedMinifierTools = [];

        function updatePreview(t) {
            const e = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline' https: blob:; style-src 'unsafe-inline' https: data:; img-src https: data: blob:; font-src https: data:; media-src https: data: blob:; connect-src https:;\">",
                s = /<head\b[^>]*>/i.test(t) ? t.replace(/<head\b[^>]*>/i, t => t + e) : `<!doctype html><html><head>${e}</head><body>${t}</body></html>`;
            previewFrame.srcdoc = s
        }
        async function minifySource(t) {
            usedMinifierTools = [];
            const e = t.trim();
            if (!/<!doctype\s+html|<html[\s>]|<head[\s>]|<body[\s>]|<\/?[a-z][^>]*>/i.test(e)) {
                if (window.csso && "function" == typeof window.csso.minify) try {
                    const e = window.csso.minify(t, {
                        comments: $("comments").checked
                    }).css;
                    return usedMinifierTools.push("CSSO 5.0.5 (CSS)"), e
                } catch (t) {}
                if (window.Terser && "function" == typeof window.Terser.minify) {
                    const e = await window.Terser.minify(t, {
                        compress: !0,
                        mangle: !0,
                        format: {
                            comments: !$("comments").checked && "all"
                        }
                    });
                    if (e.error) throw e.error;
                    if (null != e.code) return usedMinifierTools.push("Terser 5.43.1 (JavaScript)"), e.code
                }
                throw new Error("CSS 또는 JavaScript로 인식했지만 압축하지 못했습니다. 코드 종류와 문법을 확인하세요.")
            }
            let s = t;
            if (window.csso && "function" == typeof window.csso.minify) {
                const t = /(<style\b[^>]*>)([\s\S]*?)(<\/style\s*>)/gi,
                    e = [...s.matchAll(t)];
                for (const t of e) {
                    const e = t[2];
                    let i = e;
                    try {
                        i = window.csso.minify(e, {
                            comments: !$("comments").checked
                        }).css, usedMinifierTools.push("CSSO 5.0.5 (style 내부 CSS)")
                    } catch (t) {
                        throw new Error("style 태그 안의 CSS 압축 실패: " + t.message)
                    }
                    s = s.replace(t[0], t[1] + i + t[3])
                }
            }
            if (window.Terser && "function" == typeof window.Terser.minify) {
                const t = /(<script\b(?![^>]*\bsrc\s*=)[^>]*>)([\s\S]*?)(<\/script\s*>)/gi,
                    e = [...s.matchAll(t)];
                for (const t of e) {
                    const e = t[2];
                    if (!e.trim()) continue;
                    let i;
                    try {
                        i = await window.Terser.minify(e, {
                            compress: !0,
                            mangle: !0,
                            format: {
                                comments: !$("comments").checked && "all"
                            }
                        })
                    } catch (t) {
                        throw new Error("script 태그 안의 JavaScript 압축 실패: " + t.message)
                    }
                    if (i.error) throw i.error;
                    usedMinifierTools.push("Terser 5.43.1 (script 내부 JavaScript)"), s = s.replace(t[0], t[1] + i.code + t[3])
                }
            }
            const i = window.htmlMinifier || window.HTMLMinifier;
            if (i && "function" == typeof i.minify) {
                const t = {
                        collapseWhitespace: $("collapse").checked,
                        conservativeCollapse: !0,
                        removeComments: $("comments").checked,
                        removeEmptyAttributes: $("optional").checked,
                        removeRedundantAttributes: $("optional").checked,
                        useShortDoctype: !0,
                        minifyCSS: !1,
                        minifyJS: !1,
                        removeOptionalTags: !1,
                        keepClosingSlash: !0
                    },
                    e = i.minify(s, t);
                return usedMinifierTools.push("HTML Minifier 4.0.0"), usedMinifierTools.length || usedMinifierTools.push("HTML Minifier 4.0.0"), e
            }
            return usedMinifierTools.push("내장 기본 HTML 압축 (HTML Minifier CDN 사용 불가)"), fallbackMinifyHTML(s, {
                collapseWhitespace: $("collapse").checked,
                removeComments: $("comments").checked
            })
        }

        function fallbackMinifyHTML(t, e) {
            const s = [];
            return t = t.replace(/<(pre|textarea|script|style)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, t => {
                const e = s.push(t) - 1;
                return `___MINIFY_PRESERVE_${e}_TOKEN___`
            }), e.removeComments && (t = t.replace(/<!--[\s\S]*?-->/g, t => /^<!--[\s\S]*?\[if[\s\S]*?<!\[endif\]-->$/i.test(t) ? t : "")), e.collapseWhitespace && (t = (t = t.replace(/[\t\r\n\f ]+/g, " ")).replace(/>\s+</g, "><")), (t = t.replace(/___MINIFY_PRESERVE_(\d+)_TOKEN___/g, (t, e) => s[Number(e)])).trim()
        }

        function setError(t) {
            status.className = "status err", status.textContent = "오류", stats.textContent = t
        }

        function formatBytes(t) {
            return t < 1024 ? t + " B" : (t / 1024).toFixed(2) + " KB"
        }
        fileInput.addEventListener("change", async () => {
            const t = fileInput.files && fileInput.files[0];
            if (t) try {
                input.value = await t.text(), output.value = "", copyBtn.disabled = !0, status.className = "status", status.textContent = "파일을 입력창에 불러왔습니다.", stats.textContent = `${t.name} · ${formatBytes(t.size)}`
            } catch (t) {
                setError("파일을 읽지 못했습니다: " + t.message)
            }
        }), minifyBtn.addEventListener("click", async () => {
            const t = input.value;
            if (t.trim()) {
                minifyBtn.disabled = !0, copyBtn.disabled = !0, status.className = "status", status.textContent = "압축 중...", stats.textContent = "";
                try {
                    await window.__minifierLibrariesReady;
                    const e = await minifySource(t);
                    output.value = e, updatePreview(e), copyBtn.disabled = !e, status.className = "status ok", status.textContent = "압축 완료";
                    const s = new Blob([t]).size,
                        i = new Blob([e]).size,
                        n = s ? (s - i) / s * 100 : 0;
                    stats.textContent = `입력: ${s.toLocaleString()} bytes (${formatBytes(s)})\n결과: ${i.toLocaleString()} bytes (${formatBytes(i)})\n용량 변화: ${n>=0?n.toFixed(1)+"% 감소":Math.abs(n).toFixed(1)+"% 증가"}\n사용한 압축 도구: ${usedMinifierTools.length?[...new Set(usedMinifierTools)].join(" + "):"확인되지 않음"}`
                } catch (t) {
                    const e = t && t.message ? t.message : String(t),
                        s = window.__minifierLibraryErrors || [];
                    setError("압축에 실패했습니다.\\n" + e + (s.length ? "\\n\\nCDN 로드 기록:\\n" + s.join("\\n") : ""))
                } finally {
                    minifyBtn.disabled = !1
                }
            } else setError("입력 코드가 비어 있습니다.")
        }), output.addEventListener("input", () => {
            updatePreview(output.value)
        }), refreshPreviewBtn.addEventListener("click", () => updatePreview(output.value)), copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(output.value), status.className = "status ok", status.textContent = "압축 결과를 복사했습니다."
            } catch (t) {
                output.focus();
                const e = document.execCommand("copy");
                status.className = e ? "status ok" : "status err", status.textContent = e ? "압축 결과를 복사했습니다." : "자동 복사에 실패했습니다. 결과창에서 Ctrl+C를 누르세요."
            }
        });

    </script>
</body>

</html>
