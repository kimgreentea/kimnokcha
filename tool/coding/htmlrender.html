
<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>실시간 HTML 렌더링</title>

<style>

/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f2f3f5;

    color: #222;

    display: flex;
    flex-direction: column;

}


/* =========================
   헤더
========================= */

header {

    height: 64px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 24px;

    background: #222;

    color: white;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.15);

}

header h1 {

    margin: 0;

    font-size: 22px;

    font-weight: 700;

}


/* =========================
   메인
========================= */

main {

    flex: 1;

    display: grid;

    /*
     * 코드 : 미리보기
     * 기본 50 : 50
     */
    grid-template-columns:
        1fr
        10px
        1fr;

    gap: 0;

    padding: 20px;

    min-height: 0;

}


/* =========================
   패널
========================= */

.panel {

    min-width: 0;
    min-height: 0;

    display: flex;

    flex-direction: column;

    background: white;

    border: 1px solid #ddd;

    overflow: hidden;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);

}

#codePanel {

    border-radius:
        12px 0 0 12px;

}

#previewPanel {

    border-radius:
        0 12px 12px 0;

}


/* =========================
   패널 제목
========================= */

.panelHeader {

    height: 48px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 0 16px;

    background: #fafafa;

    border-bottom: 1px solid #ddd;

    font-size: 15px;

    font-weight: bold;

}


/* =========================
   코드
========================= */

#code {

    flex: 1;

    width: 100%;

    min-height: 0;

    resize: none;

    border: 0;

    outline: none;

    padding: 18px;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 16px;

    line-height: 1.6;

    color: #222;

    background: white;

    tab-size: 4;

}

#code:focus {

    background: #fcfcff;

}


/* =========================
   미리보기
========================= */

#preview {

    flex: 1;

    width: 100%;
    height: 100%;

    border: 0;

    background: white;

}


/* =========================
   드래그바
========================= */

#divider {

    position: relative;

    width: 10px;

    cursor: col-resize;

    background: #e5e5e5;

}


/* 손잡이 */

#divider::after {

    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 4px;
    height: 60px;

    border-radius: 4px;

    background: #aaa;

}


#divider:hover {

    background: #d8d8d8;

}

#divider:hover::after {

    background: #666;

}


/* =========================
   드래그 중
========================= */

body.resizing {

    cursor: col-resize;

    user-select: none;

}

body.resizing iframe,
body.resizing textarea {

    pointer-events: none;

}


/* ==================================================
   좁은 화면
================================================== */

@media (max-width: 800px) {

    main {

        display: grid;

        grid-template-columns: 1fr;

        grid-template-rows:
            minmax(300px, 1fr)
            minmax(300px, 1fr);

        gap: 14px;

        padding: 14px;

    }


    #divider {

        display: none;

    }


    #codePanel,
    #previewPanel {

        border-radius: 10px;

    }


    .panelHeader {

        height: 44px;

        padding: 0 14px;

        font-size: 14px;

    }


    #code {

        padding: 14px;

        font-size: 15px;

    }

}


/* =========================
   아주 좁은 화면
========================= */

@media (max-width: 400px) {

    main {

        padding: 8px;

        gap: 8px;

        grid-template-rows:
            minmax(250px, 1fr)
            minmax(250px, 1fr);

    }


    #code {

        font-size: 14px;

    }

}

</style>

</head>


<body>




<!-- =========================
     메인
========================= -->

<main id="main">


    <!-- 코드 -->

    <section
        class="panel"
        id="codePanel">

        <div class="panelHeader">
            HTML 코드
        </div>

        <textarea
            id="code"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="여기에 HTML 코드를 입력하세요."></textarea>

    </section>


    <!-- 드래그바 -->

    <div
        id="divider"
        title="드래그하여 크기 조절">
    </div>


    <!-- 미리보기 -->

    <section
        class="panel"
        id="previewPanel">

        <div class="panelHeader">
            미리보기
        </div>

        <iframe
            id="preview"
            title="HTML 미리보기">
        </iframe>

    </section>


</main>


<script>

/* =========================
   요소
========================= */

const codeInput =
    document.getElementById("code");

const preview =
    document.getElementById("preview");

const main =
    document.getElementById("main");

const divider =
    document.getElementById("divider");


/* =========================
   HTML 렌더링
========================= */

function render() {

    preview.srcdoc =
        codeInput.value;

}


codeInput.addEventListener(
    "input",
    render
);


/* ==================================================
   화면 크기
================================================== */

function isMobileLayout() {

    return window.innerWidth <= 800;

}


/* ==================================================
   패널 비율
================================================== */

/*
 * 코드 영역의 비율
 *
 * 0.5 = 50%
 * 0.7 = 70%
 */

let codeRatio = 0.5;


/* ==================================================
   드래그
================================================== */

let isResizing = false;


/* =========================
   드래그 시작
========================= */

divider.addEventListener(
    "mousedown",
    function(event) {

        if (isMobileLayout()) {
            return;
        }

        isResizing = true;

        document.body.classList.add(
            "resizing"
        );

        event.preventDefault();

    }
);


/* =========================
   드래그 중
========================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!isResizing) {
            return;
        }


        if (isMobileLayout()) {

            isResizing = false;

            document.body.classList.remove(
                "resizing"
            );

            resetDesktopLayout();

            return;

        }


        /*
         * main의 실제 영역
         */

        const rect =
            main.getBoundingClientRect();


        /*
         * padding 계산
         */

        const style =
            getComputedStyle(main);

        const paddingLeft =
            parseFloat(
                style.paddingLeft
            );

        const paddingRight =
            parseFloat(
                style.paddingRight
            );


        /*
         * 실제 grid 영역의 가로폭
         */

        const contentWidth =
            rect.width -
            paddingLeft -
            paddingRight;


        /*
         * 마우스의 grid 영역 내 위치
         */

        const mouseX =
            event.clientX -
            rect.left -
            paddingLeft;


        /*
         * 드래그바 너비
         */

        const dividerWidth = 10;


        /*
         * 코드 영역 너비
         */

        const codeWidth =
            mouseX;


        /*
         * divider를 제외한 전체 영역
         */

        const availableWidth =
            contentWidth -
            dividerWidth;


        /*
         * 비율 계산
         */

        codeRatio =
            codeWidth /
            availableWidth;


        /*
         * 최소 비율
         */

        const minRatio =
            200 / availableWidth;


        /*
         * 코드 최소 200px
         */

        if (codeRatio < minRatio) {

            codeRatio =
                minRatio;

        }


        /*
         * 미리보기 최소 200px
         */

        if (
            1 - codeRatio <
            minRatio
        ) {

            codeRatio =
                1 - minRatio;

        }


        /*
         * 비율로 적용
         *
         * 핵심 부분
         */

        main.style.gridTemplateColumns =
            `${codeRatio}fr 10px ${1 - codeRatio}fr`;

    }
);


/* =========================
   드래그 종료
========================= */

document.addEventListener(
    "mouseup",
    function() {

        if (!isResizing) {
            return;
        }

        isResizing = false;

        document.body.classList.remove(
            "resizing"
        );

    }
);


/* ==================================================
   데스크톱 레이아웃 초기화
================================================== */

function resetDesktopLayout() {

    main.style.gridTemplateColumns = "";

}


/* ==================================================
   화면 크기 변경
================================================== */

window.addEventListener(
    "resize",
    function() {

        if (isMobileLayout()) {

            /*
             * 모바일에서는
             * grid 비율 설정 제거
             */

            main.style.gridTemplateColumns = "";

        }

        else {

            /*
             * 다시 데스크톱으로 돌아오면
             * 기존 비율 복원
             */

            main.style.gridTemplateColumns =
                `${codeRatio}fr 10px ${1 - codeRatio}fr`;

        }

    }
);


/* =========================
   초기 실행
========================= */

render();

</script>


</body>
</html>
