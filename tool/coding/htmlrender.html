<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>실시간 HTML 렌더링</title> <style>*{box-sizing:border-box}body,html{margin:0;width:100%;height:100%}.panel,body{display:flex;flex-direction:column}body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f2f3f5;color:#222}header{height:64px;padding:0 24px;background:#222;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}header h1{margin:0;font-size:22px;font-weight:700}main{flex:1;display:grid;grid-template-columns:1fr 10px 1fr;gap:0;padding:20px;min-height:0}.panel{min-width:0;min-height:0;background:#fff;border:1px solid #ddd;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08)}#codePanel{border-radius:12px 0 0 12px}#previewPanel{border-radius:0 12px 12px 0}.panelHeader,header{flex-shrink:0;display:flex;align-items:center}.panelHeader{height:48px;padding:0 16px;background:#fafafa;border-bottom:1px solid #ddd;font-size:15px;font-weight:700}#code{flex:1;width:100%;min-height:0;resize:none;border:0;outline:0;padding:18px;font-family:Consolas,"Courier New",monospace;font-size:16px;line-height:1.6;color:#222;background:#fff;tab-size:4}#code:focus{background:#fcfcff}#preview{flex:1;width:100%;height:100%;border:0;background:#fff}#divider{position:relative;width:10px;cursor:col-resize;background:#e5e5e5}#divider::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:60px;border-radius:4px;background:#aaa}#divider:hover{background:#d8d8d8}#divider:hover::after{background:#666}body.resizing{cursor:col-resize;user-select:none}body.resizing iframe,body.resizing textarea{pointer-events:none}@media (max-width:800px){main{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) minmax(300px,1fr);gap:14px;padding:14px}#divider{display:none}#codePanel,#previewPanel{border-radius:10px}.panelHeader{height:44px;padding:0 14px;font-size:14px}#code{padding:14px;font-size:15px}}@media (max-width:400px){main{padding:8px;gap:8px;grid-template-rows:minmax(250px,1fr) minmax(250px,1fr)}#code{font-size:14px}}</style> </head><body><main id="main"><section class="panel" id="codePanel"><div class="panelHeader"> HTML 코드 </div> <textarea
            id="code"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="여기에 HTML 코드를 입력하세요."></textarea> </section><div id="divider" title="드래그하여 크기 조절"></div><section class="panel" id="previewPanel"><div class="panelHeader"> 미리보기 </div><iframe id="preview" title="HTML 미리보기"></iframe></section></main> <script>const codeInput=document.getElementById("code"),preview=document.getElementById("preview"),main=document.getElementById("main"),divider=document.getElementById("divider"),CODE_STORAGE_KEY="htmlRendererCode";function render(){localStorage.setItem(CODE_STORAGE_KEY,codeInput.value),preview.srcdoc=codeInput.value}function isMobileLayout(){return window.innerWidth<=800}codeInput.addEventListener("input",render);let codeRatio=.5,isResizing=!1;function resetDesktopLayout(){main.style.gridTemplateColumns=""}divider.addEventListener("mousedown",function(e){isMobileLayout()||(isResizing=!0,document.body.classList.add("resizing"),e.preventDefault())}),document.addEventListener("mousemove",function(e){if(!isResizing)return;if(isMobileLayout())return isResizing=!1,document.body.classList.remove("resizing"),void resetDesktopLayout();const t=main.getBoundingClientRect(),i=getComputedStyle(main),n=parseFloat(i.paddingLeft),o=parseFloat(i.paddingRight),d=t.width-n-o,s=e.clientX-t.left-n,a=d-10;codeRatio=s/a;const r=200/a;codeRatio<r&&(codeRatio=r),1-codeRatio<r&&(codeRatio=1-r),main.style.gridTemplateColumns=`${codeRatio}fr 10px ${1-codeRatio}fr`}),document.addEventListener("mouseup",function(){isResizing&&(isResizing=!1,document.body.classList.remove("resizing"))}),window.addEventListener("resize",function(){isMobileLayout()?main.style.gridTemplateColumns="":main.style.gridTemplateColumns=`${codeRatio}fr 10px ${1-codeRatio}fr`});const savedCode=localStorage.getItem(CODE_STORAGE_KEY);null!==savedCode&&(codeInput.value=savedCode),render();</script> </body></html>
