<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 검사</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;padding:26px 16px 56px;max-width:1000px;font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.5;color:#222;background:#f5f6f8}
h1{font-size:1.5rem;margin:0 0 8px}
p{margin:8px 0 16px;color:#555}
.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}
label{display:block;font-weight:700;margin-bottom:8px}
textarea{display:block;width:100%;min-height:220px;padding:12px;border:1px solid #bbb;border-radius:6px;font:14px/1.5 Consolas,monospace;resize:vertical;white-space:pre;tab-size:4}
#output{min-height:300px}
select,input[type=file]{max-width:100%;padding:8px}
button{border:0;border-radius:7px;padding:10px 14px;margin:10px 8px 0 0;background:#2459a9;color:white;font-size:15px;cursor:pointer}
button.secondary{background:#555}
button:disabled{background:#999;cursor:not-allowed}
#status{font-weight:700;white-space:pre-wrap}
.ok{color:#147a35}.error{color:#b42318}
.hint{font-size:14px;color:#666}
</style>
</head>
<body>
<h1>JSON 검사 및 정리 도구</h1>
<p>JSON 파일을 불러오거나 직접 붙여 넣으세요.</p>

<section class="panel">
  <label for="mode">검사 방식</label>
  <select id="mode">
    <option value="generic">JSON 검사 및 정렬</option>
    <option value="sentence">한문용 검사 및 변환</option>
  </select>
  <p class="hint" id="modeHint">모든 종류의 JSON을 검사하고 들여쓰기 4칸으로 정리합니다. 데이터 구조는 제한하지 않습니다.</p>
  <label for="fileInput">JSON 파일 선택</label>
  <input id="fileInput" type="file" accept=".json,application/json,.txt,text/plain">
</section>

<section class="panel">
  <label for="input">입력 JSON</label>
  <textarea id="input" spellcheck="false" placeholder="JSON 내용을 붙여 넣으세요."></textarea>
  <button id="checkBtn" type="button">검사 및 변환</button>
  <button id="clearBtn" class="secondary" type="button">입력·결과 지우기</button>
</section>

<section class="panel">
  <label>검사 결과</label>
  <div id="status">JSON 내용을 입력하거나 파일을 불러오세요.</div>
  <pre id="details" hidden></pre>
</section>

<section class="panel">
  <label for="output">변환 결과 (직접 수정 가능)</label>
  <textarea id="output" spellcheck="false" placeholder="검사를 통과하면 결과가 여기에 표시됩니다."></textarea>
  <button id="copyBtn" type="button" disabled>내용 복사</button>
  <button id="validateOutputBtn" class="secondary" type="button">수정한 결과 다시 검사</button>
</section>

<script>
const modeEl = document.getElementById("mode");
const modeHint = document.getElementById("modeHint");
const fileInput = document.getElementById("fileInput");
const inputEl = document.getElementById("input");
const outputEl = document.getElementById("output");
const checkBtn = document.getElementById("checkBtn");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");
const validateOutputBtn = document.getElementById("validateOutputBtn");
const statusEl = document.getElementById("status");
const detailsEl = document.getElementById("details");
let selectedFile = null;
let lastValidOutput = false;

fileInput.addEventListener("change", async () => {
  selectedFile = fileInput.files[0] || null;
  if (!selectedFile) return;
  try {
    inputEl.value = await selectedFile.text();
    statusEl.className = "";
    statusEl.textContent = "";
    detailsEl.hidden = true;
    outputEl.value = "";
    copyBtn.disabled = true;
    lastValidOutput = false;
    previewPlaceholder();
  } catch (e) {
    setError("파일 읽기 오류: " + e.message);
  }
});

modeEl.addEventListener("change", () => {
  modeHint.textContent = modeEl.value === "generic"
    ? "모든 종류의 JSON을 검사하고 들여쓰기 4칸으로 정리합니다. 데이터 구조는 제한하지 않습니다."
    : "한문 문장 배열의 hanmun, reading, meaning, keyHanja 구조를 검사하고 keyHanja 객체를 한 줄씩 출력합니다.";
});

checkBtn.addEventListener("click", () => processJson(inputEl.value));
validateOutputBtn.addEventListener("click", () => {
  const text = outputEl.value;
  let data;
  try {
    data = JSON.parse(text.replace(/^\uFEFF/, ""));
  } catch (e) {
    showJsonError(text, e);
    return;
  }

  if (modeEl.value === "sentence") {
    const result = validateSentenceData(data);
    if (result.errors.length) {
      setError("데이터 구조 오류 " + result.errors.length + "개\n\n" + result.errors.map(x => "• " + x).join("\n"));
      return;
    }
    setStatus(`검사 통과: ${result.data.length}개 문장. JSON 문법과 데이터 구조가 정상입니다.`, "ok");
  } else {
    setStatus("검사 통과: 유효한 JSON입니다.", "ok");
  }
  detailsEl.hidden = true;
});

copyBtn.addEventListener("click", async () => {
  if (!outputEl.value.trim()) return;
  try {
    await navigator.clipboard.writeText(outputEl.value);
    // 복사 결과는 검사 결과 칸에 표시하지 않습니다.
  } catch {
    outputEl.focus();
    outputEl.select();
    document.execCommand("copy");
  }
});

clearBtn.addEventListener("click", () => {
  inputEl.value = "";
  outputEl.value = "";
  copyBtn.disabled = true;
  lastValidOutput = false;
  detailsEl.hidden = true;
  statusEl.className = "";
  statusEl.textContent = "";
  previewPlaceholder();
});

function processJson(raw) {
  detailsEl.hidden = true;
  statusEl.className = "";
  statusEl.textContent = "";

  let data;
  try {
    data = JSON.parse(raw.replace(/^\uFEFF/, ""));
  } catch (e) {
    showJsonError(raw, e);
    return;
  }

  if (modeEl.value === "generic") {
    outputEl.value = JSON.stringify(data, null, 4) + "\n";
    lastValidOutput = true;
    copyBtn.disabled = false;
    setStatus("검사 통과: 유효한 JSON입니다. 들여쓰기 4칸으로 정리했습니다.", "ok");
    return;
  }

  const result = validateSentenceData(data);
  if (result.errors.length) {
    setError("데이터 구조 오류 " + result.errors.length + "개\n\n" + result.errors.map(x => "• " + x).join("\n"));
    return;
  }

  const formatted = formatSentenceJson(result.data);
  try {
    JSON.parse(formatted);
  } catch (e) {
    setError("내부 변환 결과 검사 실패: " + e.message);
    return;
  }
  outputEl.value = formatted;
  lastValidOutput = true;
  copyBtn.disabled = false;
  setStatus(`검사 통과: ${result.data.length}개 문장. JSON 문법과 데이터 구조가 정상입니다.`, "ok");
}

function validateSentenceData(data) {
  const errors = [];
  if (!Array.isArray(data)) {
    return {data: [], errors: ["최상위 데이터가 JSON 배열([])이 아닙니다."]};
  }

  const result = [];
  data.forEach((sentence, i) => {
    const n = i + 1;
    if (!isObject(sentence)) {
      errors.push(`${n}번 문장: 객체가 아닙니다.`);
      return;
    }

    let validSentence = true;
    for (const field of ["hanmun", "reading", "meaning"]) {
      if (!(field in sentence)) {
        errors.push(`${n}번 문장: '${field}' 필드가 없습니다.`);
        validSentence = false;
      } else if (typeof sentence[field] !== "string") {
        errors.push(`${n}번 문장: '${field}' 값이 문자열이 아닙니다.`);
        validSentence = false;
      }
    }

    if (!("keyHanja" in sentence)) {
      errors.push(`${n}번 문장: 'keyHanja' 필드가 없습니다.`);
      return;
    }
    if (!Array.isArray(sentence.keyHanja)) {
      errors.push(`${n}번 문장: 'keyHanja'가 배열이 아닙니다.`);
      return;
    }

    const keyHanja = [];
    sentence.keyHanja.forEach((item, j) => {
      const label = `${n}번 문장 keyHanja ${j + 1}번`;
      if (!isObject(item)) {
        errors.push(`${label}: 객체가 아닙니다.`);
        return;
      }
      let validItem = true;
      for (const field of ["hanja", "meaning", "reading"]) {
        if (!(field in item)) {
          errors.push(`${label}: '${field}' 필드가 없습니다.`);
          validItem = false;
        } else if (typeof item[field] !== "string") {
          errors.push(`${label}: '${field}' 값이 문자열이 아닙니다.`);
          validItem = false;
        }
      }
      if (validItem) keyHanja.push({
        hanja: item.hanja,
        meaning: item.meaning,
        reading: item.reading
      });
    });

    if (validSentence) result.push({
      hanmun: sentence.hanmun,
      reading: sentence.reading,
      meaning: sentence.meaning,
      keyHanja
    });
  });

  return {data: result, errors};
}

function formatSentenceJson(data) {
  const lines = ["["];
  data.forEach((s, i) => {
    lines.push("    {");
    lines.push(`        "hanmun": ${JSON.stringify(s.hanmun)},`);
    lines.push(`        "reading": ${JSON.stringify(s.reading)},`);
    lines.push(`        "meaning": ${JSON.stringify(s.meaning)},`);
    lines.push('        "keyHanja": [');
    s.keyHanja.forEach((item, j) => {
      lines.push("            " + JSON.stringify(item) + (j < s.keyHanja.length - 1 ? "," : ""));
    });
    lines.push("        ]");
    lines.push("    }" + (i < data.length - 1 ? "," : ""));
  });
  lines.push("]");
  return lines.join("\n") + "\n";
}

function showJsonError(raw, error) {
  const match = error.message.match(/position\s+(\d+)/i);
  const position = match ? Number(match[1]) : null;
  let message = "JSON 문법 오류\n" + error.message;
  if (position !== null) {
    const before = raw.slice(0, position);
    const line = before.split("\n").length;
    const lastNewline = before.lastIndexOf("\n");
    const column = position - lastNewline;
    message += `\n위치: ${line}행 ${column}열`;
    message += "\n\n오류 주변 코드:\n" + getContext(raw, line);
  }
  setError(message);
}

function getContext(text, errorLine) {
  const lines = text.split(/\r?\n/);
  const start = Math.max(1, errorLine - 2);
  const end = Math.min(lines.length, errorLine + 2);
  const out = [];
  for (let n = start; n <= end; n++) {
    out.push(`${n === errorLine ? ">>" : "  "} ${n}: ${lines[n - 1]}`);
  }
  return out.join("\n");
}

function isObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}
function setStatus(message, cls) {
  statusEl.className = cls || "";
  statusEl.textContent = message;
  detailsEl.hidden = true;
}
function setError(message) {
  statusEl.className = "error";
  statusEl.textContent = "검사 실패";
  detailsEl.textContent = message;
  detailsEl.hidden = false;
}

outputEl.addEventListener("input", () => {
  copyBtn.disabled = !outputEl.value.trim();
});

function previewPlaceholder() {
  // 설명 문구를 검사 결과 영역에 넣지 않습니다.
}
</script>
</body>
</html>
