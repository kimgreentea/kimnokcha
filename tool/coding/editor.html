<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>에디터</title>
    <style>
        * {
            box-sizing: border-box
        }

        :root {
            --app-bg: #eef1f6;
            --ink: #202a3a;
            --line: #d7deea;
            --blue: #315fd3
        }

        body {
            margin: 0;
            background: var(--app-bg);
            color: var(--ink);
            font: 15px/1.55 system-ui, -apple-system, "Noto Sans KR", sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #202d48;
            color: white;
            padding: 11px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 3px 14px #17233b24
        }

        .brand {
            font-weight: 800
        }

        .actions,
        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid #cbd4e1;
            background: white;
            color: #202a3a;
            border-radius: 8px;
            padding: 7px 10px;
            font-weight: 650
        }

        .btn.dark {
            background: #33425f;
            color: white;
            border-color: #52617b
        }

        .btn.primary {
            background: #315fd3;
            color: white;
            border-color: #315fd3
        }

        .btn.danger {
            color: #b42332
        }

        .app {
            max-width: 1600px;
            margin: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: minmax(300px, .8fr) minmax(420px, 1.2fr);
            gap: 14px;
            align-items: start
        }

        .panel {
            min-width: 0;
            background: white;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px;
            margin-bottom: 12px
        }

        h2 {
            font-size: 1.05rem;
            margin: 0 0 10px
        }

        .field {
            display: grid;
            gap: 4px;
            margin: 8px 0
        }

        .field label,
        .label {
            font-size: .82rem;
            font-weight: 750;
            color: #526075
        }

        input[type=text],
        input[type=url],
        input[type=number],
        select,
        textarea {
            width: 100%;
            min-width: 0;
            border: 1px solid #cbd3df;
            border-radius: 7px;
            padding: 8px;
            background: white;
            color: inherit
        }

        textarea {
            resize: vertical;
            min-height: 70px
        }

        .add-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px
        }

        .section-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            margin: 8px 0;
            overflow: hidden
        }

        .section-head {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px;
            background: #f7f8fb
        }

        .section-head strong {
            flex: 1;
            min-width: 0
        }

        .section-body {
            padding: 10px
        }

        .section-card.collapsed .section-body {
            display: none
        }

        .section-card.dragging {
            opacity: .4
        }

        .handle {
            cursor: grab;
            padding: 3px
        }

        .small {
            font-size: .8rem;
            color: #6c7788
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px
        }

        .choice-row {
            display: grid;
            grid-template-columns: 20px minmax(0, 1fr) auto;
            align-items: center;
            gap: 6px;
            margin: 6px 0
        }

        .choice-row label {
            display: contents
        }

        .choice-row input[type=radio] {
            width: auto;
            margin: 0;
            justify-self: center
        }

        .choice-row input[type=text] {
            width: 100%;
            min-width: 0
        }

        .choice-row .btn {
            white-space: nowrap;
            padding: 6px 8px
        }

        .toolbar {
            padding: 7px;
            background: #f7f8fb;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 8px
        }

        .preview-tools {
            position: sticky;
            top: -12px;
            z-index: 12;
            background: #dfe4ed;
            padding: 0 0 8px;
            margin-bottom: 8px
        }

        .preview-tools .preview-label {
            padding-top: 2px
        }

        .palette {
            display: inline-flex;
            gap: 4px;
            align-items: center
        }

        .swatch {
            width: 23px;
            height: 23px;
            padding: 0;
            border: 2px solid #fff;
            outline: 1px solid #cbd3df;
            border-radius: 6px;
            min-width: 23px
        }

        .swatch:hover,
        .swatch:focus {
            outline: 2px solid #315fd3
        }

        .palette-group {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            padding: 2px 4px
        }

        .palette-label {
            font-size: .76rem;
            color: #526075;
            font-weight: 700;
            white-space: nowrap
        }

        .toolbar select {
            width: auto;
            max-width: 150px;
            padding: 5px
        }

        .toolbar button {
            padding: 5px 8px
        }

        .preview-shell {
            position: sticky;
            top: 75px;
            max-height: calc(100vh - 90px);
            overflow: auto;
            background: #dfe4ed;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d0d8e4
        }

        .preview-label {
            font-weight: 800;
            margin: 0 0 8px
        }

        .page {
            margin: auto;
            max-width: 900px;
            min-height: 600px;
            background: white;
            padding: 28px;
            overflow-wrap: anywhere
        }

        .page [contenteditable=true]:focus {
            outline: 2px solid #8eafff;
            outline-offset: 2px
        }

        .page-section {
            position: relative;
            margin: 0 0 16px;
            padding: 16px;
            border: 1px solid #dfe4ed;
            border-radius: 10px;
            min-height: 48px
        }

        .page-section.divider-section {
            border: 0 !important;
            border-radius: 0 !important;
            padding: 0 !important;
            min-height: 0;
            margin: 12px 0;
            background: transparent !important
        }

        .divider-section hr {
            border: 0;
            border-top: 2px solid #cbd5e1;
            margin: 0
        }

        .page-section h2 {
            margin: 0 0 10px
        }

        .page-section p {
            margin: 8px 0
        }

        .preview-drag-handle {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 5;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffffd9;
            color: #334155;
            padding: 1px 7px;
            font-size: 14px;
            line-height: 1.5;
            cursor: grab;
            opacity: .65
        }

        .preview-drag-handle:hover {
            opacity: 1
        }

        .divider-section .preview-drag-handle {
            position: relative;
            display: block;
            top: auto;
            right: auto;
            margin: 0 0 4px auto;
            width: max-content
        }

        .page-section.preview-dragging {
            opacity: .45;
            outline: 2px dashed #315fd3
        }

        .page-section ul,
        .page-section ol {
            padding-left: 1.6em
        }

        .page-title {
            margin: 0 0 8px
        }

        .page-subtitle {
            margin: 0 0 22px
        }

        .table-picker {
            position: absolute;
            right: 12px;
            top: 100%;
            z-index: 30;
            width: 250px;
            padding: 12px;
            background: white;
            color: #202a3a;
            border: 1px solid #cbd3df;
            border-radius: 12px;
            box-shadow: 0 10px 30px #17233b2b
        }

        .table-picker[hidden] {
            display: none
        }

        .table-picker-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px
        }

        .table-grid button {
            aspect-ratio: 1;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #f8fafc;
            padding: 0;
            min-width: 0
        }

        .table-grid button.active,
        .table-grid button:hover {
            background: #a5c8ff;
            border-color: #315fd3
        }

        .table-picker .small {
            margin: 8px 0 0
        }

        .page[data-theme="dark"] .page-section {
            border-color: #475569
        }

        .status {
            font-size: .8rem;
            color: #6c7788;
            margin-top: 8px
        }

        @media(max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            .preview-shell {
                position: static;
                max-height: none;
                overflow: visible
            }

            .topbar {
                position: static
            }
        }

        @media(max-width:520px) {
            .app {
                padding: 8px
            }

            .page {
                padding: 15px
            }

            .add-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .section-head {
                flex-wrap: wrap
            }
        }

    </style>

        .export-page img {
            max-width: 100%;
            height: auto
        }

        .export-page .youtube-embed {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            max-width: 800px;
            margin: 12px auto
        }

        .export-page .youtube-embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0
        }

        .export-page table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #cbd5e1
        }

        .export-page td,
        .export-page th {
            border: 0;

            text-align: left
        }

        .export-page th {
            background: #eff6ff;
            font-weight: 700
        }

        .export-page[data-theme="dark"] table {
            border-color: #475569

        .export-page[data-theme="dark"] th {
            border-color: #475569
        }

        .export-page[data-theme="dark"] th {
            background: #334155;
            color: #f3f4f6
        }

        .export-page tr:last-child td {
            border-bottom: 0
        }

        .export-page td:last-child,
        .export-page th:last-child {
            border-right: 0
        }

        .export-page blockquote {
            border-left: 4px solid #9aa9c1;
            padding: 5px 12px;
            color: #536177
        }

        .export-page pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .export-page hr {
            border: 0;
            border-top: 2px solid #cbd5e1
        }

        .export-page .quiz-question {
            border: 0;
            padding: 10px 0;
            margin: 10px 0
        }

        .export-page .quiz-title {
            font-weight: 750;
            margin-bottom: 8px
        }

        .export-page .quiz-options {
            display: grid;

            gap: 6px
        }

        .export-page .quiz-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer
        }

        .export-page .quiz-options label.selected {
            background: rgba(148, 163, 184, .2)
        }

        .quiz-question.correct {
            background: url('https://github.com/kimgreentea/kimnokcha/blob/main/css/images/check-O.png?raw=true') no-repeat
        }

        .quiz-question.wrong {
            background: url('https://github.com/kimgreentea/kimnokcha/blob/main/css/images/check-X.png?raw=true') no-repeat 
        }

        .quiz-question.wrong {
            background-size: 90px 90px
        }




        @media(max-width:600px) {

            }

            }

<body>
<header class="topbar">
  <div class="brand">에디터</div>
  <div class="actions">
    <button class="btn dark" id="save-json">저장</button>
    <button class="btn dark" id="load-json-btn">불러오기</button>
    <button class="btn dark" id="export-html">내보내기</button>
    <button class="btn dark" id="export-txt">코드</button>
    <input id="load-json" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<div class="app">
<section>
  <div class="panel">
    <h2>문서 설정</h2>
    <div class="field"><label for="doc-title">문서 제목</label><input id="doc-title" type="text" value="새 문서"></div>
    <div class="field"><label for="doc-subtitle">부제</label><input id="doc-subtitle" type="text" value=""></div>
    <div class="row">
      <div class="field"><label for="font-family">글꼴</label><select id="font-family"><option value='system-ui,-apple-system,"Noto Sans KR",sans-serif'>고딕</option><option value='"Noto Serif KR",serif'>명조</option><option value="Pretendard">프리텐다드</option><option value="Ridibatang">리디바탕</option><option value='GMarketSans'>지마켓산스</option><option value='NexonMaplestory'>메이플스토리</option><option value='IsYun'>이서윤체</option><option value='monospace'>고정폭</option></select></div>
      <div class="field"><label for="font-size">전체 글자 크기 (px)</label><input id="font-size" type="number" min="8" max="72" value="16"></div>
    </div>
    <div class="field"><label for="theme-mode">문서 테마</label><select id="theme-mode"><option value="light">라이트 모드</option><option value="dark">다크 모드</option></select></div>
    <div class="row">
      <div class="field"><label for="page-width">내용 너비</label><select id="page-width"><option value="900px">보통 (900px)</option><option value="100%">전체 너비</option><option value="700px">좁게 (700px)</option><option value="1100px">넓게 (1100px)</option></select></div>
      <div class="field"><label for="line-height">줄 간격</label><select id="line-height"><option value="1.4">좁게</option><option value="1.65" selected>보통</option><option value="2">넓게</option><option value="2.4">매우 넓게</option></select></div>
    </div>
    <div class="field"><label for="page-padding">페이지 안쪽 여백 (px)</label><input id="page-padding" type="number" min="0" max="100" value="28"></div>
  </div>
  <div class="panel">
    <h2>섹션 추가</h2>
    <div class="add-grid">
      <button class="btn" data-add="text">＋ 본문</button><button class="btn" data-add="quiz">＋ 퀴즈</button><button class="btn" data-add="table">＋ 표</button>
     <button class="btn" data-add="two-column">＋ 2단 구성</button>
 <button class="btn" data-add="html">＋ HTML</button>
      <button class="btn" data-add="divider">＋ 구분선</button>
    </div>
  </div>
  <div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0">섹션 순서 및 설정</h2><div class="actions"><button class="btn" id="expand-all">펼치기</button><button class="btn" id="collapse-all">접기</button></div></div>
    <div id="section-list"></div><div class="status" id="status"></div>
  </div>
</section>
<aside class="preview-shell">
  <div class="preview-tools">

    <div class="toolbar" id="format-toolbar">
      <button class="btn" data-cmd="bold" title="굵게"><b>B</b></button><button class="btn" data-cmd="italic" title="기울임"><i>I</i></button><button class="btn" data-cmd="underline" title="밑줄"><u>U</u></button><button class="btn" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
      <select id="block-format" aria-label="문단 형식"><option value="P">본문</option><option value="H1">제목 1</option><option value="H2">제목 2</option><option value="H3">제목 3</option><option value="BLOCKQUOTE">인용문</option><option value="PRE">코드</option></select>
      <select id="font-size-preset" aria-label="글자 크기"><option value="">크기</option><option value="1">매우 작게</option><option value="2">작게</option><option value="3">보통</option><option value="4">크게</option><option value="5">더 크게</option><option value="6">매우 크게</option><option value="7">최대</option></select>
      <select id="inline-font-family" aria-label="선택 글꼴" title="선택한 글자의 글꼴"><option value="">글꼴</option><option value='system-ui,-apple-system,"Noto Sans KR",sans-serif'>고딕</option><option value='"Noto Serif KR",serif'>명조</option><option value="Pretendard">프리텐다드</option><option value="Ridibatang">리디바탕</option><option value='GMarketSans'>지마켓산스</option><option value='NexonMaplestory'>메이플스토리</option><option value='IsYun'>이서윤체</option><option value='monospace'>고정폭</option></select>
      <select id="inline-line-height" aria-label="선택 줄 간격" title="현재 문단의 줄 간격"><option value="">줄 간격</option><option value="1.3">좁게</option><option value="1.5">보통</option><option value="1.8">넓게</option><option value="2.2">매우 넓게</option></select>
      <div class="palette-group"><span class="palette-label">글자색</span><div class="palette" id="text-palette">
        <button class="swatch" data-inline-color="#334155" style="background:#334155" title="차콜" aria-label="차콜 글자색"></button><button class="swatch" data-inline-color="#2563a6" style="background:#2563a6" title="블루" aria-label="블루 글자색"></button><button class="swatch" data-inline-color="#0f766e" style="background:#0f766e" title="틸" aria-label="틸 글자색"></button><button class="swatch" data-inline-color="#6d4acb" style="background:#6d4acb" title="바이올렛" aria-label="바이올렛 글자색"></button><button class="swatch" data-inline-color="#c2415d" style="background:#c2415d" title="로즈" aria-label="로즈 글자색"></button><button class="swatch" data-inline-color="#b45309" style="background:#b45309" title="앰버" aria-label="앰버 글자색"></button>
      </div></div>
      <div class="palette-group"><span class="palette-label">강조</span><div class="palette" id="highlight-palette">
        <button class="swatch" data-inline-bg="#fef3c7" style="background:#fef3c7" title="크림 옐로" aria-label="크림 옐로 강조"></button><button class="swatch" data-inline-bg="#dbeafe" style="background:#dbeafe" title="스카이 블루" aria-label="스카이 블루 강조"></button><button class="swatch" data-inline-bg="#ccfbf1" style="background:#ccfbf1" title="민트" aria-label="민트 강조"></button><button class="swatch" data-inline-bg="#ede9fe" style="background:#ede9fe" title="라벤더" aria-label="라벤더 강조"></button><button class="swatch" data-inline-bg="#ffe4e6" style="background:#ffe4e6" title="로즈" aria-label="로즈 강조"></button><button class="swatch" data-inline-bg="#ffedd5" style="background:#ffedd5" title="피치" aria-label="피치 강조"></button>
      </div></div>
      <button class="btn" data-cmd="justifyLeft" title="왼쪽 정렬">≡←</button><button class="btn" data-cmd="justifyCenter" title="가운데 정렬">≡</button><button class="btn" data-cmd="justifyRight" title="오른쪽 정렬">→≡</button>
      <button class="btn" data-cmd="insertUnorderedList">• 목록</button><button class="btn" data-cmd="insertOrderedList">1. 목록</button>
      <button class="btn" id="link-btn">링크</button><button class="btn" id="image-btn">이미지 URL</button><button class="btn" id="image-upload-btn">이미지 업로드</button><input type="file" id="image-file" accept="image/*" hidden><button class="btn" id="youtube-btn">YouTube</button><button class="btn" id="table-btn">표 삽입 ▦</button><button class="btn" id="hr-btn">구분선</button>
    </div>
    <div id="table-picker" class="table-picker" hidden><div class="table-picker-head"><strong>표 크기 선택</strong><span id="table-picker-size">2 × 2</span></div><div id="table-grid" class="table-grid" role="grid" aria-label="표 크기 선택"></div><p class="small">격자에 마우스를 올리거나 눌러 행과 열을 선택하세요.</p></div>

  </div>
  <article id="page" class="page export-page">
    <h1 class="page-title" contenteditable="true" data-doc="title">새 문서</h1>
    <p class="page-subtitle" contenteditable="true" data-doc="subtitle"></p>
    <div id="content"></div>
  </article>
</aside>
</div>
<script>
(()=> {
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const names={text:'본문',quiz:'퀴즈',table:'표',html:'사용자 HTML',divider:'구분선','two-column':'2단 구성'};
const initial=()=>({id:uid(),type:'text',title:'본문',html:'',bg:'#ffffff',color:'#202a3a',padding:16,border:true});
let sections=[initial()],collapsed=new Set(),dragId=null,lastFocused=null,currentTheme='light',titleHtml=null,subtitleHtml=null;
const page=$('#page'),content=$('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const themes={light:{bg:'#ffffff',text:'#202a3a',sectionBg:['#ffffff','#fff7ed','#eff6ff','#ecfdf5','#f5f3ff','#fff1f2'],sectionText:['#202a3a','#334155','#1d4ed8','#0f766e','#6d28d9','#9f1239']},dark:{bg:'#111827',text:'#e5e7eb',sectionBg:['#1f2937','#332b25','#172b46','#17352f','#2b2442','#3b202b'],sectionText:['#f3f4f6','#fed7aa','#bfdbfe','#a7f3d0','#ddd6fe','#fecdd3']}};
function buildTable(rows,cols,headers=false,existing=null){const old=existing||document.createElement('table');const oldRows=[...old.querySelectorAll('tr')];let html='<table class="content-table"><tbody>';for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++){const prior=oldRows[r]?.children[c];const tag=headers&&r===0?'th':'td';html+=`<${tag}>${prior?prior.innerHTML:(headers&&r===0?`열`:'내용')}</${tag}>`}html+='</tr>'}return html+'</tbody></table>'}
function updateThemePalettes(){const mode=$('#theme-mode').value,theme=themes[mode];const bgLabels=mode==='dark'?['슬레이트','웜 브라운','네이비','포레스트','플럼','베리']:['화이트','웜 아이보리','아이스 블루','소프트 민트','라벤더','소프트 핑크'];const textLabels=mode==='dark'?['오프화이트','웜 크림','아이스 블루','민트','라벤더','로즈']:['잉크 네이비','차콜','블루','틸','바이올렛','베리'];$$('#section-list select[data-key="bg"]').forEach(sel=>{const val=sel.value;sel.innerHTML=theme.sectionBg.map((c,i)=>`<option value="${c}">${bgLabels[i]}</option>`).join('');if(theme.sectionBg.includes(val))sel.value=val});$$('#section-list select[data-key="color"]').forEach(sel=>{const val=sel.value;sel.innerHTML=theme.sectionText.map((c,i)=>`<option value="${c}">${textLabels[i]}</option>`).join('');if(theme.sectionText.includes(val))sel.value=val})}
function updateInlinePalettes(){const dark=$('#theme-mode').value==='dark';const text=dark?['#f3f4f6','#bfdbfe','#99f6e4','#ddd6fe','#fda4af','#fdba74']:['#334155','#2563a6','#0f766e','#6d4acb','#c2415d','#b45309'];const highlight=dark?['#6b5520','#234b78','#155e55','#4c3b7b','#762f42','#7c421e']:['#fef3c7','#dbeafe','#ccfbf1','#ede9fe','#ffe4e6','#ffedd5'];$$('[data-inline-color]').forEach((b,i)=>{b.dataset.inlineColor=text[i];b.style.background=text[i];b.title=(dark?'다크 모드 글자색 ':'글자색 ')+(i+1)});$$('[data-inline-bg]').forEach((b,i)=>{b.dataset.inlineBg=highlight[i];b.style.background=highlight[i];b.title=(dark?'다크 모드 강조색 ':'강조색 ')+(i+1)})}

function make(type){
const t=themes[$('#theme-mode')?.value||'light'];let s={id:uid(),type,title:names[type],html:'',bg:t.sectionBg[0],color:t.sectionText[0],padding:16,border:true};
if(type==='text')s.html='';
if(type==='quiz')s.questions=[{text:'',options:['','','',''],answer:1}];
if(type==='table'){s.tableRows=3;s.tableCols=2;s.html=buildTable(3,2,true)}
if(type==='html')s.html='';
if(type==='divider')s.html='<hr>';
if(type==='two-column')s.html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><h3>왼쪽</h3><p>내용을 입력하세요.</p></div><div><h3>오른쪽</h3><p>내용을 입력하세요.</p></div></div>';
return s;
}
function renderEditors(){
$('#section-list').innerHTML=sections.map((s,i)=>`<div class="section-card ${collapsed.has(s.id)?'collapsed':''}" data-id="${s.id}">
<div class="section-head"><span class="handle" draggable="true" title="드래그하여 순서 변경">⠿</span><strong>${i+1}. ${esc(s.title||names[s.type])}</strong><button class="btn" data-act="toggle" data-id="${s.id}">${collapsed.has(s.id)?'＋':'−'}</button><button class="btn" data-act="up" data-id="${s.id}">↑</button><button class="btn" data-act="down" data-id="${s.id}">↓</button><button class="btn" data-act="clone" data-id="${s.id}">복제</button><button class="btn danger" data-act="delete" data-id="${s.id}">삭제</button></div>
<div class="section-body">
<div class="field"><label>섹션 이름</label><input type="text" data-id="${s.id}" data-key="title" value="${esc(s.title)}"></div>
<div class="row"><div class="field"><label>섹션 배경색</label><select data-id="${s.id}" data-key="bg">${themes[$('#theme-mode').value].sectionBg.map((c,j)=>`<option value="${c}" ${s.bg===c?'selected':''}>${($('#theme-mode').value==='dark'?['슬레이트','웜 브라운','네이비','포레스트','플럼','베리']:['화이트','웜 아이보리','아이스 블루','소프트 민트','라벤더','소프트 핑크'])[j]}</option>`).join('')}</select></div><div class="field"><label>섹션 글자색</label><select data-id="${s.id}" data-key="color">${themes[$('#theme-mode').value].sectionText.map((c,j)=>`<option value="${c}" ${s.color===c?'selected':''}>${($('#theme-mode').value==='dark'?['오프화이트','웜 크림','아이스 블루','민트','라벤더','로즈']:['잉크 네이비','차콜','블루','틸','바이올렛','베리'])[j]}</option>`).join('')}</select></div></div>
<div class="row"><div class="field"><label>안쪽 여백 (px)</label><input type="number" min="0" max="100" data-id="${s.id}" data-key="padding" value="${s.padding}"></div><div class="field"><label>테두리</label><label style="display:flex;align-items:center;gap:7px;font-weight:500"><input type="checkbox" data-id="${s.id}" data-key="border" ${s.border!==false?'checked':''}> 테두리 표시</label></div></div><div class="field"><label>빠른 작업</label><div style="display:flex;gap:5px;flex-wrap:wrap"><button type="button" class="btn" data-act="clear-content" data-id="${s.id}">내용 비우기</button><button type="button" class="btn" data-act="reset-style" data-id="${s.id}">색·여백 초기화</button></div></div>
${s.type==='table'?`<div class="field"><label>표 크기</label><div class="row"><div><label class="small">행</label><select data-id="${s.id}" data-key="tableRows">${Array.from({length:12},(_,n)=>`<option value="${n+1}" ${Number(s.tableRows||3)===n+1?'selected':''}>${n+1}행</option>`).join('')}</select></div><div><label class="small">열</label><select data-id="${s.id}" data-key="tableCols">${Array.from({length:8},(_,n)=>`<option value="${n+1}" ${Number(s.tableCols||2)===n+1?'selected':''}>${n+1}열</option>`).join('')}</select></div></div><button type="button" class="btn" data-act="resize-table" data-id="${s.id}">표 크기 적용</button></div>`:''}${s.type==='quiz'?renderQuizEditor(s):`<div class="field"><label>HTML 편집</label><textarea data-id="${s.id}" data-key="html" spellcheck="false" placeholder="HTML 코드를 입력하세요.">${esc(s.html)}</textarea></div>`}
</div></div>`).join('');
}
function renderQuizEditor(s){return `${(s.questions||[]).map((q,qi)=>`<div class="question-editor"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>문항 ${qi+1}</strong><button type="button" class="btn danger" data-act="remove-question" data-id="${s.id}" data-qi="${qi}">문항 삭제</button></div><div class="field"><label>문제</label><textarea data-id="${s.id}" data-q-index="${qi}" data-qkey="text" placeholder="문제를 입력하세요.">${esc(q.text)}</textarea></div><div class="field"><label>선택지 </label>${(q.options||[]).map((o,oi)=>`<div class="choice-row"><label><input type="radio" name="answer-${s.id}-${qi}" data-q-answer data-id="${s.id}" data-qi="${qi}" value="${oi+1}" ${Number(q.answer)===oi+1?'checked':''}><input type="text" data-id="${s.id}" data-q-index="${qi}" data-option-index="${oi}" value="${esc(o)}" aria-label="문항 ${qi+1} 선택지 ${oi+1}"></label><button type="button" class="btn danger" data-act="remove-option" data-id="${s.id}" data-qi="${qi}" data-option-index="${oi}" ${q.options.length<=2?'disabled':''}>×</button></div>`).join('')}</div><button type="button" class="btn" data-act="add-option" data-id="${s.id}" data-qi="${qi}">＋ 선택지 추가</button></div>`).join('')}<button type="button" class="btn primary" data-act="add-question" data-id="${s.id}" style="margin-top:5pt;">＋ 문항 추가</button>`}
function renderQuizMarkup(s){return (s.questions||[]).map((q,qi)=>`<div class="quiz-question" data-quiz-question="${s.id}-${qi}"><div class="quiz-title">${esc(q.text||'')}</div><div class="quiz-options">${(q.options||[]).map((o,oi)=>`<label><input type="radio" name="quiz-${s.id}-${qi}" value="${oi+1}" data-quiz-id="${s.id}" data-quiz-index="${qi}" data-correct="${Number(q.answer)===oi+1?'yes':'no'}"><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}
function renderContent(){
content.innerHTML=sections.map(s=>s.type==='divider'?`<section class="page-section divider-section" data-section="${s.id}" data-type="divider"><button class="preview-drag-handle" draggable="true" type="button" title="드래그하여 섹션 순서 변경" aria-label="섹션 순서 변경">⠿</button><div contenteditable="true" data-edit="${s.id}">${s.html||'<hr>'}</div></section>`:s.type==='quiz'?`<section class="page-section" data-section="${s.id}" data-type="quiz" style="background:${s.bg};color:${s.color};padding:${Math.max(0,Number(s.padding)||0)}px;border:${s.border===false?'0':'1px solid #dfe4ed'}"><button class="preview-drag-handle" draggable="true" type="button" title="드래그하여 섹션 순서 변경" aria-label="섹션 순서 변경">⠿</button><div class="quiz-preview">${renderQuizMarkup(s)}</div></section>`:`<section class="page-section" data-section="${s.id}" data-type="${s.type}" style="background:${s.bg};color:${s.color};padding:${Math.max(0,Number(s.padding)||0)}px;border:${s.border===false?'0':'1px solid #dfe4ed'}"><button class="preview-drag-handle" draggable="true" type="button" title="드래그하여 섹션 순서 변경" aria-label="섹션 순서 변경">⠿</button><div contenteditable="true" data-edit="${s.id}">${s.html}</div></section>`).join('');
$$('[contenteditable=true]',page).forEach(el=>el.addEventListener('focus',()=>lastFocused=el));
}
function applySettings(){
const theme=themes[$('#theme-mode').value]||themes.light;
page.style.background=theme.bg;page.style.color=theme.text;page.dataset.theme=$('#theme-mode').value;page.style.fontFamily=$('#font-family').value;
page.style.fontSize=Math.max(8,Math.min(72,Number($('#font-size').value)||16))+'px';page.style.lineHeight=$('#line-height').value;
page.style.maxWidth=$('#page-width').value;page.style.padding=Math.max(0,Math.min(100,Number($('#page-padding').value)||0))+'px';
}
function replaceTextPreservingFormat(el,text){
 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let first=null,nodes=[];while(walker.nextNode()){nodes.push(walker.currentNode);if(!first)first=walker.currentNode}
 if(first){first.nodeValue=text;for(const n of nodes.slice(1))n.nodeValue='';}else el.textContent=text;
}
function syncDocFields(){const title=$('[data-doc=title]'),subtitle=$('[data-doc=subtitle]');if(title.textContent!==$('#doc-title').value)replaceTextPreservingFormat(title,$('#doc-title').value);if(subtitle.textContent!==$('#doc-subtitle').value)replaceTextPreservingFormat(subtitle,$('#doc-subtitle').value)}
function renderAll(){renderEditors();renderContent();applySettings();syncDocFields();updateThemePalettes();updateInlinePalettes()}
function syncContent(el){
const id=el.dataset.edit,s=sections.find(x=>x.id===id);
if(s){s.html=el.innerHTML;const editor=$(`[data-id="${id}"][data-key="html"]`);if(editor)editor.value=s.html}
}
function handleSectionField(e){
const el=e.target,id=el.dataset.id,key=el.dataset.key;if(!id||!key)return;
const s=sections.find(x=>x.id===id);if(!s)return;
s[key]=key==='padding'?Math.max(0,Math.min(100,Number(el.value)||0)):key==='border'?el.checked:(key==='tableRows'||key==='tableCols'?Number(el.value)||1:el.value);
if(key==='html'){const target=$(`[data-edit="${id}"]`);if(target)target.innerHTML=s.html}
if(key==='title'){const h=el.closest('.section-card')?.querySelector('.section-head strong');if(h)h.textContent=(sections.findIndex(x=>x.id===id)+1)+'. '+s.title}
if(['bg','color','padding','border'].includes(key)){const target=$(`[data-section="${id}"]`);if(target){target.style.background=s.bg;target.style.color=s.color;target.style.padding=s.padding+'px';target.style.border=s.border===false?'0':'1px solid #dfe4ed'}}
}
$('#section-list').addEventListener('input',e=>{const el=e.target;if(el.dataset.qIndex!==undefined){const s=sections.find(x=>x.id===el.dataset.id);if(!s||s.type!=='quiz')return;const q=s.questions[Number(el.dataset.qIndex)];if(el.dataset.qkey==='text')q.text=el.value;else if(el.dataset.optionIndex!==undefined)q.options[Number(el.dataset.optionIndex)]=el.value;const preview=$(`[data-section="${s.id}"] .quiz-preview`);if(preview)preview.innerHTML=renderQuizMarkup(s);return}handleSectionField(e)});$('#section-list').addEventListener('change',e=>{const el=e.target;if(el.matches('[data-q-answer]')){const s=sections.find(x=>x.id===el.dataset.id);if(s&&s.type==='quiz'){s.questions[Number(el.dataset.qi)].answer=Number(el.value);const preview=$(`[data-section="${s.id}"] .quiz-preview`);if(preview)preview.innerHTML=renderQuizMarkup(s)}return}handleSectionField(e)});
content.addEventListener('input',e=>{const el=e.target.closest('[data-edit]');if(el)syncContent(el)});content.addEventListener('change',e=>{const radio=e.target.closest('input[data-quiz-id]');if(!radio)return;const question=radio.closest('.quiz-question');if(!question)return;question.classList.remove('correct','wrong');question.classList.add(radio.dataset.correct==='yes'?'correct':'wrong');$$('label',question).forEach(l=>l.classList.toggle('selected',l.contains(radio)));});
page.addEventListener('input',e=>{const el=e.target.closest('[data-doc]');if(!el)return;$('#doc-'+el.dataset.doc).value=el.textContent});
$$('[data-add]').forEach(b=>b.addEventListener('click',()=>{sections.push(make(b.dataset.add));renderAll()}));
$('#section-list').addEventListener('click',e=>{
const b=e.target.closest('[data-act]');if(!b)return;const i=sections.findIndex(s=>s.id===b.dataset.id),s=sections[i];if(i<0)return;
switch(b.dataset.act){
case'toggle':collapsed.has(s.id)?collapsed.delete(s.id):collapsed.add(s.id);renderEditors();break;
case'up':if(i>0)[sections[i-1],sections[i]]=[sections[i],sections[i-1]];renderAll();break;
case'down':if(i<sections.length-1)[sections[i+1],sections[i]]=[sections[i],sections[i+1]];renderAll();break;
case'clone':sections.splice(i+1,0,{...s,id:uid()});renderAll();break;
case'clear-content':s.html='';renderAll();break;
case'add-question':if(s.type==='quiz'){s.questions.push({text:'',options:['','','',''],answer:1});renderAll()}break;
case'remove-question':if(s.type==='quiz'&&s.questions.length>1){s.questions.splice(Number(b.dataset.qi),1);renderAll()}else if(s.type==='quiz'){alert('퀴즈에는 최소 한 문항이 필요합니다.')}break;
case'add-option':if(s.type==='quiz'){s.questions[Number(b.dataset.qi)].options.push('');renderAll()}break;
case'remove-option':if(s.type==='quiz'){const q=s.questions[Number(b.dataset.qi)];if(q.options.length>2){q.options.splice(Number(b.dataset.optionIndex),1);if(Number(q.answer)>q.options.length)q.answer=1;renderAll()}}break;
case'resize-table':{const card=$(`[data-id="${s.id}"]`),rows=Number(card.querySelector('[data-key="tableRows"]').value)||1,cols=Number(card.querySelector('[data-key="tableCols"]').value)||1;const temp=document.createElement('div');temp.innerHTML=s.html;const old=temp.querySelector('table');s.tableRows=rows;s.tableCols=cols;s.html=buildTable(rows,cols,true,old);renderAll();break;}
case'reset-style':{const theme=themes[$('#theme-mode').value]||themes.light;s.bg=theme.sectionBg[0];s.color=theme.sectionText[0];s.padding=16;renderAll();break;}
case'delete':if(confirm(`'${s.title||names[s.type]||'섹션'}' 섹션을 삭제할까요?`)){sections.splice(i,1);collapsed.delete(s.id);renderAll()}break;
}
});
$('#expand-all').onclick=()=>{collapsed.clear();renderEditors()};
$('#collapse-all').onclick=()=>{sections.forEach(s=>collapsed.add(s.id));renderEditors()};

let savedRange=null;

function formatCommand(cmd,value=null){restoreSelection();const sel=window.getSelection();const node=sel?.anchorNode;const el=node?(node.nodeType===1?node:node.parentElement)?.closest?.('[contenteditable=true]'):null;if(el&&page.contains(el)){lastFocused=el;const alignMap={justifyLeft:'left',justifyCenter:'center',justifyRight:'right',justifyFull:'justify'};if(el.matches('[data-doc="title"]')&&alignMap[cmd]){el.style.textAlign=alignMap[cmd];saveSelection();return}const range=sel&&sel.rangeCount?sel.getRangeAt(0).cloneRange():null;el.focus();if(range){sel.removeAllRanges();sel.addRange(range)}document.execCommand(cmd,false,value);syncContent(el);saveSelection()}}

const inlineThemeColors={light:['#334155','#2563a6','#0f766e','#6d4acb','#c2415d','#b45309'],dark:['#f3f4f6','#bfdbfe','#99f6e4','#ddd6fe','#fda4af','#fdba74']};

function wrapSelectionWithThemeStyle(kind,index){restoreSelection();const sel=window.getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return;const range=sel.getRangeAt(0);const node=range.commonAncestorContainer;const el=(node.nodeType===1?node:node.parentElement)?.closest?.('[contenteditable=true]');if(!el||!page.contains(el))return;const span=document.createElement('span');span.dataset[kind==='text'?'themeText':'themeHighlight']=String(index);if(kind==='text')span.style.color=inlineThemeColors[$('#theme-mode').value][index];else span.style.backgroundColor=inlineThemeHighlights[$('#theme-mode').value][index];try{span.appendChild(range.extractContents());range.insertNode(span);const next=document.createRange();next.selectNodeContents(span);sel.removeAllRanges();sel.addRange(next);if(el.dataset.edit)syncContent(el);saveSelection()}catch(err){formatCommand(kind==='text'?'foreColor':'hiliteColor',kind==='text'?inlineThemeColors[$('#theme-mode').value][index]:inlineThemeHighlights[$('#theme-mode').value][index])}}
function remapAppliedThemeColors(){const mode=$('#theme-mode').value;$$('[data-theme-text]',page).forEach(el=>{const i=Number(el.dataset.themeText);if(Number.isInteger(i)&&inlineThemeColors[mode][i])el.style.color=inlineThemeColors[mode][i]});$$('[data-theme-highlight]',page).forEach(el=>{const i=Number(el.dataset.themeHighlight);if(Number.isInteger(i)&&inlineThemeHighlights[mode][i])el.style.backgroundColor=inlineThemeHighlights[mode][i]});$$('[data-edit]',content).forEach(syncContent)}

function youtubeEmbedUrl(raw){try{const u=new URL(raw);if(u.hostname==='youtu.be'||u.hostname.endsWith('.youtu.be')){const id=u.pathname.split('/').filter(Boolean)[0];return id?`https://www.youtube.com/embed/${id}`:null}if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch'){const id=u.searchParams.get('v');return id?`https://www.youtube.com/embed/${id}`:null}const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/);if(m)return `https://www.youtube.com/embed/${m[1]}`}return null}catch{return null}}

const tablePicker=$('#table-picker'),tableGrid=$('#table-grid'),tableSize=$('#table-picker-size');let pickRows=2,pickCols=2;

function getData(){return{version:1,title:$('#doc-title').value,subtitle:$('#doc-subtitle').value,titleHtml:$('[data-doc=title]').innerHTML,titleStyle:$('[data-doc=title]').getAttribute('style')||'',subtitleHtml:$('[data-doc=subtitle]').innerHTML,subtitleStyle:$('[data-doc=subtitle]').getAttribute('style')||'',settings:{fontFamily:$('#font-family').value,fontSize:$('#font-size').value,themeMode:$('#theme-mode').value,pageWidth:$('#page-width').value,lineHeight:$('#line-height').value,pagePadding:$('#page-padding').value},sections}}

$('#load-json').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sections))throw Error('섹션 데이터가 없습니다.');sections=d.sections;const s=d.settings||{};currentTheme=s.themeMode||'light';$('#theme-mode').value=currentTheme;$('#doc-title').value=d.title||'';$('#doc-subtitle').value=d.subtitle||'';for(const [k,v] of Object.entries({'font-family':s.fontFamily,'font-size':s.fontSize,'theme-mode':s.themeMode||'light','page-width':s.pageWidth,'line-height':s.lineHeight,'page-padding':s.pagePadding}))if(v!==undefined)$('#'+k).value=v;renderAll();if(typeof d.titleHtml==='string')$('[data-doc=title]').innerHTML=d.titleHtml;if(typeof d.titleStyle==='string')$('[data-doc=title]').setAttribute('style',d.titleStyle);if(typeof d.subtitleHtml==='string')$('[data-doc=subtitle]').innerHTML=d.subtitleHtml;if(typeof d.subtitleStyle==='string')$('[data-doc=subtitle]').setAttribute('style',d.subtitleStyle)}catch(err){alert('불러오기 실패: '+err.message)}e.target.value=''});
function exportedHtml(){
