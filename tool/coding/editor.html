<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>에디터</title>
    <style>
        * {
            box-sizing: border-box
        }

        :root {
            --app-bg: #eef1f6;
            --ink: #202a3a;
            --line: #d7deea;
            --blue: #315fd3;
            --topbar-height: 56px
        }

        body {
            margin: 0;
            background: var(--app-bg);
            color: var(--ink);
            font: 15px/1.55 system-ui, -apple-system, "Noto Sans KR", sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #202d48;
            color: white;
            padding: 11px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 3px 14px #17233b24
        }

        .brand {
            font-weight: 800
        }

        .actions,
        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid #cbd4e1;
            background: white;
            color: #202a3a;
            border-radius: 8px;
            padding: 7px 10px;
            font-weight: 650
        }

        .btn.dark {
            background: #33425f;
            color: white;
            border-color: #52617b
        }

        .btn.primary {
            background: #315fd3;
            color: white;
            border-color: #315fd3
        }

        .btn.danger {
            color: #b42332
        }

        .app {
            max-width: 1600px;
            margin: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: minmax(300px, .8fr) minmax(420px, 1.2fr);
            gap: 14px;
            align-items: start
        }

        .panel {
            min-width: 0;
            background: white;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px;
            margin-bottom: 12px
        }

        h2 {
            font-size: 1.05rem;
            margin: 0 0 10px
        }

        .field {
            display: grid;
            gap: 4px;
            margin: 8px 0
        }

        .field label,
        .label {
            font-size: .82rem;
            font-weight: 750;
            color: #526075
        }

        input[type=text],
        input[type=url],
        input[type=number],
        select,
        textarea {
            width: 100%;
            min-width: 0;
            border: 1px solid #cbd3df;
            border-radius: 7px;
            padding: 8px;
            background: white;
            color: inherit
        }

        textarea {
            resize: vertical;
            min-height: 70px
        }

        .add-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px
        }

        .section-add-wrap { margin:0 0 12px; }
        .section-add-title-panel { margin-bottom:0; padding:13px; border:1px solid var(--line); border-radius:13px; background:#fff; box-shadow:none; }
        .section-add-title-panel h2 { margin:0; }
        .section-add-panel { position:sticky; top:var(--topbar-height,56px) !important; z-index:25; margin-top:0 !important; border:0 !important; border-radius:0 0 10px 10px; box-shadow:none !important; padding-top:0; }
        .section-add-panel .add-grid { background:white; padding:8px 0; border-bottom:0; }
        .toolbar-popup { position:fixed; top:8px; left:8px; z-index:10000; min-width:170px; max-width:calc(100vw - 16px); max-height:calc(100vh - 16px); overflow:auto; overscroll-behavior:contain; padding:8px; display:flex; flex-direction:column; gap:5px; border:1px solid var(--line); border-radius:9px; background:white; box-shadow:0 8px 24px #17233b22; }
        .toolbar-popup[hidden], .toolbar-settings-panel[hidden] { display:none !important; }
        .toolbar-popup button { text-align:left; max-width:100%; overflow-wrap:anywhere; }
        .popup-wrap > select { display:none !important; }
        .document-setting-popup > select, .document-setting-popup > input { display:none !important; }
        .document-setting-popup .toolbar-popup { top:calc(100% + 4px); }
        #format-toolbar.is-collapsed > :not(.toolbar-top-controls):not(#toolbar-settings-panel):not(.toolbar-favorite) { display:none !important; }
        #format-toolbar.is-collapsed { align-items:center; }
        .toolbar-settings-row-favorite { margin-left:auto; white-space:nowrap; font-size:.78rem; }
        .toolbar-top-controls { display:flex; gap:5px; margin-left:auto; flex:0 0 auto; position:static !important; order:0; }
        .toolbar-settings-panel { flex:1 0 100%; width:100%; max-width:100%; min-width:0; box-sizing:border-box; padding:10px; border:1px solid var(--line); border-radius:9px; background:white; color:var(--ink); }
        

        #section-list { counter-reset: section-order; }

        #section-list .section-card .section-head > strong {
            counter-increment: section-order;
        }

        #section-list .section-card .section-head > strong::before {
            content: counter(section-order) ". ";
        }

        .section-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            margin: 8px 0;
            overflow: hidden
        }

        .section-head {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px;
            background: #f7f8fb
        }

        .section-head strong {
            flex: 1;
            min-width: 0
        }

        .section-body {
            padding: 10px
        }

        .section-card.collapsed .section-body {
            display: none
        }

        .section-card.dragging {
            opacity: .4
        }

        .handle {
            cursor: grab;
            padding: 3px
        }

        .small {
            font-size: .8rem;
            color: #6c7788
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px
        }

        .choice-row {
            display: grid;
            grid-template-columns: 20px minmax(0, 1fr) auto;
            align-items: center;
            gap: 6px;
            margin: 6px 0
        }

        .choice-row label {
            display: contents
        }

        .choice-row input[type=radio] {
            width: auto;
            margin: 0;
            justify-self: center
        }

        .choice-row input[type=text] {
            width: 100%;
            min-width: 0
        }

        .choice-row .btn {
            white-space: nowrap;
            padding: 6px 8px
        }

        .toolbar {
            padding: 7px;
            background: #f7f8fb;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 8px
        }

        .preview-tools {
            position: sticky;
            top: -12px;
            z-index: 12;
            background: #dfe4ed;
            padding: 0 0 8px;
            margin-bottom: 8px
        }

        .preview-tools .preview-label {
            padding-top: 2px
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(5, 23px);
            gap: 4px;
            align-items: center
        }

        .swatch {
            width: 23px;
            height: 23px;
            padding: 0;
            border: 2px solid #fff;
            outline: 1px solid #cbd3df;
            border-radius: 6px;
            min-width: 23px
        }

        .swatch:hover,
        .swatch:focus {
            outline: 2px solid #315fd3
        }

        .palette-group {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            padding: 2px 4px
        }

        .palette-label {
            font-size: .76rem;
            color: #526075;
            font-weight: 700;
            white-space: nowrap
        }

        .toolbar select {
            width: auto;
            max-width: 150px;
            padding: 5px
        }

        .toolbar button {
            padding: 5px 8px
        }

        .preview-shell {
            position: sticky;
            top: 75px;
            max-height: calc(100vh - 90px);
            overflow: auto;
            background: #dfe4ed;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d0d8e4
        }

        .preview-label {
            font-weight: 800;
            margin: 0 0 8px
        }

        .page {
            margin: auto;
            max-width: 900px;
            min-height: 600px;
            background: white;
            padding: 28px;
            overflow-wrap: anywhere
        }

        .page [contenteditable=true]:focus {
            outline: 2px solid #8eafff;
            outline-offset: 2px
        }

        .page-section {
            position: relative;
            margin: 0 0 16px;
            padding: 16px;
            border: 1px solid #dfe4ed;
            border-radius: 10px;
            min-height: 48px
        }

        .page-section.divider-section {
            border: 0 !important;
            border-radius: 0 !important;
            padding: 0 !important;
            min-height: 0;
            margin: 12px 0;
            background: transparent !important
        }

        .divider-section hr {
            border: 0;
            border-top: 2px solid #cbd5e1;
            margin: 0
        }

        .page-section h2 {
            margin: 0 0 10px
        }

        .page-section p {
            margin: 8px 0
        }

        .preview-section-tools {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffffed;
            opacity: .72
        }
        .preview-section-tools:hover { opacity: 1 }
        .preview-section-name { padding: 2px 6px; font-size: 12px; white-space: nowrap; color: #202a3a }
        .page-section:not(.divider-section) { padding-top: 42px !important }
        .preview-section-tools button {
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: #334155;
            padding: 2px 6px;
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer
        }
        .preview-section-tools button:hover { background: #e2e8f0 }
        .preview-section-tools .preview-drag-handle { cursor: grab; font-size: 15px }
        .preview-section-tools .preview-delete { color: #b91c1c }
        .page-section.preview-collapsed .preview-section-body { display: none }
        .divider-section .preview-section-tools { position: relative; top: auto; right: auto; margin: 0 0 4px auto; width: max-content }
        .divider-section .preview-section-name { display: inline-block }

        .page-section.preview-dragging {
            opacity: .45;
            outline: 2px dashed #315fd3
        }

        .page-section ul,
        .page-section ol {
            padding-left: 1.6em
        }

        .page-title {
            margin: 0 0 8px
        }

        .page-subtitle {
            margin: 0 0 22px
        }

        .table-picker {
            position: fixed;
            left: 8px;
            top: 8px;
            right: auto;
            z-index: 10000;
            width: min(250px, calc(100vw - 16px));
            max-height: calc(100vh - 16px);
            overflow: auto;
            padding: 12px;
            background: white;
            color: #202a3a;
            border: 1px solid #cbd3df;
            border-radius: 12px;
            box-shadow: 0 10px 30px #17233b2b
        }

        .table-picker[hidden] {
            display: none
        }

        .table-picker-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px
        }

        .table-grid button {
            aspect-ratio: 1;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #f8fafc;
            padding: 0;
            min-width: 0
        }

        .table-grid button.active,
        .table-grid button:hover {
            background: #a5c8ff;
            border-color: #315fd3
        }

        .table-picker .small {
            margin: 8px 0 0
        }

        .page[data-theme="dark"] .page-section {
            border-color: #475569
        }

        .status {
            font-size: .8rem;
            color: #6c7788;
            margin-top: 8px
        }

        @media(max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            .preview-shell {
                position: static;
                max-height: none;
                overflow: visible
            }

            .topbar {
                position: static
            }
        }

        @media(max-width:520px) {
            .app {
                padding: 8px
            }

            .page {
                padding: 15px
            }

            .add-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .section-head {
                flex-wrap: wrap
            }
        }

    
        /* Toolbar layout, popup boundaries, and matching quiz-option states */
        .popup-wrap { position:relative; display:inline-flex; align-items:center; min-width:0; }
        .document-setting-popup { position:relative; }
        .popup-number-input { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--line); border-radius:7px; }
        #format-toolbar { position:relative; display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:7px 88px 7px 7px; }
        .format-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:34px; height:32px; padding:4px !important; flex:0 0 auto; }
        .format-icon-btn svg { display:block; width:19px; height:19px; }
        #format-toolbar > .toolbar-top-controls { position:absolute; top:6px; right:6px; z-index:120; display:inline-flex; align-items:center; justify-content:flex-end; gap:5px; flex:0 0 auto; width:auto; order:initial; margin:0; white-space:nowrap; }
        #format-toolbar > .toolbar-settings-panel { order:10000; flex:1 0 calc(100% + 81px); width:calc(100% + 81px); max-width:calc(100% + 81px); min-width:0; box-sizing:border-box; }
        #format-toolbar.is-collapsed > .toolbar-favorite { display:inline-flex !important; }
        .toolbar-settings-panel[hidden], .toolbar-popup[hidden], .toolbar-settings-panel[hidden] { display:none !important; }
        .toolbar-settings-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; width:100%; }
        .toolbar-setting-row { display:grid; grid-template-columns: minmax(0,1fr) auto auto auto; grid-template-rows:auto auto; align-items:center; column-gap:6px; row-gap:7px; border:1px solid #d2dbea; border-radius:9px; padding:8px 10px; min-width:0; background:#f7f9fd; }
        .toolbar-setting-row.dragging { opacity:.45; }
        .toolbar-setting-row > label:first-child { grid-column:1; grid-row:1; min-width:0; font-size:.9rem; display:flex; align-items:center; gap:7px; }
        .toolbar-setting-row .toolbar-settings-row-favorite { grid-column:2; grid-row:1; margin:0; white-space:nowrap; font-size:.78rem; }
        .toolbar-setting-row .btn[data-toolbar-move="up"] { grid-column:3; grid-row:1; }
        .toolbar-setting-row .btn[data-toolbar-move="down"] { grid-column:4; grid-row:1; }
        .toolbar-setting-row .toolbar-shortcut-label { grid-column:1; grid-row:2; font-size:.76rem; color:#334155; white-space:nowrap; }
        .toolbar-setting-row .toolbar-shortcut-input { grid-column:2 / 5; grid-row:2; width:100%; min-width:0; padding:8px 9px; font-size:.8rem; border:1px solid #cbd5e1; border-radius:7px; background:#fff; }
        .toolbar-setting-row .toolbar-shortcut-label { grid-column:1; grid-row:2; font-size:.76rem; color:#334155; white-space:nowrap; }
        .toolbar-setting-row .toolbar-shortcut-input { grid-column:2 / 4; grid-row:2; width:100%; min-width:0; padding:8px 9px; font-size:.8rem; border:1px solid #cbd5e1; border-radius:7px; background:#fff; }
        .toolbar-setting-row button { padding:5px 9px; border-radius:9px; }
        .toolbar-favorite { outline:none !important; box-shadow:none !important; }
        .color-toolbar-popup { width:max-content; max-width:calc(100vw - 16px); }
        .palette-popup { display:grid; grid-template-columns:repeat(5,26px); gap:5px; }
        .palette-popup .swatch { width:26px; height:26px; padding:0; border:1px solid #aeb8c7; border-radius:5px; }
        .popup-wrap .hex-color-input { width:100%; min-width:0; }
        .section-bg-popup-wrap { display:inline-flex; vertical-align:middle; }
        .section-bg-icon { min-width:38px; min-height:36px; border:1px solid #cbd3df; }
        .section-bg-palette { grid-template-columns:repeat(5,26px); max-width:190px; }
        .section-bg-hex-row { display:flex; gap:5px; align-items:center; }
        .section-bg-hex-row .btn { white-space:nowrap; }
        .document-settings-icons>.field>label { display:none; }
        .document-settings-icons>.field { margin:0; }
        .document-settings-icon-row { display:flex; align-items:flex-start; gap:8px; flex-wrap:nowrap; margin-top:0; }
        .document-settings-icon-row .document-setting-popup { flex:0 0 auto; }
        .document-settings-icon-row .toolbar-popup { z-index:200; }
        .app>section { min-width:0; }
        .quiz-preview .quiz-options label { display:block; padding:8px 10px; margin:5px 0; border:1px solid #dbe3ef; border-radius:8pt; cursor:pointer; }
        .quiz-preview .quiz-options label.selected, .quiz-preview .quiz-option.selected, .export-page .quiz-options label.selected, .export-page .quiz-option.selected { background:rgba(230,230,230,0.7) !important; border-radius:8pt !important; }
        .quiz-preview .quiz-options label input { margin-right:8px; }

        @media(max-width:700px) {
            .toolbar-settings-grid { grid-template-columns:minmax(0,1fr); }
            .toolbar-setting-row { grid-template-columns:minmax(0,1fr) auto auto; gap:5px; padding:7px; }
            .toolbar-setting-row .toolbar-shortcut-input { font-size:.72rem; padding:7px; }
        }

        /* Main editor cards follow the cleaner heading-above-card layout. */
        .card-group { min-width:0; margin:0 0 16px; }
        .card-group-title { margin:0 2px 12px; font-size:1.05rem; line-height:1.35; }
        .panel { border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px #17233b0d; }
        .document-settings-panel .field { margin:10px 0; gap:6px; }
        .document-settings-panel input[type=text],
        .document-settings-panel input[type=number],
        .document-settings-panel select { min-height:50px; padding:11px 12px; border-radius:10px; font-size:1rem; }
        .section-add-wrap { margin-bottom:16px; }
        .section-add-panel { position:sticky; top:var(--topbar-height,56px) !important; z-index:25; margin-top:0 !important; padding:16px !important; border:1px solid var(--line) !important; border-radius:16px !important; background:#fff; box-shadow:0 2px 8px #17233b0d !important; }
        .section-add-panel .add-grid { background:transparent; padding:0; border:0; gap:8px; }
        .section-add-panel .add-grid .btn { min-height:54px; border-radius:10px; font-size:1rem; font-weight:700; background:#fff; border-color:#d7deea; }
        .section-add-panel .add-grid .btn:hover { background:#f7f9fd; border-color:#b9c8e0; }
        .section-order-actions { display:flex; justify-content:flex-end; margin:-2px 0 8px; }
        .section-order-actions #toggle-all-sections { min-width:38px; min-height:36px; }

        /* Toolbar controls remain at the far right; the settings card uses the full toolbar width. */
        #format-toolbar { width:100%; min-width:0; padding:7px 88px 7px 7px; align-content:center; }
        #format-toolbar > .toolbar-top-controls { position:absolute !important; top:6px !important; right:6px !important; left:auto !important; bottom:auto !important; z-index:120; }
        #format-toolbar > .toolbar-settings-panel { order:10000; flex:0 0 calc(100% + 14px); width:calc(100% + 14px); max-width:calc(100% + 14px); margin-left:-7px; margin-right:-7px; min-width:0; box-sizing:border-box; }
        .toolbar-settings-panel { min-width:0; }
        .toolbar-settings-grid { width:100%; grid-template-columns:repeat(2,minmax(0,1fr)); }
        @media(max-width:700px) {
            .toolbar-settings-grid { grid-template-columns:minmax(0,1fr); }
        }

        /* Final layout fixes: keep the toolbar compact, make settings truly full-width,
           and keep section controls aligned with their heading. */
        #format-toolbar {
            width:100%;
            min-width:0;
            position:relative;
            display:flex;
            align-items:center;
            align-content:flex-start;
            flex-wrap:wrap;
            gap:6px;
            padding:7px 88px 7px 7px !important;
            box-sizing:border-box;
        }
        #format-toolbar > .toolbar-top-controls {
            position:absolute !important;
            top:6px !important;
            right:6px !important;
            left:auto !important;
            bottom:auto !important;
            margin:0 !important;
            z-index:120;
            display:inline-flex;
            flex:0 0 auto;
            gap:5px;
        }
        #format-toolbar > .toolbar-settings-panel {
            order:10000;
            flex:0 0 calc(100% + 95px) !important;
            width:calc(100% + 95px) !important;
            max-width:calc(100% + 95px) !important;
            min-width:0;
            margin-left:-7px !important;
            margin-right:-88px !important;
            box-sizing:border-box;
        }
        #format-toolbar.is-collapsed {
            align-items:center;
        }
        #format-toolbar.is-collapsed > .toolbar-favorite {
            display:inline-flex !important;
        }
        .toolbar-settings-panel {
            min-width:0;
            width:100%;
        }
        .toolbar-settings-grid {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:6px;
            width:100%;
        }
        .toolbar-setting-row {
            grid-template-columns:minmax(0,1fr) auto 38px 38px;
            grid-template-rows:auto auto;
            column-gap:6px;
            row-gap:7px;
            min-width:0;
            width:100%;
        }
        .toolbar-setting-row .btn[data-toolbar-move="up"],
        .toolbar-setting-row .btn[data-toolbar-move="down"] {
            width:38px;
            min-width:38px;
            height:36px;
            padding:0;
            display:inline-flex;
            align-items:center;
            justify-content:center;
        }
        .toolbar-setting-row .toolbar-shortcut-label {
            grid-column:1;
            grid-row:2;
            align-self:center;
            white-space:nowrap;
        }
        .toolbar-setting-row .toolbar-shortcut-input {
            grid-column:2 / -1 !important;
            grid-row:2;
            width:100% !important;
            min-width:0;
            margin:0;
            box-sizing:border-box;
        }
        .toolbar-setting-row .toolbar-shortcut-input,
        .toolbar-setting-row input[type="text"] {
            max-width:none;
        }

        /* Keep the whole section-add group sticky directly below the top bar. */
        .section-add-wrap {
            position:sticky !important;
            top:var(--topbar-height, 56px) !important;
            z-index:18;
            margin-top:0 !important;
            margin-bottom:16px !important;
            align-self:start;
            background:var(--app-bg);
        }
        .section-add-wrap > .card-group-title {
            margin:0 2px 10px;
            padding-top:0;
        }
        .section-add-panel {
            position:static !important;

      <button type="button" class="btn" id="preview-toggle-all" title="전체 접기/펼치기" aria-label="전체 접기/펼치기">▤</button>

<script>
(()=> {
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const names={text:'본문',quiz:'퀴즈',table:'표',html:'사용자 HTML',divider:'구분선','two-column':'2단 구성'};
const initial=()=>({id:uid(),type:'text',title:'본문',html:'',bg:'#ffffff',color:'#202a3a',padding:16,border:true});
let sections=[initial()],collapsed=new Set(),previewCollapsed=new Set(),dragId=null,lastFocused=null,currentTheme='light',titleHtml=null,subtitleHtml=null;
const page=$('#page'),content=$('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const themes={light:{bg:'#ffffff',text:'#202a3a',sectionBg:['#ffffff','#fff7ed','#eff6ff','#ecfdf5','#f5f3ff','#fff1f2'],sectionText:['#202a3a','#334155','#1d4ed8','#0f766e','#6d28d9','#9f1239']},dark:{bg:'#111827',text:'#e5e7eb',sectionBg:['#1f2937','#332b25','#172b46','#17352f','#2b2442','#3b202b'],sectionText:['#f3f4f6','#fed7aa','#bfdbfe','#a7f3d0','#ddd6fe','#fecdd3']}};
function buildTable(rows,cols,headers=false,existing=null){const old=existing||document.createElement('table');const oldRows=[...old.querySelectorAll('tr')];let html='<table class="content-table"><tbody>';for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++){const prior=oldRows[r]?.children[c];const tag=headers&&r===0?'th':'td';html+=`<${tag}>${prior?prior.innerHTML:(headers&&r===0?`열`:'내용')}</${tag}>`}html+='</tr>'}return html+'</tbody></table>'}
function updateThemePalettes(){const mode=$('#theme-mode').value,theme=themes[mode];const bgLabels=mode==='dark'?['슬레이트','웜 브라운','네이비','포레스트','플럼','베리']:['화이트','웜 아이보리','아이스 블루','소프트 민트','라벤더','소프트 핑크'];const textLabels=mode==='dark'?['오프화이트','웜 크림','아이스 블루','민트','라벤더','로즈']:['잉크 네이비','차콜','블루','틸','바이올렛','베리'];$$('#section-list select[data-key="bg"]').forEach(sel=>{const val=sel.value;sel.innerHTML=theme.sectionBg.map((c,i)=>`<option value="${c}">${bgLabels[i]}</option>`).join('');if(theme.sectionBg.includes(val))sel.value=val});$$('#section-list select[data-key="color"]').forEach(sel=>{const val=sel.value;sel.innerHTML=theme.sectionText.map((c,i)=>`<option value="${c}">${textLabels[i]}</option>`).join('');if(theme.sectionText.includes(val))sel.value=val})}
function updateInlinePalettes(){const dark=$('#theme-mode').value==='dark';const text=dark?['#f3f4f6','#bfdbfe','#99f6e4','#ddd6fe','#fda4af','#fdba74']:['#334155','#2563a6','#0f766e','#6d4acb','#c2415d','#b45309'];const highlight=dark?['#6b5520','#234b78','#155e55','#4c3b7b','#762f42','#7c421e']:['#fef3c7','#dbeafe','#ccfbf1','#ede9fe','#ffe4e6','#ffedd5'];$$('[data-inline-color]').forEach((b,i)=>{b.dataset.inlineColor=text[i];b.style.background=text[i];b.title=(dark?'다크 모드 글자색 ':'글자색 ')+(i+1)});$$('[data-inline-bg]').forEach((b,i)=>{b.dataset.inlineBg=highlight[i];b.style.background=highlight[i];b.title=(dark?'다크 모드 강조색 ':'강조색 ')+(i+1)})}

function make(type){
const t=themes[$('#theme-mode')?.value||'light'];let s={id:uid(),type,title:names[type],html:'',bg:t.sectionBg[0],color:t.sectionText[0],padding:16,border:true};
if(type==='text')s.html='';
if(type==='quiz')s.questions=[{text:'',options:['','','',''],answer:1}];
if(type==='table'){s.tableRows=3;s.tableCols=2;s.html=buildTable(3,2,true)}
if(type==='html')s.html='';
if(type==='divider')s.html='<hr>';
if(type==='two-column')s.html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><h3>왼쪽</h3><p>내용을 입력하세요.</p></div><div><h3>오른쪽</h3><p>내용을 입력하세요.</p></div></div>';
return s;
}
function renderEditors(){
$('#section-list').innerHTML=sections.map((s,i)=>`<div class="section-card ${collapsed.has(s.id)?'collapsed':''}" data-id="${s.id}">
<div class="section-head"><span class="handle" draggable="true" title="드래그하여 순서 변경">⠿</span><strong>${esc(s.title||names[s.type])}</strong><button class="btn" data-act="toggle" data-id="${s.id}">${collapsed.has(s.id)?'＋':'−'}</button><button class="btn" data-act="up" data-id="${s.id}">↑</button><button class="btn" data-act="down" data-id="${s.id}">↓</button><button class="btn" data-act="clone" data-id="${s.id}">복제</button><button class="btn danger" data-act="delete" data-id="${s.id}">삭제</button></div>
<div class="section-body">
<div class="field"><label>섹션 이름</label><input type="text" data-id="${s.id}" data-key="title" value="${esc(s.title)}"></div>
<div class="row"><div class="field"><label>섹션 배경색</label><select data-id="${s.id}" data-key="bg" aria-label="섹션 배경색">${themes[$('#theme-mode').value].sectionBg.map((c,j)=>`<option value="${c}" ${s.bg===c?'selected':''}>${($('#theme-mode').value==='dark'?['슬레이트','웜 브라운','네이비','포레스트','플럼','베리']:['화이트','웜 아이보리','아이스 블루','소프트 민트','라벤더','소프트 핑크'])[j]}</option>`).join('')}</select></div><div class="field"><label>테두리</label><label style="display:flex;align-items:center;gap:7px;font-weight:500"><input type="checkbox" data-id="${s.id}" data-key="border" ${s.border!==false?'checked':''}> 테두리 표시</label></div></div>${s.type==='table'?`<div class="field"><label>표 크기</label><div class="row"><div><label class="small">행</label><select data-id="${s.id}" data-key="tableRows">${Array.from({length:12},(_,n)=>`<option value="${n+1}" ${Number(s.tableRows||3)===n+1?'selected':''}>${n+1}행</option>`).join('')}</select></div><div><label class="small">열</label><select data-id="${s.id}" data-key="tableCols">${Array.from({length:8},(_,n)=>`<option value="${n+1}" ${Number(s.tableCols||2)===n+1?'selected':''}>${n+1}열</option>`).join('')}</select></div></div><button type="button" class="btn" data-act="resize-table" data-id="${s.id}">표 크기 적용</button></div>`:''}${s.type==='quiz'?renderQuizEditor(s):`<div class="field"><label>HTML 편집</label><textarea data-id="${s.id}" data-key="html" spellcheck="false" placeholder="HTML 코드를 입력하세요.">${esc(s.html)}</textarea></div>`}
</div></div>`).join('');
}
function renderQuizEditor(s){return `${(s.questions||[]).map((q,qi)=>`<div class="question-editor"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>문항 ${qi+1}</strong><button type="button" class="btn danger" data-act="remove-question" data-id="${s.id}" data-qi="${qi}">문항 삭제</button></div><div class="field"><label>문제</label><textarea data-id="${s.id}" data-q-index="${qi}" data-qkey="text" placeholder="문제를 입력하세요.">${esc(q.text)}</textarea></div><div class="field"><label>선택지 </label>${(q.options||[]).map((o,oi)=>`<div class="choice-row"><label><input type="radio" name="answer-${s.id}-${qi}" data-q-answer data-id="${s.id}" data-qi="${qi}" value="${oi+1}" ${Number(q.answer)===oi+1?'checked':''}><input type="text" data-id="${s.id}" data-q-index="${qi}" data-option-index="${oi}" value="${esc(o)}" aria-label="문항 ${qi+1} 선택지 ${oi+1}"></label><button type="button" class="btn danger" data-act="remove-option" data-id="${s.id}" data-qi="${qi}" data-option-index="${oi}" ${q.options.length<=2?'disabled':''}>×</button></div>`).join('')}</div><button type="button" class="btn" data-act="add-option" data-id="${s.id}" data-qi="${qi}">＋ 선택지 추가</button></div>`).join('')}<button type="button" class="btn primary" data-act="add-question" data-id="${s.id}" style="margin-top:5pt;">＋ 문항 추가</button>`}
function renderQuizMarkup(s,editable=false){return (s.questions||[]).map((q,qi)=>`<div class="quiz-question" data-quiz-question="${s.id}-${qi}"><div class="quiz-title" ${editable?`contenteditable="true" data-quiz-edit="${s.id}" data-qi="${qi}" data-qpart="text" title="클릭해 문제 내용 편집"`:''}>${q.textHtml??esc(q.text||'')}</div><div class="quiz-options">${(q.options||[]).map((o,oi)=>`${editable?'<div class="quiz-option">':'<label>'}<input type="radio" name="quiz-${s.id}-${qi}" value="${oi+1}" data-quiz-id="${s.id}" data-quiz-index="${qi}" data-correct="${Number(q.answer)===oi+1?'yes':'no'}"><span ${editable?`contenteditable="true" data-quiz-edit="${s.id}" data-qi="${qi}" data-qpart="option" data-oi="${oi}" title="클릭해 선택지 편집"`:''}>${q.optionHtml?.[oi]??esc(o)}</span>${editable?'</div>':'</label>'}`).join('')}</div></div>`).join('')}
function previewSectionTools(s){return `<div class="preview-section-tools"><strong class="preview-section-name">${esc(s.title||names[s.type]||'섹션')}</strong><button class="preview-drag-handle" draggable="true" type="button" title="드래그하여 섹션 순서 변경" aria-label="섹션 순서 변경">⠿</button><button type="button" data-preview-act="toggle" data-id="${s.id}" title="섹션 접기 또는 펼치기">${previewCollapsed.has(s.id)?'펼치기':'접기'}</button><button type="button" class="preview-delete" data-preview-act="delete" data-id="${s.id}" title="섹션 삭제">삭제</button></div>`}
function renderContent(){
content.innerHTML=sections.map(s=>{const cls=`page-section${previewCollapsed.has(s.id)?' preview-collapsed':''}`;const style=s.type==='divider'?'':'style="background:'+s.bg+';color:'+s.color+';padding:'+Math.max(0,Number(s.padding)||0)+'px;border:'+(s.border===false?'0':'1px solid #dfe4ed')+'"';let body=s.type==='divider'?`<div class="preview-section-body" contenteditable="true" data-edit="${s.id}">${s.html||'<hr>'}</div>`:s.type==='quiz'?`<div class="preview-section-body quiz-preview">${renderQuizMarkup(s,true)}</div>`:`<div class="preview-section-body" contenteditable="true" data-edit="${s.id}">${s.html}</div>`;return `<section class="${cls}${s.type==='divider'?' divider-section':''}" data-section="${s.id}" data-type="${s.type}" ${style}>${previewSectionTools(s)}${body}</section>`}).join('');
$$('[contenteditable=true]',page).forEach(el=>el.addEventListener('focus',()=>lastFocused=el));
}
function applySettings(){
const theme=themes[$('#theme-mode').value]||themes.light;
page.style.background=theme.bg;page.style.color=theme.text;page.dataset.theme=$('#theme-mode').value;page.style.fontFamily=$('#font-family').value;
page.style.fontSize=Math.max(6,Math.min(54,Number($('#font-size').value)||12))+'pt';page.style.lineHeight='1.65';
page.style.maxWidth='900px';page.style.padding='28px';
}
function replaceTextPreservingFormat(el,text){
 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let first=null,nodes=[];while(walker.nextNode()){nodes.push(walker.currentNode);if(!first)first=walker.currentNode}
 if(first){first.nodeValue=text;for(const n of nodes.slice(1))n.nodeValue='';}else el.textContent=text;
}
function syncDocFields(){const title=$('[data-doc=title]'),subtitle=$('[data-doc=subtitle]');if(title.textContent!==$('#doc-title').value)replaceTextPreservingFormat(title,$('#doc-title').value);if(subtitle.textContent!==$('#doc-subtitle').value)replaceTextPreservingFormat(subtitle,$('#doc-subtitle').value)}
function enhanceSectionBackgroundPickers(){
  $$('#section-list select[data-key="bg"]').forEach(sel=>{
    if(sel.dataset.bgPopupReady)return;
    sel.dataset.bgPopupReady='1';
    const wrap=document.createElement('div');wrap.className='popup-wrap section-bg-popup-wrap';
    const btn=document.createElement('button');btn.type='button';btn.className='btn section-bg-icon';btn.textContent='▨';btn.title='섹션 배경색';btn.setAttribute('aria-label','섹션 배경색');
    const pop=document.createElement('div');pop.className='toolbar-popup palette-popup section-bg-palette';pop.hidden=true;
    const hex=document.createElement('div');hex.className='section-bg-hex-row';hex.style.gridColumn='1 / -1';
    const input=document.createElement('input');input.type='text';input.className='hex-color-input';input.placeholder='#RRGGBB';input.maxLength=9;input.setAttribute('aria-label','배경색 HEX 코드');
    const apply=document.createElement('button');apply.type='button';apply.className='btn';apply.textContent='적용';
    function sync(){btn.style.backgroundColor=sel.value;btn.style.color=contrastColor(sel.value);input.value=sel.value;}
    function setColor(color){if(!/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(color))return;if(color.length===4)color='#'+color.slice(1).split('').map(x=>x+x).join('');let opt=[...sel.options].find(o=>o.value.toLowerCase()===color.toLowerCase());if(!opt){opt=document.createElement('option');opt.value=color;opt.textContent=color;sel.append(opt)}sel.value=color;sel.dispatchEvent(new Event('change',{bubbles:true}));sync()}
    [...sel.options].forEach(o=>{const sw=document.createElement('button');sw.type='button';sw.className='btn swatch';sw.style.background=o.value;sw.title=o.textContent+' '+o.value;sw.setAttribute('aria-label',o.textContent);sw.addEventListener('click',()=>{setColor(o.value);pop.hidden=true});pop.append(sw)});
    apply.addEventListener('click',()=>{setColor(input.value.trim());pop.hidden=true});input.addEventListener('keydown',e=>{if(e.key==='Enter')apply.click()});hex.append(input,apply);pop.append(hex);
    btn.addEventListener('click',()=>{const opening=pop.hidden;$$('.toolbar-popup').forEach(x=>x.hidden=true);pop.hidden=!opening;btn.setAttribute('aria-expanded',String(opening));if(opening)sync()});
    wrap.append(btn,pop);sel.parentNode.insertBefore(wrap,sel);sel.hidden=true;sel.setAttribute('aria-hidden','true');sync();
  });
}
function contrastColor(hex){const h=String(hex||'#ffffff').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return '#202a3a';const n=parseInt(h,16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#202a3a':'#ffffff'}
function renderAll(){renderEditors();enhanceSectionBackgroundPickers();renderContent();applySettings();syncDocFields();updateThemePalettes();updateInlinePalettes()}
function syncContent(el){
const id=el.dataset.edit,s=sections.find(x=>x.id===id);
if(s){s.html=el.innerHTML;const editor=$(`[data-id="${id}"][data-key="html"]`);if(editor)editor.value=s.html}
}
function syncQuizContent(el){const s=sections.find(x=>x.id===el.dataset.quizEdit);if(!s||s.type!=='quiz')return;const q=s.questions[Number(el.dataset.qi)];if(!q)return;if(el.dataset.qpart==='text'){q.textHtml=el.innerHTML;q.text=el.textContent}else{const oi=Number(el.dataset.oi);q.optionHtml=q.optionHtml||[];q.optionHtml[oi]=el.innerHTML;q.options[oi]=el.textContent}}
function handleSectionField(e){
const el=e.target,id=el.dataset.id,key=el.dataset.key;if(!id||!key)return;
const s=sections.find(x=>x.id===id);if(!s)return;
s[key]=key==='padding'?Math.max(0,Math.min(100,Number(el.value)||0)):key==='border'?el.checked:(key==='tableRows'||key==='tableCols'?Number(el.value)||1:el.value);
if(key==='html'){const target=$(`[data-edit="${id}"]`);if(target)target.innerHTML=s.html}
if(key==='title'){const h=el.closest('.section-card')?.querySelector('.section-head strong');if(h)h.textContent=s.title||names[s.type];const ph=$(`[data-section="${id}"] .preview-section-name`);if(ph)ph.textContent=s.title||names[s.type]}
if(key==='bg'){const target=$(`[data-section="${id}"]`);if(target)target.style.backgroundColor=s.bg;const picker=el.closest('.field')?.querySelector('.section-bg-icon');if(picker){picker.style.backgroundColor=s.bg;picker.style.color=contrastColor(s.bg)}}
if(key==='border'){const target=$(`[data-section="${id}"]`);if(target)target.style.border=s.border===false?'0':'1px solid #dfe4ed'}

let draggedSettingKey=null;
toolbarSettingsGrid.addEventListener('dragstart',e=>{const row=e.target.closest('.toolbar-setting-row');if(!row)return;draggedSettingKey=row.dataset.toolbarKey;row.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedSettingKey)}});
toolbarSettingsGrid.addEventListener('dragover',e=>{const target=e.target.closest('.toolbar-setting-row');if(!target||!draggedSettingKey||target.dataset.toolbarKey===draggedSettingKey)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';const dragged=toolbarSettingsGrid.querySelector(`[data-toolbar-key="${CSS.escape(draggedSettingKey)}"]`);if(!dragged)return;const rect=target.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2||(Math.abs(e.clientY-(rect.top+rect.height/2))<rect.height/3&&e.clientX>rect.left+rect.width/2);toolbarSettingsGrid.insertBefore(dragged,after?target.nextSibling:target)});
toolbarSettingsGrid.addEventListener('drop',e=>{e.preventDefault();const key=e.dataTransfer?.getData('text/plain')||draggedSettingKey;if(!key)return;const row=toolbarSettingsGrid.querySelector(`[data-toolbar-key="${CSS.escape(key)}"]`);const el=toolbarControls().find(x=>x.dataset.toolbarSettingKey===key);if(!row||!el)return;const gridRows=[...toolbarSettingsGrid.querySelectorAll('.toolbar-setting-row')];gridRows.forEach((r,i)=>{const target=toolbarControls().find(x=>x.dataset.toolbarSettingKey===r.dataset.toolbarKey);if(target)toolbar.appendChild(target)});persistToolbarOrder();buildToolbarSettings()});
toolbarSettingsGrid.addEventListener('dragend',()=>{draggedSettingKey=null;toolbarSettingsGrid.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'))});
$('#toolbar-settings-reset').addEventListener('click',()=>{
 localStorage.removeItem(toolbarStorageKey);localStorage.removeItem('editor-toolbar-favorites-v1');localStorage.removeItem(toolbarOrderKey);localStorage.removeItem(toolbarShortcutKey);
 defaultToolbarOrder.forEach(el=>toolbar.appendChild(el));
 toolbarControls().forEach((el,i)=>{el.hidden=false;el.classList.remove('toolbar-favorite');el.dataset.toolbarSettingKey=stableToolbarKey(el,i)});
 getDefaultFavoriteElements().forEach(el=>el.classList.add('toolbar-favorite'));
 saveToolbarFavorites();buildToolbarSettings();
});
applyStoredToolbarOrder();
try{const state=JSON.parse(localStorage.getItem(toolbarStorageKey)||'{}');toolbarControls().forEach((el,i)=>{el.dataset.toolbarSettingKey=stableToolbarKey(el,i);if(state[el.dataset.toolbarSettingKey]===false)el.hidden=true})}catch{}
loadToolbarFavorites();
(function(){
 const defaults=getDefaultFavoriteElements();let storedFavorites=[];try{storedFavorites=JSON.parse(localStorage.getItem('editor-toolbar-favorites-v1')||'[]')}catch{}
 const known=new Set(toolbarControls().map(el=>el.dataset.toolbarSettingKey));
 if(!storedFavorites.some(k=>known.has(k))){toolbarControls().forEach(el=>el.classList.remove('toolbar-favorite'));defaults.forEach(el=>el.classList.add('toolbar-favorite'));saveToolbarFavorites()}else{loadToolbarFavorites()}
})();
syncToolbarFavoritesState();
// Execute user-defined shortcuts. Modifier combinations include Ctrl, Alt, Shift, and Meta.
document.addEventListener('keydown',e=>{
 if(e.target?.matches?.('[data-shortcut-input]'))return;
 const combo=formatKeyEvent(e);if(!combo)return;
 const map=readShortcutMap(),key=Object.keys(map).find(k=>map[k]===combo);if(!key)return;
 const el=toolbarControls().find(x=>x.dataset.toolbarSettingKey===key);if(!el||el.hidden)return;
 const btn=el.matches('button')?el:el.querySelector('.btn:not([hidden])');if(!btn)return;
 e.preventDefault();btn.click();
});

renderAll();
})();
</script>
</body>
