<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>온책 학습지 메이커</title>
    <style>
        :root {
            --ink: #202a3a;
            --muted: #6c7788;
            --line: #dce2eb;
            --paper: #fff;
            --bg: #f3f5f9;
            --blue: #315fd3;
            --blue-soft: #edf2ff;
            --red: #c43f4b
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.55
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #202d48;
            color: #fff;
            padding: 12px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 3px 14px #17233b24
        }

        .brand {
            font-weight: 800;
            font-size: 1.05rem
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 9px;
            font-weight: 650
        }

        .btn.primary {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue)
        }

        .btn.dark {
            background: #33425f;
            color: #fff;
            border-color: #52617b
        }

        .btn.danger {
            color: var(--red)
        }

        .app {
            max-width: 1500px;
            margin: auto;
            padding: 18px;
            display: grid;
            grid-template-columns: minmax(330px, .95fr) minmax(400px, 1.05fr);
            gap: 18px;
            align-items: start
        }

        .editor,
        .preview-shell {
            min-width: 0
        }

        .sticky-title {
            position: sticky;
            top: 72px;
            z-index: 10;
            background: var(--bg);
            padding: 0 0 10px
        }

        .heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 0 0 10px
        }

        .heading h2 {
            font-size: 1.15rem;
            margin: 0
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px #1b2a4210
        }

        .field {
            display: grid;
            gap: 5px;
            margin: 10px 0
        }

        .field label,
        .field-label {
            font-size: .85rem;
            color: #526075;
            font-weight: 700
        }

        input[type=text],
        input[type=url],
        input[type=number],
        textarea,
        select {
            width: 100%;
            min-width: 0;
            border: 1px solid #cbd3df;
            border-radius: 8px;
            padding: 9px 10px;
            background: #fff;
            color: var(--ink)
        }

        textarea {
            resize: vertical;
            min-height: 78px
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid #9db6ff;
            border-color: var(--blue)
        }

        .add-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px
        }

        .add-grid button {
            min-height: 48px
        }

        .block-editor {
            border: 1px solid #d5dce7;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 10px;
            overflow: hidden
        }

        .block-editor.dragging {
            opacity: .45
        }

        .block-head {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px;
            background: #f7f8fb;
            border-bottom: 1px solid var(--line)
        }

        .drag-handle {
            cursor: grab;
            color: var(--muted);
            font-size: 1.1rem;
            padding: 0 3px
        }

        .block-name {
            font-weight: 800;
            flex: 1;
            min-width: 0
        }

        .block-head .btn {
            padding: 4px 8px;
            font-size: .82rem
        }

        .block-body {
            padding: 12px
        }

        .block-body .field:first-child {
            margin-top: 0
        }

        .question-editor {
            border: 1px solid var(--line);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0
        }

        .question-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px
        }

        .question-top strong {
            font-size: .9rem
        }

        .choice-row {
            display: grid;
            grid-template-columns: 1fr 34px;
            gap: 6px;
            margin: 6px 0
        }

        .coord-row {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
        }

        .coord-row label {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: stretch;
            width: 100%;
            gap: 4px;
            min-width: 0
        }

        .coord-row label input {
            width: 100%;
            min-width: 0
        }

        .map-background-field {
            margin-top: 8px
        }

        .map-frame {
            position: relative;
            overflow: hidden
        }

        .map-frame svg {
            position: relative;
            z-index: 1
        }

        .map-frame .map-bg {
            position: absolute;
            inset: 8px;
            width: calc(100% - 16px);
            height: calc(100% - 16px);
            object-fit: cover;
            z-index: 0;
            opacity: .85
        }

        .map-frame .map-bg.fit-contain {
            object-fit: contain
        }

        .map-frame .map-bg.fit-width {
            inset: auto;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: auto;
            max-height: none;
            object-fit: contain
        }

        .map-frame .map-bg.fit-height {
            inset: auto;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: 100%;
            max-width: none;
            object-fit: contain
        }

        .map-frame svg circle {
            cursor: grab;
            touch-action: none
        }

        .map-frame svg circle:active {
            cursor: grabbing
        }

        .section-meta {
            font-size: .82rem;
            color: #6c7788;
            text-align: right;
            white-space: nowrap;
            margin: 2px 0 0
        }

        .chapter-page-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .coord-row input[type=number] {
            width: 100%;
            min-width: 0
        }

        .choice-row label {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .choice-row input[type=radio] {
            accent-color: var(--blue)
        }

        .choice-row .choice-text {
            min-width: 0
        }

        .small {
            font-size: .82rem;
            color: var(--muted)
        }

        .status {
            font-size: .82rem;
            color: var(--muted);
            margin: 8px 0
        }

        .preview-shell {
            position: sticky;
            top: 76px;
            max-height: calc(100vh - 94px);
            overflow: auto;
            background: #e6eaf1;
            border: 1px solid #d5dce6;
            border-radius: 15px;
            padding: 12px
        }

        .preview-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 2px 10px;
            font-weight: 800
        }

        .preview {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            min-height: 500px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 16px #202d4815
        }

        .learn-section {
            border: 1px solid #e0e5ee;
            border-radius: 12px;
            padding: 17px;
            min-width: 0
        }

        .section-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 12px
        }

        .learn-section h2 {
            font-size: 1.1rem;
            margin: 0
        }

        .learn-section p {
            margin: 8px 0
        }

        .quiz-q {
            border: 0;
            border-radius: 0;
            padding: 10px 0;
            margin: 10px 0
        }

        .quiz-q .qtitle {
            font-weight: 750;
            margin-bottom: 8px
        }

        .quiz-options {
            display: grid;
            gap: 6px
        }

        .quiz-options label {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 6px 8px;
            border-radius: 7px;
            cursor: pointer
        }

        .quiz-options input {
            margin-top: 5px
        }

        .photo-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px
        }

        .photo-item {
            margin: 0;
            min-width: 0
        }

        .photo-item img {
            display: block;
            width: 100%;
            height: 500px;
            object-fit: cover;
            background: #eef1f6
        }

        .photo-item img.fit-contain {
            object-fit: contain
        }

        .photo-item img.fit-width {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain
        }

        .photo-item img.fit-height {
            width: auto;
            height: 500px;
            max-width: 100%;
            object-fit: contain;
            margin: auto
        }

        .photo-item figcaption {

        }

        .vocab-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px
        }

        .vocab-grid.single {
            grid-template-columns: 1fr
        }

        .vocab-card {
            border: 0;
            border-radius: 0;
            overflow: visible
        }

        .vocab-card img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            background: #eef1f6;
            display: block
        }

        .vocab-card img.fit-width {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            margin: auto
        }

        .vocab-card img.fit-height {
            width: auto;
            height: 500px;
            max-width: 100%;
            object-fit: contain;
            margin: auto
        }

        .vocab-card img.fit-contain {
            object-fit: contain
        }

        .vocab-copy {
            padding: 10px
        }

        .vocab-copy h3 {
            font-size: 1rem;
            margin: 0 0 5px
        }

        .example {
            background: #f5f7fb;
            border-radius: 7px;
            padding: 8px;
            font-size: .9rem;
            margin-top: 8px
        }

        .map-frame {
            border: 1px solid #e0e5ee;
            border-radius: 10px;
            padding: 8px;
            background: #f8faff
        }

        .map-frame svg {
            display: block;
            width: 100%;
            height: auto
        }

        .map-frame svg text {
            font-family: inherit;
            fill: #273449;
            font-size: 12px
        }

        .reading-body {
            white-space: pre-wrap;
            line-height: 2;
            font-size: 1rem
        }

        .note-line {
            border-bottom: 1px solid #dce2eb;
            height: 30px
        }

        .placeholder {
            color: #8b95a5
        }

        .empty {
            border: 1px dashed #b8c3d4;
            border-radius: 10px;
            padding: 22px;
            text-align: center;
            color: var(--muted)
        }

        .file-status {
            font-size: .83rem;
            color: #c8f2d6
        }

        @media(max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            .preview-shell {
                position: static;
                max-height: none;
                overflow: visible
            }

            .sticky-title {
                position: static
            }

            .topbar {
                position: static
            }
        }

        @media(max-width:500px) {
            .photo-grid {
                grid-template-columns: 1fr
            }

            .app {
                padding: 10px
            }

            .add-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .vocab-grid {
                grid-template-columns: 1fr
            }

            .preview-shell {
                padding: 8px
            }
        }

    </style>

<body>
    <header class="topbar">
        <div class="brand">학습지 메이커</div>
        <div class="top-actions">
            <button class="btn dark" id="save-project">양식 저장</button>
            <button class="btn dark" id="load-project-btn">양식 불러오기</button>
            <button class="btn primary" id="export-html">내보내기</button>
            <input type="file" id="load-project" accept=".json,application/json" hidden>
        </div>
    </header>

    <div class="app">
        <section class="editor">
            <div class="sticky-title">
                <div class="heading">
                    <h2>학습지 설정</h2>
                </div>
            </div>
            <div class="card">
            <div class="field"><label for="doc-kicker">상단 문구</label><input id="doc-kicker" type="text" value="학습지 상단 문구"><label for="kicker-align">정렬</label><select id="kicker-align">
                        <option value="left">왼쪽</option>
                        <option value="center" selected>가운데</option>
                        <option value="right">오른쪽</option>
                    </select></div>
                <div class="field"><label for="doc-title">학습지 제목</label><input id="doc-title" type="text" value="학습지 제목"><label for="title-align">정렬</label><select id="title-align">
                        <option value="left">왼쪽</option>
                        <option value="center" selected>가운데</option>
                        <option value="right">오른쪽</option>
                    </select></div>
                <div class="field"><label for="doc-subtitle">학습지 부제</label><input id="doc-subtitle" type="text" value="학습지 부제"><label for="subtitle-align">정렬</label><select id="subtitle-align">
                        <option value="left">왼쪽</option>
                        <option value="center" selected>가운데</option>
                        <option value="right">오른쪽</option>
                    </select></div>
    
            </div>
            <div class="card">
                <div class="heading">
                    <h2>영역 추가</h2>
                </div>
                <div class="add-grid">
                    <button class="btn" data-add="quiz">＋ 확인 문제</button>
                    <button class="btn" data-add="vocab">＋ 단어 풀이</button>
                    <button class="btn" data-add="map">＋ 지도</button>
                    <button class="btn" data-add="body">＋ 본문</button>
                    <button class="btn" data-add="photo">＋ 사진 추가</button>
                    <button class="btn" data-add="custom">＋ HTML 영역</button>
                </div>

            </div>
            <div class="heading">
                <h2>학습지 편집</h2><span id="block-count" class="small"></span>
            </div>
            <div id="block-list"></div>

        </section>

        <aside class="preview-shell">
            <div class="preview-label"><span>실시간 미리보기</span></div>
            <div class="preview" id="preview">
                <header class="hero">
                    <div class="kicker"></div>
                    <h1></h1>
                    <p></p>
                </header>
                <main class="content"></main>
                <footer class="foot"></footer>
            </div>
        </aside>
    </div>

    <script>
        (() => {
            const $ = (s, root = document) => root.querySelector(s);
            const $$ = (s, root = document) => [...root.querySelectorAll(s)];
            const uid = () => 'b' + Math.random().toString(36).slice(2, 9);
            const kinds = {
                quiz: {
                    label: '확인 문제',
                    title: '확인 문제'
                },
                vocab: {
                    label: '단어',
                    title: '단어'
                },
                map: {
                    label: '지도',
                    title: '지도'
                },
                body: {
                    label: '본문',
                    title: '본문'
                },
                photo: {
                    label: '사진',
                    title: '사진'
                },
                custom: {
                    label: '자유 영역',
                    title: 'HTML 영역'
                }
            };
            const defaultQuestions = () => [{
                text: '',
                options: ['', '', '', ''],
                answer: '2'
            }];
            const newBlock = type => {
                const base = {
                    id: uid(),
                    type,
                    title: kinds[type].title,
                    chapter: '',
                    page: ''
                };
                if (type === 'quiz') base.questions = defaultQuestions();
                if (type === 'vocab') base.words = [{
                    word: '',
                    meaning: '',
                    image: '',
                    imageFit: 'cover',
                    example: ''
                }];
                if (type === 'map') {
                    base.backgroundImage = '';
                    base.backgroundFit = 'cover';
                    base.stations = [{
                            name: '시작',
                            x: 12,
                            y: 14,
                            line: 'blue'
                        }, {
                            name: '사건 1',
                            x: 42,
                            y: 14,
                            line: 'blue'
                        },
                        {
                            name: '사건 2',
                            x: 75,
                            y: 80,
                            line: 'orange'
                        }
                    ]
                }
                if (type === 'body') base.text = '';
                if (type === 'photo') base.photos = [{
                    image: '',
                    caption: '',
                    imageFit: 'cover'
                }];
                if (type === 'custom') {
                    base.heading = '';
                    base.text = '';
                }
                return base;
            };
            let blocks = [newBlock('quiz'), newBlock('vocab'), newBlock('map'), newBlock('body'), newBlock('photo')];
            const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            } [c]));
            const attr = esc;
            const titleInput = $('#doc-title'),
                subtitleInput = $('#doc-subtitle'),
                kickerInput = $('#doc-kicker');
            const titleAlign = $('#title-align'),
                subtitleAlign = $('#subtitle-align'),
                kickerAlign = $('#kicker-align');
            const getBlock = id => blocks.find(b => b.id === id);
            const updateBlock = (id, key, value) => {
                const b = getBlock(id);
                if (b) {
                    b[key] = value;
                    renderPreview();
                }
            };

            function field(label, id, key, value, placeholder = '') {
                return `<div class="field"><label>${esc(label)}</label><input type="text" data-id="${id}" data-key="${key}" value="${attr(value)}" placeholder="${attr(placeholder)}"></div>`;
            }

            function textArea(label, id, key, value, placeholder = '') {
                return `<div class="field"><label>${esc(label)}</label><textarea data-id="${id}" data-key="${key}" placeholder="${attr(placeholder)}">${esc(value)}</textarea></div>`;
            }

            function renderBlockEditors() {
                $('#block-count').textContent = `${blocks.length}개 영역`;
                $('#block-list').innerHTML = blocks.map((b, index) => `
      <article class="block-editor" draggable="true" data-block-id="${b.id}">
        <div class="block-head">
          <span class="drag-handle" title="드래그하여 순서 변경">⠿</span>
          <span class="block-name">${index+1}. ${esc(kinds[b.type]?.label||'영역')}</span>
          <button class="btn" data-action="up" data-id="${b.id}" title="위로">↑</button>
          <button class="btn" data-action="down" data-id="${b.id}" title="아래로">↓</button>
          <button class="btn" data-action="clone" data-id="${b.id}">복제</button>
          <button class="btn danger" data-action="delete" data-id="${b.id}">삭제</button>
        </div>
        <div class="block-body">
          ${field('영역 제목',b.id,'title',b.title)}
          <div class="chapter-page-row">${field('쪽수',b.id,'page',b.page||'','예: 12쪽')}${field('챕터',b.id,'chapter',b.chapter||'','예: 2장')}</div>
          ${b.type==='quiz'?renderQuizEditor(b):''}
          ${b.type==='vocab'?renderVocabEditor(b):''}
          ${b.type==='map'?renderMapEditor(b):''}
          ${b.type==='body'?`${textArea('본문 내용',b.id,'text',b.text)}`:''}
          ${b.type==='photo'?renderPhotoEditor(b):''}
          ${b.type==='custom'?`${field('소제목',b.id,'heading',b.heading)}${textArea('HTML 코드',b.id,'html',b.html||'','<div>내용</div>')}`:''}
        </div>
      </article>`).join('');
            }

            function renderQuizEditor(b) {
                return `<div class="field"><label>문항 구성</label></div>
    ${(b.questions||[]).map((q,qi)=>`<div class="question-editor" data-q-index="${qi}">
      <div class="question-top"><strong>문항 ${qi+1}</strong><button class="btn danger" data-action="remove-question" data-id="${b.id}" data-index="${qi}">문항 삭제</button></div>
      ${textArea('문제',b.id,`q-${qi}-text`,q.text,'문제를 입력하세요.')}
      <div class="field"><label>선택지 및 정답 지정</label></div>
      ${(q.options||[]).map((opt,oi)=>`<div class="choice-row">
        <label><input type="radio" name="correct-${b.id}-${qi}" data-action="answer" data-id="${b.id}" data-qi="${qi}" value="${oi+1}" ${String(q.answer)===String(oi+1)?'checked':''}><input class="choice-text" type="text" data-id="${b.id}" data-key="q-${qi}-opt-${oi}" value="${attr(opt)}" aria-label="선택지 ${oi+1}"></label>
        <button class="btn danger" data-action="remove-option" data-id="${b.id}" data-qi="${qi}" data-index="${oi}" title="선택지 삭제">×</button>
      </div>`).join('')}
      <button class="btn" data-action="add-option" data-id="${b.id}" data-qi="${qi}">＋ 선택지 추가</button>
    </div>`).join('')}
    <button class="btn primary" data-action="add-question" data-id="${b.id}">＋ 문항 추가</button>`;
            }

            function renderVocabEditor(b) {
                return `${(b.words||[]).map((w,wi)=>`<div class="question-editor">
      <div class="question-top"><strong>단어 ${wi+1}</strong><button class="btn danger" data-action="remove-word" data-id="${b.id}" data-index="${wi}">삭제</button></div>
      ${field('단어',b.id,`word-${wi}-word`,w.word)}
      ${textArea('뜻·설명',b.id,`word-${wi}-meaning`,w.meaning)}
      ${field('사진 URL',b.id,`word-${wi}-image`,w.image,'https://...')}
      <div class="field"><label>사진 맞춤 방식</label><select data-id="${b.id}" data-key="word-${wi}-imageFit"><option value="cover" ${(w.imageFit||'cover')==='cover'?'selected':''}>영역 꽉 채우기</option><option value="contain" ${w.imageFit==='contain'?'selected':''}>사진 전체 보이기</option><option value="width" ${w.imageFit==='width'?'selected':''}>가로 길이 맞춤</option><option value="height" ${w.imageFit==='height'?'selected':''}>세로 길이 맞춤</option></select></div>
      ${field('용례',b.id,`word-${wi}-example`,w.example)}
    </div>`).join('')}<button class="btn" data-action="add-word" data-id="${b.id}">＋ 단어 추가</button>`;
            }

            function renderPhotoEditor(b) {
                return `${(b.photos||[]).map((photo,i)=>`<div class="question-editor"><div class="question-top"><strong>사진 ${i+1}</strong><button class="btn danger" data-action="remove-photo" data-id="${b.id}" data-index="${i}">삭제</button></div>${field('사진 URL',b.id,`photo-${i}-image`,photo.image||'','https://...')}${field('사진 설명',b.id,`photo-${i}-caption`,photo.caption||'') }<div class="field"><label>사진 맞춤 방식</label><select data-id="${b.id}" data-key="photo-${i}-imageFit"><option value="cover" ${(photo.imageFit||'cover')==='cover'?'selected':''}>영역 꽉 채우기</option><option value="contain" ${photo.imageFit==='contain'?'selected':''}>사진 전체 보이기</option><option value="width" ${photo.imageFit==='width'?'selected':''}>가로 길이 맞춤</option><option value="height" ${photo.imageFit==='height'?'selected':''}>세로 길이 맞춤</option></select></div></div>`).join('')}<button class="btn" data-action="add-photo" data-id="${b.id}">＋ 사진 추가</button>`;
            }

            function renderMapEditor(b) {
                return `<p class="small">미리보기에서 지점을 직접 드래그해 위치를 바꿀 수 있습니다. </p>${field('배경 이미지 URL',b.id,'backgroundImage',b.backgroundImage||'','https://...')}
    <div class="field"><label>배경 사진 맞춤 방식</label><select data-id="${b.id}" data-key="backgroundFit"><option value="cover" ${(b.backgroundFit||'cover')==='cover'?'selected':''}>영역 꽉 채우기</option><option value="contain" ${b.backgroundFit==='contain'?'selected':''}>사진 전체 보이기</option><option value="width" ${b.backgroundFit==='width'?'selected':''}>가로 길이 맞춤</option><option value="height" ${b.backgroundFit==='height'?'selected':''}>세로 길이 맞춤</option></select></div>
    ${(b.stations||[]).map((s,si)=>`<div class="question-editor">
      <div class="question-top"><strong>지점 ${si+1}</strong><button class="btn danger" data-action="remove-station" data-id="${b.id}" data-index="${si}">삭제</button></div>
      ${field('지점 이름',b.id,`station-${si}-name`,s.name)}
      <div class="choice-row coord-row"><label><span>X </span><input type="number" min="0" max="100" data-id="${b.id}" data-key="station-${si}-x" value="${s.x}"></label><label><span>Y</span><input type="number" min="0" max="100" data-id="${b.id}" data-key="station-${si}-y" value="${s.y}"></label></div>
      <div class="field"><label>노선 색</label><select data-id="${b.id}" data-key="station-${si}-line"><option value="blue" ${s.line==='blue'?'selected':''}>파랑 노선</option><option value="orange" ${s.line==='orange'?'selected':''}>주황 노선</option><option value="green" ${s.line==='green'?'selected':''}>초록 노선</option></select></div>
    </div>`).join('')}<button class="btn" data-action="add-station" data-id="${b.id}">＋ 지점 추가</button>`;
            }

            function renderMapSvg(b) {
                const colors = {
                    blue: '#3976df',
                    orange: '#e59a37',
                    green: '#1a9b7a'
                };
                const stations = b.stations || [];
                const pts = stations.map(s => ({
                    x: 20 + (Number(s.x) || 0) * 2.6,
                    y: 20 + (Number(s.y) || 0) * 2.6
                }));
                let paths = '';
                // Connect consecutive stations; color of each segment follows the next station's selected line.
                for (let i = 1; i < stations.length; i++) {
                    paths += `<line x1="${pts[i-1].x}" y1="${pts[i-1].y}" x2="${pts[i].x}" y2="${pts[i].y}" stroke="${colors[stations[i].line]||colors.blue}" stroke-width="7" stroke-linecap="round"/>`;
                }
                return `<div class="map-frame" data-map-id="${b.id}" style="aspect-ratio:1/1">${b.backgroundImage?`<img class="map-bg fit-${attr(b.backgroundFit||'cover')}" src="${attr(b.backgroundImage)}" alt="지도 배경" onerror="this.style.display='none'">`:''}<svg viewBox="0 0 300 300" role="img" aria-label="학습 노선도">${paths}${stations.map((s,i)=>{
      const p=pts[i],c=colors[s.line]||colors.blue;
      const anchor=p.x>220?'end':'start',tx=p.x>220?p.x-11:p.x+11,ty=p.y<32?p.y+19:p.y-10;
      return `<circle data-station-index="${i}" cx="${p.x}" cy="${p.y}" r="7" fill="#fff" stroke="${c}" stroke-width="4"/><text data-station-index="${i}" x="${tx}" y="${ty}" text-anchor="${anchor}">${esc(s.name)}</text>`;
    }).join('')}</svg></div>`;
            }
            // 미리보기와 내보내기는 같은 블록 렌더러를 사용합니다.
            function renderBlock(b) {
                let inner = '';
                if (b.type === 'quiz') {
                    inner = (b.questions || []).map((q, qi) => `<div class="quiz-q q" data-preview-q="${b.id}-${qi}" data-q="${b.id}-${qi}"><div class="qtitle">${esc(q.text)}</div><div class="quiz-options options">${(q.options||[]).map((o,oi)=>`<label><input type="radio" name="learn-${b.id}-${qi}" value="${oi+1}" data-correct="${String(q.answer)===String(oi+1)?'yes':'no'}"><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('');
                } else if (b.type === 'vocab') {
                    inner = `<div class="vocab-grid ${(b.words||[]).length===1?'single':''}">${(b.words||[]).map(w=>`<article class="vocab-card vocab">${w.image?`<img class="fit-${attr(w.imageFit||'cover')}" src="${attr(w.image)}" alt="${attr(w.word)}" onerror="this.style.display='none'">`:''}<div class="vocab-copy"><h3>${esc(w.word)}</h3><p>${esc(w.meaning)}</p>${w.example?`<div class="example">${esc(w.example)}</div>`:''}</div></article>`).join('')}</div>`;
                } else if (b.type === 'map') inner = renderMapSvg(b);
                else if (b.type === 'body') inner = `<div class="reading-body">${esc(b.text||'')}</div>`;
                else if (b.type === 'photo') inner = `<div class="photo-grid">${(b.photos||[]).map(photo=>`${photo.image?`<figure class="photo-item"><img class="fit-${attr(photo.imageFit||'cover')}" src="${attr(photo.image)}" alt="${attr(photo.caption||'사진')}" onerror="this.style.display='none'"><figcaption>${esc(photo.caption||'')}</figcaption></figure>`:''}`).join('')}</div>`;
                else inner = `<h3>${esc(b.heading||'')}</h3><div class="custom-body">${b.html||''}</div>`;
                const meta = [b.page ? esc(b.page) : '', b.chapter ? esc(b.chapter) : ''].filter(Boolean).join(' · ');
                return `<section class="learn-section section"><div class="section-heading"><h2>${esc(b.title)}</h2>${meta?`<div class="section-meta">${meta}</div>`:''}</div>${inner}</section>`;
            }

            function renderDocumentMarkup() {
                const title = titleInput.value,
                    subtitle = subtitleInput.value,
                    kicker = kickerInput.value;
                const content = blocks.map(renderBlock).join('');
                return `<header class="hero"><div class="kicker" style="text-align:${kickerAlign.value}">${esc(kicker)}</div><h1 style="text-align:${titleAlign.value}">${esc(title)}</h1><p style="text-align:${subtitleAlign.value}">${esc(subtitle)}</p></header><main class="content">${content}</main><footer class="foot"></footer>`;
            }

            function renderPreview() {
                $('#preview').innerHTML = renderDocumentMarkup();
            }

            function renderAll() {
                renderBlockEditors();
                renderPreview();
            }

            function mutateQuestion(b, qi, fn) {
                const q = b.questions?.[qi];
                if (q) {
                    fn(q);
                    renderAll();
                }
            }

            function handleAction(action, el) {
                const b = getBlock(el.dataset.id);
                if (!b) return;
                const idx = Number(el.dataset.index),
                    qi = Number(el.dataset.qi);
                if (action === 'up' || action === 'down') {
                    const i = blocks.findIndex(x => x.id === b.id),
                        j = action === 'up' ? i - 1 : i + 1;
                    if (j >= 0 && j < blocks.length) {
                        [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
                        renderAll();
                    }
                } else if (action === 'clone') {
                    const copy = JSON.parse(JSON.stringify(b));
                    copy.id = uid();
                    const i = blocks.findIndex(x => x.id === b.id);
                    blocks.splice(i + 1, 0, copy);
                    renderAll();
                } else if (action === 'delete') {
                    if (confirm('이 영역을 삭제할까요?')) {
                        blocks = blocks.filter(x => x.id !== b.id);
                        renderAll();
                    }
                } else if (action === 'add-question') {
                    b.questions.push({
                        text: '',
                        options: ['', '', '', ''],
                        answer: '1'
                    });
                    renderAll();
                } else if (action === 'remove-question') {
                    b.questions.splice(idx, 1);
                    renderAll();
                } else if (action === 'add-option') {
                    b.questions[qi].options.push(`선택지 ${b.questions[qi].options.length+1}`);
                    renderAll();
                } else if (action === 'remove-option') {
                    if (b.questions[qi].options.length > 2) {
                        b.questions[qi].options.splice(idx, 1);
                        if (Number(b.questions[qi].answer) > b.questions[qi].options.length) b.questions[qi].answer = '1';
                        renderAll();
                    }
                } else if (action === 'add-word') {
                    b.words.push({
                        word: '',
                        meaning: '',
                        image: '',
                        example: ''
                    });
                    renderAll();
                } else if (action === 'remove-word') {
                    b.words.splice(idx, 1);
                    renderAll();
                } else if (action === 'add-station') {
                    b.stations.push({
                        name: `지점 ${b.stations.length+1}`,
                        x: 50,
                        y: 50,
                        line: 'blue'
                    });
                    renderAll();
                } else if (action === 'remove-station') {
                    b.stations.splice(idx, 1);
                    renderAll();
                } else if (action === 'add-photo') {
                    b.photos.push({
                        image: '',
                        caption: '',
                        imageFit: 'cover'
                    });
                    renderAll();
                } else if (action === 'remove-photo') {
                    b.photos.splice(idx, 1);
                    renderAll();
                }
            }
            $('#block-list').addEventListener('click', e => {
                const btn = e.target.closest('[data-action]');
                if (btn) handleAction(btn.dataset.action, btn);
            });
            $('#block-list').addEventListener('change', e => {
                const el = e.target;
                if (el.dataset.action === 'answer') {
                    const b = getBlock(el.dataset.id);
                    if (b) b.questions[Number(el.dataset.qi)].answer = el.value;
                    renderPreview();
                    return;
                }
                if (!el.dataset.id || !el.dataset.key) return;
                const b = getBlock(el.dataset.id),
                    key = el.dataset.key,
                    val = el.value;
                if (!b) return;
                if (key.startsWith('q-')) {
                    const parts = key.split('-'),
                        qi = Number(parts[1]),
                        kind = parts[2];
                    if (kind === 'text') b.questions[qi].text = val;
                    else if (kind === 'opt') b.questions[qi].options[Number(parts[3])] = val;
                } else if (key.startsWith('word-')) {
                    const p = key.split('-');
                    b.words[Number(p[1])][p[2]] = val;
                } else if (key.startsWith('station-')) {
                    const p = key.split('-'),
                        si = Number(p[1]),
                        prop = p[2];
                    b.stations[si][prop] = ['x', 'y'].includes(prop) ? Math.max(0, Math.min(100, Number(val) || 0)) : val;
                } else if (key.startsWith('photo-')) {
                    const p = key.split('-');
                    b.photos[Number(p[1])][p[2]] = val;
                } else b[key] = val;
                renderPreview();
            });
            $('#block-list').addEventListener('input', e => {
                const el = e.target;
                if (!el.dataset.id || !el.dataset.key) return;
                const b = getBlock(el.dataset.id),
                    key = el.dataset.key,
                    val = el.value;
                if (!b) return;
                if (key.startsWith('q-')) {
                    const p = key.split('-'),
                        qi = Number(p[1]);
                    if (p[2] === 'text') b.questions[qi].text = val;
                    if (p[2] === 'opt') b.questions[qi].options[Number(p[3])] = val;
                } else if (key.startsWith('word-')) {
                    const p = key.split('-');
                    b.words[Number(p[1])][p[2]] = val;
                } else if (key.startsWith('station-')) {
                    const p = key.split('-');
                    b.stations[Number(p[1])][p[2]] = Math.max(0, Math.min(100, Number(val) || 0));
                } else if (key.startsWith('photo-')) {
                    const p = key.split('-');
                    b.photos[Number(p[1])][p[2]] = val;
                } else b[key] = val;
                renderPreview();
            });
            [titleInput, subtitleInput, kickerInput].forEach(el => el.addEventListener('input', renderPreview));
            [titleAlign, subtitleAlign, kickerAlign].forEach(el => el.addEventListener('change', renderPreview));
            $$('[data-add]').forEach(btn => btn.addEventListener('click', () => {
                const b = newBlock(btn.dataset.add);
                blocks.push(b);
                renderAll();
                const card = $(`[data-block-id="${b.id}"]`);
                card?.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                });
            }));
            $('#preview').addEventListener('change', e => {
                const radio = e.target;
                if (radio.type !== 'radio' || !radio.name.startsWith('learn-')) return;
                const q = radio.closest('.quiz-q');
                if (!q) return;
                q.classList.remove('correct', 'wrong');
                q.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
                radio.closest('label').classList.add('selected');
                q.classList.add(radio.dataset.correct === 'yes' ? 'correct' : 'wrong');
            });
            // 지도 미리보기에서 지점을 드래그해 노선도를 배치합니다.
            let movingStation = null;
            $('#preview').addEventListener('pointerdown', e => {
                const node = e.target.closest('[data-station-index]');
                if (!node) return;
                const svg = node.ownerSVGElement,
                    map = svg?.closest('[data-map-id]');
                if (!svg || !map) return;
                movingStation = {
                    id: map.dataset.mapId,
                    index: Number(node.dataset.stationIndex)
                };
                e.preventDefault();
            });
            document.addEventListener('pointermove', e => {
                if (!movingStation) return;
                const currentMap = $(`[data-map-id="${movingStation.id}"]`, $('#preview'));
                const currentSvg = currentMap?.querySelector('svg');
                if (!currentSvg) return;
                const rect = currentSvg.getBoundingClientRect();
                const x = Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width * 300 - 20) / 2.6)));
                const y = Math.max(0, Math.min(100, Math.round(((e.clientY - rect.top) / rect.height * 300 - 20) / 2.6)));
                const b = getBlock(movingStation.id);
                if (!b || !b.stations[movingStation.index]) return;
                b.stations[movingStation.index].x = x;
                b.stations[movingStation.index].y = y;
                const editor = $(`[data-id="${b.id}"][data-key="station-${movingStation.index}-x"]`);
                const editorY = $(`[data-id="${b.id}"][data-key="station-${movingStation.index}-y"]`);
                if (editor) editor.value = x;
                if (editorY) editorY.value = y;
                renderPreview();
            });
            document.addEventListener('pointerup', () => movingStation = null);
            // Drag-and-drop reordering of entire sections in the editor list.
            let dragId = null;
            $('#block-list').addEventListener('dragstart', e => {
                const card = e.target.closest('[data-block-id]');
                if (!card) return;
                dragId = card.dataset.blockId;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            });
            $('#block-list').addEventListener('dragend', e => {
                e.target.closest('[data-block-id]')?.classList.remove('dragging');
                dragId = null;
            });
            $('#block-list').addEventListener('dragover', e => {
                e.preventDefault();
                const target = e.target.closest('[data-block-id]');
                if (!target || !dragId || target.dataset.blockId === dragId) return;
                const rect = target.getBoundingClientRect(),
                    after = e.clientY > rect.top + rect.height / 2;
                const from = blocks.findIndex(b => b.id === dragId),
                    to = blocks.findIndex(b => b.id === target.dataset.blockId);
                if (from < 0 || to < 0) return;
                const [item] = blocks.splice(from, 1);
                let insert = blocks.findIndex(b => b.id === target.dataset.blockId);
                if (after) insert++;
                blocks.splice(insert, 0, item);
                renderAll();
            });

            function exportDocument() {
                const title = titleInput.value;
                const css = document.getElementById('export-css').textContent;
                const markup = renderDocumentMarkup();
                const script = `document.addEventListener('change',function(e){const r=e.target;if(r.type!=='radio'||!r.name)return;const q=r.closest('.quiz-q');if(!q)return;q.classList.remove('correct','wrong');q.querySelectorAll('label').forEach(l=>l.classList.remove('selected'));r.closest('label').classList.add('selected');q.classList.add(r.dataset.correct==='yes'?'correct':'wrong')});`;
                const full = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}</style></head><body>${markup}<script>${script}<\/script></body></html>`;
                const blob = new Blob([full], {
                        type: 'text/html;charset=utf-8'
                    }),
                    url = URL.createObjectURL(blob),
                    a = document.createElement('a');
                a.href = url;
                a.download = (title.trim() || '학습지').replace(/[\\/:*?"<>|]/g, '_') + '.html';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            $('#export-html').addEventListener('click', exportDocument);
            $('#save-project').addEventListener('click', () => {
                const data = {
                    version: 1,
                    title: titleInput.value,
                    subtitle: subtitleInput.value,
                    kicker: kickerInput.value,
                    titleAlign: titleAlign.value,
                    subtitleAlign: subtitleAlign.value,
                    kickerAlign: kickerAlign.value,
                    blocks
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], {
                        type: 'application/json;charset=utf-8'
                    }),
                    url = URL.createObjectURL(blob),
                    a = document.createElement('a');
                a.href = url;
                a.download = '양식.json';
                a.click();
                URL.revokeObjectURL(url);
            });
            $('#load-project-btn').addEventListener('click', () => $('#load-project').click());
            $('#load-project').addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (!Array.isArray(data.blocks)) throw new Error('형식이 올바르지 않습니다.');
                    blocks = data.blocks;
                    titleInput.value = data.title || '';
                    subtitleInput.value = data.subtitle || '';
                    kickerInput.value = data.kicker || '';
                    titleAlign.value = data.titleAlign || 'center';
                    subtitleAlign.value = data.subtitleAlign || 'center';
                    kickerAlign.value = data.kickerAlign || 'center';
                    renderAll();
                } catch (err) {
                    alert('양식을 불러오지 못했습니다: ' + err.message)
                }
                e.target.value = '';
            });
            renderAll();
        })();

    </script>
</body>

</html>
