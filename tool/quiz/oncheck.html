<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>온책 학습지 메이커</title>
<style>
    :root {
        --ink: #202a3a;
        --muted: #6c7788;
        --line: #dce2eb;
        --paper: #fff;
        --bg: #f3f5f9;
        --blue: #315fd3;
        --blue-soft: #edf2ff;
        --red: #c43f4b;
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    body {
        font-family: var(--worksheet-font, system-ui, -apple-system, "Noto Sans KR", sans-serif);
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.55;
    }

    button,
    input,
    textarea,
    select {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #202d48;
        color: #fff;
        padding: 12px 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        box-shadow: 0 3px 14px #17233b24;
    }

    .brand {
        font-weight: 800;
        font-size: 1.05rem;
    }

    .top-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 8px 12px;
        border-radius: 9px;
        font-weight: 650;
    } 

    .btn.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
    }

    .btn.dark {
        background: #33425f;
        color: #fff;
        border-color: #52617b;
    }

    .btn.danger {
        color: var(--red);
    }

    .app {
        width: 100%;
        max-width: 1500px;
        margin: auto;
        padding: 18px;
        display: grid;
        grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
        gap: 18px;
        align-items: start;
    }

    .editor,

    /* 지도 전용 속성 패널 및 캔버스 높이 조절 */
    .preview-workspace { display: block; min-width: 0; }
    .map-list-section { border:1px solid var(--line); border-radius:9px; padding:9px; margin-top:10px; }
    .map-list-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
    .map-list-rows { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:9px; align-items:start; }
    .map-object-row { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 34px; gap:7px; min-width:0; align-content:start; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel, #fff); }
    .map-object-row > .field { grid-column:1 / -1; margin:2px 0 0; min-width:0; }
    .map-object-row > .map-object-select { grid-column:1; grid-row:1; }
    .map-object-row > .map-list-delete { grid-column:2; grid-row:1; align-self:start; display:flex; align-items:center; justify-content:center; min-width:34px; width:34px; height:34px; padding:0; }
    .map-object-row .editor-rich-input { min-height:36px; padding:8px; overflow-wrap:anywhere;    border: 1px solid #cbd3df;
    border-radius: 8px !important; }
    .map-object-row .field > label { font-size:.78rem; margin-bottom:4px; }
    .map-list-rows > .small { grid-column:1 / -1; }
    .map-object-select { width:100%; min-width:0; min-height:34px; text-align:left; display:grid; align-content:center; gap:2px; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
    .map-object-select strong { display:block; min-width:0; font-size:.83rem; font-weight:700; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; overflow-wrap:normal; }
    .map-object-select span { display:block; min-width:0; max-width:100%; font-size:.75rem; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; overflow-wrap:normal; }
    .map-object-select.is-selected { border-color:var(--blue); background:var(--blue-soft); box-shadow:inset 0 0 0 1px var(--blue); }
    .map-list-delete { flex:none; }
    .map-resize-handle { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; min-height:23px; padding:3px 8px; border:0; border-radius:0 0 8px 8px; background:#e9eef8; color:#526075; font-size:.75rem; cursor:ns-resize; touch-action:none; user-select:none; }
    .map-resize-handle::before, .map-resize-handle::after { content:""; width:32px; height:3px; border-top:1px solid #9ca9be; border-bottom:1px solid #9ca9be; }
    #preview .map-frame-shell { display:flex; flex-direction:column; align-items:stretch; gap:0; width:100%; min-width:0; }
    #preview .map-frame { display:block; flex:none; margin:0; aspect-ratio:300 / 300; overflow:hidden; }
    #preview .map-resize-handle { flex:none; margin:0; }
    #preview .map-frame svg { position:absolute; inset:0; width:100%; height:100%; }
    #preview .map-frame .map-bg { position:absolute; inset:8px; width:calc(100% - 16px); height:calc(100% - 16px); max-width:none; max-height:none; object-position:center; }
    /* 지도 배경 맞춤 방식: 선택값별로 위치와 크기를 명시해 브라우저의 기본 배치에 의존하지 않는다. */
    #preview .map-frame .map-bg.fit-cover {
        position:absolute; inset:8px; width:calc(100% - 16px) !important; height:calc(100% - 16px) !important;
        max-width:none !important; max-height:none !important; transform:none; object-fit:cover; object-position:center;
    }
    #preview .map-frame .map-bg.fit-contain {
        position:absolute; inset:8px; width:calc(100% - 16px) !important; height:calc(100% - 16px) !important;
        max-width:none !important; max-height:none !important; transform:none; object-fit:contain; object-position:center;
    }
    #preview .map-frame .map-bg.fit-width {
        position:absolute; top:50% !important; right:0 !important; bottom:auto !important; left:0 !important;
        inset:auto 0 auto 0; width:100% !important; height:auto !important; max-width:none !important; max-height:none !important;
        transform:translateY(-50%) !important; object-fit:fill; object-position:center;
    }
    #preview .map-frame .map-bg.fit-height {
        position:absolute; top:0 !important; right:auto !important; bottom:0 !important; left:50% !important;
        inset:0 auto 0 50%; width:auto !important; height:100% !important; max-width:none !important; max-height:none !important;
        transform:translateX(-50%) !important; object-fit:fill; object-position:center;
    }
    #preview .map-node-shape, #preview .map-node-text, #preview .map-independent-text { cursor:pointer; }
    #preview .map-node-selected { stroke:#315fd3 !important; stroke-width:3 !important; filter:drop-shadow(0 0 2px #315fd399); }
    #preview .map-node-coordinate.map-node-selected { stroke:#315fd3 !important; stroke-width:1.5 !important; stroke-dasharray:4 3; }
    #preview .map-edge-group { cursor:pointer; }
    #preview .map-edge-selected line { stroke:#315fd3 !important; stroke-width:4 !important; }
    #preview .map-independent-selected { paint-order:stroke fill; stroke:#315fd3; stroke-width:1.2; }
    /* 지도 요소 옆의 작은 스타일 팝업: 상단 서식 도구의 버튼/패널과 같은 디자인 언어 */
    .map-inline-colors { position:absolute; z-index:85; display:flex; align-items:center; }
    .map-inline-colors[hidden] { display:none !important; }
    .map-inline-tool-wrap {
        position:relative; display:flex; align-items:center; justify-content:center;
        padding:2px; border:1px solid #d5dce6; border-radius:11px;
        background:#f8faff; box-shadow:0 4px 12px rgba(25,35,55,.18);
    }
    .map-inline-tool-wrap > .toolbar-icon-btn {
        background:#fff; color:#202a3a; border:1px solid #cbd3df;
    }
    .map-inline-tool-wrap > .toolbar-icon-btn:hover {
        background:#e7efff; border-color:#b8cdf8;
    }
    .map-inline-tool-wrap > .toolbar-icon-btn.is-active {
        background:#d9e7ff !important; border-color:#7ea5f4 !important;
        color:#174ea6 !important; box-shadow:inset 0 0 0 1px #a9c4fb;
    }
    #preview .map-inline-style-popup {
        width:300px; max-width:min(330px, calc(100vw - 24px));
        max-height:min(72vh, 470px); overflow:auto; display:block;
        padding:10px; border:1px solid #d5dce6; border-radius:12px;
        background:var(--panel-bg, #fff); color:var(--text, #202a3a); box-shadow:0 8px 24px rgba(25,35,55,.18);
    }
    .map-inline-popup-tools { display:flex; flex-wrap:wrap; gap:5px; padding-bottom:9px; margin-bottom:10px; border-bottom:1px solid #e1e6ee; }
    .map-inline-popup-tools .toolbar-icon-btn { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #d5dce6; border-radius:8px; background:#fff; color:#344054; cursor:pointer; }
    .map-inline-popup-tools .toolbar-icon-btn:hover, .map-inline-popup-tools .toolbar-icon-btn.is-active { background:#e8efff; border-color:#a9c2f5; color:#214eaa; }
    .map-inline-popup-panel { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .map-inline-popup-panel[hidden] { display:none !important; }
    .map-inline-popup-panel > .map-inline-field[style*="grid-column: 1 / -1"] { grid-column:1 / -1; }
    .map-inline-popup-footer { display:flex; justify-content:flex-end; margin-top:10px; padding-top:8px; border-top:1px solid #e1e6ee; }
    .map-inline-popup-footer .btn { min-width:76px; }
    .map-inline-style-popup .map-inline-color,
    .map-inline-style-popup .map-inline-field {
        display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
        gap:5px; min-width:0; max-width:none; width:auto;
        font-size:.82rem; line-height:1.35; font-weight:650; color:#202a3a;
    }
    .map-inline-style-popup .map-inline-color > label { display:block; font:inherit; }
    .map-inline-style-popup .map-inline-color input {
        width:100%; height:32px; min-width:0; padding:5px 8px;
        flex:none; border:1px solid #cbd3df; border-radius:7px;
        background:#fff; color:#202a3a; font:inherit; font-weight:400; cursor:text;
        box-sizing:border-box;
    }
    .map-inline-style-popup .map-inline-swatches {
        display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px;
    }
    .map-inline-style-popup .map-inline-swatches button {
        width:100%; height:21px; min-width:0; padding:0; border:1px solid #aeb8c7;
        border-radius:6px; cursor:pointer;
    }
    .map-inline-style-popup .map-inline-swatches button.is-current { outline:2px solid #315fd3; outline-offset:1px; }
    .map-inline-style-popup .map-inline-field select,
    .map-inline-style-popup .map-inline-field input {
        width:100%; min-width:0; height:32px; padding:5px 8px;
        border:1px solid #cbd3df; border-radius:7px;
        background:#fff; color:#202a3a; font:inherit; font-weight:400;
    }
    .map-inline-style-popup .map-inline-format-toggle {
        display:flex; align-items:center; justify-content:center; min-width:0; height:38px;
        border:1px solid #cbd3df; border-radius:8px; background:#fff; color:#202a3a;
        font-size:1rem; cursor:pointer;
    }
    .map-inline-style-popup .map-inline-format-toggle.is-active {
        background:#d9e7ff; color:#174ea6; border-color:#7ea5f4;
        box-shadow:inset 0 0 0 1px #a9c4fb;
    }
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-format-toggle {
        background:#202633; color:#e7ebf2; border-color:#465166;
    }
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-format-toggle.is-active {
        background:#334d77; color:#eaf1ff; border-color:#7799d2;
    }
    .map-inline-style-popup .map-inline-color input::-webkit-color-swatch-wrapper { padding:2px; }
    .map-inline-style-popup .map-inline-color input::-webkit-color-swatch { border:0; border-radius:4px; }
    #preview[data-theme="dark"] .map-inline-tool-wrap {
        background:#202633; border-color:#465166;
    }
    #preview[data-theme="dark"] .map-inline-tool-wrap > .toolbar-icon-btn {
        background:#30394a; color:#e7ebf2; border-color:#465166;
    }
    #preview[data-theme="dark"] .map-inline-tool-wrap > .toolbar-icon-btn:hover,
    #preview[data-theme="dark"] .map-inline-tool-wrap > .toolbar-icon-btn.is-active {
        background:#334d77 !important; color:#eaf1ff !important; border-color:#7799d2 !important;
    }
    #preview[data-theme="dark"] .map-inline-style-popup { background:#252d3b; color:#e7ebf2; border-color:#465166; }
    #preview[data-theme="dark"] .map-inline-popup-tools { border-color:#465166; }
    #preview[data-theme="dark"] .map-inline-popup-tools .toolbar-icon-btn { background:#30394a; color:#e7ebf2; border-color:#465166; }
    #preview[data-theme="dark"] .map-inline-popup-tools .toolbar-icon-btn:hover, #preview[data-theme="dark"] .map-inline-popup-tools .toolbar-icon-btn.is-active { background:#334d77; color:#eaf1ff; border-color:#7799d2; }
    #preview[data-theme="dark"] .map-inline-popup-footer { border-color:#465166; }
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-color,
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-field { color:#e7ebf2; }
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-color input,
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-field select,
    #preview[data-theme="dark"] .map-inline-style-popup .map-inline-field input {
        background:#202633; color:#e7ebf2; border-color:#465166;
    }
    .map-inline-style-popup > .map-inline-field { min-width:0; }
    .map-inline-color { position:relative; cursor:pointer; }
    .map-inline-field { display:grid; }
    .map-frame { position:relative; }
    @media (max-width: 900px) {
    }

    .preview-shell {
        min-width: 0;
        width: 100%;
    }

    .sticky-title {
        position: sticky;
        top: 72px;
        z-index: 10;
        background: var(--bg);
        padding: 0 0 10px;
    }

    .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 10px;
    }

    .heading h2 {
        font-size: 1.15rem;
        margin: 0;
    }

    .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px #1b2a4210;
    }

    .field {
        display: grid;
        gap: 5px;
        margin: 10px 0;
    }

    .field label,
    .field-label {
        font-size: .85rem;
        color: #526075;
        font-weight: 700;
    }

    input[type=text],
    input[type=url],
    input[type=number],
    textarea,
    select {
        width: 100%;
        min-width: 0;
        border: 1px solid #cbd3df;
        border-radius: 8px;
        padding: 9px 10px;
        background: #fff;
        color: var(--ink);
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: 2px solid #9db6ff;
        border-color: var(--blue);
    }

    .add-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
    }

    .add-grid button {
        min-height: 48px;
    }

    .block-editor {
        border: 1px solid #d5dce7;
        border-radius: 12px;
        background: #fff;
        margin-bottom: 10px;
        overflow: hidden;
    }

    .block-editor.dragging {
        opacity: .45;
    }

    .block-editor.collapsed .block-body {
        display: none;
    }

    .block-editor.collapsed .block-head {
        border-bottom: 0;
    }

    .drag-handle {
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        color: var(--muted);
        font-size: 1.1rem;
        padding: 0 3px;
    }

    .block-name {
        font-weight: 800;
        flex: 1;
        min-width: 0;
    }

    .block-head [data-action="toggle-collapse"],
    .block-head [data-action="delete"] {
        width: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .block-head [data-action="up"],
    .block-head [data-action="down"] {
        width: 32px;
        padding: 0;
    }

    .block-list-controls {
        display: inline-flex;
        gap: 6px;
        margin-left: auto;
        flex-wrap: wrap;
    }

    .block-list-controls .btn {
        padding: 5px 8px;
        font-size: .82rem;
    }

    .block-meta-inline {
        color: var(--muted);
        font-size: .82em;
        font-weight: 500;
        margin-left: 6px;
    }

    .block-body {
        padding: 12px;
    }

    .block-body .field:first-child {
        margin-top: 0;
    }

    .question-editor {
        border: 1px solid var(--line);
        padding: 10px;
        border-radius: 10px;
        margin: 10px 0;
    }

    .question-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .question-top strong {
        font-size: .9rem;
    }

    .choice-row {
        display: grid;
        grid-template-columns: 1fr 34px;
        gap: 6px;
        margin: 6px 0;
    }

    .coord-row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .coord-row label {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: stretch;
        width: 100%;
        gap: 4px;
        min-width: 0;
    }

    .coord-row label input {
        width: 100%;
        min-width: 0;
    }

    .map-background-field {
        margin-top: 8px;
    }

    .map-frame svg circle:active {
        cursor: grabbing;
    }

    .chapter-page-row {
        display: flex !important;
        gap: 10px !important;
        align-items: flex-start !important;
        width: 100%;
    }

    .chapter-page-row>* {
        flex: 1 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        margin: 0 !important;
    }

    .chapter-page-row label {
        display: block !important;
        height: 20px !important;
        line-height: 20px !important;
        margin-bottom: 4px !important;
        font-size: 0.8125rem !important;
        font-weight: 600 !important;
    }

    .chapter-page-row input {
        height: 35pt;
        box-sizing: border-box margin: 0;
    }

    .coord-row input[type=number] {
        width: 100%;
        min-width: 0;
    }

    .choice-row label {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .choice-row input[type=radio] {
        accent-color: var(--blue);
    }

    .choice-row .choice-text {
        min-width: 0;
    }

    .editor-rich-input {
        min-width: 0;
        width: 100%;
        min-height: 38px;
        padding: 9px 10px;
        border: 1px solid #cbd3df;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        overflow: auto;
        resize: vertical;
        max-width: 100%;
        user-select: text;
        -webkit-user-select: text;
    }

    .editor-rich-input.multiline {
        min-height: 78px;
    }

    .editor-rich-input:empty::before,
    .editor-rich-input:has(> strong:only-child > br:only-child)::before {
        content: attr(data-placeholder);
        color: #929bad;
        pointer-events: none;
    }

    .editor-rich-input[data-edit="word"] strong,
    .editor-rich-input[data-edit="doc-title"] strong {
        font-weight: 700;
    }

    .editor-rich-input:focus {
        outline: 2px solid #9db6ff;
        border-color: var(--blue);
    }

    .choice-editor-main {
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 8px;
    }

    .choice-editor-main>label {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-top: 10px;
        font-size: .8rem;
        white-space: nowrap;
    }

    .choice-editor-main .choice-text {
        min-height: 38px;
    }

    .block-head {
        display: flex;
        align-items: center;
        background: #f7f8fb;
        border-bottom: 1px solid var(--line);
        min-height: 48px;
        padding: 8px 10px;
        gap: 6px;
    }

    .block-head .btn {
        box-sizing: border-box;
        white-space: nowrap;
        font-size: .82rem;
        flex: 0 0 32px;
        width: 32px;
        min-width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .block-head .block-name {
        min-width: 0;
        flex: 1 1 auto;
    }

    .preview-section .section-heading-main {
        flex: 1 1 auto;
        min-width: 0;
    }

    .preview-section:not(.collapsed) {
        padding: 14px;
    }

    .preview-section .section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 36px;
        margin: 0 0 10px;
    }

    .small {
        font-size: .82rem;
        color: var(--muted);
    }

    .status {
        font-size: .82rem;
        color: var(--muted);
        margin: 8px 0;
    }

    #preview [data-station-label-index] {
        cursor: move;
        user-select: none;
    }

    #preview circle[data-station-index] {
        cursor: grab;
    }

    .preview-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 2px 10px;
        font-weight: 800;

            function positionMapInlinePopup(wrap,target) {
                const preview=$('#preview'), popup=wrap?.querySelector('.map-inline-style-popup');
                if(!preview || !wrap || !popup || !target) return;
                const previewRect=preview.getBoundingClientRect(), targetRect=target.getBoundingClientRect();
                const fw=preview.clientWidth, fh=Math.max(preview.scrollHeight,preview.clientHeight);
                const pw=popup.offsetWidth, ph=popup.offsetHeight;
                const tx=targetRect.left-previewRect.left, ty=targetRect.top-previewRect.top;
                const tw=targetRect.width, th=targetRect.height, gap=8;
                const candidates=[
                    {x:tx+tw+gap,y:ty+(th-ph)/2},
                    {x:tx-pw-gap,y:ty+(th-ph)/2},
                    {x:tx+(tw-pw)/2,y:ty+th+gap},
                    {x:tx+(tw-pw)/2,y:ty-ph-gap}
                ];
                let place=candidates.find(c=>c.x>=0&&c.y>=0&&c.x+pw<=fw&&c.y+ph<=fh);
                if(!place) {
                    const clamp=(v,max)=>Math.max(0,Math.min(Math.max(0,max),v));
                    place=candidates.map(c=>({x:clamp(c.x,fw-pw),y:clamp(c.y,fh-ph)}))
                        .map(c=>({...c,overlapX:Math.max(0,Math.min(c.x+pw,tx+tw)-Math.max(c.x,tx)),overlapY:Math.max(0,Math.min(c.y+ph,ty+th)-Math.max(c.y,ty))}))
                        .sort((a,b)=>a.overlapX*a.overlapY-b.overlapX*b.overlapY)[0];
                }
                wrap.style.left=`${place.x}px`; wrap.style.top=`${place.y}px`;

                const editor=$(`#block-list [data-edit="${editKind}"][data-block-id="${b.id}"][data-index="${index}"]`);
                if(editor){editor.scrollIntoView({block:'nearest',behavior:'smooth'});editor.focus({preventScroll:true});}
            });
            $('#preview').addEventListener('input', e => {
                const tEl=e.target.closest('[data-edit="map-text"]'); if(!tEl)return;
                const b=getBlock(tEl.dataset.blockId), t=b?.texts?.find(x=>x.id===tEl.dataset.textId); if(t)t.text=tEl.textContent;
            });

            let dragId = null;
            const blockList = $('#block-list');
            blockList.addEventListener('dragstart', e => {
                if (!e.target.closest('.drag-handle')) {
                    e.preventDefault();
                    return;
                }
                const card = e.target.closest('[data-block-id]');
                if (!card) return;
                dragId = card.dataset.blockId;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            });

            document.addEventListener('dragover', e => {
                if (!dragId) return;
                const edge = 90;
                if (e.clientY < edge) {
                    window.scrollBy(0, -Math.max(8, Math.round((edge - e.clientY) / 3)));
                } else if (e.clientY > window.innerHeight - edge) {
                    window.scrollBy(0, Math.max(8, Math.round((e.clientY - (window.innerHeight - edge)) / 3)));
                }
            }, true);
            blockList.addEventListener('dragover', e => {
                if (!dragId) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';

                const dragged = blockList.querySelector(`[data-block-id="${dragId}"]`);
                const target = e.target.closest('[data-block-id]');
                if (!dragged || !target || target === dragged) return;
                const rect = target.getBoundingClientRect();
                const after = e.clientY > rect.top + rect.height / 2;
                blockList.insertBefore(dragged, after ? target.nextSibling : target);
            });
            blockList.addEventListener('drop', e => {
                if (dragId) e.preventDefault();
            });
            blockList.addEventListener('dragend', e => {
                const card = e.target.closest('[data-block-id]');
                card?.classList.remove('dragging');
                if (dragId) {
                    const order = [...blockList.querySelectorAll('[data-block-id]')].map(el => el.dataset.blockId);
                    blocks.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
                    renderAll();
                }
                dragId = null;
            });

            function exportDocument() {
                const title = titleInput.value;
                let markup = renderDocumentMarkup();
                const exportRoot = document.createElement('div');
                exportRoot.innerHTML = markup;
                exportRoot.querySelectorAll('.preview-section').forEach(section => {
                    const heading = section.querySelector('.section-heading h2');
                    if (!heading || !heading.textContent.replace(/[\u200B\uFEFF\s]/g, '').trim()) {
                        const headingBar = section.querySelector('.section-heading');
                        if (headingBar) headingBar.remove();
                    }
                });
                exportRoot.querySelectorAll('[data-map-editor-only]').forEach(el => el.remove());
                markup = exportRoot.innerHTML;
                markup = markup.replace(/<div class="preview-section-tools">[\s\S]*?<\/div>/g, '')
                    .replace(/ contenteditable="true"/g, '')
                    .replace(/ data-edit="[^"]*"/g, '')
                    .replace(/ data-block-id="[^"]*"/g, '')
                    .replace(/ preview-section/g, '')
                    .replace(/ collapsed/g, '');
                const theme = outputThemeInput.value || 'light';
                const scale = getFontScale();
                const fontFamily = globalFontInput?.value || 'system-ui, -apple-system, "Noto Sans KR", sans-serif';
                const worksheetBg = worksheetBgInput?.value || '#ffffff';
                const exportCssUrl = 'https://kimgreentea.github.io/kimnokcha/tool/quiz/oncheck.css';
                // Layout and theme styles are provided by the external stylesheet.
                // Keep only user-selected values inline so each exported worksheet preserves its settings.
                const fontsForExport = [...customFonts];
                if (customFont?.name && customFont?.url && !fontsForExport.some(f => f.name === customFont.name)) fontsForExport.push(customFont);
                const customFontCss = fontsForExport.map(font => font.url.includes('.css') ? `@import url('${font.url.replace(/'/g, '%27')}');` : `@font-face{font-family:'${font.name.replace(/['\\]/g, '')}';src:url('${font.url.replace(/'/g, '%27')}') format('woff2');font-display:swap;}`).join('\n');
                const effectiveFont = fontsForExport.some(font => font.name === fontFamily) ? `\"${fontFamily}\",sans-serif` : fontFamily;
                const mapBackgroundFitCss = `.map-frame{position:relative;overflow:hidden}.map-frame .map-bg{position:absolute;object-position:center;max-width:none;max-height:none}.map-frame .map-bg.fit-cover{inset:8px;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;transform:none;object-fit:cover}.map-frame .map-bg.fit-contain{inset:8px;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;transform:none;object-fit:contain}.map-frame .map-bg.fit-width{top:50%!important;right:0!important;bottom:auto!important;left:0!important;inset:auto 0 auto 0;width:100%!important;height:auto!important;max-width:none!important;max-height:none!important;transform:translateY(-50%)!important;object-fit:fill}.map-frame .map-bg.fit-height{top:0!important;right:auto!important;bottom:0!important;left:50%!important;inset:0 auto 0 50%;width:auto!important;height:100%!important;max-width:none!important;max-height:none!important;transform:translateX(-50%)!important;object-fit:fill}`;
                const dynamicCss = `${customFontCss}:root{--font-scale:${scale};--worksheet-font:${effectiveFont};--worksheet-bg:${worksheetBg}} body{font-family:var(--worksheet-font);background:var(--worksheet-bg)}${mapBackgroundFitCss}`;
                const script = `(function(){function grade(r){if(!r||r.type!=="radio"||!r.name||!r.checked)return;const q=r.closest(".quiz-q");if(!q)return;q.classList.remove("correct","wrong");q.querySelectorAll(".quiz-option-label").forEach(function(label){label.classList.remove("selected")});const label=r.closest(".quiz-option-label");if(label)label.classList.add("selected");q.classList.add(r.dataset.correct==="yes"?"correct":"wrong")}function findRadio(target){return target.closest('input[type="radio"][name^="learn-"]')||target.closest(".quiz-option-label")?.querySelector('input[type="radio"][name^="learn-"]')}document.addEventListener("change",function(e){if(e.target&&e.target.matches('input[type="radio"][name^="learn-"]'))grade(e.target)});document.addEventListener("click",function(e){const r=findRadio(e.target);if(!r)return;if(!r.checked){r.checked=true;r.dispatchEvent(new Event("change",{bubbles:true}))}grade(r)})})();`;
                const full = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><link rel="stylesheet" href="${exportCssUrl}"><style>${dynamicCss}</style></head><body data-theme="${theme}">${markup}<script>${script}<\/script></body></html>`;
                const blob = new Blob([full], {
                        type: 'text/html;charset=utf-8'
                    }),
                    url = URL.createObjectURL(blob),
                    a = document.createElement('a');
                a.href = url;
                a.download = (title.trim() || '학습지').replace(/[\\/:*?"<>|]/g, '_') + '.html';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            $('#export-html').addEventListener('click', exportDocument);
            $('#save-project').addEventListener('click', () => {
                const data = {
                    version: 1,
                    title: titleInput.value,
                    subtitle: subtitleInput.value,
                    kicker: kickerInput.value,
                    heroRich,
                    heroBg: heroBgInput.value, worksheetBg: worksheetBgInput?.value || '#ffffff', fontScale: fontScaleInput.value, fontScaleUnit: 'pt', globalFont: globalFontInput.value, customFont, customFonts, outputTheme: outputThemeInput.value,
                    blocks
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], {
                        type: 'application/json;charset=utf-8'
                    }),
                    url = URL.createObjectURL(blob),
                    a = document.createElement('a');
                a.href = url;
                a.download = '양식.json';
                a.click();
                URL.revokeObjectURL(url);
            });
            $('#load-project-btn').addEventListener('click', () => $('#load-project').click());
            $('#load-project').addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (!Array.isArray(data.blocks)) throw new Error('형식이 올바르지 않습니다.');
                    blocks = data.blocks;
                    titleInput.value = data.title || '';
                    subtitleInput.value = data.subtitle || '';
                    kickerInput.value = data.kicker || '';
                    heroBgInput.value = data.heroBg || '#23385f'; if (worksheetBgInput) worksheetBgInput.value = data.worksheetBg || '#ffffff'; { const savedSize=Number(data.fontScale); const savedPt=data.fontScaleUnit === 'pt' ? savedSize : (savedSize > 2 ? savedSize * 0.75 : 12*(Number.isFinite(savedSize)&&savedSize>0?savedSize:1)); fontScaleInput.value=String(Math.max(6,Math.min(36,Number.isFinite(savedPt)?savedPt:12))); } globalFontInput.value = data.globalFont || 'system-ui, -apple-system, \"Noto Sans KR\", sans-serif'; customFont = data.customFont || { name: '', url: '' }; customFonts = Array.isArray(data.customFonts) ? data.customFonts : (customFont.name && customFont.url ? [customFont] : []); customFontNameInput.value = ''; customFontUrlInput.value = ''; customFonts.forEach(font => { if (![...globalFontInput.options].some(o => o.value === font.name)) { const o=document.createElement('option'); o.value=font.name; o.textContent=font.name; globalFontInput.appendChild(o); } const sf=$('#selected-font-family'); if (![...sf.options].some(o => o.value === font.name)) { const o=document.createElement('option'); o.value=font.name; o.textContent=font.name; sf.appendChild(o); } const fm=$('#font-family-menu'); if (![...fm.querySelectorAll('[data-font-family]')].some(o => o.dataset.fontFamily === font.name)) { const b=document.createElement('button'); b.className='btn'; b.type='button'; b.dataset.fontFamily=font.name; b.textContent=font.name; fm.appendChild(b); } const anchor=document.querySelector('[data-setting-font-choice="monospace"]'); if (anchor && !document.querySelector(`[data-setting-font-choice="${CSS.escape(font.name)}"]`)) { const b=document.createElement('button'); b.className='btn setting-choice'; b.type='button'; b.dataset.settingFontChoice=font.name; b.textContent=font.name; anchor.insertAdjacentElement('afterend',b); } }); outputThemeInput.value = data.outputTheme || 'light'; syncSettingChoiceButtons();
                    heroRich.kicker = data.heroRich?.kicker ?? null;
                    heroRich['doc-title'] = data.heroRich?.['doc-title'] ?? null;
                    heroRich.subtitle = data.heroRich?.subtitle ?? null;
                    syncHeroSettingsEditors();
                    renderAll();
                } catch (err) {
                    alert('양식을 불러오지 못했습니다: ' + err.message)
                }
                e.target.value = '';
            });
            renderAll();
        })();

    </script>
</body>

</html>
