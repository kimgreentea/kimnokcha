\n                .querySelectorAll(\n                    'label'\n                )\n                .forEach(\n                    label => {\n\n                        label.classList.remove(\n                            'selected'\n                        );\n\n                    }\n                );\n\n\n\n                /*\n                   현재 선택 표시\n                */\n\n                this.parentElement\n                    .classList.add(\n                        'selected'\n                    );\n\n\n\n                /*\n                   정답\n                */\n\n                if (\n                    selectedValue ===\n                    correctAnswer\n                ) {\n\n\n                    questionDiv.classList.add(\n                        'correct'\n                    );\n\n\n                    showNextButton(\n                        questionDiv\n                    );\n\n\n                }\n\n\n                /*\n                   오답\n                */\n\n                else {\n\n\n                    questionDiv.classList.add(\n                        'wrong'\n                    );\n\n\n                    removeNextButton(\n                        questionDiv\n                    );\n\n                }\n\n            }\n        );\n\n    }\n);\n\n\n\n/* =========================================================\n   주관식 채점\n========================================================= */\n\ndocument\n.querySelectorAll(\n    '.subjective-input'\n)\n.forEach(\n    input => {\n\n\n        input.addEventListener(\n            'input',\n            function() {\n\n\n                /*\n                   현재 문제\n                */\n\n                const questionDiv =\n                    this.closest(\n                        '.question'\n                    );\n\n\n\n                /*\n                   문제 이름\n                */\n\n                const questionName =\n                    this.name;\n\n\n\n                /*\n
