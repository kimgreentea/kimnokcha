<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 코딩 AI 로봇 컨트롤러</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #1e1e24; color: white;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        #container {
            width: 100vw; height: 100vh; display: flex;
            flex-direction: column; padding: 10px; gap: 10px;
        }

        #topArea {
            display: flex; justify-content: space-between;
            align-items: flex-start; width: 100%; flex-shrink: 0; position: relative;
        }

        /* 왼쪽 구역  */
        #leftTop {
            display: flex; flex-direction: column; gap: 8px;
        }

        #blockCodeBtn {
            background: #4c97ff; color: #fff; border: none;
            border-radius: 8px; padding: 8px 12px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 0 #2b5cb8; z-index: 20;
            align-self: flex-start; /* 버튼이 딱 자기 크기만 차지하도록 */
        }

        #help {
            background: rgba(0,0,0,0.75); padding: 12px;
            border-radius: 12px; font-size: 13px; line-height: 1.5;
            min-width: 140px; border: 1px solid #333;
        }

        #cameraArea {
            width: 240px; border-radius: 15px; overflow: hidden;
            border: 3px solid #ffab19; background: black;
            position: relative;
        }

        #cameraCanvas {
            width: 100%; display: block; transform: scaleX(-1);
        }

        /* 🧩 스크래치 스타일 블록 조립 모달 */
        #blockModal {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #22242a; border: 2px solid #444857; border-radius: 16px;
            padding: 20px; z-index: 200; width: 95%; max-width: 440px;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }
        #blockModal h2 { margin-top: 0; text-align: center; color: #ffffff; font-size: 20px; }
        .block-rule {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px; background: #2a2d37;
            padding: 10px; border-radius: 10px; flex-wrap: wrap;
        }

        .block-rule {
            display: flex; align-items: center; gap: 4px;
            margin-bottom: 12px; background: rgba(0,0,0,0.3);
            padding: 8px; border-radius: 12px; flex-wrap: wrap;
        }
        /* 조건 블록 */
        .event-block {
            background: #4c97ff; color: #fff; font-weight: bold;
            padding: 8px 12px; border-radius: 8px 0 0 8px;
            font-size: 13px; box-shadow: 0 3px 0 #2b5cb8;
            display: flex; align-items: center; gap: 4px;
        }
        /* 동작 블록 */
        .action-block {
            background: #ffab19; color: #000; font-weight: bold;
            padding: 8px 12px; border-radius: 0 8px 8px 0;
            font-size: 13px; box-shadow: 0 3px 0 #c88000;
            cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: transform 0.1s;
        }
        .action-block:active { transform: translateY(2px); }

        #paletteModal {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #44475a; border: 2px solid #4c97ff; border-radius: 15px;
            padding: 15px; z-index: 300; width: 85%; max-width: 320px;
            text-align: center;
        }
        .palette-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
        }
        .palette-item {
            background: #4c97ff; color: #fff; font-weight: bold;
            padding: 10px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 3px 0 #2b5cb8; font-size: 13px;
        }

        #closeBlockBtn {
            width: 100%; padding: 12px; margin-top: 10px;
            background: #ffab19; color: black; border: none;
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #c88000;
        }

        #field {
            position: relative; flex-grow: 1; width: 100%;
            background: linear-gradient(#ddd 1px, transparent 1px),
                        linear-gradient(90deg, #ddd 1px, transparent 1px);
            background-size: 50px 50px; background-color: white;
            border: 5px solid #333; border-radius: 15px; overflow: hidden;
        }

        #robot {
            position: absolute; width: 60px; height: 60px;
            font-size: 50px; line-height: 60px; text-align: center;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: transform 0.05s linear; z-index: 5;
        }

        #command {
            width: 100%; max-width: 600px; align-self: center;
            text-align: center; padding: 15px; background: #222;
            border-radius: 15px; font-size: 22px; font-weight: bold; flex-shrink: 0;
            border: 1px solid #444;
        }

        #status {
            font-size: 14px; margin-top: 5px; font-weight: normal; color: #aaa;
        }

        #startButton {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); padding: 20px 40px;
            font-size: 22px; font-weight: bold; border: none;
            border-radius: 15px; background: #ffab19; color: black;
            box-shadow: 0 6px 0 #c88000; z-index: 100; cursor: pointer;
        }

        @media (max-width: 600px) {
            #cameraArea { width: 150px; }
            #help { font-size: 11px; padding: 8px; }
            #command { font-size: 18px; }
            .event-block, .action-block { font-size: 11px; padding: 6px 8px; }
            #blockCodeBtn { font-size: 12px; padding: 6px 10px; }
        }
    </style>
</head>

<body>

<div id="container">
    <div id="topArea">
        <div id="leftTop">
            <button id="blockCodeBtn">🔧 코드 수정</button>
            <div id="help"></div>
        </div>
        <div id="cameraArea">
            <canvas id="cameraCanvas"></canvas>
        </div>
    </div>

    <div id="blockModal">
        <h2>🧩 블록 코딩 조립기 🧩</h2>
        <p style="text-align: center; color: #aaa; font-size: 13px; margin: -5px 0 15px 0;">
            💡 노란색 부분을 클릭하여 원하는 동작으로 변경
        </p>
        <div id="blockContainer"></div>
        <button id="closeBlockBtn">확인</button>
    </div>

    <div id="paletteModal">
        <h3 style="margin: 0; color: white;">동작 블록 선택</h3>
        <div id="paletteGrid" class="palette-grid"></div>
    </div>

    <div id="field">
        <div id="robot">🤖</div>
    </div>

    <div id="command">
        ⏹ 정지
        <div id="status">카메라 시작 버튼을 누르세요.</div>
    </div>

    <button id="startButton">📷 카메라 시작</button>
</div>

<script>
    const robot = document.getElementById("robot");
    const field = document.getElementById("field");
    const commandText = document.getElementById("command");
    const statusText = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const canvas = document.getElementById("cameraCanvas");
    const ctx = canvas.getContext("2d");
    
    const blockCodeBtn = document.getElementById("blockCodeBtn");
    const blockModal = document.getElementById("blockModal");
    const closeBlockBtn = document.getElementById("closeBlockBtn");
    const blockContainer = document.getElementById("blockContainer");
    const helpBox = document.getElementById("help");
    const paletteModal = document.getElementById("paletteModal");
    const paletteGrid = document.getElementById("paletteGrid");

    let robotX = 0, robotY = 0, robotAngle = 0;
    let currentCommand = "STOP";
    let activeEditingGesture = null;

    const MOVE_SPEED = 2.5;
    const ROTATE_SPEED = 3.5;

    const GESTURES = {
        "INDEX": { emoji: "☝️", name: "검지" },
        "V_SIGN": { emoji: "✌️", name: "브이" },
        "ROCK": { emoji: "🤘", name: "로큰롤" },
        "THUMB": { emoji: "👍", name: "따봉" },
        "FIVE": { emoji: "🖐️", name: "보자기" },
        "FIST": { emoji: "✊", name: "주먹" }
    };

    const ACTIONS = {
        "FORWARD": { emoji: "⬆️", name: "직진" },
        "BACKWARD": { emoji: "⬇️", name: "후진" },
        "ROTATE_RIGHT": { emoji: "↻", name: "우회전" },
        "ROTATE_LEFT": { emoji: "↺", name: "좌회전" },
        "BOOST": { emoji: "🔥", name: "부스터" },
        "STOP": { emoji: "⏹", name: "정지" }
    };

    let gestureMapping = {
        "INDEX": "FORWARD",
        "V_SIGN": "ROTATE_RIGHT",
        "ROCK": "ROTATE_LEFT",
        "THUMB": "BACKWARD",
        "FIVE": "BOOST",
        "FIST": "STOP"
    };

    function renderBlocksAndHelp() {
        blockContainer.innerHTML = "";
        let helpHTML = "";

        for (const [gestureKey, gestureInfo] of Object.entries(GESTURES)) {
            const actionKey = gestureMapping[gestureKey];
            const actionInfo = ACTIONS[actionKey];

            const ruleDiv = document.createElement("div");
            ruleDiv.className = "block-rule";

            ruleDiv.innerHTML = `
                <div class="event-block">
                    <span>만약</span>
                    <span>${gestureInfo.emoji} ${gestureInfo.name} (이)라면</span>
                </div>
                <div class="action-block" onclick="openPalette('${gestureKey}')">
                    <span>${actionInfo.emoji} ${actionInfo.name}</span>
                </div>
            `;
            blockContainer.appendChild(ruleDiv);
            helpHTML += `${gestureInfo.emoji} ➔ ${actionInfo.emoji} ${actionInfo.name}<br>`;
        }
        helpBox.innerHTML = helpHTML;
    }

    window.openPalette = function(gestureKey) {
        activeEditingGesture = gestureKey;
        paletteGrid.innerHTML = "";

        for (const [actionKey, actionInfo] of Object.entries(ACTIONS)) {
            const item = document.createElement("div");
            item.className = "palette-item";
            item.innerHTML = `${actionInfo.emoji} ${actionInfo.name}`;
            item.onclick = () => selectAction(actionKey);
            paletteGrid.appendChild(item);
        }
        paletteModal.style.display = "block";
    };

    function selectAction(actionKey) {
        if (activeEditingGesture) {
            gestureMapping[activeEditingGesture] = actionKey;
            renderBlocksAndHelp();
        }
        paletteModal.style.display = "none";
    }

    blockCodeBtn.onclick = () => blockModal.style.display = "block";
    closeBlockBtn.onclick = () => blockModal.style.display = "none";

    renderBlocksAndHelp();

    function resetRobot() {
        robotX = field.clientWidth / 2;
        robotY = field.clientHeight / 2;
        robotAngle = 0;
        updateRobot();
    }

    function updateRobot() {
        robot.style.left = robotX + "px";
        robot.style.top = robotY + "px";
        robot.style.transform = `translate(-50%, -50%) rotate(${robotAngle}deg)`;
    }

    function moveRobot() {
        const rad = robotAngle * Math.PI / 180;
        if (currentCommand === "FORWARD") {
            robotX += Math.sin(rad) * MOVE_SPEED;
            robotY -= Math.cos(rad) * MOVE_SPEED;
        } else if (currentCommand === "BOOST") {
            robotX += Math.sin(rad) * (MOVE_SPEED * 2.5);
            robotY -= Math.cos(rad) * (MOVE_SPEED * 2.5);
        } else if (currentCommand === "BACKWARD") {
            robotX -= Math.sin(rad) * (MOVE_SPEED * 0.8);
            robotY += Math.cos(rad) * (MOVE_SPEED * 0.8);
        } else if (currentCommand === "ROTATE_RIGHT") {
            robotAngle += ROTATE_SPEED;
        } else if (currentCommand === "ROTATE_LEFT") {
            robotAngle -= ROTATE_SPEED;
        }

        const margin = 30;
        robotX = Math.max(margin, Math.min(field.clientWidth - margin, robotX));
        robotY = Math.max(margin, Math.min(field.clientHeight - margin, robotY));
        updateRobot();
    }

    function gameLoop() {
        moveRobot();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    function isFingerUp(landmarks, tip, pip) {
        const tipDist = Math.hypot(landmarks[tip].x - landmarks[0].x, landmarks[tip].y - landmarks[0].y);
        const pipDist = Math.hypot(landmarks[pip].x - landmarks[0].x, landmarks[pip].y - landmarks[0].y);
        return tipDist > pipDist;
    }

    function isThumbUp(landmarks) {
        const palmSize = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const thumbDist = Math.hypot(landmarks[4].x - landmarks[9].x, landmarks[4].y - landmarks[9].y);
        return thumbDist > palmSize * 1.1; 
    }

    function analyzeHand(landmarks) {
        return {
            index: isFingerUp(landmarks, 8, 6),
            middle: isFingerUp(landmarks, 12, 10),
            ring: isFingerUp(landmarks, 16, 14),
            pinky: isFingerUp(landmarks, 20, 18),
            thumb: isThumbUp(landmarks)
        };
    }

    function detectGestureType(fingers) {
        if (fingers.thumb && fingers.index && fingers.middle && fingers.ring && fingers.pinky) return "FIVE";
        if (!fingers.thumb && fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) return "INDEX";
        if (!fingers.thumb && fingers.index && fingers.middle && !fingers.ring && !fingers.pinky) return "V_SIGN";
        if (!fingers.thumb && fingers.index && !fingers.middle && !fingers.ring && fingers.pinky) return "ROCK";
        if (fingers.thumb && !fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) return "THUMB";
        if (!fingers.thumb && !fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) return "FIST";
        return "UNKNOWN";
    }

    function showCommand(cmd, gestureType, fingers) {
        if (cmd === "STOP" || gestureType === "UNKNOWN") {
            commandText.innerHTML = "⏹ 정지";
            const detected = [
                fingers.thumb ? "엄지" : "", fingers.index ? "검지" : "", 
                fingers.middle ? "중지" : "", fingers.ring ? "약지" : "", fingers.pinky ? "소지" : ""
            ].filter(Boolean).join(" ");
            
            statusText.innerHTML = gestureType === "UNKNOWN" 
                ? `인식 실패 🤷‍♂️ (현재 펴진 손가락: ${detected || "없음"})` 
                : "로봇 정지 상태";
        } else {
            const act = ACTIONS[cmd];
            commandText.innerHTML = `${act.emoji} ${act.name}`;
            statusText.innerHTML = `블록 코딩 동작 실행 중 (${GESTURES[gestureType].name})`;
        }
    }

    function onResults(results) {
        canvas.width = results.image.width;
        canvas.height = results.image.height;

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];

            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 4 });
            drawLandmarks(ctx, landmarks, { color: "#FF0000", lineWidth: 2 });

            const fingers = analyzeHand(landmarks);
            const gestureType = detectGestureType(fingers);
            
            currentCommand = gestureMapping[gestureType] || "STOP";
            showCommand(currentCommand, gestureType, fingers);
        } else {
            currentCommand = "STOP";
            commandText.innerHTML = "⏹ 정지";
            statusText.innerHTML = "손이 인식되지 않음";
        }
        ctx.restore();
    }

    const hands = new Hands({
        locateFile: function(file) {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({
        maxNumHands: 1, modelComplexity: 0,
        minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    let camera = null;

    startButton.addEventListener("click", async function() {
        startButton.style.display = "none";
        const video = document.createElement("video");
        video.setAttribute("playsinline", "");
        video.setAttribute("autoplay", ""); 
        video.muted = true;
        video.style.display = "none";
        document.body.appendChild(video);

        camera = new Camera(video, {
            onFrame: async function() { await hands.send({ image: video }); },
            width: 640, height: 480
        });
        camera.start();
    });

    window.addEventListener("load", resetRobot);
    window.addEventListener("resize", resetRobot);
</script>
</body>
</html>
