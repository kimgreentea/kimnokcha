<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹캠 손 추적 로봇 제어기 (TFJS 투명 배경)</title>
  
  <script src="https://unpkg.com/@tensorflow/tfjs"></script>
  <script src="https://unpkg.com/@tensorflow-models/hand-pose-detection"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin: 15px 0;
      font-size: 1.5rem;
      z-index: 10;
    }
    .container {
      position: relative;
      width: 95vw;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      background: #2c3e50;
    }
    /* 비디오를 거울처럼 반전시켜서 뒤에 깔아둠 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    /* 캔버스는 투명하게 비디오 위에 덮음 */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      background: transparent;
    }
    #status {
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00e5ff;
      z-index: 10;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #ffeb3b;
      text-align: center;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>🤖 TFJS 손 추적 컨트롤러</h1>
  <div class="container">
    <div id="loader" class="loader">로딩 시작 ㅋㅋㅋ 대기 타는 중... ⏳</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">상태: 권한 허용 대기 중 ✊</div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');

    function resizeCanvas() {
      canvasElement.width = canvasElement.clientWidth;
      canvasElement.height = canvasElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    let robot = {
      x: 200, y: 200, size: 25, angle: 0, speed: 6, turnSpeed: 0.12, state: 'stop'
    };

    function detectGesture(keypoints) {
      const isFingerUp = (tip, pip) => keypoints[tip].y < keypoints[pip].y;

      const indexUp = isFingerUp(8, 6);
      const middleUp = isFingerUp(12, 10);
      const ringUp = isFingerUp(16, 14);
      const pinkyUp = isFingerUp(20, 18);

      if (indexUp && !middleUp && !ringUp && !pinkyUp) return 'forward';
      if (indexUp && middleUp && !ringUp && !pinkyUp) return 'spin';
      return 'stop';
    }

    let detector;

    function renderRobot() {
      if (robot.state === 'forward') {
        robot.x += Math.cos(robot.angle) * robot.speed;
        robot.y += Math.sin(robot.angle) * robot.speed;
      } else if (robot.state === 'spin') {
        robot.angle += robot.turnSpeed;
      }

      if (robot.x < robot.size) robot.x = robot.size;
      if (robot.x > canvasElement.width - robot.size) robot.x = canvasElement.width - robot.size;
      if (robot.y < robot.size) robot.y = robot.size;
      if (robot.y > canvasElement.height - robot.size) robot.y = canvasElement.height - robot.size;

      // 이전 프레임 지우기 (투명 배경이라 clearRect 필수)
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      canvasCtx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
      canvasCtx.lineWidth = 1;
      for(let i = 0; i < canvasElement.width; i += 50) {
        canvasCtx.beginPath(); canvasCtx.moveTo(i, 0); canvasCtx.lineTo(i, canvasElement.height); canvasCtx.stroke();
      }
      for(let i = 0; i < canvasElement.height; i += 50) {
        canvasCtx.beginPath(); canvasCtx.moveTo(0, i); canvasCtx.lineTo(canvasElement.width, i); canvasCtx.stroke();
      }

      canvasCtx.save();
      canvasCtx.translate(robot.x, robot.y);
      canvasCtx.rotate(robot.angle);

      canvasCtx.beginPath();
      canvasCtx.moveTo(robot.size, 0);
      canvasCtx.lineTo(-robot.size * 0.8, -robot.size * 0.7);
      canvasCtx.lineTo(-robot.size * 0.4, 0);
      canvasCtx.lineTo(-robot.size * 0.8, robot.size * 0.7);
      canvasCtx.closePath();

      if(robot.state === 'forward') {
        canvasCtx.fillStyle = '#00e5ff';
        canvasCtx.shadowColor = '#00e5ff';
      } else if(robot.state === 'spin') {
        canvasCtx.fillStyle = '#ff1744';
        canvasCtx.shadowColor = '#ff1744';
      } else {
        canvasCtx.fillStyle = '#90a4ae';
        canvasCtx.shadowColor = 'transparent';
      }

      canvasCtx.shadowBlur = 15;
      canvasCtx.fill();
      canvasCtx.restore();
    }

    async function trackingLoop() {
      if (videoElement.readyState >= 2) {
        const hands = await detector.estimateHands(videoElement, {flipHorizontal: true});
        
        if (hands.length > 0) {
          const gesture = detectGesture(hands[0].keypoints);
          robot.state = gesture;

          if (gesture === 'forward') {
            statusEl.innerText = '상태: 직진 중 ☝️ 가즈아~';
            statusEl.style.color = '#00e5ff';
          } else if (gesture === 'spin') {
            statusEl.innerText = '상태: 뺑뺑이 ✌️ ㅋㅋㅋ';
            statusEl.style.color = '#ff1744';
          } else {
            statusEl.innerText = '상태: 주먹 쥠 (정지) ✊';
            statusEl.style.color = '#90a4ae';
          }
        } else {
          robot.state = 'stop';
          statusEl.innerText = '상태: 손 실종 (정지) ✊';
          statusEl.style.color = '#90a4ae';
        }
      }
      
      renderRobot();
      requestAnimationFrame(trackingLoop);
    }

    async function init() {
      if (typeof handPoseDetection === 'undefined') {
        loader.innerText = "라이브러리 다운로드 실패 🥲 새로고침 ㄱㄱ";
        return;
      }

      try {
        loader.innerHTML = "카메라 허용 눌러줘 📷<br>안 뜨면 주소창 자물쇠 눌러서 확인 ㄱㄱ";
        
        // 해상도 억까 방지 (딱 맞는 사이즈 요구 안 하고 전면 카메라만 요청)
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        
        videoElement.srcObject = stream;
        loader.innerHTML = "카메라 켜짐 📸<br>텐서플로우 뇌 다운로드 중... 쫌 걸림 ⏳";
        
        await new Promise((resolve) => {
          videoElement.onloadedmetadata = () => resolve();
        });
        videoElement.play();

        const model = handPoseDetection.SupportedModels.MediaPipeHands;
        const detectorConfig = { runtime: 'tfjs', modelType: 'lite' };
        detector = await handPoseDetection.createDetector(model, detectorConfig);

        loader.style.display = 'none';
        resizeCanvas();
        robot.x = canvasElement.width / 2;
        robot.y = canvasElement.height / 2;
        
        trackingLoop();

      } catch (err) {
        loader.innerHTML = `카메라 켜기 실패 🥲<br>에러 내용: ${err.message}`;
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
