<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손가락으로 움직이는 AI 로봇</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 플렉스박스로 화면 3등분 테트리스 세팅 ㅋㅋㅋ */
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        /* 1. 상단 구역 (도움말이랑 카메라 양끝에 배치) */
        #topArea {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            flex-shrink: 0;
        }

        #help {
            background: rgba(0,0,0,0.75);
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
        }

        #cameraArea {
            width: 280px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid white;
            background: black;
        }

        #cameraCanvas {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        /* 2. 중간 구역 (로봇 운동장이 남는 공간 싹 다 흡수) */
        #field {
            position: relative;
            flex-grow: 1; /* 핵심 폼 미친 속성 */
            width: 100%;
            background:
                linear-gradient(#ddd 1px, transparent 1px),
                linear-gradient(90deg, #ddd 1px, transparent 1px);
            background-size: 50px 50px;
            background-color: white;
            border: 5px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }

        #robot {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 50px;
            line-height: 60px;
            text-align: center;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: transform 0.05s linear;
            z-index: 5;
        }

        /* 3. 하단 구역 (명령 표시) */
        #command {
            width: 100%;
            max-width: 600px;
            align-self: center;
            text-align: center;
            padding: 15px;
            background: #222;
            border-radius: 15px;
            font-size: 25px;
            font-weight: bold;
            flex-shrink: 0;
        }

        #status {
            font-size: 16px;
            margin-top: 5px;
            font-weight: normal;
        }

        #startButton {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: #333;
            color: white;
            z-index: 100;
        }

        @media (max-width: 600px) {
            #cameraArea {
                width: 160px;
            }
            #help {
                font-size: 13px;
                padding: 10px;
            }
            #command {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div id="container">

    <!-- 상단: 도움말 & 카메라 -->
    <div id="topArea">
        <div id="help">
            ☝️ 직진<br>
            ✌️ 회전<br>
            ✊ 정지
        </div>
        <div id="cameraArea">
            <canvas id="cameraCanvas"></canvas>
        </div>
    </div>

    <!-- 중단: 로봇 운동장 -->
    <div id="field">
        <div id="robot">🤖</div>
    </div>

    <!-- 하단: 명령 표시 -->
    <div id="command">
        ⏹ 정지
        <div id="status">손을 카메라에 보여주세요.</div>
    </div>

    <!-- 시작 버튼 -->
    <button id="startButton">📷 카메라 시작</button>

</div>

<script>
    const robot = document.getElementById("robot");
    const field = document.getElementById("field");
    const commandText = document.getElementById("command");
    const statusText = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const canvas = document.getElementById("cameraCanvas");
    const ctx = canvas.getContext("2d");

    let robotX = 0;
    let robotY = 0;
    let robotAngle = 0;
    let command = "STOP";

    const MOVE_SPEED = 2.5;
    const ROTATE_SPEED = 3;

    function resetRobot() {
        robotX = field.clientWidth / 2;
        robotY = field.clientHeight / 2;
        robotAngle = 0;
        updateRobot();
    }

    function updateRobot() {
        robot.style.left = robotX + "px";
        robot.style.top = robotY + "px";
        robot.style.transform = `translate(-50%, -50%) rotate(${robotAngle}deg)`;
    }

    function moveRobot() {
        if (command === "FORWARD") {
            const rad = robotAngle * Math.PI / 180;
            robotX += Math.sin(rad) * MOVE_SPEED;
            robotY -= Math.cos(rad) * MOVE_SPEED;
        } else if (command === "ROTATE") {
            robotAngle += ROTATE_SPEED;
        }

        const margin = 30;
        robotX = Math.max(margin, Math.min(field.clientWidth - margin, robotX));
        robotY = Math.max(margin, Math.min(field.clientHeight - margin, robotY));

        updateRobot();
    }

    function gameLoop() {
        moveRobot();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    function isFingerUp(landmarks, tip, pip) {
        return landmarks[tip].y < landmarks[pip].y;
    }

    function isThumbUp(landmarks) {
        return Math.abs(landmarks[4].x - landmarks[2].x) > 0.10;
    }

    function analyzeHand(landmarks) {
        return {
            index: isFingerUp(landmarks, 8, 6),
            middle: isFingerUp(landmarks, 12, 10),
            ring: isFingerUp(landmarks, 16, 14),
            pinky: isFingerUp(landmarks, 20, 18),
            thumb: isThumbUp(landmarks)
        };
    }

    function decideCommand(fingers) {
        if (fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky) return "FORWARD";
        if (fingers.index && fingers.middle && !fingers.ring && !fingers.pinky) return "ROTATE";
        return "STOP";
    }

    function showCommand(cmd) {
        if (cmd === "FORWARD") {
            commandText.innerHTML = "⬆️ 직진";
            statusText.innerHTML = "검지 손가락";
        } else if (cmd === "ROTATE") {
            commandText.innerHTML = "🔄 회전";
            statusText.innerHTML = "검지 + 중지";
        } else {
            commandText.innerHTML = "⏹ 정지";
            statusText.innerHTML = "주먹 또는 인식되지 않음";
        }
    }

    function onResults(results) {
        canvas.width = results.image.width;
        canvas.height = results.image.height;

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];

            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 4 });
            drawLandmarks(ctx, landmarks, { color: "#FF0000", lineWidth: 2 });

            const fingers = analyzeHand(landmarks);
            command = decideCommand(fingers);
            showCommand(command);
        } else {
            command = "STOP";
            commandText.innerHTML = "⏹ 정지";
            statusText.innerHTML = "손이 인식되지 않았습니다.";
        }
        ctx.restore();
    }

    const hands = new Hands({
        // 줄바꿈 억까 해결 ㅋㅋㅋ
        locateFile: function(file) {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    let camera = null;

    startButton.addEventListener("click", async function() {
        startButton.style.display = "none";

        const video = document.createElement("video");
        video.setAttribute("playsinline", "");
        video.setAttribute("autoplay", ""); // 크롬 비디오 정지 억까 해결 ㅋㅋㅋ
        video.muted = true;
        
        // 안 보이는 비디오를 바디에 숨겨둠
        video.style.display = "none";
        document.body.appendChild(video);

        camera = new Camera(video, {
            onFrame: async function() {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });

        camera.start();
    });

    window.addEventListener("load", resetRobot);
    window.addEventListener("resize", resetRobot);

</script>
</body>
</html>
