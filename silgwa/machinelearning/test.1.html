```html
<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0">

<title>카메라 테스트</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

video {
    width: 90%;
    max-width: 640px;
    margin-top: 20px;
    background: #333;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    margin: 20px;
}

</style>

</head>

<body>

<h2>📷 카메라 테스트</h2>

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<br>

<button id="start">
    카메라 시작
</button>

<p id="status">
    대기 중
</p>


<script>

const video =
    document.getElementById("video");

const start =
    document.getElementById("start");

const status =
    document.getElementById("status");


start.addEventListener("click", async () => {

    try {

        status.textContent =
            "카메라 요청 중...";


        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });


        console.log("STREAM", stream);


        video.srcObject = stream;


        /*
         * 중요
         *
         * video.play()를 호출하지 않는다.
         *
         * autoplay + muted + playsinline이
         * 자동으로 재생하도록 맡긴다.
         */


        status.textContent =
            "✅ 카메라 스트림 연결됨";


        setTimeout(() => {

            status.textContent =
                "영상 크기: " +
                video.videoWidth +
                " × " +
                video.videoHeight;

        }, 1000);


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ " +
            error.name +
            ": " +
            error.message;

    }

});

</script>

</body>
</html>
```
