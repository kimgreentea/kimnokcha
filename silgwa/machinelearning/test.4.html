<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹캠 손 추적 로봇 제어기 (TFJS 버전)</title>
  
  <!-- TensorFlow.js 및 Hand Pose Detection 라이브러리 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.1.2/dist/hand-pose-detection.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin: 15px 0;
      font-size: 1.5rem;
    }
    .container {
      position: relative;
      width: 95vw;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #2c3e50;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video {
      display: none; 
    }
    #status {
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00e5ff;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #ffeb3b;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>🤖 TFJS 손 추적 로봇 컨트롤러</h1>
  <div class="container">
    <div id="loader" class="loader">텐서플로우 뇌 이식 중...<br>쪼끔만 기달 ㅋㅋㅋ ⏳</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">상태: 카메라 대기 중 ✊</div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    const loader = document.getElementById('loader');

    function resizeCanvas() {
      canvasElement.width = canvasElement.clientWidth;
      canvasElement.height = canvasElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    let robot = {
      x: 200, y: 200, size: 25, angle: 0, speed: 6, turnSpeed: 0.12, state: 'stop'
    };

    // 제스처 판단 로직 (TFJS 키포인트 배열 사용)
    function detectGesture(keypoints) {
      // y좌표가 작을수록 화면 위쪽
      const isFingerUp = (tip, pip) => keypoints[tip].y < keypoints[pip].y;

      // TFJS HandPose 키포인트 인덱스 (MediaPipe랑 동일함)
      const indexUp = isFingerUp(8, 6);
      const middleUp = isFingerUp(12, 10);
      const ringUp = isFingerUp(16, 14);
      const pinkyUp = isFingerUp(20, 18);

      if (indexUp && !middleUp && !ringUp && !pinkyUp) return 'forward';
      if (indexUp && middleUp && !ringUp && !pinkyUp) return 'spin';
      return 'stop';
    }

    let detector;

    // 로봇 그리기 및 위치 업데이트
    function renderRobot() {
      if (robot.state === 'forward') {
        robot.x += Math.cos(robot.angle) * robot.speed;
        robot.y += Math.sin(robot.angle) * robot.speed;
      } else if (robot.state === 'spin') {
        robot.angle += robot.turnSpeed;
      }

      if (robot.x < robot.size) robot.x = robot.size;
      if (robot.x > canvasElement.width - robot.size) robot.x = canvasElement.width - robot.size;
      if (robot.y < robot.size) robot.y = robot.size;
      if (robot.y > canvasElement.height - robot.size) robot.y = canvasElement.height - robot.size;

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      canvasCtx.lineWidth = 1;
      for(let i = 0; i < canvasElement.width; i += 50) {
        canvasCtx.beginPath(); canvasCtx.moveTo(i, 0); canvasCtx.lineTo(i, canvasElement.height); canvasCtx.stroke();
      }
      for(let i = 0; i < canvasElement.height; i += 50) {
        canvasCtx.beginPath(); canvasCtx.moveTo(0, i); canvasCtx.lineTo(canvasElement.width, i); canvasCtx.stroke();
      }

      canvasCtx.save();
      canvasCtx.translate(robot.x, robot.y);
      canvasCtx.rotate(robot.angle);

      canvasCtx.beginPath();
      canvasCtx.moveTo(robot.size, 0);
      canvasCtx.lineTo(-robot.size * 0.8, -robot.size * 0.7);
      canvasCtx.lineTo(-robot.size * 0.4, 0);
      canvasCtx.lineTo(-robot.size * 0.8, robot.size * 0.7);
      canvasCtx.closePath();

      if(robot.state === 'forward') {
        canvasCtx.fillStyle = '#00e5ff';
        canvasCtx.shadowColor = '#00e5ff';
      } else if(robot.state === 'spin') {
        canvasCtx.fillStyle = '#ff1744';
        canvasCtx.shadowColor = '#ff1744';
      } else {
        canvasCtx.fillStyle = '#90a4ae';
        canvasCtx.shadowColor = 'transparent';
      }

      canvasCtx.shadowBlur = 20;
      canvasCtx.fill();
      canvasCtx.restore();
    }

    // 메인 추적 루프
    async function trackingLoop() {
      if (videoElement.readyState >= 2) {
        const hands = await detector.estimateHands(videoElement, {flipHorizontal: true});
        
        if (hands.length > 0) {
          const gesture = detectGesture(hands[0].keypoints);
          robot.state = gesture;

          if (gesture === 'forward') {
            statusEl.innerText = '상태: 직진 중 ☝️ 가즈아~';
            statusEl.style.color = '#00e5ff';
          } else if (gesture === 'spin') {
            statusEl.innerText = '상태: 뺑뺑이 도는 중 ✌️ ㅋㅋㅋ';
            statusEl.style.color = '#ff1744';
          } else {
            statusEl.innerText = '상태: 정지 ✊';
            statusEl.style.color = '#90a4ae';
          }
        } else {
          robot.state = 'stop';
          statusEl.innerText = '상태: 손 실종됨 (정지) ✊';
          statusEl.style.color = '#90a4ae';
        }
      }
      
      renderRobot();
      requestAnimationFrame(trackingLoop);
    }

    // 카메라 및 TFJS 초기화 세팅
    async function init() {
      try {
        // 웹캠 스트림 가져오기
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });
        videoElement.srcObject = stream;
        
        // 비디오 로드 대기
        await new Promise((resolve) => {
          videoElement.onloadedmetadata = () => {
            resolve(videoElement);
          };
        });
        videoElement.play();

        // TFJS 모델 로드
        const model = handPoseDetection.SupportedModels.MediaPipeHands;
        const detectorConfig = {
          runtime: 'tfjs',
          modelType: 'lite'
        };
        detector = await handPoseDetection.createDetector(model, detectorConfig);

        // 로딩 끝
        loader.style.display = 'none';
        resizeCanvas();
        robot.x = canvasElement.width / 2;
        robot.y = canvasElement.height / 2;
        
        // 루프 시작
        trackingLoop();

      } catch (err) {
        alert("카메라 에러 뜸 ㅠㅠ: " + err);
        loader.innerText = "카메라를 켤 수 없음 🥲 권한 확인 ㄱㄱ";
      }
    }

    init();
  </script>
</body>
</html>
