<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>머신러닝 체험</title> <style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f3f4f6;color:#222}.container{max-width:1100px;margin:30px auto;padding:20px}h1{margin-bottom:8px}.description{color:#666;margin-bottom:25px}.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.panel h2{margin-top:0}table{width:100%;border-collapse:collapse;margin-top:15px}td,td input,th{border:1px solid #ddd;padding:8px;text-align:center}th{background:#f1f1f1}td input{width:100%;padding:7px;border:1px solid #ccc;border-radius:5px}button{border:0;border-radius:7px;padding:9px 15px;cursor:pointer;font-size:14px}.add-btn,.train-btn{background:#2563eb;color:#fff}.add-btn{margin-top:15px}.train-btn{font-size:16px;padding:12px 20px}.delete-btn{background:#dc2626;color:#fff}.predict-area{display:grid;grid-template-columns:1fr 1fr;gap:15px}.input-group{display:flex;flex-direction:column;gap:6px}.input-group label{font-weight:700}.input-group input{padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px}.predict-btn{margin-top:20px;background:#2563eb;color:#fff;width:100%;font-size:17px;padding:13px}.result{margin-top:20px;padding:25px;background:#f8fafc;border-radius:10px;text-align:center}.result-title{font-size:18px;color:#555}.result-size{font-size:55px;font-weight:700;margin:10px;color:#7c3aed}.message,.status{margin-top:10px;color:#555}.message{color:#dc2626}.tree-info{background:#f8fafc;padding:15px;border-radius:8px;line-height:1.7}@media (max-width:700px){.predict-area{grid-template-columns:1fr}}</style> </head><body><div class="container"><h1>머신러닝 >_<</h1><div class="description"> 옷 사이즈를 추천해주는 AI </div><div class="panel"><h2>① 학습 데이터</h2><p> 아래 데이터를 추가하거나 수정할 수 있습니다. </p><table><thead><tr><th>번호</th><th>키 (cm)</th><th>몸무게 (kg)</th><th>사이즈</th><th>삭제</th></tr></thead><tbody id="dataTable"></tbody></table><button class="add-btn" onclick="addData()"> + 데이터 추가 </button></div><div class="panel"><h2>② AI 학습</h2><p> 현재 입력된 데이터를 이용하여 AI가 학습합니다. </p><button class="train-btn" onclick="trainModel()"> AI 학습하기 </button><div class="tree-info" id="treeInfo"> 아직 학습하지 않았습니다. </div></div><div class="panel"><h2>③ 사이즈 추천</h2><p> 학습된 데이터를 이용하여 사이즈를 추천합니다. </p><div class="predict-area"><div class="input-group"><label>키 (cm)</label><input type="number" id="heightInput" placeholder="예: 172" ></div><div class="input-group"><label>몸무게 (kg)</label><input type="number" id="weightInput" placeholder="예: 68" ></div></div><button class="predict-btn" onclick="predict()"> AI 추천 </button><div class="result"><div class="result-size" id="result"></div><div class="status" id="resultMessage"> 먼저 AI를 학습해주세요. </div></div></div></div> <script>let data=[{height:150,weight:45,size:"S"},{height:155,weight:48,size:"S"},{height:160,weight:50,size:"M"},{height:165,weight:55,size:"M"},{height:168,weight:60,size:"L"},{height:170,weight:65,size:"L"},{height:175,weight:70,size:"L"},{height:180,weight:75,size:"XL"},{height:185,weight:82,size:"XL"}],model=null;const MAX_DEPTH=5;function gini(e){if(0===e.length)return 0;const t={};e.forEach(e=>{t[e.size]||(t[e.size]=0),t[e.size]++});let n=1;for(const i in t){const r=t[i]/e.length;n-=r*r}return n}function majority(e){const t={};e.forEach(e=>{t[e.size]||(t[e.size]=0),t[e.size]++});let n=null,i=-1;for(const e in t)t[e]>i&&(n=e,i=t[e]);return n}function findBestSplit(e){let t=null,n=null,i=1/0;const r=["height","weight"];for(const l of r){const r=e.map(e=>e[l]).sort((e,t)=>e-t),o=[...new Set(r)];for(let r=0;r<o.length-1;r++){const u=(o[r]+o[r+1])/2,h=e.filter(e=>e[l]<=u),d=e.filter(e=>e[l]>u);if(0===h.length||0===d.length)continue;const a=h.length/e.length*gini(h)+d.length/e.length*gini(d);a<i&&(i=a,t=l,n=u)}}return null===t?null:{feature:t,threshold:n,score:i}}function buildTree(e,t=0){if(0===e.length)return null;const n=[...new Set(e.map(e=>e.size))];if(1===n.length)return{type:"leaf",prediction:n[0],count:e.length};if(t>=5)return{type:"leaf",prediction:majority(e),count:e.length};const i=findBestSplit(e);if(!i)return{type:"leaf",prediction:majority(e),count:e.length};const r=e.filter(e=>e[i.feature]<=i.threshold),l=e.filter(e=>e[i.feature]>i.threshold);return{type:"node",feature:i.feature,threshold:i.threshold,left:buildTree(r,t+1),right:buildTree(l,t+1)}}function trainModel(){const e=[];for(let t=0;t<data.length;t++){const n=data[t],i=Number(n.height),r=Number(n.weight),l=String(n.size).trim();if(!Number.isFinite(i)||!Number.isFinite(r)||i<=0||r<=0||""===l)return void alert(`${t+1}번째 데이터가 올바르지 않습니다.`);e.push({height:i,weight:r,size:l})}e.length<2?alert("학습 데이터가 최소 2개 필요합니다."):(model=buildTree(e),document.getElementById("treeInfo").innerHTML=`\n        <b>학습 완료</b><br>\n        학습 데이터: ${e.length}개<br>\n        `,document.getElementById("resultMessage").textContent="학습이 완료되었습니다. 키와 몸무게를 입력하세요.")}function predictTree(e,t,n){if("leaf"===e.type)return e.prediction;let i;return i="height"===e.feature?t:n,i<=e.threshold?predictTree(e.left,t,n):predictTree(e.right,t,n)}function predict(){if(null===model)return void alert("먼저 AI를 학습해주세요.");const e=Number(document.getElementById("heightInput").value),t=Number(document.getElementById("weightInput").value);if(!Number.isFinite(e)||e<=0)return void alert("키는 0보다 큰 숫자를 입력해주세요.");if(!Number.isFinite(t)||t<=0)return void alert("몸무게는 0보다 큰 숫자를 입력해주세요.");const n=predictTree(model,e,t);document.getElementById("result").textContent=n,document.getElementById("resultMessage").textContent=`${e}cm, ${t}kg이신 분에게는 ${n} 사이즈를 추천합니다!`}function renderTable(){const e=document.getElementById("dataTable");e.innerHTML="",data.forEach((t,n)=>{const i=document.createElement("tr");i.innerHTML=`\n            <td>${n+1}</td>\n\n            <td>\n                <input\n                    type="number"\n                    value="${t.height}"\n                    onchange="updateData(${n}, 'height', this.value)"\n                >\n            </td>\n\n            <td>\n                <input\n                    type="number"\n                    value="${t.weight}"\n                    onchange="updateData(${n}, 'weight', this.value)"\n                >\n            </td>\n\n            <td>\n                <input\n                    type="text"\n                    value="${t.size}"\n                    onchange="updateData(${n}, 'size', this.value)"\n                >\n            </td>\n\n            <td>\n                <button\n                    class="delete-btn"\n                    onclick="deleteData(${n})"\n                >\n                    삭제\n                </button>\n            </td>\n        `,e.appendChild(i)})}function updateData(e,t,n){data[e][t]=n,model=null,document.getElementById("treeInfo").textContent="데이터가 수정되었습니다. 다시 학습해주세요."}function addData(){data.push({height:170,weight:65,size:"M"}),renderTable(),model=null,document.getElementById("treeInfo").textContent="데이터가 추가되었습니다. 다시 학습해주세요."}function deleteData(e){data.splice(e,1),renderTable(),model=null,document.getElementById("treeInfo").textContent="데이터가 삭제되었습니다. 다시 학습해주세요."}renderTable();</script> </body></html>
