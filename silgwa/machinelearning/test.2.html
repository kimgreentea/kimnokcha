<!DOCTYPE html>
<html>
<body>

<video id="video"
       autoplay
       muted
       playsinline
       style="width:100%;"></video>

<button onclick="camera()">카메라 시작</button>

<script>

async function camera() {

    const stream =
        await navigator.mediaDevices.getUserMedia({
            video: true
        });

    document.getElementById("video").srcObject = stream;

}

</script>

</body>
</html>
