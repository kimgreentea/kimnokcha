<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파이썬 실습실</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: monospace; padding: 20px; }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        

        .nav-bar {
            display: flex;
            flex-direction: column; 
            align-items: center;   
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .nav-btn {
            width: 200px;        
            text-align: center;
            padding: 10px 16px;
            background: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-family: monospace;
            transition: all 0.2s;
        }
        
        .nav-btn:hover {
            background: #007acc; 
            color: #fff;
            border-color: #007acc;
        }


        button.run-btn { 
            margin-top: 10px; 
            padding: 8px; 
            background: #007acc; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        button.run-btn:hover { background: #005999; }
    </style>
</head>
<body>

    <h2>파이썬 실습실</h2>

    <div class="nav-bar">
        <a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill1" class="nav-btn active">출력문</a>
        <a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill2" class="nav-btn">변수</a>
        <a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill3" class="nav-btn">for 문</a>
        <a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill4" class="nav-btn">while 문</a>
        <a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill5" class="nav-btn">if 문</a>
    </div>

</body>
</html>
