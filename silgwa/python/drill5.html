<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>while 반복문 연습하기</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: monospace; padding: 20px; }
        h2 { text-align: center; color: #fff; margin-bottom: 30px; }
        
        .nav-bar {
            display: flex;
            flex-direction: column; 
            align-items: center;   
            gap: 10px;
            margin-bottom: 30px;
        }
        .nav-btn {
            width: 200px;        
            text-align: center;
            padding: 10px 16px;
            background: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-family: monospace;
            transition: all 0.2s;
        }
        
        .nav-btn:hover {
            background: #007acc; 
            color: #fff;
            border-color: #007acc;
        }

        .compiler-row { 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            margin-bottom: 30px; 
            background: #252526; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
        }

        /* 에디터와 결과창을 좌우로 나란히 배치 */
        .editor-group {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }
        
        .pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
        
        h4 { margin: 0 0 8px 0; color: #9cdcfe; }
        
        textarea.code-input { 
            width: 100%; 
            flex: 1; 
            min-height: 150px; 
            background: #1e1e1e; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 10px; 
            font-family: monospace; 
            resize: none; 
            border-radius: 4px; 
            box-sizing: border-box;
        }
        
        button.run-btn { 
            margin-top: 10px; 
            padding: 8px; 
            background: #007acc; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        button.run-btn:hover { background: #005999; }
        
button.run-btn.hidden {
            display: none;
        }
        .output { 
            background: #111; 
            border: 1px solid #333; 
            padding: 10px; 
            flex: 1; 
            min-height: 150px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            color: #4ec9b0; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }

        .desc-box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 4px;
            color: #ce9178;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .desc-box p {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <h2>if 선택문 연습하기</h2> 

    <!-- 실습 1 -->
    <div class="compiler-row" data-id="1">
        <div class="editor-group">
            <div class="pane">
                <h4>코드 입력</h4>
                <textarea class="code-input">
if는 다음 주에 하자..
                  
얘들아 공부해라..    
모른다고 포기하지 말고.. 
좀.. 하는 척이라도 해라.. 
                </textarea>
                <button class="run-btn hidden">실행 ▶</button>
            </div>
            <div class="pane">
                <h4>결과</h4>
                <div class="output">준비 중...</div>
            </div>
        </div>
        <div class="desc-box">
            <p>💡 <b>if 조건 :</b></p>
            <p>조건이 참(True)이라면 아래의 명령문을 계속 반복하는 코드</p>
            <p>콜론(:)을 빼지 않도록 유의</p>
        </div>
    </div>





    <!-- 목록으로 돌아가기 -->
<div class="nav-bar">
<a href="https://kimgreentea.github.io/kimnokcha/silgwa/python/drill" class="nav-btn">목록으로</a>
</div>   

    <!-- 다중 실행을 처리하는 파이썬 스크립트 -->
    <script type="py">
        import js
        import sys
        import io
        from pyodide.ffi import create_proxy

        def make_web_input(output_div, current_stdout):
            def web_input(prompt_msg=""):
                res = js.prompt(str(prompt_msg))
                if res is None:
                    res = ""
                current_stdout.write(f"{prompt_msg}{res}\n")
                output_div.innerText = current_stdout.getvalue()
                return res
            return web_input

        def create_runner(row):
            code_textarea = row.querySelector('.code-input')
            output_div = row.querySelector('.output')
            
            def run_python_code(event):
                code = code_textarea.value
                new_stdout = io.StringIO()
                
                global_env = {
                    '__name__': '__main__',
                    'input': make_web_input(output_div, new_stdout)
                }
                
                old_stdout = sys.stdout
                sys.stdout = new_stdout
                
                try:
                    exec(code, global_env)
                    result = new_stdout.getvalue()
                except Exception as e:
                    result = str(e)
                finally:
                    sys.stdout = old_stdout
                    
                output_div.innerText = result

            return run_python_code

        def setup_all():
            rows = js.document.querySelectorAll('.compiler-row')
            for i in range(rows.length):
                row = rows.item(i)
                btn = row.querySelector('.run-btn')
                runner = create_runner(row)
                btn.addEventListener("click", create_proxy(runner))
                row.querySelector('.output').innerText = "준비 완료!"

        setup_all()
    </script>

</body>
</html>
