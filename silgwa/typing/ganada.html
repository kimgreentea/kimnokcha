
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>타자연습 조아</title>

<style>

* {
    box-sizing: border-box;
}


html,
body {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}


body {
    margin: 0 auto;
    padding: 50px 5vw 80px;
    max-width: 1000px;

    font-family: Arial, "Noto Sans KR", sans-serif;
}


h1 {
    margin: 0;
    font-size: 30pt;
}


#instruction {
    margin-bottom: 50px;

    font-size: 22pt;
    font-weight: 600;
}


#target {
    margin-bottom: 25px;

    font-size: 32pt;
    font-weight: 700;

    letter-spacing: 2px;
    word-break: keep-all;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}


#count {
    margin-bottom: 25px;

    font-size: 30pt;
    font-weight: 500;
}


#word {
    display: block;

    width: 100%;
    height: 90px;

    padding: 10px 20px;

    border: 3px solid #333;
    border-radius: 12px;

    background-color: #f8f8f8;

    font-size: 30pt;
    font-family: inherit;

    outline: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}


#word:focus {
    border-color: #000;
    background-color: #fff;
}

</style>
</head>


<body>

<h1 id="instruction">40번 이상 연습 후 검사받기</h1>

<h1 id="target"></h1>

<h1><span id="count">0</span>번</h1>

<input
    id="word"
    type="text"
    inputmode="text"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    data-form-type="other"
    data-lpignore="true"
    data-1p-ignore="true"
    autofocus
>


<script>


let words = [

    '가나다라마바사아자차카타파하',
    '거너더러머버서어저처커터퍼허',
    '고노도로모보소오조초코토포호',
    '구누두루무부수우주추쿠투푸후',
    '그느드르므브스으즈츠크트프흐',
    '기니디리미비시이지치키티피히',
    '개내대래매배새애재채캐태패해',
    '게네데레메베세에제체케테페헤',
    '갸냐댜랴먀뱌샤야쟈챠캬탸퍄햐',
    '겨녀뎌려며벼셔여져쳐켜텨펴혀',

    '가갸개거겨게고교구규그기긔',
    '나냐내너녀네노뇨누뉴느니늬',
    '다댜대더뎌데도됴두듀드디듸',
    '라랴래러려레로료루류르리릐',
    '마먀매머며메모묘무뮤므미믜',
    '바뱌배버벼베보뵤부뷰브비븨',
    '사샤새서셔세소쇼수슈스시싀',
    '아야애어여에오요우유으이의',
    '자쟈재저져제조죠주쥬즈지즤',
    '차챠채처쳐체초쵸추츄츠치츼',
    '카캬캐커켜케코쿄쿠큐크키킈',
    '타탸태터텨테토툐투튜트티틔',
    '파퍄패퍼펴페포표푸퓨프피픠',
    '하햐해허혀헤호효후휴흐히희'

];


let count = Number(
    localStorage.getItem("typingCount")
) || 0;


let currentWord =
    localStorage.getItem("typingCurrentWord");


let current;


let input;



function updateCount() {

    document.getElementById("count").innerText = count;

}



function shuffleWord(word) {

    let characters = [...word];


    // Fisher-Yates 셔플
    for (
        let i = characters.length - 1;
        i > 0;
        i--
    ) {

        let j = Math.floor(
            Math.random() * (i + 1)
        );


        [
            characters[i],
            characters[j]
        ] = [
            characters[j],
            characters[i]
        ];

    }


    return characters.join("");

}



function createRandomWord(word) {

    let shuffled = shuffleWord(word);


    let result = "";

    let position = 0;


    while (position < shuffled.length) {

        let remaining =
            shuffled.length - position;


        let length = Math.min(
            Math.floor(Math.random() * 4) + 1,
            remaining
        );


        result += shuffled.slice(
            position,
            position + length
        );


        position += length;

        if (position < shuffled.length) {

            result += " ";

        }

    }


    return result;

}



function randomWord() {

    let next;


    do {

        next = Math.floor(
            Math.random() * words.length
        );

    } while (
        words.length > 1 &&
        next === current
    );


    current = next;


    currentWord =
        createRandomWord(words[current]);

    localStorage.setItem(
        "typingCurrentWord",
        currentWord
    );

    document.getElementById(
        "target"
    ).innerText = currentWord;

}


function showCurrentWord() {

    document.getElementById(
        "target"
    ).innerText = currentWord;

}


function setupInput() {

    input.type = "text";

    input.inputMode = "text";

    input.autocomplete = "off";
    input.autocorrect = "off";
    input.autocapitalize = "off";

    input.spellcheck = false;


    input.setAttribute(
        "data-form-type",
        "other"
    );

    input.setAttribute(
        "data-lpignore",
        "true"
    );

    input.setAttribute(
        "data-1p-ignore",
        "true"
    );

}



function addInputEvents() {

    setupInput();



    input.addEventListener(
        "paste",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "cut",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "copy",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "dragstart",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "selectstart",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "keydown",
        function(event) {

            if (
                (event.ctrlKey || event.metaKey) &&
                (
                    event.key.toLowerCase() === "c" ||
                    event.key.toLowerCase() === "v" ||
                    event.key.toLowerCase() === "x"
                )
            ) {

                event.preventDefault();

            }

        }
    );


    input.addEventListener(
        "input",
        function() {




            if (input.value === "김녹차") {

                count = 0;


                localStorage.setItem(
                    "typingCount",
                    count
                );


                updateCount();

                let oldInput = input;


                input = document.createElement(
                    "input"
                );


                input.id = "word";


                setupInput();


                // 기존 입력창 교체
                oldInput.replaceWith(input);


                // 이벤트 등록
                addInputEvents();



                setTimeout(
                    function() {

                        input.focus();

                    },
                    50
                );


                return;

            }

            if (
                input.value === currentWord
            ) {

                count++;


                localStorage.setItem(
                    "typingCount",
                    count
                );


                updateCount();



                randomWord();



                let oldInput = input;


                input = document.createElement(
                    "input"
                );


                input.id = "word";


     
                setupInput();


                oldInput.replaceWith(input);


                addInputEvents();


                input.focus();

            }

        }
    );

}


document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);



document.addEventListener(
    "selectstart",
    function(event) {

        event.preventDefault();

    }
);



document.addEventListener(
    "dragstart",
    function(event) {

        event.preventDefault();

    }
);



document.addEventListener(
    "copy",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "cut",
    function(event) {

        event.preventDefault();

    }
);




document.addEventListener(
    "paste",
    function(event) {

        event.preventDefault();

    }
);



document.addEventListener(
    "keydown",
    function(event) {

        if (
            (event.ctrlKey || event.metaKey) &&
            (
                event.key.toLowerCase() === "c" ||
                event.key.toLowerCase() === "v" ||
                event.key.toLowerCase() === "x"
            )
        ) {

            event.preventDefault();

        }

    }
);



if (currentWord) {

    showCurrentWord();

}



else {

    randomWord();

}



updateCount();



input = document.getElementById("word");



addInputEvents();



input.focus();


</script>

</body>
</html>
