let count = Number(
    localStorage.getItem("typingCount")
) || 0;


let currentWord =
    localStorage.getItem("typingCurrentWord");


let current;


let input;



function updateCount() {

    document.getElementById("count").innerText = count;

}



function shuffleWord(word) {

    let characters = [...word];


    // Fisher-Yates 셔플
    for (
        let i = characters.length - 1;
        i > 0;
        i--
    ) {

        let j = Math.floor(
            Math.random() * (i + 1)
        );


        [
            characters[i],
            characters[j]
        ] = [
            characters[j],
            characters[i]
        ];

    }


    return characters.join("");

}



function createRandomWord(word) {

    let shuffled = shuffleWord(word);


    let result = "";

    let position = 0;


    while (position < shuffled.length) {

        let remaining =
            shuffled.length - position;


        let length = Math.min(
            Math.floor(Math.random() * 4) + 1,
            remaining
        );


        result += shuffled.slice(
            position,
            position + length
        );


        position += length;

        if (position < shuffled.length) {

            result += " ";

        }

    }


    return result;

}



function randomWord() {

    let next;


    do {

        next = Math.floor(
            Math.random() * words.length
        );

    } while (
        words.length > 1 &&
        next === current
    );


    current = next;


    currentWord =
        createRandomWord(words[current]);

    localStorage.setItem(
        "typingCurrentWord",
        currentWord
    );

    document.getElementById(
        "target"
    ).innerText = currentWord;

}


function showCurrentWord() {

    document.getElementById(
        "target"
    ).innerText = currentWord;

}


function setupInput() {

    input.type = "text";

    input.inputMode = "text";

    input.autocomplete = "off";
    input.autocorrect = "off";
    input.autocapitalize = "off";

    input.spellcheck = false;


    input.setAttribute(
        "data-form-type",
        "other"
    );

    input.setAttribute(
        "data-lpignore",
        "true"
    );

    input.setAttribute(
        "data-1p-ignore",
        "true"
    );

}



function addInputEvents() {

    setupInput();



    input.addEventListener(
        "paste",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "cut",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "copy",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "dragstart",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );


    input.addEventListener(
        "selectstart",
        function(event) {

            event.preventDefault();

        }
    );



    input.addEventListener(
        "keydown",
        function(event) {

            if (
                (event.ctrlKey || event.metaKey) &&
                (
                    event.key.toLowerCase() === "c" ||
                    event.key.toLowerCase() === "v" ||
                    event.key.toLowerCase() === "x"
                )
            ) {

                event.preventDefault();

            }

        }
    );


    input.addEventListener(
        "input",
        function() {




            if (input.value === "김녹차") {

                count = 0;


                localStorage.setItem(
                    "typingCount",
                    count
                );


                updateCount();

                let oldInput = input;


                input = document.createElement(
                    "input"
                );


                input.id = "word";


                setupInput();


                // 기존 입력창 교체
                oldInput.replaceWith(input);


                // 이벤트 등록
                addInputEvents();



                setTimeout(
                    function() {

                        input.focus();

                    },
                    50
                );


                return;

            }

            if (
                input.value === currentWord
            ) {

                count++;


                localStorage.setItem(
                    "typingCount",
                    count
                );


                updateCount();



                randomWord();



                let oldInput = input;


                input = document.createElement(
                    "input"
                );


                input.id = "word";


     
                setupInput();


                oldInput.replaceWith(input);


                addInputEvents();


                input.focus();

            }

        }
    );

}
