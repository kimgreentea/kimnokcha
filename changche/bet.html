<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="docTitle">홀짝 도박 체험</title>
<style>
  :root { color-scheme: dark; --bg:#101522; --panel:#1a2233; --line:#303b51; --text:#f3f5fa; --muted:#aab5c8; --accent:#7dd3fc; --red:#fb7185; --green:#86efac; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(145deg,#101522,#19253a); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; padding:24px 14px 40px; }
  main { max-width:760px; margin:auto; }
  h1 { font-size:clamp(1.5rem,5vw,2.1rem); margin:0 0 8px; }
  .intro { color:var(--muted); line-height:1.65; margin:0 0 22px; }
  .panel { background:rgba(26,34,51,.96); border:1px solid var(--line); border-radius:18px; padding:20px; margin:14px 0; box-shadow:0 12px 30px #0002; }
  .label { color:var(--muted); font-size:.9rem; }
  .money { font-size:clamp(2rem,8vw,3rem); font-weight:800; letter-spacing:-.04em; margin:4px 0 14px; }
  .money small { font-size:1rem; color:var(--muted); letter-spacing:0; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  input[type=number] { width:100%; background:#0e1420; color:var(--text); border:1px solid #46536d; border-radius:10px; padding:13px; font:inherit; }
  button { border:0; border-radius:11px; padding:13px 16px; font:inherit; font-weight:750; cursor:pointer; transition:transform .08s,opacity .15s; }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .secondary { background:#29364e; color:var(--text); }
  .next-btn { width:100%; margin-top:12px; background:var(--accent); color:#082032; font-weight:800; font-size:1rem; }
  .result { min-height:58px; line-height:1.6; padding:14px; background:#0e1420; border-radius:12px; border:1px solid var(--line); margin-top:14px; }
  .result.win { border-color:#2f855a; color:var(--green); }
  .result.lose { border-color:#9f3346; color:#fecdd3; }
  .result.stop { border-color:#be123c; color:#ffe4e6; }
  .ladder-wrap { display:block; margin-top:16px; padding:14px; border:1px solid var(--line); border-radius:14px; background:#0b111d; }
  .ladder-stage { position:relative; }
  .start-cover { position:absolute; left:12%; right:12%; top:16%; bottom:16%; z-index:5; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; padding:14px; background:var(--panel); border:2px solid var(--line); border-radius:14px; }
  .start-buttons { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .start-point { min-width:0; padding:10px 2px; border:1px solid #71809a; background:#29364e; color:#f3f5fa; font-size:.85rem; border-radius:8px; font-weight:700; cursor:pointer; }
  .start-point:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .start-cover p { margin:8px 0 0; color:var(--muted); text-align:center; font-size:.8rem; }
  .start-cover.hidden { display:none; }
  .ladder-heading { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px; font-weight:750; }
  .ladder-heading span:last-child { color:var(--muted); font-size:.85rem; font-weight:500; }
  #ladderSvg { display:block; width:100%; max-height:300px; }
  .ladder-rail { stroke:#53627c; stroke-width:4; stroke-linecap:round; }
  .ladder-rung { stroke:#53627c; stroke-width:3; stroke-linecap:round; visibility:hidden; }
  .ladder-wrap.revealed .ladder-rung { visibility:visible; }
  .ladder-route { fill:none; stroke:#7dd3fc; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  .ladder-token { fill:#facc15; stroke:#fff7cc; stroke-width:2; filter:drop-shadow(0 0 5px #facc15aa); }
  .ladder-status { text-align:center; min-height:24px; color:var(--accent); font-weight:700; margin-top:4px; display:none;}
  
  /* 테이블 형태의 히스토리 스타일 (표 테두리 없음) */
  .history-header { display:grid; grid-template-columns:4fr 3fr 3fr; gap:12px; padding-bottom:8px; border-bottom:2px solid var(--line); font-weight:700; font-size:.85rem; color:var(--muted); text-align:right; }
  .history-header span:first-child { text-align:left; }
  .history { margin:0; padding:0; list-style:none; max-height:300px; overflow-y:auto; }
  .history li { display:grid; grid-template-columns:4fr 3fr 3fr; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:.92rem; text-align:right; align-items:center; }
  .history li:last-child { border-bottom:none; }
  .history li span:first-child { text-align:left; color:var(--muted); font-size:.85rem; }
  
  /* 요약 박스 */
  .history-summary { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:2px solid var(--line); font-weight:800; font-size:1.05rem; }
  .history-summary .summary-label { font-size:.85rem; color:var(--muted); font-weight:500; margin-right:8px; }
  .profit-pos { color:var(--green); }
  .profit-neg { color:var(--red); }
  
  .notice { font-size:.9rem; line-height:1.65; color:var(--muted); }
  .debrief { display:none; border-color:#8b5cf6; }
  .debrief.show { display:block; }
  .debrief h2 { margin-top:0; }
  .kicked { display:none; position:fixed; inset:0; background:#080b12ee; z-index:10; padding:20px; align-items:center; justify-content:center; }
  .kicked.show { display:flex; }
  .modal { width:min(100%,480px); background:#1a2233; border:1px solid #fb7185; border-radius:20px; padding:26px; text-align:center; box-shadow:0 20px 80px #0008; }
  .modal h2 { color:#fb7185; margin-top:0; }
  .modal p { line-height:1.7; color:#e5e7eb; }
  .modal button { width:100%; background:#fb7185; color:#300812; margin-top:8px; }
  footer { color:#7f8ca3; text-align:center; font-size:.8rem; margin-top:22px; }
</style>
</head>
<body>
<main>
  <h1 id="titleEl">홀짝 도박 체험</h1>
  <p class="intro">가상 포인트로 진행하는 도박 시뮬레이션</p>

  <section class="panel">
    <div class="label">현재 소지금</div>
    <div class="money"><span id="balance">500,000</span><small> 원</small></div>
    <div class="row">
      <div>
        <label class="label" for="bet">이번 판 판돈 (원)</label>
<input id="bet" type="number" min="1" step="1000" value="50000" inputmode="numeric">
      </div>
      <div>
        <label class="label" for="quickBet">빠른 판돈 설정</label>
        <select id="quickBet" style="width:100%;padding:13px;border-radius:10px;background:#0e1420;color:var(--text);border:1px solid #46536d;font:inherit">
          <option value="">직접 입력</option>
          <option value="10000">10,000원</option>
          <option value="50000">50,000원</option>
          <option value="100000">100,000원</option>
          <option value="250000">250,000원</option>
          <option value="500000">500,000원</option>
        </select>
      </div>
    </div>
    <p class="label" style="margin:15px 0 8px">출발 지점 선택 — 시작 지점 자체를 누르세요</p>
    <div class="ladder-wrap show" id="ladderWrap">
      <div class="ladder-heading"><span>사다리 게임</span><span>출발 지점 선택</span></div>
      <div class="ladder-stage" id="ladderStage">
        <svg id="ladderSvg" viewBox="0 0 320 250" role="img" aria-label="사다리 게임"></svg>
        <div class="start-cover" id="startCover" aria-label="사다리 시작 버튼">
          <div class="start-buttons">
            <button class="start-point" data-lane="0" type="button">출발 1</button>
            <button class="start-point" data-lane="1" type="button">출발 2</button>
          </div>
          <p>출발 지점을 누르면 사다리가 시작됩니다.</p>
        </div>
      </div>
      <div class="ladder-status" id="ladderStatus" aria-live="polite">출발 지점을 선택하세요.</div>
    </div>
    <button class="next-btn" id="nextRoundBtn" type="button" style="display:none;" disabled>다음 판 준비 (10초)</button>
    <div class="result" id="result" role="status" aria-live="polite">출발 지점을 선택하세요.</div>
  </section>

  <section class="panel">
    <h2 style="margin-top:0; margin-bottom:16px; font-size:1.1rem">진행 기록</h2>
    
  
    <div class="history-header">
      <span>진행 내역</span>
      <span>증감액</span>
      <span>잔액</span>
    </div>
    

    <ul class="history" id="history"></ul>
    
   
    <div class="history-summary">
      <div>
        <span class="summary-label">누적 번 돈</span>
        <span id="totalProfit">0원</span>
      </div>
      <div>
        <span class="summary-label">누적 입금액</span>
        <span id="totalDepositAmount" style="color:var(--text);">500,000원</span>
      </div>
    </div>
  </section>

  <section class="panel debrief" id="debrief">
    <h2>모든 돈을 잃었습니다.</h2>
    <p>하지만 돈을 추가로 입금하여 다시 시작할 수 있습니다.</p>
    <button class="secondary" id="reset" type="button">입금 후 다시 시작</button>
  </section>
</main>  

<div class="kicked" id="kicked" role="dialog" aria-modal="true" aria-labelledby="kickTitle">
  <div class="modal">
    <h2 id="kickTitle">파산하여 게임이 종료되었습니다</h2>
    <p id="kickMessage">모든 소지금을 잃었습니다. </p>
    <button id="showDebrief" type="button">기록 확인</button>     
  </div>
</div>

<script>
(() => {
  const START = 500000; 
  const STOP_AT = 1600000;
  
  const NORMAL_PROBABILITY = 0.35;
  const UNLIMITED_PROBABILITY = 0.65;  


  let isUnlimitedMode = Math.random() < 0.25;
  
  let balance = START;
  let totalDeposit = START; 
  let choice = 0;
  let stopped = false;
  let rounds = 0;
  let countdownTimer = null;

  const $ = id => document.getElementById(id);
  const titleEl = $('titleEl');
  const docTitle = $('docTitle');
  const balanceEl = $('balance');
  const betEl = $('bet');
  const quickBet = $('quickBet');
  const resultEl = $('result');
  const nextRoundBtn = $('nextRoundBtn');
  const historyEl = $('history');
  

  const totalProfitEl = $('totalProfit');
  const totalDepositAmountEl = $('totalDepositAmount');

  const debrief = $('debrief');
  const kicked = $('kicked');
  const ladderWrap = $('ladderWrap');
  const ladderSvg = $('ladderSvg');
  const ladderStatus = $('ladderStatus');
  const startCover = $('startCover');
  let busy = false;

  function initModeDisplay() {
    if (isUnlimitedMode) {
      titleEl.textContent = '홀짝 도박 체험';
      docTitle.textContent = '홀짝 도박 체험!';
    } else {
      titleEl.textContent = '홀짝 도박 체험';
      docTitle.textContent = '홀짝 도박 체험';
    }
  }
  initModeDisplay();

  const won = n => n.toLocaleString('ko-KR');


  function updateSummary() {
    const profit = balance - totalDeposit;
    totalDepositAmountEl.textContent = won(totalDeposit) + '원';
    
    totalProfitEl.textContent = (profit > 0 ? '+' : '') + won(profit) + '원';
    totalProfitEl.className = profit > 0 ? 'profit-pos' : (profit < 0 ? 'profit-neg' : '');
  }


  function addHistory(col1, col2, col3) {
    const li = document.createElement('li');
    
    const s1 = document.createElement('span'); 
    s1.textContent = col1;
    
    const s2 = document.createElement('span'); 
    s2.textContent = col2;

    if(col2.startsWith('+')) {
      s2.style.color = 'var(--green)';
      s2.style.fontWeight = '700';
    } else if(col2.startsWith('-') && col2 !== '-') {
      s2.style.color = '#fecdd3';
    } else {
      s2.style.color = 'var(--text)';
    }
    
    const s3 = document.createElement('span'); 
    s3.textContent = col3;
    s3.style.color = 'var(--text)';

    li.append(s1, s2, s3);
    historyEl.prepend(li);
  }


  addHistory('게임 시작', '-', `${won(balance)}원`);
  updateSummary();

  function buildInitialLadder() {
    const NS = 'http://www.w3.org/2000/svg';
    const make = (tag, attrs = {}) => {
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    };
    ladderSvg.replaceChildren();
    const xs = [100, 220], top = 28, bottom = 218;
    xs.forEach(x => ladderSvg.appendChild(make('line', {x1:x,y1:top,x2:x,y2:bottom,class:'ladder-rail'})));

    const winningDestination = Math.floor(Math.random() * 2);
    
    [0, 1].forEach(i => {
      const isWin = (i === winningDestination);
      const t = make('text', {
        x: xs[i], y: 242, 'text-anchor': 'middle',
        fill: isWin ? '#86efac' : '#fecdd3',
        'font-size': '14', 'font-weight': '800'
      });
      t.textContent = isWin ? '당첨' : '꽝';
      ladderSvg.appendChild(t);
    });

    return { winningDestination };
  }

  let currentWinningDestination = buildInitialLadder().winningDestination;

  function startNextRoundCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    nextRoundBtn.style.display = 'block';
    nextRoundBtn.disabled = true;
    let secondsLeft = 10;
    nextRoundBtn.textContent = `다음 판 준비 (${secondsLeft}초)`;

    countdownTimer = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0) {
        nextRoundBtn.textContent = `다음 판 준비 (${secondsLeft}초)`;
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        nextRoundBtn.disabled = false;
        nextRoundBtn.textContent = '다음 판 준비';
      }
    }, 1000);
  }

  nextRoundBtn.addEventListener('click', () => {
    nextRoundBtn.style.display = 'none';
    currentWinningDestination = buildInitialLadder().winningDestination;
    
    busy = false;
    betEl.disabled = false;
    quickBet.disabled = false;
    startCover.classList.remove('hidden');
    ladderWrap.classList.remove('revealed');
    document.querySelectorAll('.start-point').forEach(b => b.disabled = false);
    ladderStatus.textContent = '출발 지점을 선택하세요.';
    resultEl.className = 'result';
    resultEl.textContent = '출발 지점을 선택하세요.';
  });

  function finishGame() {
    stopped = true;
    busy = true;
    nextRoundBtn.style.display = 'none';
    betEl.disabled = true;
    quickBet.disabled = true;
    document.querySelectorAll('.start-point').forEach(b => b.disabled = true);
    
    $('kickTitle').textContent = '파산하여 게임이 종료되었습니다';
    $('kickMessage').textContent = '모든 소지금을 잃었습니다. ';
    kicked.classList.add('show');
    debrief.classList.add('show');
  }

  function startLadder(lane) {
    if (stopped || busy) return;
    const bet = Math.floor(Number(betEl.value));
    if (!Number.isFinite(bet) || bet < 1) {
      resultEl.className = 'result lose';
      resultEl.textContent = '판돈은 1원 이상으로 입력하세요.';
      return;
    }
    if (!Number.isFinite(bet) || bet > 500000) {
      resultEl.className = 'result lose';
      resultEl.textContent = '판돈은 500,000원 이하로 입력하세요.';
      return;
    }
    if (bet > balance) {
      resultEl.className = 'result lose';
      resultEl.textContent = '보유 금액보다 큰 판돈은 걸 수 없습니다.';  
      return;
    }

    choice = lane;
    busy = true;
    rounds++;
    betEl.disabled = true;
    quickBet.disabled = true;
    document.querySelectorAll('.start-point').forEach(b => b.disabled = false);
    startCover.classList.add('hidden');
    ladderWrap.classList.add('revealed');
    ladderStatus.textContent = `출발 ${lane + 1}에서 사다리를 타는 중…`;
    resultEl.className = 'result';
    resultEl.textContent = '사다리를 따라 이동 중입니다…';

    let isWin = false;
    if (!isUnlimitedMode && (balance + bet > STOP_AT)) {
      isWin = false;
    } else {
      const currentProb = isUnlimitedMode ? UNLIMITED_PROBABILITY : NORMAL_PROBABILITY;
      isWin = Math.random() < currentProb;
    }

    const targetDestination = isWin ? currentWinningDestination : (1 - currentWinningDestination);
    
    const needCross = (lane !== targetDestination);
    const rungCount = needCross ? 3 : 4;

    const NS = 'http://www.w3.org/2000/svg';
    const make = (tag, attrs = {}) => {
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    };

    ladderSvg.replaceChildren();
    const xs = [100, 220], top = 28, bottom = 218;
    xs.forEach(x => ladderSvg.appendChild(make('line', {x1:x,y1:top,x2:x,y2:bottom,class:'ladder-rail'})));

    const rungs = [];
    const step = (bottom - top - 40) / (rungCount + 1);
    let curSide = 0;
    for (let i = 0; i < rungCount; i++) {
      const y = top + 25 + (i * step);
      rungs.push({ i: curSide, y });
      curSide = 1 - curSide;
    }

    rungs.forEach(r => ladderSvg.appendChild(make('line', {
      x1:xs[0], y1:r.y, x2:xs[1], y2:r.y, class:'ladder-rung'
    })));

    [0, 1].forEach(i => {
      const isDestinationWin = (i === currentWinningDestination);
      const t = make('text', {
        x: xs[i], y: 242, 'text-anchor': 'middle',
        fill: isDestinationWin ? '#86efac' : '#fecdd3',
        'font-size': '14', 'font-weight': '800'
      });
      t.textContent = isDestinationWin ? '당첨' : '꽝';
      ladderSvg.appendChild(t);
    });

    const pathPoints = [[xs[lane], top]];
    let currentLane = lane;
    rungs.forEach(rung => {
      pathPoints.push([xs[currentLane], rung.y]);
      currentLane = 1 - currentLane;
      pathPoints.push([xs[currentLane], rung.y]);
    });
    pathPoints.push([xs[currentLane], bottom]);

    const d = pathPoints.map((pt,i) => `${i ? 'L' : 'M'} ${pt[0]} ${pt[1]}`).join(' ');
    const route = make('path', {d, class:'ladder-route'});
    ladderSvg.appendChild(route);
    const token = make('circle', {cx:xs[lane], cy:top, r:7, class:'ladder-token'});
    ladderSvg.appendChild(token);

    const length = route.getTotalLength(), duration = 2100, start = performance.now();
    route.style.strokeDasharray = String(length);
    route.style.strokeDashoffset = String(length);

    function animate(now) {
      const p = Math.min(1, (now-start)/duration);
      const eased = p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      route.style.strokeDashoffset = String(length*(1-eased));
      const point = route.getPointAtLength(length*eased);
      token.setAttribute('cx', point.x);
      token.setAttribute('cy', point.y);

      if (p < 1) {
        requestAnimationFrame(animate);
      } else {
        const delta = isWin ? bet : -bet;
        balance = Math.max(0, balance + delta);
        balanceEl.textContent = won(balance);
        
        ladderStatus.textContent = isWin ? `당첨! +${won(delta)}원` : `꽝! ${won(Math.abs(delta))}원 손실`;
        resultEl.className = 'result ' + (isWin ? 'win' : 'lose');
        resultEl.textContent = `${delta > 0 ? '+' : ''}${won(delta)}원 | 현재 소지금 ${won(balance)}원`;
        
        // 새 그리드 포맷에 맞춘 이력 추가
        addHistory(`${rounds}회 · 출발 ${lane+1} → ${isWin ? '당첨' : '꽝'}`, `${delta > 0 ? '+' : ''}${won(delta)}원`, `${won(balance)}원`);
        updateSummary();

        if (balance <= 0) {
          resultEl.className = 'result stop';
          resultEl.textContent = '소지금을 모두 잃었습니다. 더 이상 판돈을 걸 수 없습니다.';
          finishGame();
        } else {
          startNextRoundCountdown();
        }
      }
    }
    requestAnimationFrame(animate);
  }

  document.querySelectorAll('.start-point').forEach(button => {
    button.addEventListener('click', () => startLadder(Number(button.dataset.lane)));
  });

  quickBet.addEventListener('change', () => { if (quickBet.value) betEl.value = quickBet.value; });

  $('showDebrief').addEventListener('click', () => {
    kicked.classList.remove('show');
    debrief.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('reset').addEventListener('click', () => {
    if (countdownTimer) clearInterval(countdownTimer);
    
  

    balance = START;
    totalDeposit += START; 
    choice = 0;   
    stopped = false; 
    busy = false;   
     
    nextRoundBtn.style.display = 'none';
    betEl.disabled = false; quickBet.disabled = false;
    betEl.value = '50000'; quickBet.value = '';
    balanceEl.textContent = won(balance);
    resultEl.className = 'result';
    resultEl.textContent = '출발 지점을 선택하세요.';
    

    addHistory('추가 입금', '+500,000원', `${won(balance)}원`);
    updateSummary();
    
    kicked.classList.remove('show');
    debrief.classList.remove('show');
    startCover.classList.remove('hidden');
    ladderWrap.classList.remove('revealed');
    document.querySelectorAll('.start-point').forEach(b => b.disabled = false);
    currentWinningDestination = buildInitialLadder().winningDestination;
    ladderStatus.textContent = '출발 지점을 선택하세요.';
  });
})();
</script>
</body>
</html>
