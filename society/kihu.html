<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>문제</title>

<style>



        

        @font-face {
            font-family: 'NotoSerifKR';

            src: url(
                'https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NotoSerifKR.woff'
            ) format('woff');

            font-weight: normal;
            font-style: normal;
        }


        @font-face {
            font-family: 'Pretendard-Regular';

            src: url(
                'https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff'
            ) format('woff');

            font-weight: 400;
            font-style: normal;
        }


        
        body {
            width: 1200px;
            max-width: 100%;
            margin: 0 auto;
            margin-top: 60px;
            padding: 0 20px;
            box-sizing: border-box;
        }


        

        .question {

            padding: 20px;

            font-size: 15pt;

            font-family: 'NotoSerifKR';

            line-height: 1.6;

            background-size: auto;

            background-position: left top;

            background-repeat: no-repeat;
        }


        

        .question.correct {

            background-image:
                url(
                    'https://kimgreentea.github.io/kimnokcha/quiz/check-O.png'
                );
        }


        .question.wrong {

            background-image:
                url(
                    'https://kimgreentea.github.io/kimnokcha/quiz/check-X.png'
                );
        }


        

        .moonje {

            font-family: 'Pretendard-Regular';

            font-size: 20pt;

            margin-bottom: 15px;
        }


        

        .number {

            font-family: 'Pretendard-Regular';

            font-size: 20pt;

            margin-bottom: 15px;

            margin-right: 10px;

            color: #0078D6;

            font-weight: bold;

            vertical-align: top;

            width: 40px;
        }


        

        .explanation {

            margin: 10px 0 5px 5px;

            padding: 12px 15px;

            font-family: 'Pretendard-Regular';

            font-size: 17pt;

            color: #666;

            background-color:
                rgba(240, 240, 240, 0.7);

            border-radius: 10px;
        }


        

        .bogi {

            display: block;

            margin-bottom: 10px;

            padding: 20px;

            border-radius: 10px;


        }


        

        .question label {

            display: block;

            margin-bottom: 10px;

            padding: 5px;

            border-radius: 10px;
        }


        

        .question input[type="radio"] {

            margin-right: 10px;

            width: 15px;

            height: 15px;

            accent-color: #0078D6;
        }


        

        .question label.selected {

            background-color:
                rgba(210, 210, 210, 0.8);
        }


        

        input[type="text"] {

            padding: 20px;

            font-size: 20px;

            font-family: 'NotoSerifKR';

            width: 100%;

            max-width:
                calc(100% - 40px);

            border-radius: 15pt;

            background-color:
                rgba(230, 230, 230, 0.7);

            border: none;

            margin-bottom: 15pt;
        }


        

        input[type="file"] {

            font-size: 20px;

            font-family: 'NotoSerifKR';

            border: none;
        }


        input[type="file"]::file-selector-button {

            background-color: #0078D4;

            color: white;

            font-size: 16px;

            padding: 10px 20px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            transition:
                background-color 0.3s ease;

            margin-right: 10px;
        }


        input[type="file"]::file-selector-button:hover {

            background-color: #005a9e;
        }


        

        textarea {

            width: 100%;

            height: 300px;

            font-size: 12px;

            font-family: monospace;
        }


        

        button {

            background-color: #0078D4;

            color: white;

            font-size: 16px;

            padding: 10px 20px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            transition:
                background-color 0.3s ease;

            margin-right: 10px;
        }


        button:hover {

            background-color: #005a9e;
        }


        

        .next-btn {

        }

    @media (max-width: 768px) {
    body {
        zoom: 1.3;
    }
}

</style>

</head>

<body>

<div id="questionsContainer">

<div class="question">

    <span class="number">
        1
    </span>

    <span class="moonje">
        대화를 읽고 어느 기후인지 
    </span>

    
    <div class="explanation">
        너무 덥다<br>어쩜 좋아<br>사람 살려 기후잖아
    </div>
        

    <div class="bogi">


        <label>

            <input
                type="radio"
                name="q1"
                value="1"
            >

            아열대기후

        </label>



        <label>

            <input
                type="radio"
                name="q1"
                value="2"
            >

            열대기후

        </label>



        <label>

            <input
                type="radio"
                name="q1"
                value="3"
            >

            냉대기후

        </label>



    </div>

</div>



<div class="question">

    <span class="number">
        2
    </span>

    <span class="moonje">
        북극! 남극! 무슨 기후!
    </span>

    

    <div class="bogi">


        <input
            type="text"
            name="q2"
            class="subjective-input"
            placeholder="정답을 입력하세요"
        >



    </div>

</div>



<div class="question">

    <span class="number">
        3
    </span>

    <span class="moonje">
        다음 노래를 듣고 떠오르는 기후를
    </span>

    
    <div class="explanation">
        높은산 깊은골<br>적막한 산하<br>우웅..
    </div>
        

    <div class="bogi">


        <label>

            <input
                type="radio"
                name="q3"
                value="1"
            >

            적막한 산하 기후

        </label>



        <label>

            <input
                type="radio"
                name="q3"
                value="2"
            >

            고장기후

        </label>



        <label>

            <input
                type="radio"
                name="q3"
                value="3"
            >

            고산기후

        </label>



    </div>

</div>



<div class="question">

    <span class="number">
        4
    </span>

    <span class="moonje">
        다음 지역이 속하는 기후
    </span>

    
    <div class="explanation">
        러시아<br>부칸<br>캔아다
    </div>
        

    <div class="bogi">


        <input
            type="text"
            name="q4"
            class="subjective-input"
            placeholder="정답을 입력하세요"
        >



    </div>

</div>



<div class="question">

    <span class="number">
        5
    </span>

    <span class="moonje">
        건조기후의 특성
    </span>

    

    <div class="bogi">


        <label>

            <input
                type="radio"
                name="q5"
                value="1"
            >

            아이고 추버라

        </label>



        <label>

            <input
                type="radio"
                name="q5"
                value="2"
            >

            우와 나무가 많다

        </label>



        <label>

            <input
                type="radio"
                name="q5"
                value="3"
            >

            오늘도 비잖아

        </label>



        <label>

            <input
                type="radio"
                name="q5"
                value="4"
            >

            으악 사막이다

        </label>



    </div>

</div>



</div>
<script>


(() => {



const answers =
    {"q1":"2","q2":"한대","q3":"3","q4":"냉대","q5":"4"};





let currentQuestion = 0;





const quiz =
    document.getElementById(
        "questionsContainer"
    );





let questions =
    Array.from(
        document.querySelectorAll(
            '.question'
        )
    );





for (
    let i = questions.length - 1;
    i > 0;
    i--
) {

    const j =
        Math.floor(
            Math.random() * (i + 1)
        );


    [
        questions[i],
        questions[j]
    ] =
    [
        questions[j],
        questions[i]
    ];

}





questions.forEach(
    question => {

        quiz.appendChild(
            question
        );

    }
);





questions.forEach(
    (question, index) => {

        const number =
            question.querySelector(
                '.number'
            );


        if (number) {

            number.textContent =
                index + 1;

        }

    }
);





questions.forEach(
    (question, index) => {

        if (index !== 0) {

            question.style.display =
                "none";

        }

    }
);





function showNextButton(questionDiv) {


    

    if (
        questionDiv.querySelector(
            '.next-btn'
        )
    ) {

        return;

    }



    

    const btn =
        document.createElement(
            "button"
        );


    btn.textContent =
        "다음 문제";


    btn.className =
        "next-btn";



    

    btn.onclick =
        function() {


            

            questions[
                currentQuestion
            ].style.display =
                "none";



            

            currentQuestion++;



            

            if (
                questions[
                    currentQuestion
                ]
            ) {


                questions[
                    currentQuestion
                ].style.display =
                    "block";


            }

            else {


                

                quiz.innerHTML +=
                    "<h2>모든 문제를 풀었습니다!</h2>";

            }



            

            btn.remove();

        };


    

    questionDiv.appendChild(
        btn
    );

}





function removeNextButton(
    questionDiv
) {

    const btn =
        questionDiv.querySelector(
            '.next-btn'
        );


    if (btn) {

        btn.remove();

    }

}





document
.querySelectorAll(
    '.question input[type="radio"]'
)
.forEach(
    input => {


        input.addEventListener(
            'change',
            function() {


                

                const questionDiv =
                    this.closest(
                        '.question'
                    );



                

                const questionName =
                    this.name;



                

                const selectedValue =
                    this.value;



                

                const correctAnswer =
                    answers[
                        questionName
                    ];



                

                questionDiv.classList.remove(
                    'correct',
                    'wrong'
                );



                

                questionDiv
                .querySelectorAll(
                    'label'
                )
                .forEach(
                    label => {

                        label.classList.remove(
                            'selected'
                        );

                    }
                );



                

                this.parentElement
                    .classList.add(
                        'selected'
                    );



                

                if (
                    selectedValue ===
                    correctAnswer
                ) {


                    

                    questionDiv.classList.add(
                        'correct'
                    );


                    

                    showNextButton(
                        questionDiv
                    );


                }

                else {


                    

                    questionDiv.classList.add(
                        'wrong'
                    );


                    

                    removeNextButton(
                        questionDiv
                    );

                }

            }
        );

    }
);





document
.querySelectorAll(
    '.subjective-input'
)
.forEach(
    input => {


        input.addEventListener(
            'input',
            function() {


                

                const questionDiv =
                    this.closest(
                        '.question'
                    );



                

                const questionName =
                    this.name;



                

                const userAnswer =
                    this.value.trim();



                

                const correctAnswer =
                    answers[
                        questionName
                    ];



                

                questionDiv.classList.remove(
                    'correct',
                    'wrong'
                );



                

                if (
                    userAnswer ===
                    correctAnswer
                ) {


                    questionDiv.classList.add(
                        'correct'
                    );


                    

                    showNextButton(
                        questionDiv
                    );

                }


                

                else {

                    removeNextButton(
                        questionDiv
                    );

                }

            }
        );

    }
);

})();


</script>

</body>

</html>
