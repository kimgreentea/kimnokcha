
<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>퀴즈 메이커</title>


<style>

/* =========================================================
   한글 폰트
========================================================= */

@font-face {

    font-family: 'NotoSerifKR';

    src: url(
        'https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NotoSerifKR.woff'
    ) format('woff');

    font-weight: normal;
    font-style: normal;

}


@font-face {

    font-family: 'Pretendard-Regular';

    src: url(
        'https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff'
    ) format('woff');

    font-weight: 400;
    font-style: normal;

}


/* =========================================================
   전체 페이지
========================================================= */

body {

    width: 1200px;

    max-width: 100%;

    margin: 0 auto;

    margin-top: 60px;

    padding: 0 20px;

    box-sizing: border-box;

}


/* =========================================================
   문제
========================================================= */

.question {

    padding: 20px;

    font-size: 15pt;

    font-family: 'NotoSerifKR';

    line-height: 1.6;

    background-size: auto;

    background-position: left top;

    background-repeat: no-repeat;

}


.question.correct {

    background-image:
        url(
            'https://kimgreentea.github.io/kimnokcha/quiz/check-O.png'
        );

}


.question.wrong {

    background-image:
        url(
            'https://kimgreentea.github.io/kimnokcha/quiz/check-X.png'
        );

}


/* =========================================================
   문제 문장
========================================================= */

.moonje {

    font-family: 'Pretendard-Regular';

    font-size: 20pt;

    margin-bottom: 15px;

}


/* =========================================================
   문제 번호
========================================================= */

.number {

    font-family: 'Pretendard-Regular';

    font-size: 20pt;

    margin-bottom: 15px;

    margin-right: 10px;

    color: #0078D6;

    font-weight: bold;

    vertical-align: top;

    width: 40px;

}


/* =========================================================
   설명
========================================================= */

.explanation {

    margin: 10px 0 5px 5px;

    padding: 12px 15px;

    font-family: 'Pretendard-Regular';

    font-size: 17pt;

    color: #666;

    background-color:
        rgba(240, 240, 240, 0.7);

    border-radius: 10px;

}


/* =========================================================
   보기
========================================================= */

.bogi {

    display: block;

    margin-bottom: 10px;

    padding: 20px;

    border-radius: 10px;

}


.question label {

    display: block;

    margin-bottom: 10px;

    padding: 5px;

    border-radius: 10px;

}


.question input[type="radio"] {

    margin-right: 10px;

    width: 15px;

    height: 15px;

    accent-color: #0078D6;

}


.question label.selected {

    background-color:
        rgba(210, 210, 210, 0.8);

}


/* =========================================================
   주관식 입력창
========================================================= */

input[type="text"] {

    padding: 20px;

    font-size: 20px;

    font-family: 'NotoSerifKR';

    width: 100%;

    max-width:
        calc(100% - 40px);

    border-radius: 15pt;

    background-color:
        rgba(230, 230, 230, 0.7);

    border: none;

    margin-bottom: 15pt;

}


/* =========================================================
   파일 업로드
========================================================= */

input[type="file"] {

    font-size: 20px;

    font-family: 'NotoSerifKR';

    border: none;

}


input[type="file"]::file-selector-button {

    background-color: #0078D4;

    color: white;

    font-size: 16px;

    padding: 10px 20px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    transition:
        background-color 0.3s ease;

    margin-right: 10px;

}


input[type="file"]::file-selector-button:hover {

    background-color: #005a9e;

}


/* =========================================================
   랜덤화 옵션
========================================================= */

.random-option {

    display: block;

    margin: 15px 0;

    font-family: 'Pretendard-Regular';

    font-size: 18px;

    cursor: pointer;

}


.random-option input {

    width: 18px;

    height: 18px;

    margin-right: 8px;

    vertical-align: middle;

    cursor: pointer;

}


/* =========================================================
   생성된 코드
========================================================= */

textarea {

    width: 100%;

    height: 300px;

    font-size: 12px;

    font-family: monospace;

}


/* =========================================================
   버튼
========================================================= */

button {

    background-color: #0078D4;

    color: white;

    font-size: 16px;

    padding: 10px 20px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    transition:
        background-color 0.3s ease;

    margin-right: 10px;

}


button:hover {

    background-color: #005a9e;

}


/* =========================================================
   모바일
========================================================= */

@media (max-width: 768px) {

    body {

        width: 100%;

        max-width: 100%;

        margin-top: 30px;

        padding: 0 12px;

    }


    .question {

        padding: 10px;

        font-size: 15pt;

        line-height: 1.6;

    }


    .moonje {

        font-size: clamp(20px, 5vw, 30px);

        margin-bottom: 12px;

    }


    .number {

        font-size: clamp(20px, 5vw, 30px);

        width: auto;

        margin-right: 8px;

        margin-bottom: 10px;

    }


    .explanation {

        margin: 8px 0 5px 0;

        padding: 10px 12px;

        font-size: clamp(16px, 4vw, 24px);

        line-height: 1.5;

    }


    .bogi {

        padding: 10px;

        margin-bottom: 8px;

    }


    .question label {

        padding: 10px 5px;

        margin-bottom: 8px;

        font-size: clamp(17px, 4.5vw, 25px);

        line-height: 1.5;

    }


    .question input[type="radio"] {

        width: 20px;

        height: 20px;

        margin-right: 8px;

        vertical-align: middle;

    }


    input[type="text"] {

        width: 100%;

        max-width: 100%;

        padding: 15px;

        font-size: clamp(18px, 5vw, 28px);

        box-sizing: border-box;

    }


    input[type="file"] {

        width: 100%;

        font-size: clamp(16px, 4vw, 22px);

    }


    input[type="file"]::file-selector-button {

        font-size: clamp(16px, 4vw, 22px);

        padding: 10px 15px;

    }


    textarea {

        width: 100%;

        height: 250px;

        font-size: 11px;

        box-sizing: border-box;

    }


    button {

        font-size: clamp(16px, 4vw, 22px);

        padding: 10px 16px;

        margin-bottom: 8px;

    }


    .random-option {

        font-size: clamp(16px, 4vw, 22px);

    }

}

</style>

</head>


<body>


<!-- =========================================================
     양식 다운로드
========================================================= -->

<h2>💾 양식 파일 다운로드</h2>


<button
    onclick="
        window.location.href =
        'https://kimgreentea.github.io/kimnokcha/quiz/template2026.xlsx';
    "
>
    다운로드
</button>




<!-- =========================================================
     엑셀 업로드
========================================================= -->

<h2>📂 엑셀 파일 업로드</h2>

<!-- =========================================================
     랜덤화 옵션

     기본값:
     체크 = 랜덤화

     체크 해제 = 원래 순서
========================================================= -->

<label class="random-option">

    <input
        type="checkbox"
        id="randomCheckbox"
        checked
    >

    문제 순서 랜덤화

</label>



<input
    type="file"
    id="fileInput"
    accept=".xlsx,.xls"
>






<!-- =========================================================
     생성된 HTML
========================================================= -->

<h2>📝 생성된 HTML 코드</h2>


<textarea
    id="codeContainer"
    readonly
></textarea>


<br><br>


<button id="copyButton">
    📋 복사하기
</button>


<button
    id="saveButton"
    onclick="saveAsHtml()"
>
    💾 HTML로 저장
</button>



<!-- =========================================================
     미리보기
========================================================= -->

<h2>👀 미리보기</h2>


<div id="questionsContainer"></div>



<!-- =========================================================
     SheetJS
========================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
</script>



<script>


/* =========================================================
   엑셀 파일 업로드
========================================================= */

document
.getElementById('fileInput')
.addEventListener(
    'change',
    function(event) {


        /*
           선택한 파일
        */

        const file =
            event.target.files[0];


        /*
           파일을 선택하지 않았다면 종료
        */

        if (!file) {

            return;

        }


        /*
           여기서 input.value를 초기화하지 않는다.

           기존 코드의

           event.target.value = '';

           를 제거했음.

           따라서 업로드 후에도
           선택된 파일명이 그대로 표시된다.
        */



        /*
           FileReader 생성
        */

        const reader =
            new FileReader();



        /*
           파일 읽기 완료
        */

        reader.onload =
            function(e) {


                /*
                   ArrayBuffer → Uint8Array
                */

                const data =
                    new Uint8Array(
                        e.target.result
                    );



                /*
                   엑셀 파일 읽기
                */

                let workbook;

                try {

                    workbook =
                        XLSX.read(
                            data,
                            {
                                type: 'array'
                            }
                        );

                }

                catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        '엑셀 파일을 읽을 수 없습니다.'
                    );

                    return;

                }



                /*
                   첫 번째 시트
                */

                const sheet =
                    workbook.Sheets[
                        workbook.SheetNames[0]
                    ];



                /*
                   엑셀 → 배열
                */

                const jsonData =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {
                            header: 1
                        }
                    );



                /*
                   문제 생성
                */

                generateQuestions(
                    jsonData
                );

            };



        /*
           파일 읽기 오류
        */

        reader.onerror =
            function() {

                alert(
                    '파일을 읽는 중 오류가 발생했습니다.'
                );

            };



        /*
           파일 읽기 시작
        */

        reader.readAsArrayBuffer(
            file
        );

    }
);



/* =========================================================
   문제 생성
========================================================= */

function generateQuestions(data) {


    /*
       랜덤화 체크박스 상태

       체크
       → true
       → 랜덤화

       체크 해제
       → false
       → 원래 순서
    */

    const randomize =
        document
        .getElementById(
            'randomCheckbox'
        )
        .checked;



    /*
       미리보기 영역
    */

    const container =
        document.getElementById(
            'questionsContainer'
        );



    /*
       생성된 코드 영역
    */

    const codeContainer =
        document.getElementById(
            'codeContainer'
        );



    /*
       기존 미리보기 제거
    */

    container.innerHTML = '';



    /*
       정답 저장
    */

    const answers = {};



    /*
       다운로드 HTML 시작
    */

    let htmlCode =
        `<div id="questionsContainer">`;



    /* =====================================================
       엑셀 각 행 처리
    ===================================================== */

    for (
        let i = 1;
        i < data.length;
        i++
    ) {


        const row =
            data[i];


        /*
           빈 행 무시
        */

        if (
            !row ||
            row.length < 2
        ) {

            continue;

        }



        /*
           A열
           문제
        */

        const questionText =
            row[0] ?? '';



        /*
           B열
           설명
        */

        const explanation =
            (row[1] ?? '')
            .toString()
            .replace(
                /\r?\n/g,
                '<br>'
            );



        /*
           C~G열
           보기
        */

        const options =
            row
            .slice(2, 7)
            .filter(
                opt =>
                    opt !== undefined &&
                    opt !== null &&
                    opt !== ''
            );



        /*
           H열
           정답
        */

        const answer =
            row[7]
            ?.toString()
            .trim() ?? '';



        /*
           문제 이름
        */

        const questionName =
            `q${i}`;



        /*
           정답 저장
        */

        answers[
            questionName
        ] =
            answer;



        /* =================================================
           미리보기 문제 생성
        ================================================= */

        const questionDiv =
            document.createElement(
                'div'
            );


        questionDiv.className =
            'question';



        /*
           문제 내용
        */

        questionDiv.innerHTML = `

            <span class="number">
                ${i}
            </span>

            <span class="moonje">
                ${questionText}
            </span>

            ${
                explanation
                ?
                `
                <div class="explanation">
                    ${explanation}
                </div>
                `
                :
                ''
            }

        `;



        /*
           보기 영역
        */

        const bogiDiv =
            document.createElement(
                'div'
            );


        bogiDiv.className =
            'bogi';



        /* =================================================
           객관식
        ================================================= */

        if (
            options.length > 0
        ) {


            options.forEach(
                (option, index) => {


                    const label =
                        document.createElement(
                            'label'
                        );


                    label.innerHTML = `

                        <input
                            type="radio"
                            name="${questionName}"
                            value="${index + 1}"
                        >

                        ${option}

                    `;


                    bogiDiv.appendChild(
                        label
                    );

                }
            );


        }


        /* =================================================
           주관식
        ================================================= */

        else {


            const input =
                document.createElement(
                    'input'
                );


            input.type =
                'text';


            input.name =
                questionName;


            input.classList.add(
                'subjective-input'
            );


            input.placeholder =
                '정답을 입력하세요';


            bogiDiv.appendChild(
                input
            );

        }



        /*
           보기 추가
        */

        questionDiv.appendChild(
            bogiDiv
        );



        /*
           미리보기 추가
        */

        container.appendChild(
            questionDiv
        );



        /* =================================================
           다운로드용 HTML
        ================================================= */

        let questionHTML = `

<div class="question">

    <span class="number">
        ${i}
    </span>

    <span class="moonje">
        ${questionText}
    </span>

    ${
        explanation
        ?
        `
    <div class="explanation">
        ${explanation}
    </div>
        `
        :
        ''
    }

    <div class="bogi">
`;



        /*
           객관식
        */

        if (
            options.length > 0
        ) {


            options.forEach(
                (option, index) => {

                    questionHTML += `

        <label>

            <input
                type="radio"
                name="${questionName}"
                value="${index + 1}"
            >

            ${option}

        </label>

`;

                }
            );


        }


        /*
           주관식
        */

        else {


            questionHTML += `

        <input
            type="text"
            name="${questionName}"
            class="subjective-input"
            placeholder="정답을 입력하세요"
        >

`;

        }



        questionHTML += `

    </div>

</div>

`;


        /*
           전체 HTML에 추가
        */

        htmlCode +=
            questionHTML;

    }



    /*
       문제 영역 종료
    */

    htmlCode += `

</div>

`;



    /* =========================================================
       정답 JSON
    ========================================================= */

    const answersJSON =
        JSON.stringify(
            answers
        );



    /* =========================================================
       생성되는 퀴즈에 전달할
       랜덤화 설정

       체크
       → true

       해제
       → false
    ========================================================= */

    const randomizeSetting =
        randomize
        ? 'true'
        : 'false';



    /* =========================================================
       생성된 HTML에서 실행할 JavaScript
    ========================================================= */

    const quizScript = `

(() => {


/* =========================================================
   정답
========================================================= */

const answers =
    ${answersJSON};



/* =========================================================
   현재 문제
========================================================= */

let currentQuestion = 0;



/* =========================================================
   문제 컨테이너
========================================================= */

const quiz =
    document.getElementById(
        "questionsContainer"
    );



/* =========================================================
   문제 가져오기
========================================================= */

let questions =
    Array.from(
        document.querySelectorAll(
            '.question'
        )
    );



/* =========================================================
   랜덤화 여부

   true
   → 랜덤

   false
   → 원래 순서
========================================================= */

const randomize =
    ${randomizeSetting};



/* =========================================================
   랜덤화

   체크되어 있을 때만 실행
========================================================= */

if (randomize) {


    /*
       Fisher-Yates
    */

    for (
        let i = questions.length - 1;
        i > 0;
        i--
    ) {


        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            questions[i],
            questions[j]
        ] =
        [
            questions[j],
            questions[i]
        ];

    }



    /*
       랜덤으로 섞은 순서를
       DOM에 반영
    */

    questions.forEach(
        question => {

            quiz.appendChild(
                question
            );

        }
    );



    /*
       랜덤화된 순서에 맞춰
       문제 번호를 다시 1부터 표시
    */

    questions.forEach(
        (question, index) => {


            const number =
                question.querySelector(
                    '.number'
                );


            if (number) {

                number.textContent =
                    index + 1;

            }

        }
    );

}



/* =========================================================
   처음에는 첫 문제만 표시
========================================================= */

questions.forEach(
    (question, index) => {

        if (index !== 0) {

            question.style.display =
                "none";

        }

    }
);



/* =========================================================
   다음 문제 버튼
========================================================= */

function showNextButton(
    questionDiv
) {


    /*
       이미 있으면 생성하지 않음
    */

    if (
        questionDiv.querySelector(
            '.next-btn'
        )
    ) {

        return;

    }



    const btn =
        document.createElement(
            "button"
        );


    btn.textContent =
        "다음 문제";


    btn.className =
        "next-btn";



    btn.onclick =
        function() {


            /*
               현재 문제 숨기기
            */

            questions[
                currentQuestion
            ].style.display =
                "none";



            /*
               다음 문제
            */

            currentQuestion++;



            /*
               다음 문제가 있으면 표시
            */

            if (
                questions[
                    currentQuestion
                ]
            ) {


                questions[
                    currentQuestion
                ].style.display =
                    "block";


            }


            else {


                /*
                   모든 문제 완료
                */

                quiz.innerHTML +=
                    "<h2>모든 문제를 풀었습니다!</h2>";

            }



            /*
               버튼 삭제
            */

            btn.remove();

        };



    questionDiv.appendChild(
        btn
    );

}



/* =========================================================
   다음 문제 버튼 제거
========================================================= */

function removeNextButton(
    questionDiv
) {


    const btn =
        questionDiv.querySelector(
            '.next-btn'
        );


    if (btn) {

        btn.remove();

    }

}



/* =========================================================
   객관식 채점
========================================================= */

document
.querySelectorAll(
    '.question input[type="radio"]'
)
.forEach(
    input => {


        input.addEventListener(
            'change',
            function() {


                /*
                   현재 문제
                */

                const questionDiv =
                    this.closest(
                        '.question'
                    );



                /*
                   문제 이름
                */

                const questionName =
                    this.name;



                /*
                   선택한 값
                */

                const selectedValue =
                    this.value;



                /*
                   정답
                */

                const correctAnswer =
                    answers[
                        questionName
                    ];



                /*
                   기존 상태 제거
                */

                questionDiv.classList.remove(
                    'correct',
                    'wrong'
                );



                /*
                   기존 선택 표시 제거
                */

                questionDiv
                .querySelectorAll(
                    'label'
                )
                .forEach(
                    label => {

                        label.classList.remove(
                            'selected'
                        );

                    }
                );



                /*
                   현재 선택 표시
                */

                this.parentElement
                    .classList.add(
                        'selected'
                    );



                /*
                   정답
                */

                if (
                    selectedValue ===
                    correctAnswer
                ) {


                    questionDiv.classList.add(
                        'correct'
                    );


                    showNextButton(
                        questionDiv
                    );


                }


                /*
                   오답
                */

                else {


                    questionDiv.classList.add(
                        'wrong'
                    );


                    removeNextButton(
                        questionDiv
                    );

                }

            }
        );

    }
);



/* =========================================================
   주관식 채점
========================================================= */

document
.querySelectorAll(
    '.subjective-input'
)
.forEach(
    input => {


        input.addEventListener(
            'input',
            function() {


                /*
                   현재 문제
                */

                const questionDiv =
                    this.closest(
                        '.question'
                    );



                /*
                   문제 이름
                */

                const questionName =
                    this.name;



                /*
                   입력값
                */

                const userAnswer =
                    this.value.trim();



                /*
                   정답
                */

                const correctAnswer =
                    answers[
                        questionName
                    ];



                /*
                   기존 상태 제거
                */

                questionDiv.classList.remove(
                    'correct',
                    'wrong'
                );



                /*
                   정답이면
                */

                if (
                    userAnswer ===
                    correctAnswer
                ) {


                    questionDiv.classList.add(
                        'correct'
                    );


                    showNextButton(
                        questionDiv
                    );


                }


                /*
                   아직 오답이면
                */

                else {

                    removeNextButton(
                        questionDiv
                    );

                }

            }
        );

    }
);


})();

`;



    /* =========================================================
       미리보기 실행
    ========================================================= */

    const previewScript =
        document.createElement(
            'script'
        );


    previewScript.textContent =
        quizScript;


    document.body.appendChild(
        previewScript
    );



    /* =========================================================
       저장용 JavaScript
       주석 제거
    ========================================================= */

    const cleanJS =
        quizScript
        .replace(
            /\/\*[\s\S]*?\*\//g,
            ''
        );



    /*
       저장용 HTML에 JavaScript 추가
    */

    htmlCode += `<script>

${cleanJS}

<\/script>`;



    /* =========================================================
       CSS
    ========================================================= */

    const cleanCSS =
        document
        .querySelector('style')
        .innerHTML
        .replace(
            /\/\*[\s\S]*?\*\//g,
            ''
        );



    /* =========================================================
       HTML 주석 제거
    ========================================================= */

    const cleanHTML =
        htmlCode.replace(
            /<!--[\s\S]*?-->/g,
            ''
        );



    /* =========================================================
       최종 HTML
    ========================================================= */

    codeContainer.value =

`<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>문제</title>

<style>

${cleanCSS}

</style>

</head>

<body>

${cleanHTML}

</body>

</html>`;

}



/* =========================================================
   복사
========================================================= */

document
.getElementById(
    'copyButton'
)
.addEventListener(
    'click',
    function() {


        const textarea =
            document.getElementById(
                'codeContainer'
            );


        textarea.select();


        document.execCommand(
            'copy'
        );


        alert(
            '코드가 복사되었습니다!'
        );

    }
);



/* =========================================================
   HTML 저장
========================================================= */

function saveAsHtml() {


    const html =
        document
        .getElementById(
            'codeContainer'
        )
        .value;



    const blob =
        new Blob(
            [html],
            {
                type: 'text/html'
            }
        );



    const a =
        document.createElement(
            'a'
        );


    a.href =
        URL.createObjectURL(
            blob
        );


    a.download =
        'quiz.html';


    a.click();


    URL.revokeObjectURL(
        a.href
    );

}


</script>
