<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/kimnokcha/math/style.css"><title>소수의 나눗셈 연습</title></head><body><div class="container"><h1>소수의 나눗셈 연습</h1><div class="question-box"><span id="number"></span><span id="question"></span></div><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="정답" ></div> <script>let correctNumerator,correctDenominator,number=document.getElementById("number"),question=document.getElementById("question"),input_answer=document.getElementById("answer"),count=1;function randomInt(e,n){return Math.floor(Math.random()*(n-e+1))+e}function gcd(e,n){for(;0!==n;){let t=e%n;e=n,n=t}return Math.abs(e)}function setAnswer(e,n){let t=gcd(e,n);correctNumerator=e/t,correctDenominator=n/t}function decimal(e,n){return(e/Math.pow(10,n)).toFixed(n).replace(/\.?0+$/,"")}function makeType1(){let e,n,t;do{e=randomInt(1,99),e%10!=0&&(n=randomInt(3,9),t=e*n)}while(t>99||10===e);question.innerText=decimal(t,1)+" ÷ "+decimal(e,1)+" = ",setAnswer(n,1)}function makeType2(){let e,n,t;do{e=randomInt(1,999),e%100!=0&&(n=randomInt(3,9),t=e*n)}while(t>999||100===e);question.innerText=decimal(t,2)+" ÷ "+decimal(e,2)+" = ",setAnswer(n,1)}function makeType3(){let e,n,t;do{e=randomInt(1,99),e%10!=0&&(n=randomInt(21,99),t=e*n)}while(t<100||t>999||10===e);question.innerText=decimal(t,2)+" ÷ "+decimal(e,1)+" = ",setAnswer(n,10)}function makeType4(){let e,n,t;do{e=randomInt(1,999),e%100!=0&&(n=randomInt(21,99),t=e*n/1e3)}while(!Number.isInteger(t)||t<2||t>99||100===e);question.innerText=t+" ÷ "+decimal(e,2)+" = ",setAnswer(n,10)}function makeQuestion(){let e=randomInt(1,4);1===e?makeType1():2===e?makeType2():3===e?makeType3():makeType4(),number.innerText=count+"."}function parseAnswer(e){if(""===(e=e.trim()))return null;if(!/^\d+(\.\d+)?$/.test(e))return null;let n=e.split("."),t=n[0],r=n[1]||"",o=Math.pow(10,r.length);return{numerator:Number(t)*o+Number(r||0),denominator:o}}input_answer.addEventListener("input",function(){let e=parseAnswer(input_answer.value);null!==e&&e.numerator*correctDenominator===correctNumerator*e.denominator&&(input_answer.value="",count+=1,makeQuestion())}),makeQuestion(),input_answer.focus();</script> </body></html>
