  
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>소수의 나눗셈 연습</title>

    <style>



        * {
            box-sizing: border-box;
        } 
  
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f3f6fa;


            color: #222;
        }

        .container {
            width: min(700px, 92vw);

            padding: 55px 50px 60px;

            background: white;

            border-radius: 28px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            margin: 0 0 40px;

            font-size: 34px;
            font-weight: 600;

            color: #333;
        }

        .question-box {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 35px;

            white-space: nowrap;
        }

        #number {
            font-size: 48px;

            color: #0078D6;

            margin-right: 5px;

            min-width: 55px;

            text-align: right;
        }

        #question {
            font-size: 48px;

            font-weight: 500;

            letter-spacing: 1px;
        }

        #answer {
            width: 230px;
            height: 85px;

            border: 3px solid #d9e1ea;

            border-radius: 16px;

            background: #f8fafc;

            font-family: inherit;

            font-size: 45px;

            text-align: center;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s,
                background 0.15s;
        }

        #answer::placeholder {
            color: #b5bdc8;

            font-size: 45px;
        }

        #answer:focus {
            border-color: #0078D6;

            background: white;

            box-shadow:
                0 0 0 5px rgba(0, 120, 214, 0.1);
        }

        .hint {
            margin-top: 25px;

            font-size: 17px;

            color: #9aa3ad;
        }

        @media (max-width: 600px) {

            .container {
                width: 94vw;

                padding: 40px 20px 45px;

                border-radius: 22px;
            }

            h1 {
                margin-bottom: 30px;

                font-size: 28px;
            }

            .question-box {
                gap: 5px;

                margin-bottom: 28px;
            }

            #number {
                font-size: 48px;

                min-width: 40px;
            }

            #question {
                font-size: 35px;

                letter-spacing: 0;
            }

            #answer {
                width: 190px;

                height: 72px;

                font-size: 38px;
            }

            #answer::placeholder {
                font-size: 45px;
            }

            .hint {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>소수의 나눗셈 연습</h1>

        <div class="question-box">

            <span id="number"></span>

            <span id="question"></span>

        </div>

        <input
            id="answer"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="정답"
        >



    </div>


<script>

let number = document.getElementById("number");
let question = document.getElementById("question");
let input_answer = document.getElementById("answer");

let correctNumerator;
let correctDenominator;

let count = 1;


function randomInt(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}

function gcd(a, b) {

    while (b !== 0) {

        let temp = a % b;

        a = b;
        b = temp;

    }

    return Math.abs(a);

}


function setAnswer(numerator, denominator) {

    let g = gcd(
        numerator,
        denominator
    );

    correctNumerator =
        numerator / g;

    correctDenominator =
        denominator / g;

}



function decimal(value, digits) {

    let divisor =
        Math.pow(10, digits);

    let result =
        value / divisor;

    return result
        .toFixed(digits)
        .replace(/\.?0+$/, "");

}




function makeType1() {

    let divisor;
    let answer;
    let dividend;

    do {

   
        divisor =
            randomInt(1, 99);

    
        if (divisor % 10 === 0) {
            continue;
        }


        answer =
            randomInt(3, 9);

        dividend =
            divisor * answer;

    } while (


        dividend > 99

        ||


        divisor === 10

    );


    question.innerText =
        decimal(dividend, 1)
        + " ÷ "
        + decimal(divisor, 1)
        + " = ";


    setAnswer(
        answer,
        1
    );

}

function makeType2() {

    let divisor;
    let answer;
    let dividend;

    do {

       
        divisor =
            randomInt(1, 999);

        if (divisor % 100 === 0) {
            continue;
        }

        answer =
            randomInt(3, 9);

        dividend =
            divisor * answer;

    } while (

        dividend > 999

        ||

        divisor === 100

    );


    question.innerText =
        decimal(dividend, 2)
        + " ÷ "
        + decimal(divisor, 2)
        + " = ";


    setAnswer(
        answer,
        1
    );

}


function makeType3() {

    let divisor;
    let answer10;
    let dividend;

    do {

        // 0.1 ~ 9.9
        divisor =
            randomInt(1, 99);

  
        if (divisor % 10 === 0) {
            continue;
        }


        answer10 =
            randomInt(21, 99);



        dividend =
            divisor * answer10;

    } while (

        dividend < 100

        ||

        dividend > 999

        ||


        divisor === 10

    );


    question.innerText =
        decimal(dividend, 2)
        + " ÷ "
        + decimal(divisor, 1)
        + " = ";


    setAnswer(
        answer10,
        10
    );

}



function makeType4() {

    let divisor;
    let answer10;
    let dividend;

    do {


        divisor =
            randomInt(1, 999);




        if (divisor % 100 === 0) {
            continue;
        }


        answer10 =
            randomInt(21, 99);



        dividend =
            divisor * answer10 / 1000;


    } while (


        !Number.isInteger(dividend)

        ||

        dividend < 2

        ||

        dividend > 99

        ||

        divisor === 100

    );


    question.innerText =
        dividend
        + " ÷ "
        + decimal(divisor, 2)
        + " = ";


    setAnswer(
        answer10,
        10
    );

}


function makeQuestion() {

    let type =
        randomInt(1, 4);


    if (type === 1) {

        makeType1();

    }

    else if (type === 2) {

        makeType2();

    }

    else if (type === 3) {

        makeType3();

    }

    else {

        makeType4();

    }


    number.innerText =
        count + ".";

}


function parseAnswer(value) {

    value =
        value.trim();


    if (value === "") {
        return null;
    }


    if (!/^\d+(\.\d+)?$/.test(value)) {
        return null;
    }


    let parts =
        value.split(".");


    let integerPart =
        parts[0];

    let decimalPart =
        parts[1] || "";


    let denominator =
        Math.pow(
            10,
            decimalPart.length
        );


    let numerator =
        Number(integerPart) * denominator
        +
        Number(decimalPart || 0);


    return {
        numerator: numerator,
        denominator: denominator
    };

}

input_answer.addEventListener(
    "input",
    function() {

        let userAnswer =
            parseAnswer(
                input_answer.value
            );


        if (userAnswer === null) {
            return;
        }



        let left =
            userAnswer.numerator
            *
            correctDenominator;


        let right =
            correctNumerator
            *
            userAnswer.denominator;


        if (left === right) {

            input_answer.value = "";

            count += 1;

            makeQuestion();

        }

    }
);



makeQuestion();

input_answer.focus();

</script>

</body>
</html>
