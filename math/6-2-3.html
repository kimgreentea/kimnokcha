  
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/kimnokcha/math/style.css">
    <title>소수의 나눗셈 연습</title>

</head>


<body>

    <div class="container">

        <h1>소수의 나눗셈 연습</h1>

        <div class="question-box">

            <span id="number"></span>

            <span id="question"></span>

        </div>

        <input
            id="answer"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="정답"
        >



    </div>


<script>

let number = document.getElementById("number");
let question = document.getElementById("question");
let input_answer = document.getElementById("answer");

let correctNumerator;
let correctDenominator;

let count = 1;


function randomInt(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}

function gcd(a, b) {

    while (b !== 0) {

        let temp = a % b;

        a = b;
        b = temp;

    }

    return Math.abs(a);

}


function setAnswer(numerator, denominator) {

    let g = gcd(
        numerator,
        denominator
    );

    correctNumerator =
        numerator / g;

    correctDenominator =
        denominator / g;

}



function decimal(value, digits) {

    let divisor =
        Math.pow(10, digits);

    let result =
        value / divisor;

    return result
        .toFixed(digits)
        .replace(/\.?0+$/, "");

}




function makeType1() {

    let divisor;
    let answer;
    let dividend;

    do {

   
        divisor =
            randomInt(1, 99);

    
        if (divisor % 10 === 0) {
            continue;
        }


        answer =
            randomInt(3, 9);

        dividend =
            divisor * answer;

    } while (


        dividend > 99

        ||


        divisor === 10

    );


    question.innerText =
        decimal(dividend, 1)
        + " ÷ "
        + decimal(divisor, 1)
        + " = ";


    setAnswer(
        answer,
        1
    );

}

function makeType2() {

    let divisor;
    let answer;
    let dividend;

    do {

       
        divisor =
            randomInt(1, 999);

        if (divisor % 100 === 0) {
            continue;
        }

        answer =
            randomInt(3, 9);

        dividend =
            divisor * answer;

    } while (

        dividend > 999

        ||

        divisor === 100

    );


    question.innerText =
        decimal(dividend, 2)
        + " ÷ "
        + decimal(divisor, 2)
        + " = ";


    setAnswer(
        answer,
        1
    );

}


function makeType3() {

    let divisor;
    let answer10;
    let dividend;

    do {

        // 0.1 ~ 9.9
        divisor =
            randomInt(1, 99);

  
        if (divisor % 10 === 0) {
            continue;
        }


        answer10 =
            randomInt(21, 99);



        dividend =
            divisor * answer10;

    } while (

        dividend < 100

        ||

        dividend > 999

        ||


        divisor === 10

    );


    question.innerText =
        decimal(dividend, 2)
        + " ÷ "
        + decimal(divisor, 1)
        + " = ";


    setAnswer(
        answer10,
        10
    );

}



function makeType4() {

    let divisor;
    let answer10;
    let dividend;

    do {


        divisor =
            randomInt(1, 999);




        if (divisor % 100 === 0) {
            continue;
        }


        answer10 =
            randomInt(21, 99);



        dividend =
            divisor * answer10 / 1000;


    } while (


        !Number.isInteger(dividend)

        ||

        dividend < 2

        ||

        dividend > 99

        ||

        divisor === 100

    );


    question.innerText =
        dividend
        + " ÷ "
        + decimal(divisor, 2)
        + " = ";


    setAnswer(
        answer10,
        10
    );

}


function makeQuestion() {

    let type =
        randomInt(1, 4);


    if (type === 1) {

        makeType1();

    }

    else if (type === 2) {

        makeType2();

    }

    else if (type === 3) {

        makeType3();

    }

    else {

        makeType4();

    }


    number.innerText =
        count + ".";

}


function parseAnswer(value) {

    value =
        value.trim();


    if (value === "") {
        return null;
    }


    if (!/^\d+(\.\d+)?$/.test(value)) {
        return null;
    }


    let parts =
        value.split(".");


    let integerPart =
        parts[0];

    let decimalPart =
        parts[1] || "";


    let denominator =
        Math.pow(
            10,
            decimalPart.length
        );


    let numerator =
        Number(integerPart) * denominator
        +
        Number(decimalPart || 0);


    return {
        numerator: numerator,
        denominator: denominator
    };

}

input_answer.addEventListener(
    "input",
    function() {

        let userAnswer =
            parseAnswer(
                input_answer.value
            );


        if (userAnswer === null) {
            return;
        }



        let left =
            userAnswer.numerator
            *
            correctDenominator;


        let right =
            correctNumerator
            *
            userAnswer.denominator;


        if (left === right) {

            input_answer.value = "";

            count += 1;

            makeQuestion();

        }

    }
);



makeQuestion();

input_answer.focus();

</script>

</body>
</html>
