
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/kimnokcha/math/style.css">
    <title>구구단 연습</title>


</head>


<body>

    <div class="container">

        <h1>구구단 연습</h1>

        <div class="question-box">
            <span id="number"></span>
            <span id="question"></span>
        </div>

        <input
            id="answer"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="정답"
        >



    </div>


<script>

let number = document.getElementById("number");
let question = document.getElementById("question");
let input_answer = document.getElementById("answer");

let num1;
let num2;
let count = 1;


function makeQuestion() {

    num1 = Math.floor(Math.random() * 8) + 2;
    num2 = Math.floor(Math.random() * 9) + 1;

    number.innerText = count + ".";
    question.innerText = num1 + " × " + num2 + " = ";

}


input_answer.addEventListener("input", function() {

    if (Number(input_answer.value) == num1 * num2) {

        input_answer.value = "";

        count += 1;

        makeQuestion();

    }

});


makeQuestion();


input_answer.focus();

</script>

</body>
</html>
