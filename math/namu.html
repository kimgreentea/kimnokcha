<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>쌓기나무</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f3f5f7;
            color: #222
        }

        header {
            background: #222;
            color: #fff;
            padding: 14px 18px;
            font-size: 20px;
            font-weight: 700
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: #fff;
            border-bottom: 1px solid #ddd
        }

        button,
        select {
            font-size: 15px;
            padding: 8px 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            background: #fff;
            cursor: pointer
        }

        button:hover {
            background: #eee
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(450px, 1fr) 430px;
            gap: 14px;
            padding: 14px;
            max-width: 1450px;
            margin: auto
        }

        #scene {
            width: 100%;
            height: 700px;
            background: #dfe8f0;
            border-radius: 12px;
            overflow: hidden;
            position: relative
        }

        .hint {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 5;
            background: rgba(255, 255, 255, .92);
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none
        }

        .info {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px
        }

        #status {
            font-weight: 700;
            margin-bottom: 7px
        }

        .views-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px
        }

        .views-header h2 {
            margin: 0;
            font-size: 18px
        }

        #toggleViews {
            font-size: 13px;
            padding: 6px 10px
        }

        .views {
            display: grid;
            gap: 12px
        }

        .view {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .07)
        }

        .view h2 {
            font-size: 17px;
            margin: 0 0 8px
        }

        .grid {
            display: grid;
            gap: 3px;
            justify-content: center;
            align-content: center;
            background: #fafafa;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 7px
        }

        .cell {
            width: 42px;
            height: 42px;
            border: 2px solid #666;
            background: #fff
        }

        .cell.filled {
            background: #dbeafe;
            border-color: #2563eb
        }

        .legend {
            font-size: 12px;
            color: #666;
            margin-top: 6px
        }

        @media (max-width:900px) {
            .layout {
                grid-template-columns: 1fr
            }

            #scene {
                height: 520px
            }
        }

    </style>
    <script type="importmap">{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}</script>
</head>

<body>
    <header>쌓기나무</header>
    <div class="controls"><label>바닥 크기: <select id="sizeSelect">
                <option value="3" selected="selected">3 × 3</option>
                <option value="4">4 × 4</option>
                <option value="5">5 × 5</option>
            </select></label> <button id="randomBtn">랜덤 생성</button> <button id="clearBtn">전체 지우기</button></div>
    <div class="layout">
        <div>
            <div id="scene">
                <div class="hint">블럭 쌓기 : 클릭<br>블럭 제거 : 우클릭 / 길게 클릭<br>시점 변경 : 드래그 / 끌기<br>확대/축소 : 휠 / 두손가락</div>
            </div>
        </div>
        <div>
            <div class="views-header">
                <h2>👀 방향별 모양</h2><button id="toggleViews">숨기기</button>
            </div>
            <div class="views">
                <div class="view">
                    <h2>앞에서 본 모양</h2>
                    <div id="front" class="grid"></div>
                    <div class="legend">앞쪽에서 바라본 모습</div>
                </div>
                <div class="view">
                    <h2>위에서 본 모양</h2>
                    <div id="top" class="grid"></div>
                    <div class="legend">위쪽에서 바라본 모습</div>
                </div>
                <div class="view">
                    <h2>옆에서 본 모양</h2>
                    <div id="side" class="grid"></div>
                    <div class="legend">옆에서 바라본 모습</div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import * as THREE from "three";
        import {
            OrbitControls
        } from "three/addons/controls/OrbitControls.js";
        let N = 3;
        const MAX_H = 9;
        let scene, camera, renderer, controls, raycaster, mouse, heights = [],
            blocks = [],
            floorCells = [];
        const sceneDiv = document.getElementById("scene");

        function makeData() {
            heights = Array.from({
                length: N
            }, () => Array(N).fill(0))
        }

        function initThree() {
            scene = new THREE.Scene, scene.background = new THREE.Color(14674160), camera = new THREE.PerspectiveCamera(45, sceneDiv.clientWidth / sceneDiv.clientHeight, .1, 1e3), camera.position.set(2.35 * N, 2 * N, 2.35 * N), renderer = new THREE.WebGLRenderer({
                antialias: !0
            }), renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)), renderer.setSize(sceneDiv.clientWidth, sceneDiv.clientHeight), sceneDiv.appendChild(renderer.domElement), controls = new OrbitControls(camera, renderer.domElement), controls.enableDamping = !0, controls.target.set(0, 1, 0), raycaster = new THREE.Raycaster, mouse = new THREE.Vector2, scene.add(new THREE.HemisphereLight(16777215, 7829367, 2.2));
            const e = new THREE.DirectionalLight(16777215, 2);
            e.position.set(6, 10, 7), scene.add(e), draw(), renderer.domElement.addEventListener("pointerdown", onPointerDown), renderer.domElement.addEventListener("contextmenu", e => {
                e.preventDefault()
            }), renderer.domElement.addEventListener("pointerdown", e => {
                0 === e.button && (longPressTriggered = !1, longPressTimer = setTimeout(() => {
                    longPressTriggered = !0, removeOneAtPointer(e)
                }, 550))
            }), renderer.domElement.addEventListener("pointerup", () => {
                longPressTimer && (clearTimeout(longPressTimer), longPressTimer = null)
            }), renderer.domElement.addEventListener("pointercancel", () => {
                longPressTimer && (clearTimeout(longPressTimer), longPressTimer = null)
            }), renderer.domElement.addEventListener("pointermove", e => {
                0 === e.button && longPressTimer && (Math.abs(e.movementX) > 8 || Math.abs(e.movementY) > 8) && (clearTimeout(longPressTimer), longPressTimer = null)
            }), renderer.domElement.addEventListener("pointermove", onPointerMove), window.addEventListener("resize", resize), animate()
        }

        function makeTextSprite(e, t) {
            const r = document.createElement("canvas");
            r.width = 320, r.height = 180;
            const n = r.getContext("2d");
            n.clearRect(0, 0, r.width, r.height), n.font = 'bold 70px "Malgun Gothic", Arial, sans-serif', n.fillStyle = t, n.textAlign = "center", n.textBaseline = "middle", n.fillText(e, 160, 90);
            const o = new THREE.CanvasTexture(r);
            o.needsUpdate = !0;
            const s = new THREE.SpriteMaterial({
                    map: o,
                    transparent: !0,
                    depthTest: !0,
                    depthWrite: !1
                }),
                a = new THREE.Sprite(s);
            return a.scale.set(1.55, .88, 1), a.userData.directionMarker = !0, scene.add(a), a
        }

        function addDirectionMarkers() {
            const e = N / 2 + .8;
            makeTextSprite("앞", "#d90429").position.set(0, .45, e);
            makeTextSprite("옆", "#007f5f").position.set(e, .45, 0);
            const t = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, .08, N / 2 - .05), .6, 14222377, .18, .12);
            t.userData.directionMarker = !0, scene.add(t);
            const r = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(N / 2 - .05, .08, 0), .6, 32607, .18, .12);
            r.userData.directionMarker = !0, scene.add(r)
        }

        function addGrid() {
            floorCells = [];
            const e = new THREE.GridHelper(N, N, 5592405, 10066329);
            e.position.y = .02, scene.add(e);
            const t = new THREE.PlaneGeometry(.98, .98);
            for (let e = 0; e < N; e++)
                for (let r = 0; r < N; r++) {
                    const n = new THREE.MeshBasicMaterial({
                            color: 16777215,
                            transparent: !0,
                            opacity: .08,
                            side: THREE.DoubleSide
                        }),
                        o = new THREE.Mesh(t, n);
                    o.rotation.x = -Math.PI / 2, o.position.set(r - (N - 1) / 2, .035, e - (N - 1) / 2), o.userData = {
                        floor: !0,
                        row: e,
                        col: r
                    }, scene.add(o), floorCells.push(o)
                }
            addDirectionMarkers()
        }

        function draw() {
            for (const e of blocks)
                if (scene.remove(e), e.geometry.dispose(), e.material.dispose(), e.children.length)
                    for (const t of e.children) t.geometry && t.geometry.dispose(), t.material && t.material.dispose();
            blocks = [];
            for (const e of [...scene.children])(e.userData?.floor || e.userData?.directionMarker || "GridHelper" === e.type) && (scene.remove(e), e.material && (e.material.map && e.material.map.dispose(), e.material.dispose()));
            addGrid();
            const e = new THREE.BoxGeometry(.95, .95, .95),
                t = new THREE.EdgesGeometry(e);
            for (let r = 0; r < N; r++)
                for (let n = 0; n < N; n++)
                    for (let o = 0; o < heights[r][n]; o++) {
                        const s = new THREE.MeshStandardMaterial({
                                color: 6000111,
                                roughness: .65
                            }),
                            a = new THREE.Mesh(e.clone(), s);
                        a.position.set(n - (N - 1) / 2, o + .5, r - (N - 1) / 2), a.userData = {
                            row: r,
                            col: n,
                            height: o
                        }, scene.add(a), blocks.push(a);
                        const i = new THREE.LineSegments(t.clone(), new THREE.LineBasicMaterial({
                            color: 2047858
                        }));
                        a.add(i)
                    }
            updateViews()
        }

        function getMouse(e) {
            const t = renderer.domElement.getBoundingClientRect();
            mouse.x = (e.clientX - t.left) / t.width * 2 - 1, mouse.y = -(e.clientY - t.top) / t.height * 2 + 1
        }

        function removeOneAtPointer(e) {
            getMouse(e), raycaster.setFromCamera(mouse, camera);
            const t = raycaster.intersectObjects(blocks, !1);
            if (t.length) {
                const e = t[0].object,
                    r = e.userData.row,
                    n = e.userData.col;
                return heights[r][n] = Math.max(0, heights[r][n] - 1), draw(), !0
            }
            const r = raycaster.intersectObjects(floorCells, !1);
            if (r.length) {
                const e = r[0].object,
                    t = e.userData.row,
                    n = e.userData.col;
                return heights[t][n] = Math.max(0, heights[t][n] - 1), draw(), !0
            }
            return !1
        }

        function onPointerDown(e) {
            if (2 === e.button) return void removeOneAtPointer(e);
            if (longPressTriggered) return void(longPressTriggered = !1);
            getMouse(e), raycaster.setFromCamera(mouse, camera);
            const t = raycaster.intersectObjects(blocks, !1);
            if (t.length) {
                const e = t[0].object,
                    r = e.userData.row,
                    n = e.userData.col;
                return heights[r][n] = Math.min(9, heights[r][n] + 1), void draw()
            }
            const r = raycaster.intersectObjects(floorCells, !1);
            if (r.length) {
                const e = r[0].object,
                    t = e.userData.row,
                    n = e.userData.col;
                heights[t][n] = Math.min(9, heights[t][n] + 1), draw()
            }
        }
        let hoveredCell = null,
            longPressTriggered = !1,
            longPressTimer = null;

        function onPointerMove(e) {
            getMouse(e), raycaster.setFromCamera(mouse, camera), hoveredCell && (hoveredCell.material.opacity = .08, hoveredCell.material.color.set(16777215), hoveredCell = null);
            const t = raycaster.intersectObjects(floorCells, !1);
            t.length ? (hoveredCell = t[0].object, hoveredCell.material.opacity = .38, hoveredCell.material.color.set(4491519), renderer.domElement.style.cursor = "pointer") : renderer.domElement.style.cursor = "default"
        }

        function makeView(e, t, r) {
            const n = document.getElementById(e);
            n.innerHTML = "";
            const o = t.length,
                s = t[0].length;
            n.style.gridTemplateColumns = `repeat(${s}, 42px)`;
            for (let e = 0; e < o; e++)
                for (let r = 0; r < s; r++) {
                    const o = t[e][r],
                        s = document.createElement("div");
                    s.className = "cell" + (o > 0 ? " filled" : ""), n.appendChild(s)
                }
        }

        function updateViews() {
            const e = Array(N).fill(0);
            for (let t = 0; t < N; t++)
                for (let r = 0; r < N; r++) e[t] = Math.max(e[t], heights[r][t]);
            const t = Array(N).fill(0);
            for (let e = 0; e < N; e++)
                for (let r = 0; r < N; r++) t[e] = Math.max(t[e], heights[e][r]);
            const r = Math.max(3, Math.max(...e, ...t)),
                n = Array.from({
                    length: r
                }, () => Array(N).fill(0));
            for (let t = 0; t < r; t++)
                for (let o = 0; o < N; o++) n[r - 1 - t][o] = e[o] > t ? 1 : 0;
            const o = Array.from({
                length: r
            }, () => Array(N).fill(0));
            for (let e = 0; e < r; e++)
                for (let n = 0; n < N; n++) o[r - 1 - e][N - 1 - n] = t[n] > e ? 1 : 0;
            const s = heights.map(e => e.map(e => e > 0 ? 1 : 0));
            makeView("front", n, !0), makeView("top", s, !0), makeView("side", o, !0)
        }

        function randomize() {
            makeData();
            for (let e = 0; e < N; e++)
                for (let t = 0; t < N; t++) heights[e][t] = Math.floor(4 * Math.random());
            draw()
        }

        function clearAll() {
            makeData(), draw()
        }

        function resize() {
            camera.aspect = sceneDiv.clientWidth / sceneDiv.clientHeight, camera.updateProjectionMatrix(), renderer.setSize(sceneDiv.clientWidth, sceneDiv.clientHeight)
        }

        function animate() {
            requestAnimationFrame(animate), controls.update(), renderer.render(scene, camera)
        }
        document.getElementById("sizeSelect").addEventListener("change", e => {
            N = Number(e.target.value), makeData(), camera.position.set(2.35 * N, 2 * N, 2.35 * N), controls.target.set(0, 1, 0), draw()
        }), document.getElementById("randomBtn").addEventListener("click", randomize), document.getElementById("clearBtn").addEventListener("click", clearAll);
        const toggleViews = document.getElementById("toggleViews"),
            views = document.querySelector(".views");
        toggleViews.addEventListener("click", () => {
            "none" === views.style.display ? (views.style.display = "grid", toggleViews.textContent = "숨기기") : (views.style.display = "none", toggleViews.textContent = "펼치기")
        }), makeData(), initThree()

    </script>
</body>

</html>
