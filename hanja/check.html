   @import url('//fonts.googleapis.com/earlyaccess/nanummyeongjo.css');


.hanja {
font-size:50pt;
}

</style>
    
</head>
<body>

<h1>한자 검사</h1>

<p>전체 개수: <span id="total"></span></p>
  <select id="fontSelect">
  
      <option value='Klee One'>
            Klee One
        </option>

        <option value='"LXGW WenKai TC", serif'>
            LXGW WenKai TC
        </option>

        <option value= 'Myeongwon'>
            명원체
        </option>

        <option value="HangulJaemin60">
            재민체
        </option>       


        <option value='JoseonPalace'>
            조선일보궁서체
        </option>


        <option value='GyeonggiMillenniumBackground'>
            경기천년바탕
        </option>


        <option value='Noto Serif TC'>
            Noto Serif TC
        </option>

  
       <option value='Pretendard'>
            기본
        </option>


       
       
    </select>

<h2>중복된 한자</h2>
<div id="duplicate"></div>

<h2>전체 한자</h2>
<div id="list"></div>

<script>

fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json")
    .then(response => response.json())
    .then(data => {

        // 1. 중복 검사
        const count = {};

        for (let item of data) {

            const hanja = item.hanja;

            if (count[hanja]) {
                count[hanja]++;
            }
            else {
                count[hanja] = 1;
            }

        }


        // 중복 출력
        let duplicate = "";

        for (let hanja in count) {

            if (count[hanja] > 1) {
                duplicate += `${hanja} : ${count[hanja]}번<br>`;
            }

        }

        if (duplicate === "") {
            duplicate = "중복 없음";
        }

        document.querySelector("#duplicate").innerHTML = duplicate;


        // 2. 전체 개수
        document.querySelector("#total").textContent = data.length;


// 3. 중복 여부와 관계없이 모든 한자 출력
let list = "";

for (let item of data) {
    list += `<span class="hanja">${item.hanja}</span> `;
}

document.querySelector("#list").innerHTML = list;

    });

    
/* =========================
   폰트 변경
========================= */

/* 현재 선택된 한자 폰트 */

let selectedFont = "Klee One";
    
document
    .getElementById("fontSelect")
    .addEventListener(
        "change",
        function() {

            selectedFont =
                this.value;

            document
                .querySelectorAll(".hanja")
                .forEach(
                    element => {

                        element.style.fontFamily =
                            selectedFont;

                    }
                );

        }
    );
    
</script>

</body>
</html>
