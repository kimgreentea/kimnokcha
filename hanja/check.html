<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자 검사</title>
</head>
<body>

<h1>한자 검사</h1>

<p>전체 개수: <span id="total"></span></p>

<h2>중복된 한자</h2>
<div id="duplicate"></div>

<h2>전체 한자</h2>
<div id="list"></div>

<script>

fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json")
    .then(response => response.json())
    .then(data => {

        // 1. 중복 검사
        const count = {};

        for (let item of data) {

            const hanja = item.hanja;

            if (count[hanja]) {
                count[hanja]++;
            }
            else {
                count[hanja] = 1;
            }

        }


        // 중복 출력
        let duplicate = "";

        for (let hanja in count) {

            if (count[hanja] > 1) {
                duplicate += `${hanja} : ${count[hanja]}번<br>`;
            }

        }

        if (duplicate === "") {
            duplicate = "중복 없음";
        }

        document.querySelector("#duplicate").innerHTML = duplicate;


        // 2. 전체 개수
        document.querySelector("#total").textContent = data.length;


        // 3. 중복 여부와 관계없이 모든 한자 출력
        let list = "";

        for (let item of data) {
            list += item.hanja + " ";
        }

        document.querySelector("#list").textContent = list;

    });

</script>

</body>
</html>
