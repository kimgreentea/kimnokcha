<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>한자 획순 보기</title> <style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif}#card,#hanja{text-align:center}#card{width:90%;max-width:700px;margin:50px auto;padding:30px;background:#fff;border-radius:25px;box-shadow:0 5px 25px rgba(0,0,0,.12)}#hanja{width:220px;padding:15px;font-size:35px;border:2px solid #ddd;border-radius:15px;outline:0}#hanja:focus{border-color:#888}#result{width:50vw;max-width:400px;margin:20px auto}#result_mean{margin-top:10px;font-size:40px;font-weight:700}@media (max-width:600px){#card{margin-top:20px;padding:20px}#hanja{width:180px;font-size:30px}#result_mean{font-size:32px}}</style> </head><body><div id="card"><input type="text" id="hanja" placeholder="한자 입력" maxlength="1" oninput="getUnicodeLink()" ><div id="result"></div><div id="result_mean"></div></div> <script>let animationTimer=null,currentHanja="";async function getUnicodeLink(){let t=document.getElementById("hanja").value.trim(),e=document.getElementById("result");if(""===t)return currentHanja="",e.innerHTML="",document.getElementById("result_mean").innerHTML="",void(null!==animationTimer&&(clearTimeout(animationTimer),animationTimer=null));t=t.charAt(0),currentHanja=t,null!==animationTimer&&(clearTimeout(animationTimer),animationTimer=null);let n="https://raw.githubusercontent.com/skishore/makemeahanzi/618dbab8a8ddefb958763c8b4afbaa741a4460de/svgs/"+t.charCodeAt(0)+".svg";try{let e=await fetch(n);if(!e.ok)throw new Error("파일을 찾을 수 없습니다 (404)");let a=(await e.text()).split("\n");a.splice(2,4);let i=a.join("\n").replace(/stroke:\s*blue;/g,"stroke: black;"),r=i.match(/animation-delay:\s*(\d+\.?\d*)s/g),o=0;r&&(o=Math.max(...r.map(t=>parseFloat(t.match(/(\d+\.?\d*)s/)[1]))));let m=1e3*o+1400;playAnimation(i),animationTimer=setTimeout(function e(){currentHanja===t&&(playAnimation(i),animationTimer=setTimeout(e,m))},m)}catch(t){console.error("SVG 로딩 실패:",t),e.innerHTML=""}searchHanja(t)}function playAnimation(t){let e=document.getElementById("result");e.innerHTML="",e.innerHTML=t;let n=e.querySelector("svg");n&&(n.style.animation="none",n.offsetWidth,n.style.animation="")}async function fetchHanjaData(){const t=await fetch("https://raw.githubusercontent.com/myungcheol/hanja/refs/heads/master/hanja.txt");return(await t.text()).split("\n").map(t=>t.split("="))}async function searchHanja(t){const e=document.getElementById("result_mean");if(t)try{const n=(await fetchHanjaData()).find(([e])=>e===t);if(n){const t=n[1].split(",")[0].trim();e.innerHTML=t}else e.innerHTML=""}catch(t){console.error("한자 뜻 검색 실패:",t)}else e.innerHTML=""}</script> </body></html>
