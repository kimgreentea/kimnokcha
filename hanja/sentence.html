<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@200..900&family=Shippori+Mincho&display=swap" rel="stylesheet">


@font-face {
    font-family: 'Myeongwon';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607131254@4/4/Hangeuljaemin4-RegularI.woff2') format('woff2');
    font-weight: 100;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: 'Noto Serif KR', serif;
    overflow: hidden;
}


/* =========================
   전체 슬라이드
========================= */

.slide {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 5vw;
    text-align: center;
}


/* =========================
   문장 / 음 / 뜻
========================= */

.hanmun {
    font-size: clamp(40px, 6vw, 100px);
    line-height: 1.5;
    font-family: 'Klee One';
    margin-bottom: 20px;
    white-space: pre-line;
}

.reading {
    font-size: clamp(22px, 3vw, 50px);
    margin-bottom: 35px;
    white-space: pre-line;
}

.meaning {
    font-size: clamp(20px, 2.5vw, 45px);
    line-height: 1.7;
    color: #ddd;
    margin-bottom: 50px;
    white-space: pre-line;
}


/* =========================
   주요 한자
========================= */

.keyHanja {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}


.hanjaCard {
    min-width: 130px;

    padding: 15px 25px;

    border: 1px solid #555;
    border-radius: 12px;

    background: #1c1c1c;
}


.hanja {
    font-size: 42px;
    font-family: 'Klee One';
    font-weight: 100;
}


.hanjaMeaning {
    font-size: 18px;
    color: #bbb;
    margin-top: 3px;
}

.hanjaReading {
    font-size: 20px;
    margin-top: 5px;
}




/* =========================
   페이지 표시 + 입력
========================= */

.page {
    position: fixed;

    right: 30px;
    bottom: 20px;

    display: flex;
    align-items: center;

    gap: 6px;

    font-family: sans-serif;
    color: #888;
}


#pageInput {
    width: 55px;

    padding: 5px;

    border: none;
    border-radius: 5px;

    font-size: 16px;
    text-align: center;
}


/* 숫자 입력 화살표 제거 */

#pageInput::-webkit-inner-spin-button,
#pageInput::-webkit-outer-spin-button {
    opacity: 1;
}
</style>
</head>


<body>


<div class="slide">

    <!-- 한문 -->

    <div
        class="hanmun"
        id="hanmun">
    </div>


    <!-- 음 -->

    <div
        class="reading"
        id="reading">
    </div>


    <!-- 뜻 -->

    <div
        class="meaning"
        id="meaning">
    </div>


    <!-- 주요 한자 -->

    <div
        class="keyHanja"
        id="keyHanja">
    </div>

</div>


<!-- =========================
     페이지
========================= -->

<div class="page">

    <input
        type="number"
        id="pageInput"
        min="1"
    >

    <span id="totalPages"></span>

</div>


<script>
// 현재 페이지


let sentences = [];
let current = Number(localStorage.getItem("hanjaPage")) || 0;

// JSON 불러오기
fetch("https://kimgreentea.github.io/kimnokcha/hanja/sentence.json")
    .then(response => response.json())
    .then(data => {
        sentences = data;

        if (current >= sentences.length) {
            current = sentences.length - 1;
        }

        showSlide();
    })
    .catch(error => {
        console.error("JSON 불러오기 실패:", error);
    });



// ==================================================
// 요소
// ==================================================

const hanmun =
    document.getElementById("hanmun");

const reading =
    document.getElementById("reading");

const meaning =
    document.getElementById("meaning");

const keyHanja =
    document.getElementById("keyHanja");

const pageInput =
    document.getElementById("pageInput");

const totalPages =
    document.getElementById("totalPages");


// ==================================================
// 화면 표시
// ==================================================

function showSlide() {
    const sentence = sentences[current];

    hanmun.textContent = sentence.hanmun;
    reading.textContent = sentence.reading || "";
    meaning.textContent = sentence.meaning || "";

    keyHanja.innerHTML = "";

    (sentence.keyHanja || []).forEach(item => {
        const card = document.createElement("div");
        card.className = "hanjaCard";

        card.innerHTML = `
            <div class="hanja">
                ${item.hanja}
            </div>
            <div class="hanjaMeaning">
                ${item.meaning}
            </div>
            <div class="hanjaReading">
                ${item.reading}
            </div>
        `;

        keyHanja.appendChild(card);
    });

    pageInput.value = current + 1;
    totalPages.textContent = `/ ${sentences.length}`;

    // 마지막으로 본 페이지 저장
    localStorage.setItem("hanjaPage", current);
}


// ==================================================
// 다음 페이지
// ==================================================

function nextSlide() {

    if (current < sentences.length - 1) {

        current++;

        showSlide();

    }

}


// ==================================================
// 이전 페이지
// ==================================================

function previousSlide() {

    if (current > 0) {

        current--;

        showSlide();

    }

}


// ==================================================
// 페이지 번호 입력
// ==================================================

pageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }


        const page =
            Number(pageInput.value);


        if (
            page >= 1 &&
            page <= sentences.length
        ) {

            current = page - 1;

            showSlide();

        }
        else {

            pageInput.value =
                current + 1;

        }

    }
);


// ==================================================
// 키보드
// ==================================================

document.addEventListener(
    "keydown",
    function(event) {

        // 페이지 입력 중에는
        // 키보드 페이지 이동을 하지 않음

        if (
            document.activeElement === pageInput
        ) {
            return;
        }


        // 다음

        if (
            event.key === "ArrowRight" ||
            event.key === " " ||
            event.key === "Enter"
        ) {

            nextSlide();

        }


        // 이전

        if (
            event.key === "ArrowLeft"
        ) {

            previousSlide();

        }

    }
);

// ==================================================
// 클릭 / 터치 / 드래그 → 다음 페이지
// ==================================================

const slide = document.querySelector(".slide");

let touchStartX = 0;
let touchEndX = 0;


// 터치 시작
slide.addEventListener("touchstart", function(event) {

    touchStartX = event.touches[0].clientX;

}, { passive: true });


// 손가락 이동
slide.addEventListener("touchmove", function(event) {

    event.preventDefault();

}, { passive: false });


// 터치 종료
slide.addEventListener("touchend", function(event) {

    touchEndX = event.changedTouches[0].clientX;

    const distance = touchEndX - touchStartX;

    // 왼쪽으로 충분히 드래그
    if (distance < -50) {

        nextSlide();

    }

    // 오른쪽으로 충분히 드래그
    else if (distance > 50) {

        previousSlide();

    }

    // 거의 움직이지 않은 경우 → 클릭처럼 처리
    else {

        nextSlide();

    }

}, { passive: true });


// ==================================================
// 우클릭 → 이전 페이지
// ==================================================

slide.addEventListener("contextmenu", function(event) {

    event.preventDefault();

    previousSlide();

});

</script>

</body>
</html>
