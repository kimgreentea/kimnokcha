<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: 'Noto Serif KR', serif;
    overflow: hidden;
}


/* =========================
   전체 슬라이드
========================= */

.slide {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 5vw;
    text-align: center;
}


/* =========================
   한문
========================= */

.hanmun {
    font-size: clamp(40px, 6vw, 100px);
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 20px;
}


/* =========================
   음
========================= */

.reading {
    font-size: clamp(22px, 3vw, 50px);
    margin-bottom: 35px;
}


/* =========================
   뜻
========================= */

.meaning {
    font-size: clamp(20px, 2.5vw, 45px);
    line-height: 1.7;
    color: #ddd;
    margin-bottom: 50px;
}


/* =========================
   주요 한자
========================= */

.keyHanja {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}


.hanjaCard {
    min-width: 130px;

    padding: 15px 25px;

    border: 1px solid #555;
    border-radius: 12px;

    background: #1c1c1c;
}


.hanja {
    font-size: 42px;
    font-weight: 700;
}


.hanjaMeaning {
    font-size: 18px;
    color: #bbb;
    margin-top: 3px;
}

.hanjaReading {
    font-size: 20px;
    margin-top: 5px;
}




/* =========================
   페이지 표시 + 입력
========================= */

.page {
    position: fixed;

    right: 30px;
    bottom: 20px;

    display: flex;
    align-items: center;

    gap: 6px;

    font-family: sans-serif;
    color: #888;
}


#pageInput {
    width: 55px;

    padding: 5px;

    border: none;
    border-radius: 5px;

    font-size: 16px;
    text-align: center;
}


/* 숫자 입력 화살표 제거 */

#pageInput::-webkit-inner-spin-button,
#pageInput::-webkit-outer-spin-button {
    opacity: 1;
}
</style>
</head>


<body>


<div class="slide">

    <!-- 한문 -->

    <div
        class="hanmun"
        id="hanmun">
    </div>


    <!-- 음 -->

    <div
        class="reading"
        id="reading">
    </div>


    <!-- 뜻 -->

    <div
        class="meaning"
        id="meaning">
    </div>


    <!-- 주요 한자 -->

    <div
        class="keyHanja"
        id="keyHanja">
    </div>

</div>


<!-- =========================
     페이지
========================= -->

<div class="page">

    <input
        type="number"
        id="pageInput"
        min="1"
    >

    <span id="totalPages"></span>

</div>


<script>

let sentences = [];
let current = 0;


// JSON 불러오기
fetch("https://kimgreentea.github.io/kimnokcha/hanja/sentence.json")
    .then(response => response.json())
    .then(data => {

        sentences = data;

        showSlide();

    })
    .catch(error => {

        console.error("JSON 불러오기 실패:", error);

    });



// ==================================================
// 요소
// ==================================================

const hanmun =
    document.getElementById("hanmun");

const reading =
    document.getElementById("reading");

const meaning =
    document.getElementById("meaning");

const keyHanja =
    document.getElementById("keyHanja");

const pageInput =
    document.getElementById("pageInput");

const totalPages =
    document.getElementById("totalPages");


// ==================================================
// 화면 표시
// ==================================================

function showSlide() {

    const sentence = sentences[current];


    // 한문

    hanmun.textContent =
        sentence.hanmun;


    // 음

    reading.textContent =
        sentence.reading;


    // 뜻

    meaning.textContent =
        sentence.meaning;


    // 주요 한자 초기화

    keyHanja.innerHTML = "";


    // 주요 한자 생성

    sentence.keyHanja.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "hanjaCard";


        card.innerHTML = `
            <div class="hanja">
                ${item.hanja}
            </div>
          
            <div class="hanjaMeaning">
                ${item.meaning}
            </div>

            <div class="hanjaReading">
                ${item.reading}
            </div>

          
        `;


        keyHanja.appendChild(card);

    });


    // 페이지 번호

    pageInput.value =
        current + 1;

    totalPages.textContent =
        `/ ${sentences.length}`;

}


// ==================================================
// 다음 페이지
// ==================================================

function nextSlide() {

    if (current < sentences.length - 1) {

        current++;

        showSlide();

    }

}


// ==================================================
// 이전 페이지
// ==================================================

function previousSlide() {

    if (current > 0) {

        current--;

        showSlide();

    }

}


// ==================================================
// 페이지 번호 입력
// ==================================================

pageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }


        const page =
            Number(pageInput.value);


        if (
            page >= 1 &&
            page <= sentences.length
        ) {

            current = page - 1;

            showSlide();

        }
        else {

            pageInput.value =
                current + 1;

        }

    }
);


// ==================================================
// 키보드
// ==================================================

document.addEventListener(
    "keydown",
    function(event) {

        // 페이지 입력 중에는
        // 키보드 페이지 이동을 하지 않음

        if (
            document.activeElement === pageInput
        ) {
            return;
        }


        // 다음

        if (
            event.key === "ArrowRight" ||
            event.key === " " ||
            event.key === "Enter"
        ) {

            nextSlide();

        }


        // 이전

        if (
            event.key === "ArrowLeft"
        ) {

            previousSlide();

        }

    }
);

// ==================================================
// 클릭 / 터치 → 다음 페이지
// ==================================================

document.querySelector(".slide").addEventListener("click", function() {
    nextSlide();
});



</script>

</body>
</html>
