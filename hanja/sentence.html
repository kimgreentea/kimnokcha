<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>

@import url('https://fonts.googleapis.com/css2?family=Klee+One&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@200..900&family=Shippori+Mincho&display=swap');



@font-face {
    font-family: 'Myeongwon';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607131254@4/4/Hangeuljaemin4-RegularI.woff2') format('woff2');
    font-weight: 100;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: 'Noto Serif KR', serif;
    overflow: hidden;
}


/* =========================
   전체 슬라이드
========================= */

.slide {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 5vw;
    text-align: center;
}


/* =========================
   문장 / 음 / 뜻
========================= */

.hanmun {
    font-size: clamp(60px, 6vw, 120px);
    line-height: 1.5;
    font-family: 'Klee One';
    margin-bottom: 15px; 
    white-space: pre-line;
}

.reading {
    font-size: clamp(35px, 3vw, 70px);
    margin-bottom: 30px;
    white-space: pre-line;
}

.meaning {
    font-size: clamp(25px, 2.5vw, 50px);
    line-height: 1.5;
    color: #ddd;
    margin-bottom: 30px;
    white-space: pre-line;
}


/* =========================
   주요 한자
========================= */

.keyHanja {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}


.hanjaCard {
    min-width: 130px;

    padding: 15px 25px;

    //border: 1px solid #555;
    border-radius: 12px;

    background: #1c1c1c;
}


.hanja {
    font-size: 40px;
    font-family: 'Klee One';
    font-weight: 100;
}


.hanjaMeaning {
    font-size: 20px;
    color: #bbb;
    margin-top: 3px;
}

.hanjaReading {
    font-size: 23px;
    margin-top: 5px;
}




/* =========================
   페이지 표시 + 입력
========================= */

.page {
    position: fixed;

    right: 30px;
    bottom: 20px;

    display: flex;
    align-items: center;

    gap: 6px;

    font-family: sans-serif;
    color: #888;
}


#pageInput {
    width: 55px;

    padding: 5px;

    border: none;
    border-radius: 5px;

    font-size: 16px;
    text-align: center;
}

.fontSelect {
    position: fixed;

    left: 30px;
    bottom: 20px;

    display: flex;
    align-items: center;

    gap: 6px;

    font-family: sans-serif;
    color: #888;
}



</style>
</head>


<body>


<div class="slide">

    <!-- 한문 -->

    <div
        class="hanmun"
        id="hanmun">
    </div>


    <!-- 음 -->

    <div
        class="reading"
        id="reading">
    </div>


    <!-- 뜻 -->

    <div
        class="meaning"
        id="meaning">
    </div>


    <!-- 주요 한자 -->

    <div
        class="keyHanja"
        id="keyHanja">
    </div>

</div>


<!-- =========================
     페이지
========================= -->

<div class="page">

    <input
        type="number"
        id="pageInput"
        min="1"
    >

    <span id="totalPages"></span>

</div>



<!-- =========================
     폰트
========================= -->

<div class="fontSelect">

  <select id="fontSelect">
  
      <option value='Klee One'>
            Klee One
        </option>

        <option value='"LXGW WenKai TC", serif'>
            LXGW WenKai TC
        </option>

        <option value= 'Myeongwon'>
            명원체
        </option>


        <option value='Noto Serif TC'>
            Noto Serif TC
        </option>
       <option value='Shippori Mincho'>
            Shippori Mincho
        </option>
  
       <option value='Noto Serif KR'>
            기본
        </option>


       
       
    </select>

</div>

<script>
// 현재 페이지


let sentences = [];
let current = Number(localStorage.getItem("hanjaPage")) || 0;

// JSON 불러오기
fetch("https://kimgreentea.github.io/kimnokcha/hanja/sentence.json")
    .then(response => response.json())
    .then(data => {
        sentences = data;

        if (current >= sentences.length) {
            current = sentences.length - 1;
        }

        showSlide();
    })
    .catch(error => {
        console.error("JSON 불러오기 실패:", error);
    });



// ==================================================
// 요소
// ==================================================

const hanmun =
    document.getElementById("hanmun");

const reading =
    document.getElementById("reading");

const meaning =
    document.getElementById("meaning");

const keyHanja =
    document.getElementById("keyHanja");

const pageInput =
    document.getElementById("pageInput");

const totalPages =
    document.getElementById("totalPages");


// ==================================================
// 화면 표시
// ==================================================

function showSlide() {
    const sentence = sentences[current];

    hanmun.textContent = sentence.hanmun;
    reading.textContent = sentence.reading || "";
    meaning.textContent = sentence.meaning || "";

    keyHanja.innerHTML = "";

    (sentence.keyHanja || []).forEach(item => {
        const card = document.createElement("div");
        card.className = "hanjaCard";

        card.innerHTML = `
            <div class="hanja">
                ${item.hanja}
            </div>
            <div class="hanjaMeaning">
                ${item.meaning}
            </div>
            <div class="hanjaReading">
                ${item.reading}
            </div>
        `;

        keyHanja.appendChild(card);
    });

    pageInput.value = current + 1;
    totalPages.textContent = `/ ${sentences.length}`;

    // 마지막으로 본 페이지 저장
    localStorage.setItem("hanjaPage", current);
}


// ==================================================
// 다음 페이지
// ==================================================

function nextSlide() {

    if (current < sentences.length - 1) {

        current++;

        showSlide();

    }

}


// ==================================================
// 이전 페이지
// ==================================================

function previousSlide() {

    if (current > 0) {

        current--;

        showSlide();

    }

}


// ==================================================
// 페이지 번호 입력
// ==================================================

pageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }


        const page =
            Number(pageInput.value);


        if (
            page >= 1 &&
            page <= sentences.length
        ) {

            current = page - 1;

            showSlide();

        }
        else {

            pageInput.value =
                current + 1;

        }

    }
);


// ==================================================
// 키보드
// ==================================================

document.addEventListener(
    "keydown",
    function(event) {

        // 페이지 입력 중에는
        // 키보드 페이지 이동을 하지 않음

        if (
            document.activeElement === pageInput
        ) {
            return;
        }


        // 다음

        if (
            event.key === "ArrowRight" ||
            event.key === " " ||
            event.key === "Enter"
        ) {

            nextSlide();

        }


        // 이전

        if (
            event.key === "ArrowLeft"
        ) {

            previousSlide();

        }

    }
);

// // ==================================================
// 클릭 / 터치 / 드래그
// ==================================================

const slide = document.querySelector(".slide");

let touchStartX = 0;
let touchEndX = 0;
let isTouching = false;


// ==================================================
// 터치 시작
// ==================================================

slide.addEventListener("touchstart", function(event) {

    isTouching = true;

    touchStartX = event.touches[0].clientX;

}, { passive: true });


// ==================================================
// 손가락 이동
// ==================================================

slide.addEventListener("touchstart", function(event) {

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

}, { passive: true });


// ==================================================
// 터치 종료
// ==================================================

slide.addEventListener("touchend", function(event) {

    const touchEndX = event.changedTouches[0].clientX;
    const touchEndY = event.changedTouches[0].clientY;

    const distanceX = touchEndX - touchStartX;
    const distanceY = touchEndY - touchStartY;

    // 가로 스와이프
    if (Math.abs(distanceX) > Math.abs(distanceY)) {

        if (distanceX < -50) {
            // 왼쪽 → 다음
            nextSlide();
        }
        else if (distanceX > 50) {
            // 오른쪽 → 이전
            previousSlide();
        }
        else {
            // 탭 → 다음
            nextSlide();
        }

    }

    // 세로 스와이프
    else {

        if (distanceY > 50) {
            // 위 → 이전
            previousSlide();
        }
        else {
            // 아래 → 다음
            nextSlide();
        }

    }

}, { passive: true });


// ==================================================
// 우클릭 → 이전 페이지
// ==================================================

slide.addEventListener("contextmenu", function(event) {

    event.preventDefault();

    previousSlide();

});


// ==================================================
// 좌클릭 → 다음 페이지
// ==================================================

slide.addEventListener("click", function(event) {

    event.preventDefault();


    // 모바일 터치에서 발생한 click이면 무시
    if (isTouching) {

        return;

    }


    nextSlide();

});

let selectedFont = '';
    
document
    .getElementById("fontSelect")
    .addEventListener(
        "change",
        function() {

            selectedFont =
                this.value;

            document
                .querySelectorAll(".hanja")
                .forEach(
                    element => {

                        element.style.fontFamily =
                            selectedFont;

                    }



                );

            document
                .querySelectorAll(".hanmun")
                .forEach(
                    element => {

                        element.style.fontFamily =
                            selectedFont;

                    }



                );
        }
    );

</script>

</body>
</html>
