<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>오늘의 한자</title>

<style>

/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eee;
    font-family: 'Pretendard';
}


/* =========================
   조작 영역
========================= */

.controls {
    width: 800px;
    max-width:100%;
    margin: 15px auto;
    padding: 12px;
    background: white;
    text-align: center;
}

.controls input {
    width: 60px;
    font-size: 16px;
    padding: 4px;
}

.controls select {
    font-size: 16px;
    padding: 4px 8px;
}

.controls button {
    font-size: 16px;
    padding: 6px 15px;
    margin-left: 8px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
}

        button:hover {
            background-color: #005a9e;
        }

#status {
    margin-top: 8px;
    font-size: 14px;
}



/* =========================
   학습지
========================= */

.pages {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.page {
    width:800px;
    max-width:100%;

    padding: 7mm 6mm 6mm;

    background: white;

    margin-bottom: 15px;

    overflow: hidden;

    box-sizing: border-box;
}

/* 제목 */

.title {
    text-align: center;
    font-size: 30px;
    font-weight: 500;
}


/* 날짜 / 이름 */

.info {
    display: flex;
    justify-content: right;
    white-space: pre-line;
    gap: 22px;

    font-size: 17px;
}


/* 안내문 */

.instruction {
    font-size: 15x;
    white-space: pre-line;
    margin-bottom: 7px;
}

textarea {
width:70%;
resize: none;
height:40px;
font-family:'Pretendard';
font-size: 16px;
}

.centeric {
display:flex;
justify-content: center;
align-items: center;
}



/* =========================
   표
========================= */

table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}


col.hanja-col {
    width: 12.5%;
}

col.info-col {
    width: 25%;
}

col.write-col {
    width: 12.5%;
}


td {
    border: 1px solid #ccc;

    height: 24.3mm;

    padding: 0;

    text-align: center;

    vertical-align: middle;
}


/* =========================
   한자
========================= */

.hanja {
    font-family:'Klee One';
    font-weight:100;
    font-size: 50px;
}


/* =========================
   한자 설명
========================= */

.word-info {
    line-height: 1.5;
}

.meaning-reading {
    font-size: 25px;

    margin-bottom: 3px;
}

.examples {
    font-size: 17px;
}


/* =========================
   쓰기 칸
========================= */

.write-cell {
    padding: 0;

    position: relative;
}


/*
    SVG가 셀 전체를 차지하도록 함
*/

.grid-svg {
    display: block;

    width: 100%;
    height: 100%;
}


/*
    SVG 선
*/

.grid-svg line {
    stroke: #eeeeee;

    stroke-width: 0.7;

    vector-effect: non-scaling-stroke;
}


/* =========================
   인쇄
========================= */

@media print {

    @page {
        size: A4 portrait;
        margin: 0;
    }

    body {
        background: white;
    }

    .controls {
        display: none;
    }

    .page {
        margin: 0;

        page-break-after: always;
    }

    .page:last-child {
        page-break-after: auto;
    }

}

</style>


<!-- =========================
     웹폰트
========================= -->

@font-face {

@font-face {

<body>


<!-- =========================
     조작 영역
========================= -->

<div class="controls">

    학습지 개수:

    <input
        id="pageCount"
        type="number"
        value="10"
        min="1"
    >


    장당 한자:

<select id="wordCount">
    <option value="5">5자</option>
    <option value="6">6자</option>
    <option value="7">7자</option>
    <option value="8">8자</option>
    <option value="9">9자</option>
    <option value="10" selected>10자</option>
</select>


    총획수(20~):

    <input
        id="strokeTarget"
        type="number"
        value="70"
        min="20"
    >


    한자 폰트:

    <select id="fontSelect">
  
      <option value='Klee One'>
            Klee One
        </option>

        <option value='"LXGW WenKai TC", serif'>
            LXGW WenKai TC
        </option>

        <option value= 'Myeongwon'>
            명원체
        </option>

        <option value="HangulJaemin60">
            재민체
        </option>       


        <option value='JoseonPalace'>
            조선일보궁서체
        </option>


        <option value='GyeonggiMillenniumBackground'>
            경기천년바탕
        </option>


        <option value='Noto Serif TC'>
            Noto Serif TC
        </option>

  
       <option value='Pretendard'>
            기본
        </option>


       
       
    </select>

<p class="centeric">
    제목 　
    <textarea id="titleText">오늘의 한자</textarea>
</p>

<p class="centeric">
    이름　
    <textarea id="infoText">날짜 ( 2026년 /　　월 /　　일 )　사유 (　　　　　　　　)　이름 (　　　　　)</textarea>
</p>

<p class="centeric">
    설명　
    <textarea id="instructionText">글자의 모양을 생각하며 바르게 글씨를 써봅시다.</textarea>
</p>
<p>

    <button onclick="makeWorksheets()">
        만들기
    </button>


    <button onclick="window.print()">
        인쇄
    </button>

</p>
    <div id="status"></div>

</div>


<div id="pages" class="pages"></div>


<script>


/* =========================
   전역 변수
========================= */

let words = [];


/* 현재 선택된 한자 폰트 */

let selectedFont = ''


/* =========================
   폰트 변경
========================= */

document
    .getElementById("fontSelect")
    .addEventListener(
        "change",
        function() {

            selectedFont =
                this.value;

            document
                .querySelectorAll(".hanja")
                .forEach(
                    element => {

                        element.style.fontFamily =
                            selectedFont;

                    }
                );

        }
    );


/* =========================
   JSON 불러오기
========================= */

async function loadWords() {

    try {

        const response =
            await fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json");


        if (!response.ok) {

            throw new Error(
                "words.json을 불러올 수 없습니다."
            );

        }


        words =
            await response.json();


        console.log(
            "불러온 한자 개수:",
            words.length
        );


        makeWorksheets();


    } catch (error) {

        document
            .getElementById("pages")
            .innerHTML =
                "<p>words.json을 불러오지 못했습니다.</p>";


        console.error(
            "JSON 로딩 실패:",
            error
        );

    }

}


/* =========================
   총획수에 맞는 한자 조합 찾기
========================= */

function getRandomWordsByStrokeTarget(
    wordCount,
    target
) {


    /* 한자 순서를 섞음 */

    let shuffled =
        [...words].sort(
            () =>
                Math.random() - 0.5
        );


    /*
        dp[count][sum]

        count:
        선택한 한자 개수

        sum:
        현재 총획수
    */

    let dp =
        Array.from(
            {
                length:
                    wordCount + 1
            },

            () => new Map()
        );


    dp[0].set(
        0,
        []
    );


    for (
        let word of shuffled
    ) {

        let stroke =
            Number(
                word.strokeCount
            );


        /*
            뒤에서부터 처리

            같은 한자를
            두 번 선택하지 않도록 함
        */

        for (
            let count =
                wordCount - 1;

            count >= 0;

            count--
        ) {

            for (
                let [
                    sum,
                    selected
                ]
                of dp[count]
            ) {

                let newSum =
                    sum + stroke;


                if (
                    newSum > target
                ) {

                    continue;

                }


                if (
                    !dp[count + 1]
                        .has(newSum)
                ) {

                    dp[count + 1].set(
                        newSum,
                        [
                            ...selected,
                            word
                        ]
                    );

                }

            }

        }

    }


    return (
        dp[wordCount]
            .get(target)
        || null
    );

}


/* =========================
   SVG 쓰기 칸 생성
========================= */

function createGridSVG(
    showGuideLines
) {

    /*
        기본선

        세로 1/2
        가로 1/2
    */

    let lines = `

        <line
            x1="50"
            y1="0"
            x2="50"
            y2="100"
        />

        <line
            x1="0"
            y1="50"
            x2="100"
            y2="50"
        />

    `;





    return `

        <svg
            class="grid-svg"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            ${lines}

        </svg>

    `;

}


/* =========================
   학습지 만들기
========================= */

function makeWorksheets() {


    /* 한자 개수 확인 */

    if (
        words.length < 10
    ) {

        alert(
            "한자가 충분하지 않습니다.\n\n" +
            `현재 불러온 한자: ${words.length}개`
        );

        return;

    }


    const pageCount =
        Number(
            document
                .getElementById(
                    "pageCount"
                )
                .value
        );


    const wordCount =
        Number(
            document
                .getElementById(
                    "wordCount"
                )
                .value
        );


    const target =
        Number(
            document
                .getElementById(
                    "strokeTarget"
                )
                .value
        );


    /* 입력값 확인 */




    if (
        target < 20
    ) {

        alert(
            "20 이상으로 입력"
        );

        return;

    }


    let pages =
        document.getElementById(
            "pages"
        );


    let status =
        document.getElementById(
            "status"
        );


    pages.innerHTML = "";

    status.innerText =
        "학습지를 만드는 중...";


    let worksheetData = [];


    /* =========================
       각 학습지 생성
    ========================= */

    for (
        let p = 0;
        p < pageCount;
        p++
    ) {

        let selected =
            getRandomWordsByStrokeTarget(
                wordCount,
                target
            );


        if (!selected) {

            status.innerText =
                "";


            alert(
                 `총획수 변경`
            );


            return;

        }


        worksheetData.push(
            selected
        );

    }


    /* =========================
       화면 출력
    ========================= */

    worksheetData.forEach(
        selected => {

            const page =
                document.createElement(
                    "div"
                );


            page.className =
                "page";


            const title =
    document.getElementById("titleText").value;

const info =
    document.getElementById("infoText").value;

const instruction =
    document.getElementById("instructionText").value;

page.innerHTML = `

    <div class="title">
        ${title}
    </div>

    <div class="info">
        ${info}
    </div>

    <div class="instruction">
        ${instruction}
    </div>

                <table>

                    <colgroup>

                        <col class="hanja-col">

                        <col class="info-col">

                        <col class="write-col">
                        <col class="write-col">
                        <col class="write-col">
                        <col class="write-col">
                        <col class="write-col">

                    </colgroup>


                    <tbody></tbody>

                </table>

            `;


            const tbody =
                page.querySelector(
                    "tbody"
                );


            selected.forEach(
                (word, index) => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const examples =
                        Array.isArray(
                            word.examples
                        )
                            ? word.examples.join(
                                ", "
                            )
                            : word.examples;


                    row.innerHTML = `

                        <td
                            class="hanja"
                            style="
                                font-family:
                                ${selectedFont};
                            "
                        >
                            ${word.hanja}
                        </td>


                        <td class="word-info">

                            <div
                                class="meaning-reading"
                            >
                                ${word.meaning}
                                ${word.reading}
                            </div>


                            <div class="examples">
                                ${examples}
                            </div>

                        </td>


                        <!-- 첫 번째 칸: 보조선 있음 -->

                        <td class="write-cell">

                            ${createGridSVG(true)}

                        </td>


                        <!-- 두 번째 칸: 보조선 있음 -->

                        <td class="write-cell">

                            ${createGridSVG(true)}

                        </td>


                        <!-- 세 번째 칸 -->

                        <td class="write-cell">

                          

                        </td>


                        <!-- 네 번째 칸-->

                        <td class="write-cell">

                          

                        </td>


                        <!-- 다섯 번째 칸-->

                        <td class="write-cell">



                        </td>

                    `;


                    tbody.appendChild(
                        row
                    );

                }
            );


            pages.appendChild(
                page
            );

        }
    );


    status.innerText =
        `${pageCount}장 생성`;

}


/* =========================
   실행
========================= */

loadWords();

</script>
