<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Klee+One&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet"><title>오늘의 한자</title> <style>*{box-sizing:border-box}body,textarea{font-family:"Pretendard"}body{margin:0;background:#eee}.controls{width:800px;max-width:100%;margin:15px auto;padding:12px;background:#fff;text-align:center}.controls input{width:60px;font-size:16px;padding:4px}.controls select{font-size:16px;padding:4px 8px}.controls button{font-size:16px;padding:6px 15px;margin-left:8px;background-color:#0078d4;color:#fff;border:0;border-radius:5px;cursor:pointer;transition:background-color .3s ease}button:hover{background-color:#005a9e}#status{margin-top:8px;font-size:14px}.options{margin:12px 0;font-size:16px}.options label{margin:0 10px;cursor:pointer}.options input[type=checkbox]{width:auto;margin-right:5px}.pages{display:flex;flex-direction:column;align-items:center}.page{width:800px;max-width:100%;padding:7mm 6mm 6mm;background:#fff;margin-bottom:15px;overflow:hidden;box-sizing:border-box}.title,td{text-align:center}.title{font-size:30px;line-height:1;font-weight:500;margin-bottom:25pt}.info,.instruction{white-space:pre-line;line-height:.5}.info{display:flex;justify-content:right;gap:12px;font-size:17px}.instruction{font-size:15px;margin-bottom:0;padding:0}textarea{width:70%;resize:none;height:40px;font-size:16px}.centeric{display:flex;justify-content:center;align-items:center}table{width:100%;border-collapse:collapse;table-layout:fixed}col.hanja-col{width:12.5%}col.info-col{width:25%}col.write-col{width:12.5%}td{border:1px solid #ccc;height:24.3mm;padding:0;vertical-align:middle}.hanja{font-family:"Klee One";font-weight:100;font-size:50px}.word-info{line-height:1.5}.meaning-reading{font-size:25px;margin-bottom:3px}.examples{font-size:17px}.write-cell{padding:0;position:relative}.grid-svg{display:block;width:100%;height:100%}.grid-svg line{stroke:#eee;stroke-width:.7;vector-effect:non-scaling-stroke}.meaning-line{stroke:#d0d0d0!important;stroke-width:.9!important}.example-hanja,.example-meaning{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:50px;color:#d0d0d0;pointer-events:none;white-space:nowrap}.example-meaning{top:87.5%;font-family:"Pretendard";font-size:18px}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.controls{display:none}.page{margin:0;page-break-after:always}.page:last-child{page-break-after:auto}}@font-face{font-family:"GyeonggiMillenniumBackground";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2410-3@1.0/Batang_Regular.woff)format("woff");font-weight:400;font-display:swap}@font-face{font-family:"GyeonggiMillenniumBackground";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2410-3@1.0/Batang_Bold.woff)format("woff");font-weight:700;font-display:swap}@font-face{font-family:"JoseonPalace";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGs.woff)format("woff");font-weight:400;font-display:swap}@font-face{font-family:"Myeongwon";src:url(https://cdn.jsdelivr.net/gh/Project-Noonnu/2607131254@4/4/Hangeuljaemin4-RegularI.woff2)format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"HangulJaemin60";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2507-1@1.0/Hangeuljaemin6TTF-Regular.woff2)format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2)format("woff2");font-weight:100;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2)format("woff2");font-weight:200;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2)format("woff2");font-weight:300;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2)format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2)format("woff2");font-weight:500;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2)format("woff2");font-weight:600;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2)format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2)format("woff2");font-weight:800;font-display:swap}@font-face{font-family:"Pretendard";src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2)format("woff2");font-weight:900;font-display:swap}</style> </head><body><div class="controls"> 학습지 개수: <input id="pageCount" type="number" value="10" min="1" > 장당 한자: <select id="wordCount"><option value="5"> 5자 </option><option value="6"> 6자 </option><option value="7"> 7자 </option><option value="8"> 8자 </option><option value="9"> 9자 </option><option value="10" selected> 10자 </option></select> 총획수(20~): <input id="strokeTarget" type="number" value="70" min="20" > 한자 폰트: <select id="fontSelect"><option value="Klee One"> Klee One </option><option value='"LXGW WenKai TC", serif'> LXGW WenKai TC </option><option value="Myeongwon"> 명원체 </option><option value="HangulJaemin60"> 재민체 </option><option value="JoseonPalace"> 조선일보궁서체 </option><option value="GyeonggiMillenniumBackground"> 경기천년바탕 </option><option value="Noto Serif TC"> Noto Serif TC </option><option value="Pretendard"> 기본 </option></select><div class="options"><label><input type="checkbox" id="showMeaningLine" checked > 훈음 쓰기 칸 </label><label><input type="checkbox" id="showExample" checked > 예시 칸 </label><label><input type="checkbox" id="showGridLines" checked > 보조선 </label></div><p class="centeric"> 제목 　 <textarea id="titleText">오늘의 한자</textarea> </p><p class="centeric"> 이름　 <textarea id="infoText">날짜 ( 2026년 /　　월 /　　일 )　사유 (　　　　　　　　)　이름 (　　　　　)</textarea> </p><p class="centeric"> 설명　 <textarea id="instructionText">글자의 모양을 생각하며 바르게 글씨를 써봅시다.</textarea> </p><p><button onclick="makeWorksheets()"> 만들기 </button><button onclick="window.print()"> 인쇄 </button></p><div id="status"></div></div><div id="pages" class="pages" ></div> <script>let words=[],selectedFont="Klee One";async function loadWords(){try{const n=await fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json");if(!n.ok)throw new Error("words.json을 불러올 수 없습니다.");words=await n.json(),console.log("불러온 한자 개수:",words.length),makeWorksheets()}catch(n){document.getElementById("pages").innerHTML="<p>words.json을 불러오지 못했습니다.</p>",console.error("JSON 로딩 실패:",n)}}function getRandomWordsByStrokeTarget(n,e){let t=[...words].sort(()=>Math.random()-.5),l=Array.from({length:n+1},()=>new Map);l[0].set(0,[]);for(let o of t){let t=Number(o.strokeCount);for(let c=n-1;c>=0;c--)for(let[n,s]of l[c]){let a=n+t;a>e||(l[c+1].has(a)||l[c+1].set(a,[...s,o]))}}return l[n].get(e)||null}function createGridSVG(n,e){const t=n?37.5:50;let l="";return e&&(l+=`\n\n            \x3c!-- 세로 중앙선 --\x3e\n\n            <line\n                x1="50"\n                y1="0"\n                x2="50"\n                y2="${n?75:100}"\n            />\n\n\n            \x3c!-- 가로 중앙선 --\x3e\n\n            <line\n                x1="0"\n                y1="${t}"\n                x2="100"\n                y2="${t}"\n            />\n\n        `),n&&(l+='\n\n            <line\n                class="meaning-line"\n                x1="0"\n                y1="75"\n                x2="100"\n                y2="75"\n            />\n\n        '),`\n\n        <svg\n            class="grid-svg"\n            viewBox="0 0 100 100"\n            preserveAspectRatio="none"\n            xmlns="http://www.w3.org/2000/svg"\n        >\n\n            ${l}\n\n        </svg>\n\n    `}function makeWorksheets(){if(words.length<10)return void alert(`한자가 충분하지 않습니다.\n\n현재 불러온 한자: ${words.length}개`);const n=Number(document.getElementById("pageCount").value),e=Number(document.getElementById("wordCount").value),t=Number(document.getElementById("strokeTarget").value),l=document.getElementById("showMeaningLine").checked,o=document.getElementById("showExample").checked,c=document.getElementById("showGridLines").checked;if(t<20)return void alert("20 이상으로 입력");let s=document.getElementById("pages"),a=document.getElementById("status");s.innerHTML="",a.innerText="학습지를 만드는 중...";let r=[];for(let l=0;l<n;l++){let n=getRandomWordsByStrokeTarget(e,t);if(!n)return a.innerText="",void alert("총획수 변경");r.push(n)}r.forEach(n=>{const e=document.createElement("div");e.className="page";const t=document.getElementById("titleText").value,a=document.getElementById("infoText").value,r=document.getElementById("instructionText").value;e.innerHTML=`\n\n\n                <div class="title">\n\n                    ${t}\n\n                </div>\n\n\n                <div class="info">\n\n                    ${a}\n\n                </div>\n\n\n                <div class="instruction">\n\n                    ${r}\n\n                </div>\n\n\n                <table>\n\n\n                    <colgroup>\n\n\n                        <col class="hanja-col">\n\n\n                        <col class="info-col">\n\n\n                        <col class="write-col">\n\n                        <col class="write-col">\n\n                        <col class="write-col">\n\n                        <col class="write-col">\n\n                        <col class="write-col">\n\n\n                    </colgroup>\n\n\n                    <tbody></tbody>\n\n\n                </table>\n\n            `;const d=e.querySelector("tbody");n.forEach((n,e)=>{const t=document.createElement("tr"),s=Array.isArray(n.examples)?n.examples.join(", "):n.examples,a=l?37.5:50;t.innerHTML=`\n\n\n                        \x3c!-- =====================\n                             한자\n                        ====================== --\x3e\n\n                        <td\n\n                            class="hanja"\n\n                            style="\n                                font-family:\n                                ${selectedFont};\n                            "\n\n                        >\n\n                            ${n.hanja}\n\n                        </td>\n\n\n                        \x3c!-- =====================\n                             뜻 / 음 / 예시\n                        ====================== --\x3e\n\n                        <td class="word-info">\n\n\n                            <div\n                                class="meaning-reading"\n                            >\n\n                                ${n.meaning}\n\n                                ${n.reading}\n\n                            </div>\n\n\n                            <div class="examples">\n\n                                ${s}\n\n                            </div>\n\n\n                        </td>\n\n\n                        \x3c!-- =====================\n                             첫 번째 쓰기 칸\n                        ====================== --\x3e\n\n                        <td class="write-cell">\n\n\n${createGridSVG(l,c)}\n\n\n    ${o?`\n        \x3c!-- 예시 한자 --\x3e\n\n        <div\n            class="example-hanja"\n            style="\n                font-family: ${selectedFont};\n                top: ${a}%;\n            "\n        >\n            ${n.hanja}\n        </div>\n\n\n        \x3c!-- 뜻 쓰기 영역의 예시 --\x3e\n\n        ${l?`\n                <div\n                    class="example-meaning"\n                >\n                    ${n.meaning} ${n.reading}\n                </div>\n            `:""}\n    `:""}\n                        </td>\n\n\n                        \x3c!-- =====================\n                             두 번째 쓰기 칸\n                        ====================== --\x3e\n\n                        <td class="write-cell">\n${createGridSVG(l,c)}\n\n\n                        </td>\n\n\n                        \x3c!-- =====================\n                             세 번째 쓰기 칸\n                        ====================== --\x3e\n\n                        <td class="write-cell">\n\n\n${createGridSVG(l,c)}\n\n\n                        </td>\n\n\n                        \x3c!-- =====================\n                             네 번째 쓰기 칸\n                        ====================== --\x3e\n\n                        <td class="write-cell">\n\n\n${createGridSVG(l,c)}\n\n                        </td>\n\n\n                        \x3c!-- =====================\n                             다섯 번째 쓰기 칸\n                        ====================== --\x3e\n\n                        <td class="write-cell">\n\n\n${createGridSVG(l,c)}\n\n                        </td>\n\n\n                    `,d.appendChild(t)}),s.appendChild(e)}),a.innerText=`${n}장 생성`}document.getElementById("fontSelect").addEventListener("change",function(){selectedFont=this.value,document.querySelectorAll(".hanja").forEach(n=>{n.style.fontFamily=selectedFont}),document.querySelectorAll(".example-hanja").forEach(n=>{n.style.fontFamily=selectedFont})}),loadWords();</script> </body></html>
