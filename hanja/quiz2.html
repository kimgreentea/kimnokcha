<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테스트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
main{width:min(560px,calc(100% - 28px));margin:28px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px #00000010}
h1{font-size:22px;text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#777;font-size:14px;margin-bottom:24px}
.card{height:250px;border:1px solid #e5e5e5;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:#fff}
#hanja{font-family:"Klee One",serif;font-size:clamp(110px,28vw,170px);line-height:1}
.answer-form{display:grid;gap:12px}
.field{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:10px}
.field label{font-size:15px;color:#555}
.field input{width:100%;min-width:0;border:1px solid #dcdfe3;border-radius:10px;padding:14px 12px;font-size:17px;outline:none}
.field input:focus{border-color:#527b70;box-shadow:0 0 0 3px #527b7018}
.enter-guide{text-align:center;color:#888;font-size:13px;margin:4px 0 0}
.result{text-align:center;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result h1{margin-bottom:4px}
.result p{color:#666;font-size:14px;margin:8px 0 0}
.restart{background:#263b35;color:#fff;font-size:15px;padding:13px 24px;margin-top:24px;border:0;border-radius:12px;cursor:pointer}
.restart:hover:not(:disabled){background:#1b302a}
.restart:disabled{background:#c9cecc;color:#f7f7f7;cursor:not-allowed}
.hidden{display:none!important}
#resultMessage {

  font-size: 18px;
  font-weight: 600;
  margin-top: 12px;
}
@media(max-width:420px){main{padding:18px}.card{height:220px}}
</style>
</head>
<body>
<main>
  <section id="quiz">

    <div class="card"><div id="hanja">漢</div></div>
    <form class="answer-form" id="answerForm" autocomplete="off">
      <div class="field">
        <label for="answerInput">정답</label>
        <input id="answerInput" type="text" placeholder="" required>
      </div>

    </form>
  </section>
  <section id="result" class="result hidden">
    <h1 id="resultTitle">통과</h1>
    <p id="resultMessage"></p>
    <button class="restart" id="restart" type="button">다시</button>
  </section>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const encoded = params.get("data");
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "hanjaQuizSession:" + (encoded || "invalid");
  let selectedIndexes = [];
  let wordData = [];
  let items = [];
  let index = 0;
  let unlockAt = 0;
  let resultState = "";
  let countdownInterval = null;

  try {
    if (!encoded) throw new Error("데이터 없음");
    if (!/^\d{4,}$/.test(encoded) || encoded.length % 4 !== 0) {
      throw new Error("데이터 형식 오류");
    }
    selectedIndexes = encoded.match(/\d{4}/g).map(code => Number(code) - 1);
    if (selectedIndexes.length < 1 || selectedIndexes.length > 10 ||
        selectedIndexes.some(index => index < 0)) {
      throw new Error("데이터 형식 오류");
    }
  } catch (e) {
    $("quiz").innerHTML = '<h1>QR코드로 접속하세요</h1>';
    return;
  }

  const sourceIndexes = [...selectedIndexes];

  function pickRandomThree() {
    const shuffled = [...sourceIndexes];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(3, shuffled.length));
  }

  function normalize(value) {
    return String(value ?? "").trim().replace(/\s+/g, " ").toLowerCase();
  }

  function saveSession() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        sourceIndexes, wordData, items, index, unlockAt, resultState
      }));
    } catch (error) {
      console.warn("퀴즈 진행 상태를 저장하지 못했습니다.", error);
    }
  }

  function render() {
    $("hanja").textContent = items[index].hanja;
    $("answerInput").value = "";
    $("answerInput").focus();
  }

  function submitAnswer() {
    if (resultState) return;
    const answer = normalize($("answerInput").value);
    if (!answer) {
      $("answerInput").focus();
      return;
    }

    const current = items[index];
    const expected = normalize(`${current.meaning} ${current.reading}`);
    const correct = answer === expected;

    if (!correct) {
      resultState = "failed";
      unlockAt = Date.now() + 60 * 1000;
      saveSession();
      showResult(false);
      return;
    }

    if (index === items.length - 1) {
      resultState = "passed";
      saveSession();
      showResult(true);
      return;
    }

    index++;
    saveSession();
    render();
  }

  function showResult(passed) {
    if (countdownInterval) clearInterval(countdownInterval);
    $("quiz").classList.add("hidden");
    $("resultTitle").textContent = passed ? "통과" : "오답";
    $("restart").classList.toggle("hidden", passed);
    $("resultMessage").textContent = "";
    $("result").classList.remove("hidden");

    if (!passed) {
      updateCountdown();
      if (Date.now() < unlockAt) {
        countdownInterval = setInterval(updateCountdown, 250);
      }
    }
  }

  function updateCountdown() {
    const remaining = Math.max(0, Math.ceil((unlockAt - Date.now()) / 1000));
    $("resultMessage").textContent = `${remaining}초 후 다시 도전할 수 있습니다.`;
    $("restart").disabled = remaining > 0;
    if (remaining <= 0 && countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }

  function restartQuiz() {
    if (resultState === "failed" && Date.now() < unlockAt) return;
    items = pickRandomThree().map(sourceIndex => wordData[sourceIndex]).filter(Boolean);
    index = 0;
    unlockAt = 0;
    resultState = "";
    saveSession();
    $("result").classList.add("hidden");
    $("quiz").classList.remove("hidden");
    render();
  }

  $("answerForm").addEventListener("submit", event => {
    event.preventDefault();
    submitAnswer();
  });

  $("restart").addEventListener("click", restartQuiz);

  function restoreSession(saved) {
    wordData = saved.wordData;
    items = saved.items;
    index = saved.index;
    unlockAt = saved.unlockAt || 0;
    resultState = saved.resultState || "";

    if (resultState === "passed") {
      showResult(true);
    } else if (resultState === "failed") {
      showResult(false);
    } else {
      render();
    }
  }

  async function init() {
    try {
      const savedText = localStorage.getItem(STORAGE_KEY);
      if (savedText) {
        const saved = JSON.parse(savedText);
        if (Array.isArray(saved.wordData) && Array.isArray(saved.items) &&
            saved.items.length && Number.isInteger(saved.index) &&
            saved.index >= 0 && saved.index < saved.items.length) {
          restoreSession(saved);
          return;
        }
      }

      const response = await fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json");
      if (!response.ok) throw new Error("words.json을 불러올 수 없습니다.");
      wordData = await response.json();

      const invalidIndexes = sourceIndexes.filter(sourceIndex => sourceIndex >= wordData.length);
      if (invalidIndexes.length) throw new Error("JSON 배열 범위를 벗어난 번호가 있습니다.");

      items = pickRandomThree().map(sourceIndex => wordData[sourceIndex]);
      index = 0;
      saveSession();
      render();
    } catch (error) {
      $("quiz").innerHTML = '<h1>퀴즈를 불러오지 못했습니다.</h1>';
      console.error(error);
    }
  }

  init();
})();
</script>
</body>
</html>
