<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>오늘의 한자</title> <style>body{margin:0;background-color:#f5f5f5;font-family:Arial,sans-serif;text-align:center}#card{width:500px;margin:50px auto;padding:30px;background-color:#fff;border-radius:20px;box-sizing:border-box;box-shadow:0 5px 20px #ccc}@media (max-width:550px){#card{width:95%}}#result{width:300px;height:300px;margin:0 auto}@media (max-width:450px){#result{width:80%;height:80%}}#infoBox{display:flex;justify-content:center;gap:20px;margin-top:20px}.info{font-size:30px}.label{margin-top:25px;margin-bottom:5px}#examples{font-size:22px}#strokeCount,.label{font-size:20px;color:gray}#strokeCount{margin-top:10px}button{margin-top:30px;padding:12px 25px;font-size:20px;cursor:pointer}</style> </head><body><div id="card"><div id="result"></div><div id="infoBox"><div class="info"><div class="label">뜻</div><div id="meaning"></div></div><div class="info"><div class="label">음</div><div id="reading"></div></div></div><div class="label">예시단어</div><div id="examples"></div><div id="strokeCount"></div><button onclick="makeQuestion()"> 다음 </button></div> <script>let number,words=[],animationTimer=null,currentHanja="";async function loadWords(){try{let e=await fetch("https://kimgreentea.github.io/kimnokcha/hanja/words.json");if(!e.ok)throw new Error("words.json을 불러올 수 없습니다.");words=await e.json(),makeQuestion()}catch(e){console.error("데이터 로딩 실패:",e)}}function makeQuestion(){number=Math.floor(Math.random()*words.length);let e=words[number];currentHanja=e.hanja,document.getElementById("meaning").innerText=e.meaning,document.getElementById("reading").innerText=e.reading,document.getElementById("examples").innerText=e.examples.join(", "),null!==animationTimer&&(clearTimeout(animationTimer),animationTimer=null),getUnicodeLink(currentHanja)}async function getUnicodeLink(e){let n=document.getElementById("result");n.innerHTML="";let t="https://raw.githubusercontent.com/skishore/makemeahanzi/618dbab8a8ddefb958763c8b4afbaa741a4460de/svgs/"+e.charCodeAt(0)+".svg";try{let n=await fetch(t);if(!n.ok)throw new Error("SVG 파일을 찾을 수 없습니다.");let a=(await n.text()).split("\n");a.splice(2,4);let o=a.join("\n").replace(/stroke:\s*blue;/g,"stroke: black;"),i=o.match(/animation-delay:\s*(\d+\.?\d*)s/g),r=0;i&&(r=Math.max(...i.map(e=>parseFloat(e.match(/(\d+\.?\d*)s/)[1]))));let l=1e3*(r+1.4);playAnimation(o),animationTimer=setTimeout(function n(){currentHanja===e&&(playAnimation(o),animationTimer=setTimeout(n,l))},l)}catch(e){console.error("SVG 로딩 실패:",e),n.innerHTML=""}}function playAnimation(e){let n=document.getElementById("result");n.innerHTML="",n.innerHTML=e;let t=n.querySelector("svg");t&&(t.style.animation="none",t.offsetWidth,t.style.animation="")}loadWords(),console.log(words),console.log(words.length);</script> </body></html>
